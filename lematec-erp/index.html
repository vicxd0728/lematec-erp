function _renderOrderCalendar(tabs){
  if(!window._ORD_CAL_YEAR){
    const t=new Date();
    window._ORD_CAL_YEAR=t.getFullYear();
    window._ORD_CAL_MONTH=t.getMonth()+1;
  }
  // 顯示 3 個月（當月 + 前後）
  if(window._ORD_CAL_MONTHS===undefined) window._ORD_CAL_MONTHS=3;
  const showMonths = window._ORD_CAL_MONTHS;

  const today = new Date(); today.setHours(0,0,0,0);

  // 建立交期 dayMap
  const deadlineMap={};
  orders.filter(o=>o.deadline&&o.status!=='已完成'&&o.status!=='取消').forEach(o=>{
    const key=o.deadline.slice(0,10);
    if(!deadlineMap[key]) deadlineMap[key]=[];
    deadlineMap[key].push(o);
  });

  // 月份數量選擇
  const monthCtrl=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH--;if(window._ORD_CAL_MONTH<1){window._ORD_CAL_MONTH=12;window._ORD_CAL_YEAR--;}renderTab('orders')">← 上月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_YEAR=new Date().getFullYear();window._ORD_CAL_MONTH=new Date().getMonth()+1;renderTab('orders')">今月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH++;if(window._ORD_CAL_MONTH>12){window._ORD_CAL_MONTH=1;window._ORD_CAL_YEAR++;}renderTab('orders')">下月 →</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.6875rem;color:var(--text3)">顯示月數：</span>
      ${[1,2,3,6].map(n=>{const a=showMonths===n;return`<button onclick="window._ORD_CAL_MONTHS=${n};renderTab('orders')"
        style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;
        border:1px solid ${a?'var(--blue)':'var(--border)'};
        background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};
        color:${a?'var(--blue)':'var(--text2)'}">${n}個月</button>`;}).join('')}
    </div>
  </div>`;

  // 產生每個月的月曆
  let calHtml='';
  for(let mi=0;mi<showMonths;mi++){
    let yr=window._ORD_CAL_YEAR, mo=window._ORD_CAL_MONTH+mi;
    while(mo>12){mo-=12;yr++;}
    const monthStr=yr+'-'+String(mo).padStart(2,'0');
    const daysInMonth=new Date(yr,mo,0).getDate();
    const firstDay=new Date(yr,mo-1,1).getDay();
    const wds=['日','一','二','三','四','五','六'];
    let cells=''; let dc=1;
    const total=Math.ceil((firstDay+daysInMonth)/7)*7;
    for(let i=0;i<total;i++){
      if(i<firstDay||dc>daysInMonth){
        cells+=`<div style="min-height:60px;background:rgba(255,255,255,.01);border-radius:6px"></div>`;
      } else {
        const dk=monthStr+'-'+String(dc).padStart(2,'0');
        const dl=deadlineMap[dk]||[];
        const isT=dk===today.toISOString().slice(0,10);
        const isW=(i%7===0||i%7===6);
        cells+=`<div style="min-height:60px;padding:4px 5px;background:${isT?'rgba(77,142,245,.08)':'var(--bg2)'};
          border:1px solid ${isT?'rgba(77,142,245,.3)':dl.length?'rgba(239,68,68,.25)':'var(--border)'};border-radius:6px">
          <div style="font-size:0.6875rem;font-weight:${isT?700:400};color:${isT?'var(--blue)':isW?'rgba(239,68,68,.7)':'var(--text)'};margin-bottom:2px">${dc}</div>
          ${dl.map(o=>`<div style="padding:1px 4px;border-radius:3px;font-size:0.5625rem;font-weight:600;
            background:rgba(239,68,68,.12);color:#ef4444;margin-bottom:1px;
            overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer"
            title="${o.no} ${o.cust||o.customer||''} × ${o.qty}">
            🔴 ${o.no.slice(-6)}</div>`).join('')}
        </div>`;
        dc++;
      }
    }
    // 計算本月有幾張交期訂單
    const monthDL = Object.entries(deadlineMap).filter(([k])=>k.startsWith(monthStr)).reduce((s,[,v])=>s+v.length,0);
    calHtml+=`<div style="margin-bottom:${mi<showMonths-1?'24px':'0'}">
      <div style="font-size:0.875rem;font-weight:700;color:var(--text);margin-bottom:8px">
        ${yr} 年 ${mo} 月
        ${monthDL?`<span style="font-size:0.6875rem;font-weight:400;color:var(--red);margin-left:8px">🔴 ${monthDL} 張交期</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">
        ${wds.map(w=>`<div style="text-align:center;font-size:0.625rem;font-weight:700;color:var(--text3);padding:3px">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
    </div>`;
  }

  // 近期交期清單
  const upcomingList = Object.entries(deadlineMap)
    .sort(([a],[b])=>a.localeCompare(b))
    .filter(([k])=>k>=today.toISOString().slice(0,10))
    .slice(0,10);

  const upcomingHtml = upcomingList.length ? `<div class="panel" style="margin-top:16px">
    <div class="panel-hdr"><span class="panel-title">📌 近期交期清單</span></div>
    <div class="table-wrap"><table>
      <tr><th>交期</th><th>訂單號</th><th>客戶</th><th>品項</th><th>數量</th><th>狀態</th><th>剩餘天數</th></tr>
      ${upcomingList.map(([dk,ords])=>ords.map(o=>{
        const dl=new Date(dk);dl.setHours(0,0,0,0);
        const diff=Math.round((dl-today)/86400000);
        const urgColor=diff<=3?'var(--red)':diff<=7?'var(--yellow)':'var(--text2)';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem;font-weight:600;color:${urgColor}">${dk}</td>
          <td style="font-family:monospace;font-size:0.6875rem">${o.no}</td>
          <td style="font-size:0.6875rem">${o.cust||o.customer||'—'}</td>
          <td style="font-size:0.6875rem">${o.product||'—'}</td>
          <td style="font-family:monospace">${o.qty}</td>
          <td>${pill(o.status||'—')}</td>
          <td style="font-size:0.6875rem;font-weight:700;color:${urgColor}">${diff===0?'今天':diff+'天'}</td>
        </tr>`;
      }).join('')).join('')}
    </table></div>
  </div>` : '';

  return tabs + monthCtrl + calHtml + upcomingHtml;
}

  <!-- 表格 -->
  <div class="panel">
    <div class="panel-hdr">
      <span class="panel-title">料件主檔 <span class="badge">${total}</span></span>

        ${TH('inventory','name','料件名稱')}
        ${TH('inventory','code','料件編號','str','hide-m')}
        ${TH('inventory','type','類型','str','hide-m')}
        ${TH('inventory','stock','庫存','num')}
        ${TH('inventory','safe','安全庫存','num','hide-m')}
        <th class="hide-m">狀態</th>
        <th>操作</th>
      </tr>
      ${pageData.length?pageData.map(m=>{
        const pct=m.safe>0?Math.min(100,(m.stock/(m.safe*2))*100):(m.stock>0?80:0);
        const fill=m.stock<=0?'var(--red)':m.stock<=m.safe?'var(--yellow)':'var(--green)';
        const sc=m.stock<=0?'var(--red)':m.stock<=m.safe?'var(--yellow)':'var(--green)';
        return`<tr>
        <td style="font-weight:600">${m.name}${m.code?`<div style="font-size:0.625rem;color:var(--text3);font-family:monospace;margin-top:2px">${m.code}</div>`:''}</td>

        <td>

            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${fill}"></div></div>

        <td class="hide-m" style="font-family:monospace;color:var(--text3)">${m.safe}</td>
        <td class="hide-m" style="color:${sc};font-size:0.8125rem;font-weight:700">${m.stock<=0?'❌':m.stock<=m.safe?'⚠':'✓'}</td>

    </table>
    </div>
    ${maxPage>1?`<div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:4px">${pageBtns()}</div>`:''}
  </div>`;
  return _notionBar + html;
}

// ═══════════════════════════════════════════════
// 入料單：手動輸入料件名稱時，即時檢查是否已建檔
// ═══════════════════════════════════════════════
function checkDupMat(val){
  const warn = document.getElementById('dup_mat_warn');
  if(!warn) return;
  const q = val.trim().toLowerCase();
  if(!q){ warn.style.display='none'; return; }

  // 比對料件主檔（大小寫不敏感 + 去空白後比對）
  const qNorm = q.replace(/\s+/g,''); // 去除所有空白後比對
  const exact = mats.find(m=> {
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');
    const cNorm = (m.code||'').toLowerCase().replace(/\s+/g,'');
    return nNorm===qNorm || (cNorm && cNorm===qNorm);
  });
  const similar = mats.filter(m=>{
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');

  if(exact){

    warn.style.borderColor='rgba(239,68,68,.4)';
    warn.style.background='rgba(239,68,68,.07)';
    warn.style.color='var(--red2)';
    warn.querySelector('div').style.color='var(--red2)';
  } else if(similar.length){
    // 相似 → 提示可能重複
    warn.style.display='';
    warn.style.borderColor='rgba(245,158,11,.3)';
    warn.style.background='rgba(245,158,11,.07)';

          </span>
          <button class="btn btn-ghost btn-xs" onclick="ibSwitchToExistAndSelect('${m.id}')" style="flex-shrink:0;margin-left:8px">使用此料件</button>

function ibSwitchToExistAndSelect(matId){
  const mat=mats.find(m=>m.id===matId);
  if(!mat){showToast('找不到料件','err');return;}
  const q=document.getElementById(`ib_qty_${matId}`);

function _invRender(){

function addManualPickItem(matId){

async function addManualPickNewItem(){

async function completeManualPick(masterId){
  const pick=picks.find(p=>p.id===masterId);
  if(!pick){showToast('找不到領料單','err');return;}
  if(!confirm('確認此臨時補料單已領料？\n確認後會依明細扣除庫存。')) return;
  showToast('扣除臨時補料庫存中...','warn');
  try{
    const details=(await dbQueryAll(DB.pickDetail)).filter(p=>p.properties?.['領料主單']?.relation?.some(r=>r.id===masterId));
    if(!details.length) throw new Error('找不到領料明細');
    for(const d of details){
      const matId=d.properties?.['料件']?.relation?.[0]?.id||'';
      const qty=d.properties?.['需求數量']?.number||d.properties?.['實領數量']?.number||0;
      if(!matId||!qty) continue;
      const mat=mats.find(m=>m.id===matId);
      const latest=await notionAPI('GET','pages/'+matId);
      const cur=latest?.properties?.['目前庫存']?.number??mat?.stock??0;
      const next=Math.max(0,cur-qty);
      await updatePage(matId,{'目前庫存':{number:next}});
      await updatePage(d.id,{'實領數量':{number:qty},'狀態':{select:{name:cur>=qty?'足夠':'缺料'}}});
      await logStockChange(matId,mat?.name||getTitle(d.properties,'料件名稱'),mat?.code||'','臨時補料領料',-qty,cur,next,pick.no,ROLE);
      if(mat) mat.stock=next;
    }
    await updatePage(masterId,{'狀態':{select:{name:'已領料'}}});
    logUserAction('完成臨時補料領料',pick.no,pick.note||'',ROLE);
    await refreshAll(true); await loadPicks(); window._PICK_SUB='manual'; renderTab('picking');
    showToast('✅ 已領料並完成扣庫存','ok');
  }catch(e){showToast('❌ 扣庫存失敗：'+e.message,'err');}
}

function renderAnnounce(){
  const canEdit = ROLE==='manager'||ROLE==='admin';
  const sorted = [...announces].sort((a,b)=>{
    if(a.pinned!==b.pinned) return a.pinned?-1:1;
    return (a.order||99)-(b.order||99);
  });
  let html = '<div class="panel"><div class="panel-hdr">'
    + '<span class="panel-title">📢 公告管理 <span class="badge">'+sorted.length+'</span></span>'
    + (canEdit?'<button class="btn btn-blue btn-sm" onclick="openModal(\'newAnnounce\')">＋ 新增公告</button>':'')
    + '</div><div style="padding:8px">';
  if(!sorted.length) html+='<div class="info-box">目前沒有公告</div>';
  else sorted.forEach(a=>{
    const statusColor = a.status==='發佈'?'var(--green)':a.status==='草稿'?'var(--text3)':'var(--red)';
    html+=`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">

          <span style="font-size:0.625rem;color:${statusColor};border:1px solid ${statusColor};border-radius:4px;padding:2px 6px">${a.status}</span>
          ${canEdit?`<button class="btn btn-ghost btn-sm" onclick="openModal('newAnnounce',${JSON.stringify(a)})">✏</button>
          <button class="btn btn-red btn-sm" onclick="deleteAnnounce('${a.id}')">🗑</button>`:''}

function isShopeeMat(m){
  const t=m?.type||'';
  const code=m?.code||m?.name||'';
  return t==='蝦皮用'||t==='蝦皮用(S-)'||/^S-/i.test(code);
}
function normSku(v){return String(v||'').trim().replace(/\s+/g,'').toUpperCase();}
function findMatBySku(sku){
  const key=normSku(sku);
  if(!key) return null;
  const byId=mats.find(m=>m.id===sku);
  if(byId) return byId;
  return mats.find(m=>
    normSku(m.code)===key||
    normSku(m.name)===key
  )||null;
}

async function importShopeeBomToNotion(){
  if(ROLE!=='manager'){showToast('只有廠長可以匯入 BOM','warn');return;}
  const totalRows=SHOPEE_BOM_EXCEL.reduce((sum,row)=>sum+(row.children||[]).length,0);
  if(!confirm(`準備把 Excel 蝦皮 BOM 匯入 Notion BOM 清單。\n\n母件：${SHOPEE_BOM_EXCEL.length} 個\nBOM關係：${totalRows} 筆\n\n系統會略過已存在的母件/子件關係。要開始嗎？`)) return;
  showToast('⏳ 重新同步 Notion 資料中...','warn',6000);
  await refreshAll(true);
  let created=0, skipped=0, noParent=[], noChild=[], failed=[];
  const existing=new Set(boms.map(b=>b.parentId+'|'+b.childId));
  for(const row of SHOPEE_BOM_EXCEL){
    const parent=findMatBySku(row.parent);
    if(!parent){noParent.push(row.parent);continue;}
    for(const ch of (row.children||[])){
      const child=findMatBySku(ch.code);
      if(!child){noChild.push(row.parent+' → '+ch.code);continue;}
      const key=parent.id+'|'+child.id;
      if(existing.has(key)){skipped++;continue;}
      try{
        const title=`${row.parent} → ${ch.code}`;
        const r=await createPage(DB.bom,{
          'BOM項目':{title:[{text:{content:title}}]},
          '母件':{relation:[{id:parent.id}]},
          '子件':{relation:[{id:child.id}]},
          '每台用量':{number:Number(ch.qty)||1},
          '備註':{rich_text:[{text:{content:'Shopee Excel import'}}]},
        });
        if(r?.object==='error') throw new Error(r.message||'Notion 建立失敗');
        existing.add(key);
        boms.push({parentId:parent.id,childId:child.id,qty:Number(ch.qty)||1});
        created++;
        if(created%20===0) showToast(`⏳ 蝦皮 BOM 匯入中：已新增 ${created} 筆`,'warn',5000);
      }catch(e){
        failed.push(title+': '+e.message);
      }
    }
  }
  await refreshAll(true);
  const msg=`✅ BOM匯入完成：新增 ${created} 筆，略過 ${skipped} 筆`
    +(noParent.length?`，找不到母件 ${noParent.length} 個`:'')
    +(noChild.length?`，找不到子件 ${noChild.length} 筆`:'')
    +(failed.length?`，失敗 ${failed.length} 筆`:'');
  showToast(msg,failed.length||noParent.length||noChild.length?'warn':'ok',9000);
  if(noParent.length||noChild.length||failed.length){
    alert(msg+'\n\n找不到母件：\n'+noParent.slice(0,30).join('\n')+
      '\n\n找不到子件：\n'+noChild.slice(0,50).join('\n')+
      '\n\n失敗：\n'+failed.slice(0,30).join('\n'));
  }
}

async function ensureShopeeParentMaterial(sku){

async function ensureShopeeBomRows(parentMat){
  const sku=parentMat.code||parentMat.name;
  const rows=shopeeBomRowsForSku(sku);
  if(!rows.length) return {created:0,missing:0,total:0};
  const existing=new Set(boms.map(b=>b.parentId+'|'+b.childId));
  let created=0, childCreated=0;
  for(const row of rows){
    let child=findMatBySku(row.code);
    if(!child){
      child=await createMaterialFromSku(row.code,'零件',0,0,'Shopee Excel BOM 自動建檔');
      childCreated++;
    }
    const key=parentMat.id+'|'+child.id;
    if(existing.has(key)) continue;
    const title=`${sku} → ${row.code}`;
    const r=await createPage(DB.bom,{
      'BOM項目':{title:[{text:{content:title}}]},
      '母件':{relation:[{id:parentMat.id}]},
      '子件':{relation:[{id:child.id}]},
      '每台用量':{number:Number(row.qty)||1},
      '備註':{rich_text:[{text:{content:'Shopee Excel BOM 自動建立'}}]},
    });
    if(r?.object==='error') throw new Error(title+'：'+(r.message||'BOM 建立失敗'));
    boms.push({parentId:parentMat.id,childId:child.id,qty:Number(row.qty)||1});
    existing.add(key);
    created++;
  }
  return {created,childCreated,total:rows.length};
}

function makeCorderNo(){
  const today=new Date().toISOString().slice(0,10);
  return 'CO-'+today.slice(2,7).replace('-','')+'-'+Math.floor(Math.random()*9000+1000);
}
function parseCorderStockRefs(raw, fallbackQty){
  const text=String(raw||'').trim();
  if(!text) return [];
  if(text.includes(':')){
    return text.split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>{
      const [id,qty]=x.split(':');
      return {id:id.trim(),qty:parseInt(qty)||fallbackQty||1};
    });
  }
  return text.split(',').map(x=>x.trim()).filter(Boolean).map(id=>({id,qty:fallbackQty||1}));
}
function corderStockRef(id, qty){return id?`${id}:${parseInt(qty)||1}`:'';}
function filterCorderMatOptions(q){
  const sel=document.getElementById('co_mat');
  if(!sel) return;
  const v=(q||'').toLowerCase();
  Array.from(sel.options).forEach(opt=>{
    if(!opt.value){opt.style.display='';return;}
    const text=(opt.textContent||'').toLowerCase();
    opt.style.display=(!v||text.includes(v))?'':'none';
  });
}

async function deductCorderStock(mat, qty, refNo, operator){
  const latest=await notionAPI('GET','pages/'+mat.id);
  const cur=latest?.properties?.['目前庫存']?.number??mat.stock??0;
  const next=cur-(parseInt(qty)||1);
  await updatePage(mat.id,{'目前庫存':{number:next}});
  await logStockChange(mat.id,mat.name||'',mat.code||'','C端出貨',-(parseInt(qty)||1),cur,next,refNo,operator||ROLE);
  mat.stock=next;
  return {before:cur,after:next};

async function returnCorderStock(refs, refNo){

    const cur=latest?.properties?.['目前庫存']?.number??mat?.stock??0;
    const next=cur+(parseInt(r.qty)||1);

    await logStockChange(r.id,mat?.name||'',mat?.code||'','C端退料',parseInt(r.qty)||1,cur,next,refNo,ROLE);

}

      <div style="display:flex;gap:6px;flex-wrap:wrap">排序：${sb('created','日期')} ${sb('status','狀態')} ${sb('mat','品項')} ${sb('qty','數量')}</div>
    </div>
    <div style="padding:8px 16px;font-size:0.8125rem;color:var(--text3);border-bottom:1px solid var(--border)">Excel 料號欄位目前固定讀取：<b style="color:var(--cyan2)">商品選項貨號</b>。建立後立即扣庫存，取消時可選回料或報銷。</div>`;

// ══ 品管檢驗單 ══
async function loadQCInspections(){
  try{
    const r = await dbQueryAll(DB.qcInspection);
    window._qcInspections = r.map(p=>({
      id:       p.id,
      no:       p.properties?.['檢驗單號']?.title?.[0]?.plain_text||'',
      orderRefRaw: p.properties?.['關聯訂單號']?.rich_text?.[0]?.plain_text||'',
      get orderRef(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[1]:r; },
      get orderId(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[0]:''; },
      matName:  p.properties?.['品項名稱']?.rich_text?.[0]?.plain_text||
                p.properties?.['料件名稱']?.rich_text?.[0]?.plain_text||'',
      matCode:  p.properties?.['料件編號']?.rich_text?.[0]?.plain_text||'',
      type:     p.properties?.['檢驗類型']?.select?.name||'',
      qtyReq:   p.properties?.['應檢數量']?.number??0,
      qtyAct:   p.properties?.['實檢數量']?.number??0,
      qtyBad:   p.properties?.['不良數量']?.number??0,
      result:   p.properties?.['檢驗結果']?.select?.name||'待檢驗',
      date:     p.properties?.['檢驗日期']?.date?.start||'',
      inspector:p.properties?.['檢驗人員']?.rich_text?.[0]?.plain_text||'',
      badReason:p.properties?.['不良原因']?.select?.name||'',
      handling: p.properties?.['處理方式']?.select?.name||'',
      toStock:  p.properties?.['料號入庫']?.checkbox||false,
      note:     p.properties?.['備註']?.rich_text?.[0]?.plain_text||'',
    })).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ console.warn('loadQCInspections error:',e); window._qcInspections=[]; }
}


// ── 檢驗結果：通過 / 不通過 ──
async function doInspResult(insId, orderRef, resultCode){
  // resultCode 可能是 'p'/'f'（來自 data-res）或已是中文
  const result = resultCode==='p' ? '通過' : resultCode==='f' ? '不通過' : resultCode;
  // orderRef 格式：「orderId|orderNo」或純訂單號
  // 解析
  let orderId = '', orderNo = '';
  if(orderRef && orderRef.includes('|')){
    [orderId, orderNo] = orderRef.split('|');
  } else {
    orderNo = orderRef||'';
    // 嘗試從本地 orders 找
    const found = orders.find(o=>o.no===(orderNo||'').trim());
    if(found) orderId = found.id;
  }

  // 確認不通過原因
  let badDesc = '';
  if(result === '不通過'){
    badDesc = prompt('請填入不通過原因（必填）：')||'';
    if(!badDesc){ showToast('請填入不通過原因','warn'); return; }
  }

  showToast('更新中...','warn');

  try{
    // 1. 更新檢驗單結果
    const props = { '檢驗結果':{select:{name:result}} };
    if(badDesc) props['不良描述']={rich_text:[{text:{content:badDesc}}]};
    await updatePage(insId, props);

    // 2. 若有關聯訂單 → 更新訂單狀態
    let targetOrder = null;
    if(orderId){
      targetOrder = orders.find(x=>x.id===orderId);
    } else if(orderNo){
      targetOrder = orders.find(x=>(x.no||'').trim()===(orderNo||'').trim());
    }

    if(targetOrder){
      const isSfgOrder = targetOrder.orderType==='半成品' || (targetOrder.no||'').startsWith('SFG-');
      if(result==='通過'){
        if(isSfgOrder){
          // 半成品通過 → 自動入庫 + 訂單改「已完成」
          const mat = mats.find(m=>m.id===targetOrder.productId);
          if(mat){
            const latest = await notionAPI('GET','pages/'+mat.id);
            const curStock = latest.properties?.['目前庫存']?.number??mat.stock??0;
            const inQty = targetOrder.qty||0;
            const newStock = curStock + inQty;
            await updatePage(mat.id, {'目前庫存':{number:newStock}});
            await logStockChange(mat.id, mat.name, mat.code||'', '半成品入庫', inQty, curStock, newStock, orderNo||orderId, inspector||ROLE);
          }
          await updatePage(targetOrder.id, {'狀態':{select:{name:'已完成'}}});
          targetOrder.status = '已完成';
        } else {
          // 一般訂單通過 → 待出貨（不動庫存）
          await updatePage(targetOrder.id, {'狀態':{select:{name:'待出貨'}}});
          targetOrder.status = '待出貨';
        }
      } else {
        // 不通過 → 維持待檢驗
        await updatePage(targetOrder.id, {'狀態':{select:{name:'待檢驗'}}});
        targetOrder.status = '待檢驗';
      }
    }

    // 3. 重新載入並刷新
    await loadQCInspections();
    await refreshAll();

    showToast(result==='通過'
      ? '✅ 檢驗通過'+(orderId||orderNo?' — 訂單已更新為「待出貨」':'')
      : '❌ 檢驗不通過，訂單維持待檢驗狀態'
    , result==='通過'?'ok':'warn');

  }catch(e){ showToast('❌ '+e.message,'err'); }
}

async function updateInspectionStatus(id, status){
  try{
    await updatePage(id,{'檢驗狀態':{select:{name:status}}});
    await loadQCInspections(); renderTab('qc');
    showToast('✅ 已更新為「'+status+'」','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

function renderQCReport(allInspections=[],pendingInbound=[],pendingOrders=[],doneInbound=[]){
  const month=new Date().toISOString().slice(0,7);
  const monthIns=allInspections.filter(x=>(x.date||'').startsWith(month));
  const pass=allInspections.filter(x=>x.result==='通過'||x.result==='條件通過').length;
  const fail=allInspections.filter(x=>x.result==='不通過').length;
  const badQty=allInspections.reduce((s,x)=>s+(Number(x.qtyBad)||0),0);
  const reasonMap={};
  allInspections.forEach(x=>{const k=x.badReason||x.handling||'';if(k)reasonMap[k]=(reasonMap[k]||0)+1;});
  const reasons=Object.entries(reasonMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const rate=allInspections.length?Math.round(pass/allInspections.length*100):100;
  return `<div class="dash-kpi-grid">
    <div class="kpi-card kpi-green"><div class="kpi-label">通過率</div><div class="kpi-num">${rate}<span style="font-size:1.2rem">%</span></div><div class="kpi-sub">${pass} 通過 / ${allInspections.length} 總檢驗</div></div>
    <div class="kpi-card ${fail?'kpi-red':'kpi-green'}"><div class="kpi-label">不通過</div><div class="kpi-num">${fail}</div><div class="kpi-sub">不良數量 ${badQty}</div></div>
    <div class="kpi-card ${pendingInbound.length+pendingOrders.length?'kpi-amber':'kpi-green'}"><div class="kpi-label">待檢項目</div><div class="kpi-num">${pendingInbound.length+pendingOrders.length}</div><div class="kpi-sub">入料 ${pendingInbound.length} / 訂單 ${pendingOrders.length}</div></div>
    <div class="kpi-card kpi-cyan"><div class="kpi-label">本月檢驗</div><div class="kpi-num">${monthIns.length}</div><div class="kpi-sub">${month}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
    <div class="panel"><div class="panel-hdr"><span class="panel-title">不良原因排行</span></div>
      <div style="padding:12px">${reasons.length?reasons.map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)"><b>${k}</b><span class="badge">${v}</span></div>`).join(''):'<div style="padding:22px;text-align:center;color:var(--green2)">目前沒有不良原因資料</div>'}</div>
    </div>
    <div class="panel"><div class="panel-hdr"><span class="panel-title">最近檢驗紀錄</span></div>
      <div style="padding:12px">${allInspections.slice(0,10).map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)"><div><b>${x.no||'—'}</b><div style="font-size:.76rem;color:var(--text3)">${x.matName||x.matCode||'—'} · ${x.date||'—'}</div></div>${pill(x.result)}</div>`).join('')||'<div style="padding:22px;text-align:center;color:var(--text3)">尚無檢驗單</div>'}</div>
    </div>
    <div class="panel"><div class="panel-hdr"><span class="panel-title">Notion 整理建議</span></div>
      <div style="padding:14px;line-height:1.8;color:var(--text2);font-size:.86rem">
        品管檢驗單是唯一主紀錄；入料通過會寫檢驗單、更新入料狀態並入庫。建議 Notion 保留「品管檢驗單」、「品管不合格記錄」、「入料單」三個資料源即可，舊版品管記錄頁可封存。
      </div>
    </div>
  </div>`;
}

    <button class="qc-tab${QC_SUB==='inspect'?' active':''}" onclick="QC_SUB='inspect';if(!window._qcInspections||!window._qcInspections.length){loadQCInspections().then(()=>renderTab('qc'));}else{renderTab('qc');}">🗂 檢驗紀錄<span class="badge" style="background:rgba(77,142,245,.12);color:var(--blue)">${allInspections.length}</span></button>
    <button class="qc-tab${QC_SUB==='report'?' active':''}" onclick="QC_SUB='report';if(!window._qcInspections||!window._qcInspections.length){loadQCInspections().then(()=>renderTab('qc'));}else{renderTab('qc');}">📈 品管報表</button>
    <button class="qc-tab${QC_SUB==='history'?' active':''}" onclick="QC_SUB='history';renderTab('qc')">✅ 入料已檢測<span class="badge" style="background:rgba(46,196,138,.1);color:var(--green)">${doneInbound.length}</span></button>
  </div>`;

  // ══════════════════════════════
  // tab 1：入料待品檢（原有功能）
  // ══════════════════════════════
  if(QC_SUB==='pending'){
    if(!pendingInbound.length) return _notionBar+tabs+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">✅ 目前沒有入料待品檢項目</div></div>`;
    return _notionBar+tabs+`<div class="panel">
      <div class="panel-hdr"><span class="panel-title">📥 入料待品檢</span><span class="badge" style="background:rgba(245,185,66,.15);color:var(--yellow)">${pendingInbound.length}</span></div>
      <div class="table-wrap"><table>
        <tr>${TH('qcp','no','入料單號')}<th>料件</th>${TH('qcp','qty','數量','num')}${TH('qcp','date','日期','str','hide-m')}<th>操作</th></tr>
        ${applySort('qcp',pendingInbound).map(i=>{
          const mat=mats.find(m=>m.id===i.matId);
          return `<tr>
            <td style="font-family:monospace;font-size:0.6875rem">${i.no}</td>
            <td style="font-size:0.6875rem">${mat?.name||'—'}</td>
            <td style="font-family:monospace">${i.qty}</td>
            <td class="hide-m" style="font-size:0.6875rem">${i.date||'—'}</td>
            <td>${canQC?`<div style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn btn-green btn-sm" onclick="approveQC('${i.id}','${i.matId}',${i.qty})">✓ 通過</button>
              <button class="btn btn-red btn-sm" onclick="rejectQC('${i.id}')">✗ 退回</button>
              <a href="https://www.notion.so/${i.id.replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-sm">📷</a>
            </div>`:'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }

  if(QC_SUB==='report'){
    return _notionBar+tabs+renderQCReport(allInspections,pendingInbound,pendingOrders,doneInbound);
  }

  // ══════════════════════════════
  // tab 2：訂單待檢驗（只有訂單）
  // ══════════════════════════════
  if(QC_SUB==='order_qc'){
    if(!pendingOrders.length) return _notionBar+tabs+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">✅ 目前沒有訂單待檢驗</div></div>`;
    return _notionBar+tabs+`<div class="panel">
      <div class="panel-hdr"><span class="panel-title">📋 訂單待檢驗</span><span class="badge" style="background:rgba(168,85,247,.12);color:var(--purple,#a855f7)">${pendingOrders.length}</span></div>
      <div class="table-wrap"><table>
        <tr><th>訂單號</th><th>客戶</th><th>品項</th><th>數量</th><th>狀態</th><th>操作</th></tr>
        ${pendingOrders.map(o=>{
          const isFail = o.status==='品檢異常';
          return `<tr>
            <td style="font-family:monospace;font-size:0.6875rem">${o.no}</td>
            <td style="font-size:0.6875rem">${o.cust||'—'}</td>
            <td style="font-size:0.6875rem">${o.product||'—'}</td>
            <td style="font-family:monospace">${o.qty||'—'}</td>
            <td><span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;background:${isFail?'rgba(239,68,68,.12)':'rgba(168,85,247,.12)'};color:${isFail?'#ef4444':'var(--purple,#a855f7)'}">${o.status}</span></td>
            <td>${canQC?`<div style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn btn-purple btn-sm" onclick="openInspectionModal('${o.id}','${o.no}')">📋 開立檢驗單</button>
              <a href="https://www.notion.so/${o.id.replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-sm">🔗</a>
            </div>`:'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }

  // ══════════════════════════════
  // tab 3：檢驗紀錄（入料 + 訂單分開）
  // ══════════════════════════════
  if(QC_SUB==='inspect'){
    const inspections = allInspections;
    const _qcDateOpts=[['0','全部'],['7','近7天'],['30','當月'],['90','近3個月']];
    const filterBar=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.6875rem;color:var(--text2)">結果：</span>
      ${['all','pass','fail'].map(f=>{const lb={all:'全部',pass:'✅通過',fail:'❌不合格'};const a=QC_FILTER===f;return`<button onclick="QC_FILTER='${f}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;font-weight:600;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${lb[f]}</button>`;}).join('')}
      <span style="font-size:0.6875rem;color:var(--text2);margin-left:8px">時間：</span>
      ${_qcDateOpts.map(([v,l])=>{const a=QC_DATE===v;return`<button onclick="QC_DATE='${v}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${l}</button>`;}).join('')}
    </div>`;

    const cutoff = QC_DATE==='0'?0:(Date.now()-parseInt(QC_DATE)*86400000);
    function insFilter(ins){
      if(QC_FILTER==='pass' && ins.result!=='通過' && ins.result!=='條件通過') return false;
      if(QC_FILTER==='fail' && ins.result!=='不通過') return false;
      if(cutoff){ const t=new Date(ins.created||ins.date||'').getTime(); if(!t||t<cutoff) return false; }
      return true;
    }

    // 分成入料檢驗單（關聯訂單號含 IB-）和訂單檢驗單（含 ORD-）
    const ibIns  = inspections.filter(i=>insFilter(i) && (i.orderRef||'').startsWith('IB-') || (!i.orderRef && insFilter(i) && (i.insNo||'').startsWith('IB-')));
    const ordIns = inspections.filter(i=>insFilter(i) && ((i.orderRef||'').startsWith('ORD-') || (i.insNo||'').startsWith('ORD-')));
    const otherIns = inspections.filter(i=>insFilter(i) && !ibIns.includes(i) && !ordIns.includes(i));

    const statusColors={'待檢驗':'var(--text3)','通過':'var(--green)','不通過':'var(--red)','條件通過':'var(--yellow)'};
    function insRow(ins){ return `<tr>
      <td style="font-family:monospace;font-size:0.6875rem">${ins.insNo||'—'}</td>
      <td style="font-size:0.6875rem">${ins.orderRef||'—'}</td>
      <td style="font-size:0.6875rem">${ins.product||'—'}</td>
      <td style="font-family:monospace">${ins.actual||0}/${ins.total||0}</td>
      <td style="font-family:monospace;color:var(--red)">${ins.badQty||0}</td>
      <td><span style="font-size:0.6875rem;font-weight:600;color:${statusColors[ins.result]||'var(--text3)'}">${ins.result||'—'}</span></td>
      <td style="font-size:0.6875rem;color:var(--text3)">${ins.date||'—'}</td>
      <td style="font-size:0.6875rem">${ins.inspector||'—'}</td>
      <td><a href="https://www.notion.so/${(ins.id||'').replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-xs">🔗</a></td>
    </tr>`; }

    const thead = `<tr><th>檢驗單號</th><th>關聯單號</th><th>品項</th><th>實/應檢</th><th>不良</th><th>結果</th><th>日期</th><th>人員</th><th></th></tr>`;

    let content = '';
    if(ordIns.length){
      content += `<div class="panel" style="margin-bottom:12px">
        <div class="panel-hdr"><span class="panel-title">📋 訂單品管檢驗</span><span class="badge">${ordIns.length}</span></div>
        <div class="table-wrap"><table>${thead}${ordIns.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(ibIns.length || otherIns.length){
      const allIbOther = [...ibIns, ...otherIns];
      content += `<div class="panel">
        <div class="panel-hdr"><span class="panel-title">📥 入料品管檢驗</span><span class="badge">${allIbOther.length}</span></div>
        <div class="table-wrap"><table>${thead}${allIbOther.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(!content) content = `<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有符合條件的檢驗紀錄</div></div>`;

    return _notionBar+tabs+filterBar+content;
  }

  // ══════════════════════════════
  // tab 4：入料已檢測歷史
  // ══════════════════════════════
  const _qcDateOpts=[['0','全部'],['7','近7天'],['30','當月'],['90','近3個月']];
  const filterBar2=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:0.6875rem;color:var(--text2)">時間：</span>
    ${_qcDateOpts.map(([v,l])=>{const a=QC_DATE===v;return`<button onclick="QC_DATE='${v}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${l}</button>`;}).join('')}
  </div>`;
  const cutoff2 = QC_DATE==='0'?0:(Date.now()-parseInt(QC_DATE)*86400000);
  const filteredDone = doneInbound.filter(i=>{
    if(!cutoff2) return true;
    const t=new Date(i.date||'').getTime(); return t&&t>=cutoff2;
  });
  if(!filteredDone.length) return _notionBar+tabs+filterBar2+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有已檢測記錄</div></div>`;
  return _notionBar+tabs+filterBar2+`<div class="panel">
    <div class="panel-hdr"><span class="panel-title">✅ 入料已檢測</span><span class="badge">${filteredDone.length}</span></div>
    <div class="table-wrap"><table>
      <tr>${TH('qch','no','入料單號')}<th>料件</th>${TH('qch','qty','數量','num')}${TH('qch','date','日期','str','hide-m')}<th>狀態</th></tr>
      ${applySort('qch',filteredDone).map(i=>{
        const mat=mats.find(m=>m.id===i.matId);
        const isFail=i.qcStatus==='品檢不合格';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem">${i.no}</td>
          <td style="font-size:0.6875rem">${mat?.name||'—'}</td>
          <td style="font-family:monospace">${i.qty}</td>
          <td class="hide-m" style="font-size:0.6875rem">${i.date||'—'}</td>
          <td><span style="padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;background:${isFail?'rgba(239,68,68,.1)':'rgba(46,196,138,.1)'};color:${isFail?'var(--red)':'var(--green)'}">${i.qcStatus||'—'}</span></td>
        </tr>`;
      }).join('')}
    </table></div>
  </div>`;
}

// ── 刪除訂單（跳確認框，Notion archive 同步刪除）
async function deleteOrder(oid, no){
  if(!confirm('⚠️ 確認刪除訂單「'+no+'」？\n\n此操作將從 Notion 永久刪除，無法復原。')) return;
  showToast('刪除中...','warn');
  try{
    // ★ 先從本地移除（立即生效，不等 Notion）
    orders = orders.filter(o=>o.id!==oid);
    renderTab(CURRENT_TAB);

    // ★ 同步到 Notion：先 archive，確認後不再出現在 query 結果
    const r = await notionAPI('PATCH','pages/'+oid,{archived:true});
    if(r.object==='error') throw new Error(r.message);
    logUserAction('刪除訂單',no||oid,'訂單已刪除',ROLE);

    showToast('✅ 訂單「'+no+'」已刪除','ok');

    // ★ 延遲 2 秒再 refreshAll，讓 Notion 有時間處理
    // 且 refresh 時跳過已知刪除的 ID，避免 race condition
    setTimeout(async ()=>{
      try{
        const [mR,bR,oR,masterR,annR,leaveR]=await Promise.all([
          dbQueryAll(DB.materials), dbQueryAll(DB.bom),
          dbQueryAll(DB.orders), dbQueryAll(DB.custMaster),
          dbQueryAll(DB.announce), dbQueryAll(DB.leave),
        ]);
        // 解析訂單時排除剛刪除的 ID
        orders=oR.filter(p=>p.id!==oid).map(p=>({
          id:p.id, no:getTitle(p.properties,'訂單號'),
          customer:p.properties?.['客戶名稱']?.select?.name||'',
          productId:p.properties?.['成品']?.relation?.[0]?.id||'',
          qty:p.properties?.['訂購數量']?.number??0,
          deadline:p.properties?.['交期']?.date?.start||'',
          status:p.properties?.['狀態']?.select?.name||'',
          note:p.properties?.['業務備註']?.rich_text?.[0]?.plain_text||'',
          created:p.created_time?.slice(0,10)||'',
        }));
        renderTab(CURRENT_TAB);
      }catch(e){ console.warn('bg refresh after delete:',e); }
    }, 2000);

  }catch(e){ showToast('❌ 刪除失敗：'+e.message,'err'); }
}

// 庫存修改記錄：寫入 Notion 📝 庫存修改記錄 資料庫
// ══════════════════════════════════════════════
async function _writeStockEditLog({matId, matName, matCode, changeType, before, after, delta, reason, operator}){
  try{
    const today = new Date();
    const yr = today.getFullYear().toString().slice(2);
    const mo = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    const hh = String(today.getHours()).padStart(2,'0');
    const mm = String(today.getMinutes()).padStart(2,'0');
    const recNo = `LOG-${yr}${mo}${dd}-${hh}${mm}-${Math.floor(Math.random()*90+10)}`;

    const props = {
      '記錄編號':  {title:[{text:{content:recNo}}]},
      '料件名稱':  {rich_text:[{text:{content:matName||''}}]},
      '料件編號':  {rich_text:[{text:{content:matCode||''}}]},
      '修改類型':  {select:{name:changeType||'其他修改'}},
      '修改前數值':{rich_text:[{text:{content:String(before??'')}}]},
      '修改後數值':{rich_text:[{text:{content:String(after??'')}}]},
      '修改原因':  {rich_text:[{text:{content:reason||''}}]},
      '修改人員':  {rich_text:[{text:{content:operator||ROLE||''}}]},
    };
    if(typeof delta === 'number' && !isNaN(delta)) props['變化量']={number:delta};
    if(matId) props['料件連結']={url:`https://www.notion.so/${matId.replace(/-/g,'')}`};

    await notionAPI('POST','pages',{parent:{database_id:DB.stockEditLog},properties:props});
    console.log('[庫存記錄] 已寫入:', recNo, changeType, reason);
  }catch(e){
    console.warn('[庫存記錄] 寫入失敗（不影響主功能）:', e);
  }
}

async function doEditMat(mid){
  const name=document.getElementById('em_name').value.trim();
  const code=document.getElementById('em_code').value.trim();
  const type=document.getElementById('em_type').value;
  const safe=parseInt(document.getElementById('em_safe').value)||0;
  const reason=(document.getElementById('em_reason')?.value||'').trim();
  if(!name){showToast('請填入料件名稱','warn');return;}
  // 原因驗證
  if(!reason || !/[\u4e00-\u9fa5a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫修改原因（需包含中文或英數字）','warn');
    document.getElementById('em_reason')?.focus();
    return;
  }
  const oldMat = mats.find(x=>x.id===mid);
  const oldName = oldMat?.name||'';
  const oldSafe = oldMat?.safe||0;
  closeModal();showToast('更新中...','warn');
  try{
    const props={
      '料件名稱':{title:[{text:{content:name}}]},
      '類型':{select:{name:type}},
      '安全庫存':{number:safe},
    };
    if(code!==undefined)props['料件編號']={rich_text:[{text:{content:code}}]};
    await updatePage(mid,props);
    // 判斷修改類型
    const changeType = name!==oldName ? '料件名稱修改' : safe!==oldSafe ? '安全庫存修改' : '其他修改';
    const before = name!==oldName ? oldName : String(oldSafe);
    const after  = name!==oldName ? name : String(safe);
    await _writeStockEditLog({
      matId:mid, matName:name, matCode:code,
      changeType, before, after, delta:0, reason, operator:ROLE,
    });
    await refreshAll();
    showToast('✅ 料件「'+name+'」已更新（原因已記錄）','ok');
  }catch(e){showToast('❌ 更新失敗：'+e.message,'err');}
}

async function doPick(orderId){
  const o=orders.find(x=>x.id===orderId);
  const prod=mats.find(m=>m.id===o.productId);
  const ds=new Date().toISOString().slice(0,10);
  const no=`PK-${ds.slice(2).replace(/-/g,'')}-${Math.floor(Math.random()*900+100)}`;
  closeModal();
  showToast('建立領料單中...','warn');

  try{
    // ── BOM 展開領料邏輯（蝦皮 S-、半成品、有 BOM 成品都走這裡）──
    const items=explodeBOM(o.productId,o.qty);
    const hasBOM = items.length > 0;
    if(!hasBOM&&requiresBOMMaterial(prod,o?.orderType)){
      throw new Error('此品項必須設定 BOM 才能領料，避免誤扣成品庫存。請先補 BOM 關係。');
    }
    // 1. 建立領料主單
    const master=await createPage(DB.pickMaster,{
      '領料主單號':{title:[{text:{content:no}}]},
      '對應訂單':{relation:[{id:orderId}]},
      '成品品號':{rich_text:[{text:{content:prod?.name||''}}]},
      '生產數量':{number:o.qty},
      '狀態':{select:{name:'已確認扣料'}},
      '領料日期':{date:{start:ds}}
    });
    if(master.object==='error') throw new Error('領料主單建立失敗：'+master.message);

    let stockErrors=[];

    if(hasBOM){
      // ══ 有 BOM：展開子件逐項扣庫存 ══
      for(const item of items){
        if(item.missing||!item.id){
          stockErrors.push((item.code||item.name)+': BOM 子料號尚未建檔');
          continue;
        }
        try{
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:item.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:item.id}]},
            '類型':{select:{name:item.type}},
            '需求數量':{number:item.needed},
            '實領數量':{number:item.type==='半成品'?item.needed:Math.min(item.needed,item.stock)},
            '狀態':{select:{name:item.type==='半成品'?'半成品':item.stock>=item.needed?'足夠':'缺料'}}
          });
          // 只有零件才扣，半成品不扣（半成品本身的零件已在 BOM 展開時計算）
          if(item.type!=='半成品'){
            const latestMat=await notionAPI('GET','pages/'+item.id);
            const latestStock=latestMat?.properties?.['目前庫存']?.number??item.stock;
            const newStock=Math.max(0,latestStock-item.needed);
            await updatePage(item.id,{'目前庫存':{number:newStock}});
            await logStockChange(item.id,item.name,item.code||'','領料',-item.needed,latestStock,newStock,no,ROLE);
          }
        }catch(itemErr){
          stockErrors.push(item.name+': '+itemErr.message);
          console.error('領料明細錯誤',item.name,itemErr);
        }
      }
    } else {
      // ══ 無 BOM：直接扣成品本身庫存 ══
      if(!prod){
        stockErrors.push('訂單未關聯成品料件，無法扣庫存');
      } else {
        try{
          // 建立一筆領料明細（成品本身）
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:prod.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:prod.id}]},
            '類型':{select:{name:prod.type||'成品'}},
            '需求數量':{number:o.qty},
            '實領數量':{number:o.qty},
            '狀態':{select:{name:'足夠'}}
          });
          // 從 Notion 讀最新庫存再扣
          const latestProd=await notionAPI('GET','pages/'+prod.id);
          const latestStock=latestProd?.properties?.['目前庫存']?.number??prod.stock;
          const newStock=Math.max(0,latestStock-o.qty);
          await updatePage(prod.id,{'目前庫存':{number:newStock}});
          await logStockChange(prod.id,prod.name,prod.code||'','領料',-o.qty,latestStock,newStock,no,ROLE);
        }catch(prodErr){
          stockErrors.push(prod.name+': '+prodErr.message);
          console.error('成品直接扣料錯誤',prodErr);
        }
      }
    }

    // 3. 更新訂單狀態為「生產中」
    await updatePage(orderId,{'狀態':{select:{name:'生產中'}}});
    logUserAction('確認領料',no,`${o?.no||orderId} ${hasBOM?'BOM展開':'直接扣料'}`,ROLE);

    // 4. 重新整理資料
    await refreshAll();
    await loadPicks();

    const modeNote = hasBOM ? `（BOM展開 ${items.length} 項子件）` : '（直接扣成品庫存）';
    if(stockErrors.length){
      showToast(`⚠ 領料單 ${no} 建立，部分失敗：${stockErrors.join('、')}`,'warn');
    }else{
      showToast(`✅ 領料單 ${no} 建立完成 ${modeNote}`,'ok');
    }
  }catch(e){
    showToast('❌ 領料失敗：'+e.message,'err');
    console.error('doPick error:',e);
  }
}

async function syncInboundStock(id, matId, qty){
  if(!matId){ showToast('此入料單未關聯料件，無法同步庫存','warn'); return; }
  // 先確認入料單目前狀態
  const inbound = inbounds.find(i=>i.id===id);
  if(!inbound){ showToast('找不到此入料單','warn'); return; }

  if(inbound.qcStatus!=='品檢通過'){
    showToast('⚠ 品管狀態尚未通過，無法同步庫存','warn'); return;
  }
  if(inbound.stStatus==='已入庫'){
    showToast('⚠ 此入料單已是「已入庫」，避免重複增加庫存','warn'); return;
  }

  const mat = mats.find(m=>m.id===matId);
  if(!mat){ showToast('找不到對應料件','warn'); return; }

  const newStock = (mat.stock||0) + parseInt(qty);
  if(!confirm(`確認同步庫存？
料件：${mat.name}
目前庫存：${mat.stock}
入料數量：${qty}
同步後：${newStock}`)) return;

  showToast('同步中...','warn');
  try{
    await updatePage(matId, {'目前庫存':{number: newStock}});
    // 確保入庫狀態也是已入庫
    await updatePage(id, {'入庫狀態':{select:{name:'已入庫'}}});
    await logStockChange(matId,mat.name,mat.code||'','手動同步入庫',parseInt(qty),mat.stock||0,newStock,id,ROLE);
    await refreshAll();
    showToast(`✅ ${mat.name} 庫存已同步：${mat.stock} → ${newStock}`,'ok');
  }catch(e){ showToast('❌ 同步失敗：'+e.message,'err'); }
}

// ══ 庫存異動記錄（每次入料/領料/手動調整都呼叫）══
async function logStockChange(matId, matName, matCode, changeType, qty, beforeStock, afterStock, refNo, operator){
  // ★ 非同步加入佇列，不阻塞主流程
  _logQueue.push({matId,matName,matCode,changeType,qty,beforeStock,afterStock,refNo,operator,
    operator2:operator||ROLE||''});
  if(!_logFlushing) _flushLogQueue();
}
function logUserAction(action, refNo='', detail='', operator=''){
  logStockChange('', detail||action, '', action, 0, 0, 0, refNo, operator||ROLE||'');
}

const STOCK_LOG_TYPES=new Set(['入料','領料','手動調整','品管退回','C端出貨','C端退料','C端退料（刪除）','建立入料單','品管通過','新增訂單','刪除訂單','取消訂單','狀態更新','出貨完成','補料']);
function normalizeStockLogType(type){
  const t=String(type||'手動調整');
  if(STOCK_LOG_TYPES.has(t)) return t;
  if(t.includes('建立入料')) return '建立入料單';
  if(t.includes('品管通過')) return '品管通過';
  if(t.includes('品管退')||t.includes('不合格')) return '品管退回';
  if(t.includes('新增訂單')||t.includes('建立訂單')) return '新增訂單';
  if(t.includes('刪除訂單')) return '刪除訂單';
  if(t.includes('取消')) return '取消訂單';
  if(t.includes('狀態')) return '狀態更新';
  if(t.includes('出貨')) return '出貨完成';
  if(t.includes('補料')) return '補料';
  if(t.includes('C端出貨')) return 'C端出貨';
  if(t.includes('C端退料')) return t.includes('刪除')?'C端退料（刪除）':'C端退料';
  if(t.includes('入庫')||t.includes('入料')||t.includes('完成')) return '入料';
  if(t.includes('領料')||t.includes('扣料')||t.includes('組裝')) return '領料';
  return '手動調整';
}

// 佇列逐一寫入（避免同時大量 API 請求）
const _logQueue = [];
let _logFlushing = false;
async function _flushLogQueue(){
  if(_logFlushing||!_logQueue.length) return;
  _logFlushing=true;
  while(_logQueue.length){
    const item=_logQueue.shift();
    try{
      const today=new Date().toISOString().slice(0,10);
      const safeType=normalizeStockLogType(item.changeType);
      await notionAPI('POST','pages',{parent:{database_id:DB.stockLog},properties:{
        '異動項目':{title:[{text:{content:today+' '+item.changeType+' '+item.matName}}]},
        '料件名稱':{rich_text:[{text:{content:item.matName||''}}]},
        '料件編號':{rich_text:[{text:{content:item.matCode||''}}]},
        '異動類型':{select:{name:safeType}},
        '異動數量':{number:Math.abs(item.qty)},
        '異動前庫存':{number:item.beforeStock},
        '異動後庫存':{number:item.afterStock},
        '異動日期':{date:{start:today}},
        '關聯單號':{rich_text:[{text:{content:item.refNo||''}}]},
        '操作人員':{rich_text:[{text:{content:item.operator2||''}}]},
        '備註':{rich_text:[{text:{content:safeType===item.changeType?'':'原始動作：'+item.changeType}}]},
      }});
    }catch(e){ console.warn('庫存異動記錄失敗：',e.message); }
  }
  _logFlushing=false;
}

async function approveQC(id,matId,qty){
  if(!confirm('確認品檢通過？將增加 '+qty+' 個庫存'))return;

  // 找入料單資料（用來建立檢驗單）
  const ib = inbounds.find(x=>x.id===id);
  const ibNo = ib?.no||id;
  const ibMat = ib?.matName||ib?.mat||'';
  const ibCode = ib?.matCode||'';
  const ibDate = new Date().toISOString().slice(0,10);
  const insNo = 'IB-'+ibDate.replace(/-/g,'').slice(2)+'-'+Math.floor(Math.random()*900+100);

  // ★ 驗證 matId
  if(!matId){
    showToast('❌ 入料單未關聯料件，無法品檢通過與入庫。請先補上料件關聯。','err');
    logUserAction('品管通過失敗',ibNo,'入料單未關聯料件',ROLE);
    return;
  }
  try{
    // 1. 建立品管檢驗單記錄（寫入品管資料庫）
    const insProps = {
      '檢驗單號':   {title:[{text:{content:insNo}}]},
      '關聯訂單號': {rich_text:[{text:{content:ibNo}}]},
      '檢驗類型':   {select:{name:'全檢'}},
      '品項名稱':   {rich_text:[{text:{content:ibMat}}]},
      '料件編號':   {rich_text:[{text:{content:ibCode}}]},
      '應檢數量':   {number:parseInt(qty)||0},
      '實檢數量':   {number:parseInt(qty)||0},
      '不良數量':   {number:0},
      '檢驗結果':   {select:{name:'通過'}},
      '檢驗人員':   {rich_text:[{text:{content:ROLE}}]},
      '料號入庫':   {checkbox:true},
      '備註':       {rich_text:[{text:{content:'入料品管通過 自動建立'}}]},
      '處理方式':   {select:{name:'正常入庫'}},
    };
    if(ibDate) insProps['檢驗日期']={date:{start:ibDate}};
    await notionAPI('POST','pages',{parent:{database_id:DB.qcInspection}, properties:insProps});

    // 2. 更新入料單品管狀態
    await updatePage(id,{'品管狀態':{select:{name:'品檢通過'}},'入庫狀態':{select:{name:'已入庫'}}});
    logUserAction('品管通過',ibNo,ibMat||ibCode,ROLE);
    // 3. 重新從 Notion 讀最新庫存
    const matData=await notionAPI('GET','pages/'+matId);
    const curStock=matData?.properties?.['目前庫存']?.number??0;
    const newStock=curStock+parseInt(qty);
    // 4. 更新庫存

async function selectAndLoadPI(pageId,title,idx){
  document.querySelectorAll('.pi-item').forEach(e=>e.classList.remove('selected'));
  const el=document.getElementById('pii_'+idx);if(el)el.classList.add('selected');
  const setStatus=msg=>{const d=el?.querySelector('.pi-status');if(d)d.textContent=msg;};
  setStatus('⏳ 讀取中...');
  try{
    const blocks=await getBlockChildren(pageId);const all=blocks.results||[];
    let fileUrl='',pdfUrl='';
    for(const b of all){
      if(b.type!=='file')continue;
      const fd=b.file||{};const name=(fd.name||'').toLowerCase();const url=fd.file?.url||fd.external?.url||'';if(!url)continue;
      if((name.endsWith('.xlsx')||name.endsWith('.xls'))&&!fileUrl)fileUrl=url;
      if(name.endsWith('.pdf')&&!pdfUrl)pdfUrl=url;
    }
    if(!fileUrl){
      for(const b of all){if(b.type!=='child_page')continue;const t=(b.child_page?.title||'').toLowerCase();if(t.endsWith('.xlsx')||t.endsWith('.xls')){try{const bd=await getBlock(b.id);const bfd=bd[bd.type]||{};const u=bfd.file?.url||bfd.external?.url||'';if(u){fileUrl=u;break;}}catch{}}}
    }
    if(!fileUrl&&pdfUrl){
      setStatus('📄 只有 PDF');const el2=document.getElementById('piInfo');
      if(el2)el2.innerHTML=`<span style="color:var(--yellow)">⚠ 只有 PDF 附件，無法自動解析。<a href="${pdfUrl}" target="_blank" style="color:var(--blue)">開啟 PDF</a>，請手動填入。</span>`;
      showToast('只有 PDF，請手動填入','warn');return;
    }
    if(!fileUrl){setStatus('❌ 找不到 Excel');showToast('找不到 Excel，請直接上傳','warn');return;}
    setStatus('⏳ 下載中...');
    const buf=await downloadViaProxy(fileUrl);
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    const orderNo=title.replace(/\s*\(.*?\)\s*/g,'').trim();
    const items=parsePIRows(rows,orderNo);
    setStatus(`✅ 讀取 ${items.length} 個品項`);
    showToast(`✅ PI「${title}」讀取成功`,'ok');
  }catch(e){setStatus(`❌ ${e.message.slice(0,40)}`);showToast('讀取失敗，請直接上傳','err');}
}

async function submitMultiOrders(){
  const cust=document.getElementById('m_cust')?.value;
  const date=document.getElementById('m_date')?.value;
  if(!cust){alert('請選擇客戶');return;}
  if(!date){alert('請填入交期');return;}

  // 從 data attribute 還原品項資料（避免 onclick 引號問題）
  const div=document.getElementById('piMultiList');
  if(!div||!div.dataset.items){alert('品項資料遺失，請重新讀取 PI');return;}
  let items;
  try{items=JSON.parse(decodeURIComponent(atob(div.dataset.items)));}
  catch(e){alert('品項資料解析失敗：'+e.message);return;}
  const piNo=div.dataset.pino||'';

  const selected=[];
  for(let i=0;i<items.length;i++){
    const chk=document.getElementById('chk_'+i);const qtyEl=document.getElementById('qty_'+i);
    if(chk?.checked&&qtyEl)selected.push({model:items[i].model,qty:parseInt(qtyEl.value)||items[i].qty});
  }
  if(!selected.length){alert('請至少勾選一個品項');return;}

  // 顯示進度（不 closeModal）
  const batchBtn=document.getElementById('batchBtn');
  if(batchBtn){batchBtn.disabled=true;batchBtn.textContent='建立中，請勿關閉...';}
  div.insertAdjacentHTML('afterend',`<div id="batchProgress" style="background:var(--bg3);border-radius:8px;padding:10px;margin-top:8px;font-size:0.75rem;color:var(--cyan)"><div class="spin" style="margin-right:6px"></div>正在建立 ${selected.length} 筆訂單...</div>`);

  const prefix=`ORD-${new Date().toISOString().slice(2,7).replace('-','')}`;
  let ok=0,fail=0,failList=[];

  for(let i=0;i<selected.length;i++){
    const item=selected[i];
    const prog=document.getElementById('batchProgress');
    if(prog)prog.innerHTML=`<div class="spin" style="margin-right:6px"></div>建立第 ${i+1}/${selected.length} 筆：${item.model}...`;
    try{
      let prodId='';
      const ex=mats.find(m=>m.name===item.model||m.code===item.model);
      if(ex){prodId=ex.id;}
      else{
        const nm=await createPage(DB.materials,{'料件名稱':{title:[{text:{content:item.model}}]},'類型':{select:{name:'成品'}},'目前庫存':{number:1000},'安全庫存':{number:0}});
        prodId=nm.id;
      }
      const no=`${prefix}-${String(i+1).padStart(3,'0')}`;
      await createPage(DB.orders,{
        '訂單號':{title:[{text:{content:no}}]},
        '客戶名稱':{select:{name:cust}},
        '成品':{relation:[{id:prodId}]},
        '訂購數量':{number:item.qty},
        '交期':{date:{start:date}},
        '狀態':{select:{name:'待排程'}},
        '訂單類型':{select:{name:orderType}},
        '業務備註':{rich_text:[{text:{content:note||(piNo?'PI: '+piNo:'')}}]},
        ...(piNo?{'PI單號':{rich_text:[{text:{content:piNo}}]}}:{}),
        ...(shipMethod?{'出貨方式':{select:{name:shipMethod}}}:{}),
        ...(packageType?{'包裝方式':{select:{name:packageType}}}:{}),
        ...(deliverAddr?{'送貨地':{rich_text:[{text:{content:deliverAddr}}]}}:{}),
      });
      ok++;
    }catch(e){fail++;failList.push(item.model);console.error(item.model,e);}
  }

  await refreshAll();

  const prog=document.getElementById('batchProgress');
  if(prog)prog.innerHTML=`<span style="color:${ok===selected.length?'var(--green)':'var(--yellow)'}">
    ✅ 成功 ${ok} 筆${fail?`，失敗 ${fail} 筆（${failList.join('、')}）`:''}
  </span>
  <br><button class="btn btn-ghost btn-sm" onclick="closeModal()" style="margin-top:8px">關閉</button>`;

  showToast(`${ok===selected.length?'✅':'⚠'} 建立 ${ok}/${selected.length} 筆訂單`,ok===selected.length?'ok':'warn');
}

function initShopeeOrderList(){

function filterShopeeList(q){
  _renderShopeeList((q||'').toLowerCase().trim());

function _renderShopeeList(q){
  const sel = document.getElementById('m_shopee_sku');
  if(!sel) return;
  const prev = sel.value;
  const rawQ=(q||'').trim();
  const qKey=rawQ.toLowerCase();
  const newCode=normSku(rawQ);
  sel.innerHTML = '<option value="">— 選擇蝦皮商品（S-開頭）—</option>';
  const items = mats
    .filter(m=>/^S-/i.test((m.code||m.name||'').trim()) || isShopeeMat(m))
    .filter(m=>!qKey || (m.code||'').toLowerCase().includes(qKey) || (m.name||'').toLowerCase().includes(qKey))
    .sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||''));
  items.forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m.id;
    opt.textContent=(m.code||m.name)+(m.name&&m.name!==m.code?' — '+m.name:'');
    if(m.id===prev) opt.selected=true;
    sel.appendChild(opt);
  });
  if(newCode.startsWith('S-')&&!findMatBySku(newCode)){
    const opt=document.createElement('option');
    opt.value='NEW::'+newCode;
    opt.textContent='＋ 建立新蝦皮料號：'+newCode;
    opt.selected=true;
    sel.appendChild(opt);
  }
  if(items.length===0){
    const opt=document.createElement('option');
    opt.disabled=true;
    opt.textContent=newCode.startsWith('S-')?'可選擇上方建立新料號':'（無符合結果，輸入 S-料號可建立）';
    sel.appendChild(opt);
  }
}

function onShopeeSkuChange(matId){

async function addShopeeOrderItem(manual=false){
  let matId=document.getElementById('m_shopee_sku')?.value||'';

  const manualSku=(document.getElementById('m_shopee_manual')?.value||document.getElementById('shopee_search')?.value||'').trim();

async function importShopeeExcel(input){
  const file = input.files[0];
  if(!file) return;
  input.value='';
  showToast('⏳ 上傳解析中...','ok');

  try{
    // 蝦皮匯出的 Excel 可能加密，先交給 Worker 處理；未加密檔也會回傳可讀資料。
    const formData = new FormData();
    formData.append('file', file);
    formData.append('password', '576313');

    const workerRes = await fetch(PROXY, {
      method: 'POST',
      body: formData,
    });

    if(!workerRes.ok){
      showToast('❌ Worker 回應異常: '+workerRes.status,'err');
      return;
    }

    const { base64, encrypted, error } = await workerRes.json();
    if(error){
      showToast('❌ 解密失敗: '+error,'err');
      return;
    }

    // \u2500\u2500 \u7528 SheetJS \u8b80\u53d6\u89e3\u5bc6\u5f8c\u7684 xlsx \u2500\u2500
    const binStr = atob(base64);
    const buf = new Uint8Array(binStr.length);
    for(let i=0;i<binStr.length;i++) buf[i]=binStr.charCodeAt(i);

    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if(!rows.length){ showToast('Excel 沒有資料','warn'); return; }

    showToast('⏳ 解析訂單中...','ok');

    const SHIP_MAP = {
      '新竹物流':'新竹物流','蝦皮':'蝦皮','店到家宅配':'店到家','店到家':'店到家',
      '7-11':'7-11','全家':'全家','黑貓宅便':'黑貓宅便',
      'SF順豐':'SF順豐','大榮貨運':'大榮貨運','郵局包裹':'郵局包裹',
    };
    function mapShip(v){
      for(const k in SHIP_MAP){ if(v&&v.toString().includes(k)) return SHIP_MAP[k]; }
      return v||'';
    }
    function rowVal(row, names){
      for(const n of names){
        if(row[n]!==undefined&&row[n]!==null&&String(row[n]).trim()!=='') return String(row[n]).trim();
      }
      return '';
    }
    function dateVal(v){
      const s=String(v||'').trim();
      if(!s) return '';
      return s.slice(0,10).replace(/\//g,'-');
    }

    const incoming=[];
    for(const row of rows){
      const no=rowVal(row,['訂單編號','訂單號碼','蝦皮訂單號碼']);
      if(!no) continue;
      const sku=rowVal(row,['商品選項貨號']);
      const qty=parseInt(rowVal(row,['數量','商品數量']))||1;
      const buyer=rowVal(row,['買家帳號']);
      const shipMethod=mapShip(rowVal(row,['寄送方式','出貨方式']));
      const shipDate=dateVal(rowVal(row,['實際出貨時間','出日']));
      const payDate=dateVal(rowVal(row,['買家付款時間','付款時間','訂單成立時間']));
      const prodName=rowVal(row,['商品名稱','商品選項名稱']).slice(0,60);
      incoming.push({no,sku,qty,buyer,shipMethod,shipDate,payDate,prodName});
    }
    if(!incoming.length){ showToast('沒有有效訂單資料','warn'); return; }

    showToast('⏳ 匯入 '+incoming.length+' 筆品項...','ok');
    let ok=0, skip=0, warn=0, failed=0;
    const warnList=[];

    for(const item of incoming){
      const dup=(window.corders||[]).find(c=>c.no===item.no&&(c.matCode===item.sku||c.matName===item.sku));
      if(dup){skip++;continue;}

      let mat=null, stockRef='', note='';
      if(!item.sku){
        note='⚠ Excel 商品選項貨號空白，庫存未扣除';
        warnList.push(item.no+'：無料號');
        warn++;
      }else{
        mat=findMatBySku(item.sku);
        if(mat){
          try{
            await deductCorderStock(mat,item.qty,item.no,ROLE);
            stockRef=corderStockRef(mat.id,item.qty);
          }catch(eStock){
            note='⚠ 找到料件但扣庫存失敗：'+eStock.message;
            warnList.push(item.no+'：'+item.sku+' 扣庫存失敗');
            warn++;
          }
        }else{
          note='⚠ 找不到庫存料號，庫存未扣除：'+item.sku;
          warnList.push(item.no+'：找不到 '+item.sku);
          warn++;
        }
      }

      const displaySku=item.sku||item.prodName||'(無貨號)';
      const cProps={
        '訂單號碼':{title:[{text:{content:item.no}}]},
        '買家帳號':{rich_text:[{text:{content:item.buyer||''}}]},
        '品名':{rich_text:[{text:{content:displaySku}}]},
        '數量':{number:item.qty},
        '出貨方式':{rich_text:[{text:{content:item.shipMethod||''}}]},
        '狀態':{select:{name:'出貨中'}},
        '來源':{select:{name:'蝦皮'}},
        '料件ID':{rich_text:[{text:{content:stockRef}}]},
        '備註':{rich_text:[{text:{content:note}}]},
      };
      if(item.shipDate&&item.shipDate.length===10) cProps['出日']={date:{start:item.shipDate}};
      if(item.payDate&&item.payDate.length===10) cProps['付款時間']={date:{start:item.payDate}};
      try{
        await notionAPI('POST','pages',{parent:{database_id:DB.corders},properties:cProps});
        await syncToShopee115({no:item.no,buyer:item.buyer,matName:displaySku,qty:item.qty,
          shipMethod:item.shipMethod,shipDate:item.shipDate,payDate:item.payDate||'',note});
        ok++;
      }catch(eCreate){
        failed++;
        console.error('C端訂單建立失敗:',item,eCreate);
      }
    }

    await refreshAll(); await loadCorders(); renderTab(CURRENT_TAB);
    showToast('✅ 匯入完成：新增 '+ok+' 筆'+(skip?' / 跳過 '+skip+' 筆':'')+(warn?' / '+warn+' 筆需確認':'')+(failed?' / 失敗 '+failed+' 筆':''), warn?'warn':'ok');
    if(warnList.length){
      alert('⚠ 以下品項庫存未完整扣除，請確認料件主檔：\n\n'+warnList.slice(0,30).join('\n')+(warnList.length>30?'\n...':''));
    }

  }catch(e){
    showToast('❌ 匯入失敗：'+e.message,'err');
    console.error('importShopeeExcel error:',e);
  }
}

  if(info) info.textContent='⏳ 解析 PI Excel 中...';

  // 先嘗試直接讀取（未加密 Excel）
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      parsePIRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null}), file.name.replace(/\.xlsx?$/i,''));
    }catch(err){
      // 可能是加密，嘗試送 Worker 解密
      if(info) info.textContent='⏳ 上傳解密中（約 5-15 秒）...';
      try{
        const formData=new FormData();
        formData.append('file', file);
        formData.append('password','576313');
        const controller=new AbortController();
        const tid=setTimeout(()=>controller.abort(), 60000);
        let res;
        try{
          res=await fetch(PROXY,{method:'POST',body:formData,signal:controller.signal});
        }catch(fe){
          clearTimeout(tid);
          if(info) info.textContent=fe.name==='AbortError'?'❌ 解密超時（60秒），請重試':'❌ 無法連線 Worker：'+fe.message;
          input.value=''; return;
        }
        clearTimeout(tid);
        if(!res.ok){if(info)info.textContent='❌ Worker 錯誤：HTTP '+res.status; input.value=''; return;}
        const json=await res.json();
        if(json.error){if(info)info.textContent='❌ 解密失敗：'+json.error; input.value=''; return;}
        if(!json.base64){if(info)info.textContent='❌ Worker 未回傳資料'; input.value=''; return;}
        // 解碼 base64
        const binary=atob(json.base64);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        const wb2=XLSX.read(bytes,{type:'array'});
        parsePIRows(XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:null}), file.name.replace(/\.xlsx?$/i,''));
      }catch(e2){
        if(info) info.textContent='❌ 解密失敗：'+e2.message;
        input.value='';
      }
    }
  };
  reader.readAsArrayBuffer(file);
  input.value='';
}

function parsePIRows(rows, piName){
  const info=document.getElementById('piInfo');
  try{
    const piNo=rows[6]&&rows[6][9]?String(rows[6][9]).trim():'';
    let piDate='';
    if(rows[7]&&rows[7][8]) piDate=String(rows[7][8]).replace('Date:','').trim().replace(/\./g,'-');
    const items=[];
    for(let i=12;i<rows.length-2;i++){
      const row=rows[i]; if(!row) continue;
      const col1=row[1]?String(row[1]).trim():'';
      if(col1&&/^\d+\.?$/.test(col1)){
        const qty=row[6]?parseInt(row[6]):0;
        const model=(rows[i+1]||[])[2]?String((rows[i+1]||[])[2]).trim():'';
        if(model) items.push({model,qty}); i++;
      }
    }
    if(piNo&&document.getElementById('m_note')) document.getElementById('m_note').value='PI No: '+piNo;
    if(piDate&&document.getElementById('m_date')) document.getElementById('m_date').value=piDate;
    // 把品項加入訂單品項清單
    if(items.length){
      const prodSel=document.getElementById('m_product');
      if(prodSel&&items[0]){
        const mat=mats.find(m=>m.code===items[0].model||m.name===items[0].model);
        if(mat) prodSel.value=mat.id;
        if(document.getElementById('m_qty')) document.getElementById('m_qty').value=items[0].qty||1;
      }
    }
    if(info) info.innerHTML=`✅ PI 解析完成：<b>${piNo||piName}</b>，${piDate}，共 ${items.length} 種品項`;
  }catch(e){
    if(info) info.textContent='❌ PI 解析失敗：'+e.message;
  }
}

  parsePIFile(input);
}

async function submitNormalOrder(isDomestic){
  const btn=document.getElementById('orderSubmitBtn');
  const domSel=document.getElementById('m_dom_cust');
  const domManual=(document.getElementById('m_dom_manual')?.value||'').trim();
  const custId = isDomestic ? domSel?.value : document.getElementById('m_cust')?.value;
  const selectedCust = customers.find(c=>c.id===custId);
  const custName = isDomestic
    ? (domManual || selectedCust?.name || domSel?.options[domSel?.selectedIndex]?.dataset?.name || domSel?.options[domSel?.selectedIndex]?.text?.replace(/\s*\([^)]*\)\s*$/,'') || '')
    : (selectedCust?.name || (document.getElementById('m_newcust_name')?.value||'').trim() || '');
  const custCode = selectedCust?.code || '';
  const productId=document.getElementById('m_product')?.value;
  const qty=parseInt(document.getElementById('m_qty')?.value)||1;
  const deadline=document.getElementById('m_date')?.value||'';
  const note=document.getElementById('m_note')?.value?.trim()||'';
  const orderType=isDomestic?'國內':'國外';

  if(!custName){showToast(isDomestic?'請選擇或手動輸入國內客戶':'請選擇或輸入國外客戶','warn');return;}
  if(!productId){showToast('請選擇成品','warn');return;}

  const product=mats.find(m=>m.id===productId);
  const today=new Date().toISOString().slice(0,10);
  const yr=today.slice(2,4); const mo=today.slice(5,7);
  const orderNo=`ORD-${yr}${mo}-${Math.floor(Math.random()*9000+1000)}`;

  closeModal(); showToast('建立訂單中...','warn');
  try{
    const props={
      '訂單號':    {title:[{text:{content:orderNo}}]},
      '客戶名稱':  {select:{name:custName||'未知'}},
      '訂購數量':  {number:qty},
      '狀態':      {select:{name:'待排程'}},
      '訂單類型':  {select:{name:orderType}},
      '業務備註':  {rich_text:[{text:{content:note}}]},
    };
    if(productId) props['成品']={relation:[{id:productId}]};
    if(deadline)  props['交期']={date:{start:deadline}};
    await notionAPI('POST','pages',{parent:{database_id:DB.orders},properties:props});
    if(isDomestic){
      await syncToDomesticTrade115({
        orderNo,
        custName:custName||'未知',
        custCode,
        productName:product?.code||product?.name||'',
        qty,
        deadline,
        note
      });
    }
    logUserAction('建立訂單',orderNo,`${custName||'未知'} ${product?.code||product?.name||''} x ${qty}`,ROLE);
    await refreshAll();
    showToast(`✅ 訂單 ${orderNo} 建立完成${isDomestic?'，已同步 115年貿易商':''}`,'ok');
  }catch(e){showToast('❌ 建立失敗：'+e.message,'err'); if(btn){btn.disabled=false;btn.textContent='📋 建立訂單';}}
}

function switchOrderTab(type){
  const tabs = ['overseas','domestic','sfg','shopee'];
  tabs.forEach(t=>{
    const block = document.getElementById('block'+t.charAt(0).toUpperCase()+t.slice(1));
    const tab   = document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1));
    if(block) block.style.display = (t===type)?'':'none';
    if(tab){
      tab.className='btn '+(t===type?'btn-blue':'btn-ghost');
      tab.style.cssText='flex:1;justify-content:center;font-size:0.75rem';
    }
  });
  const itemAddRow = document.getElementById('itemAddRow');
  const dateRow    = document.getElementById('dateRow');
  if(itemAddRow) itemAddRow.style.display = (type==='sfg'||type==='shopee')?'none':'flex';
  if(dateRow)    dateRow.style.display    = (type==='sfg'||type==='shopee')?'none':'';
  if(type==='domestic'){
    initDomesticList();
  }
  if(type==='sfg'){
    const sel=document.getElementById('m_sfg_sel');
    if(sel) sel.style.display='block';
  }
  if(type==='shopee'){
    initShopeeOrderList();
  }
}

async function submitShopeeOrdersV2(){
  const note=document.getElementById('m_shopee_note')?.value?.trim()||'';
  let items=window._shopeeOrderItems||[];
  const selected=document.getElementById('m_shopee_sku')?.value;
  if(!items.length&&selected){
    let mat=null;
    if(selected.startsWith('NEW::')){
      mat=await ensureShopeeParentMaterial(selected.slice(5));
      await ensureShopeeBomRows(mat);
    }else{
      mat=mats.find(m=>m.id===selected)||findMatBySku(selected);
    }
    if(mat) items=[{matId:mat.id,qty:parseInt(document.getElementById('m_shopee_qty')?.value)||1,code:mat.code||mat.name,name:mat.name||mat.code}];
  }
  if(!items.length){showToast('請至少加入一個 S-料號','warn');return;}
  const today=new Date().toISOString().slice(0,10);
  const yr=today.slice(2,4), mo=today.slice(5,7);
  closeModal(); showToast('⏳ 建立蝦皮待排程訂單...','ok');
  let ok=0, fail=0, messages=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    let mat=mats.find(m=>m.id===it.matId)||findMatBySku(it.code||it.name||it.matId);
    if(!mat){
      try{mat=await ensureShopeeParentMaterial(it.code||it.name||it.matId);}
      catch(e){fail++;messages.push((it.code||it.name||'')+'：'+e.message);continue;}
    }
    const orderNo=`ORD-${yr}${mo}-S${String(i+1).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;
    try{
      await ensureShopeeBomRows(mat);
      const bomItems=explodeBOM(mat.id,it.qty);
      if(!bomItems.length) throw new Error('此 S-料號尚未設定 BOM 或主料/配件備註，無法建立可領料訂單');
      const missing=bomItems.filter(x=>x.missing||!x.id);
      if(missing.length) throw new Error('BOM 子料號未建檔：'+missing.map(x=>x.code||x.name).join('、'));
      const props={
        '訂單號':{title:[{text:{content:orderNo}}]},
        '客戶名稱':{select:{name:'蝦皮'}},
        '成品':{relation:[{id:mat.id}]},
        '訂購數量':{number:it.qty},
        '狀態':{select:{name:'待排程'}},
        '訂單類型':{select:{name:'蝦皮'}},
        '業務備註':{rich_text:[{text:{content:[`S料號：${mat.code||mat.name}`,note,'預計扣料：'+bomItems.map(x=>(x.code||x.name)+'×'+x.needed).join('、')].filter(Boolean).join(' / ')}}]},
      };
      props['交期']={date:{start:today}};
      const r=await notionAPI('POST','pages',{parent:{database_id:DB.orders},properties:props});
      if(!r||r.object!=='page') throw new Error(r?.message||'訂單建立失敗');
      logUserAction('建立蝦皮訂單',orderNo,`${mat.code||mat.name} x ${it.qty}`,ROLE);
      ok++;
    }catch(e){
      fail++;
      messages.push((mat.code||mat.name)+'：'+e.message);
    }
  }
  window._shopeeOrderItems=[];
  await refreshAll();
  showToast(`✅ 蝦皮待排程訂單建立 ${ok} 筆${fail?'，失敗 '+fail+' 筆':''}`,fail?'warn':'ok');
  if(messages.length) alert('以下 S-料號未完成建立：\n\n'+messages.join('\n'));
}

async function submitShopeeOrder(){
  return submitShopeeOrdersV2();
}

async function completeShopeeOrder(orderId, orderNo, skuCode, qty){
  if(!confirm(`確認完成訂單 ${orderNo}？\n完成後將增加 ${skuCode} 庫存 ${qty||1} 個（成品入庫）。`)) return;
  try{
    await updatePage(orderId,{'狀態':{select:{name:'已完成'}}});
    const ord = orders.find(o=>o.id===orderId);
    if(ord) ord.status='已完成';
    const sku = mats.find(m=>m.code===skuCode);
    if(sku){
      const addQty = qty||1;
      const latest = await notionAPI('GET','pages/'+sku.id);
      const curQty = latest?.properties?.['目前庫存']?.number ?? sku.qty ?? sku.stock ?? 0;
      const newQty = curQty + addQty;
      await updatePage(sku.id,{'目前庫存':{number:newQty}});
      await logStockChange(sku.id, sku.name||skuCode, sku.code||skuCode, '蝦皮完成入庫', addQty, curQty, newQty, orderNo, ROLE);
      logUserAction('完成蝦皮訂單',orderNo,`${skuCode} x ${addQty}`,ROLE);
      sku.qty = newQty;
      sku.stock = newQty;
    }
    await refreshAll(); renderTab(CURRENT_TAB);
    showToast(`✅ 訂單 ${orderNo} 已完成，${skuCode} 庫存已更新`,'ok');
  }catch(e){ showToast('❌ '+e.message,'err'); }
}
