/* ══════════════════════════════════════════════
   LEMATEC ERP 主題系統 — 5 種精選配色
   即時切換、localStorage 保存、無需重整
   ══════════════════════════════════════════════ */
/* 共用字型變數 */
:root{
  --bg:#05080f;--bg2:#0a0f1e;--bg3:#0f1628;--bg4:#151d35;--bg5:#1c2640;
  --border:#1a2438;--border2:#243352;--border3:#2d4068;
  --brand:#9c1b2c;--brand2:#c5243e;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#06b6d4;--cyan2:#22d3ee;
  --green:#10b981;--green2:#34d399;--yellow:#f59e0b;--amber:#fbbf24;
  --red:#ef4444;--red2:#f87171;--purple:#8b5cf6;
  --text:#f0f4ff;--text2:#a0aec0;--text3:#55657a;
  --f-ui:'Outfit','Noto Sans TC',system-ui,sans-serif;
  --f-mono:'DM Mono',monospace;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius-card:14px;
}
/* ══════════════════════════════
   主題覆蓋（不影響 :root 預設值）
   選擇後即時覆蓋，不選則用科技風
   ══════════════════════════════ */
/* 🌿 自然風 */
html[data-theme="nature"]{
  --bg:#0f1a12;--bg2:#162118;--bg3:#1c2e20;--bg4:#243a28;--bg5:#2c4832;
  --border:#2a3d2e;--border2:#3a5540;--border3:#4a6e52;
  --brand:#2d6a4f;--brand2:#40916c;
  --blue:#52b788;--blue2:#74c69d;--cyan:#95d5b2;--cyan2:#b7e4c7;
  --green:#2d6a4f;--green2:#40916c;--yellow:#d4a017;--amber:#e9c46a;
  --red:#c44536;--red2:#e07a5f;--purple:#7b6d8d;
  --text:#d8f3dc;--text2:#95b8a0;--text3:#52796f;
  --shadow:0 4px 24px rgba(0,0,0,.4);--radius-card:16px;
}
/* ⬜ 極簡風（深灰）*/
html[data-theme="minimal"]{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;--bg4:#2a2a2a;--bg5:#333333;
  --border:#2c2c2c;--border2:#383838;--border3:#444444;
  --brand:#505050;--brand2:#707070;
  --blue:#6e9ef5;--blue2:#8fb3f8;--cyan:#5bc4d6;--cyan2:#7dd4e3;
  --green:#5fbd8a;--green2:#79cea0;--yellow:#d4a843;--amber:#e8c56e;
  --red:#d9534f;--red2:#e57573;--purple:#9b8ec4;
  --text:#ebebeb;--text2:#9a9a9a;--text3:#585858;
  --shadow:0 4px 20px rgba(0,0,0,.6);--radius-card:8px;
}
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌌 科技深藍（預設）- 深邃宇宙藍，高對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root, html
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌙 深紫夜色 - 優雅暗紫，眼睛最舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌿 森林綠意 - 沉穩深綠，自然舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🔥 琥珀暗金 - 溫暖金棕，高貴沉穩
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ⬛ 碳黑極簡 - 純粹黑灰，最大對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
html{font-size:1rem;}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--cyan),var(--green2));border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
/* ── Input ── */
.inp{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-family:var(--f-ui);font-size:0.875rem;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18);}
.inp::placeholder{color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;}
select.inp{-webkit-appearance:none;appearance:none;cursor:pointer;height:auto;}
select.inp>option{background:var(--bg3);color:var(--text);}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6;}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;font-family:var(--f-ui);font-size:0.875rem;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;-webkit-user-select:none;user-select:none;white-space:nowrap;letter-spacing:.2px;}
.btn:active{transform:scale(.97);}
