function openInspectionModal(orderId, orderNo){
  const o=orders.find(x=>x.id===orderId);
  const product=mats.find(m=>m.id===o?.productId);
  openNewInspection(orderId,orderNo,product?.name||o?.product||'',o?.qty||0);
}

function toggleInspectionBad(result){
  const block = document.getElementById('ins_bad_block');
  if(block) block.style.display = (result==='不通過'||result==='條件通過') ? '' : 'none';
}

async function submitInspection(){
  // 讀取 orderId（從訂單觸發時有值，手動新增時為空）
  const orderId = document.getElementById('ins_order_id')?.value||'';
  const orderNo = document.getElementById('ins_order')?.value.trim()||'';
  const selectedMatId = document.getElementById('ins_mat_existing_id')?.value||'';
  const selectedMat = mats.find(m=>m.id===selectedMatId);
  const matName = (document.getElementById('ins_mat').value.trim() || selectedMat?.name || selectedMat?.code || '');
  const matCode = (document.getElementById('ins_code').value.trim() || selectedMat?.code || '');
  const qtyReq  = parseInt(document.getElementById('ins_qtyreq').value)||0;
  const qtyAct  = parseInt(document.getElementById('ins_qtyact').value)||0;
  const qtyBad  = parseInt(document.getElementById('ins_qtybad').value)||0;
  const type     = document.getElementById('ins_type').value;
  const date     = document.getElementById('ins_date').value;
  const result   = document.getElementById('ins_result').value;
  const inspector= document.getElementById('ins_inspector').value.trim();
  const badReason= document.getElementById('ins_bad_reason')?.value||'';
  const handling = document.getElementById('ins_handling')?.value||'';
  const badDesc  = document.getElementById('ins_bad_desc')?.value.trim()||'';
  const toStock  = document.getElementById('ins_to_stock')?.checked||false;
  const matSel   = document.getElementById('ins_mat_sel')?.value||''; // 選擇的料件 ID（入庫用）
  const note     = document.getElementById('ins_note').value.trim();
  const photos   = [..._qcPhotoFiles];

  if(!matName){ showToast('請填入品項名稱','warn'); return; }
  if(!date){ showToast('請填入檢驗日期','warn'); return; }

  // 手動新增且勾選料號入庫：需選料件
  const isManual = !orderId;
  if(isManual && toStock && !matSel){
    showToast('勾選料號入庫時，請從料件主檔選擇對應料件','warn'); return;
  }

  const no = document.getElementById('ins_no').value;
  closeModal(); showToast('建立檢驗單中...','warn');

  try{
    const props = {
      '檢驗單號':   {title:[{text:{content:no}}]},
      '關聯訂單號': {rich_text:[{text:{content: orderId ? orderId+'|'+(orderNo||orderId) : (orderNo||'手動品檢')}}]},
      '檢驗類型':   {select:{name:type}},
      '品項名稱':   {rich_text:[{text:{content:matName}}]},
      '料件編號':   {rich_text:[{text:{content:matCode}}]},
      '應檢數量':   {number:qtyReq},
      '實檢數量':   {number:qtyAct},
      '不良數量':   {number:qtyBad},
      '檢驗結果':   {select:{name:result}},
      '檢驗人員':   {rich_text:[{text:{content:inspector||ROLE}}]},
      '料號入庫':   {checkbox:toStock},
      '備註':       {rich_text:[{text:{content:note}}]},
    };
    if(date) props['檢驗日期']={date:{start:date}};
    if(badReason) props['不良原因']={select:{name:badReason}};
    if(handling)  props['處理方式']={select:{name:handling}};
    if(badDesc)   props['不良描述']={rich_text:[{text:{content:badDesc}}]};

    const createdInspection=await notionAPI('POST','pages',{parent:{database_id:DB.qcInspection}, properties:props});
    logUserAction('新增品檢', no, `${matCode||matName} ${result}${isManual?' / 手動新增':''}`, inspector||ROLE);
    if(photos.length){
      try{await uploadQCPhotosToNotion({
        photos,
        inspectionPageId:createdInspection?.id,
        sourcePageId:orderId||'',
        sourceTitle:orderNo||matCode||matName,
        inspectionNo:no
      });}
      catch(e){showToast('⚠ 檢驗單已建立，但照片上傳失敗：'+e.message,'warn',6000);}
    }

    // ── 情況 A：訂單品管（有 orderId）──
    if(orderId){
      if(result==='通過'){
        // 訂單推進到待出貨，不動庫存
        await updatePage(orderId, {'狀態':{select:{name:'待出貨'}}});
        const o = orders.find(x=>x.id===orderId);
        if(o){ o.status='待出貨'; renderTab(CURRENT_TAB); }
        showToast('✅ 檢驗通過，訂單已更新為「待出貨」','ok');
      } else if(result==='不通過'){
        showToast('❌ 檢驗不通過，請處理不良品','err');
      } else {
        showToast('✅ 檢驗單 '+no+' 已建立','ok');
      }

    // ── 情況 B：手動新增（無 orderId）──
    } else {
      // 若勾選「料號入庫」且結果通過 → 更新庫存
      if(toStock && matSel && (result==='通過'||result==='條件通過')){
        const mat = mats.find(m=>m.id===matSel);
        if(mat){
          const inQty = qtyAct - qtyBad; // 實檢數量 - 不良數量 = 入庫數量
          const latest = await notionAPI('GET','pages/'+matSel);
          const curStock = latest.properties?.['目前庫存']?.number??mat.stock;
          const newStock = curStock + inQty;
          await updatePage(matSel, {'目前庫存':{number:newStock}});
          await logStockChange(matSel, mat.name, mat.code, '品管入庫', inQty, curStock, newStock, no, inspector||ROLE);
          showToast('✅ 檢驗單 '+no+' 已建立，庫存 +'+inQty,'ok');
        }
      } else {
        showToast('✅ 檢驗單 '+no+' 已建立','ok');
      }
    }

    await loadQCInspections();
    await refreshAll();
    if(CURRENT_TAB==='qc') renderTab('qc');
  }catch(e){ showToast('❌ '+e.message,'err'); }
}

function renderDashboard(){
  const low=mats.filter(m=>m.stock<=m.safe);

  const done=orders.filter(o=>o.status==='已完成').length;
  const rate=orders.length?Math.round(done/orders.length*100):0;
  const pending=leaves.filter(l=>l.status==='待審核').length;
  const _todayShip=todayStr();
  const todayShipOrders=orders.filter(o=>o.shipDate===_todayShip);
  const readyShipOrders=orders.filter(o=>o.status==='待出貨');
  // 交期提醒計算
  const warnDays = window._deadlineWarn!==undefined ? window._deadlineWarn : parseInt(localStorage.getItem('_deadlineWarn')||'14');
  const _now = new Date(); _now.setHours(0,0,0,0);
  const deadlineSoon = orders.filter(o=>{
    if(!o.deadline||o.status==='已完成'||o.status==='取消') return false;
    const dl=new Date(o.deadline); dl.setHours(0,0,0,0);
    const diff=Math.round((dl-_now)/86400000);
    return diff>=0 && diff<=warnDays;
  });
  const qcPending=(orders.filter(o=>o.status==='待檢驗').length)+(inbounds.filter(i=>i.qcStatus==='待品檢').length);

  // 公告
  const pubAll=announces.filter(a=>a.status==='已發佈');
  const pinnedOne=pubAll.filter(a=>a.pinned).sort((a,b)=>(a.order||99)-(b.order||99))[0]||null;
  const latestOne=pubAll.filter(a=>!a.pinned).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  const dashAnns=[pinnedOne,latestOne].filter(Boolean);

  // 近30天訂單分析

  const c30=cutoff30.toISOString().slice(0,10);

function renderOrders(){
  if(!window._ORD_SUB) window._ORD_SUB='list';
  const OSUB = window._ORD_SUB;

  // ── 交期提醒天數設定（可儲存）──
  if(window._deadlineWarn===undefined) window._deadlineWarn=parseInt(localStorage.getItem('_deadlineWarn')||'14');
  const warnDays = window._deadlineWarn;

  // ── Tab 切換 ──
  const now = new Date(); now.setHours(0,0,0,0);
  const soonOrders = orders.filter(o=>{
    if(!o.deadline) return false;
    const dl = new Date(o.deadline); dl.setHours(0,0,0,0);
    const diff = Math.round((dl-now)/86400000);
    return diff>=0 && diff<=warnDays && o.status!=='已完成' && o.status!=='取消';
  }).sort((a,b)=>a.deadline.localeCompare(b.deadline));

  const tabs=`<div style="display:flex;gap:2px;padding:4px;background:var(--bg3);border-radius:12px;margin-bottom:14px">
    ${[['list','📋 訂單列表'],['deadline','⏰ 交期提醒'+(soonOrders.length?` (${soonOrders.length})`:'')],['calendar','📅 月曆']].map(([k,l])=>`
    <button onclick="window._ORD_SUB='${k}';renderTab('orders')"
      style="flex:1;padding:8px 4px;border-radius:8px;font-size:0.75rem;font-weight:${OSUB===k?700:400};
      background:${OSUB===k?'var(--bg)':'transparent'};
      color:${OSUB===k?(k==='deadline'&&soonOrders.length?'var(--red)':'var(--text)'):'var(--text3)'};
      border:${OSUB===k?'1px solid var(--border)':'1px solid transparent'};cursor:pointer;transition:all .15s;
      box-shadow:${OSUB===k?'0 1px 4px rgba(0,0,0,.3)':'none'}">${l}</button>`).join('')}
  </div>`;

  if(OSUB==='list') return _renderOrdersList(tabs);
  if(OSUB==='deadline') return _renderDeadlineTab(tabs, soonOrders, warnDays);
  return _renderOrderCalendar(tabs);
}

function orderCustomerLabel(o){
  const raw=String(o?.customer||o?.cust||'').trim();
  if(!raw) return '—';
  const isDomestic=o?.orderType==='國內'||o?.orderType==='domestic';
  if(isDomestic) return raw;
  const rawUp=raw.toUpperCase();
  const c=customers.find(x=>(x.type==='overseas'||!x.type)&&(
    String(x.code||'').toUpperCase()===rawUp ||
    String(x.name||'').toUpperCase()===rawUp ||
    rawUp.includes(String(x.code||'').toUpperCase())
  ));
  return c?.code||raw;
}

function _renderDeadlineTab(tabs, soonOrders, warnDays){
  const _notionBar='';

  // 設定欄：可調整提醒天數
  const settingBar=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.15);
    border-radius:10px;margin-bottom:14px">
    <span style="font-size:0.75rem;color:var(--text2)">⏰ 提醒設定：距交期</span>
    <input type="number" id="warnDaysInput" value="${warnDays}" min="1" max="90"
      style="width:60px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);
      background:var(--bg3);color:var(--text);font-size:0.75rem;text-align:center">
    <span style="font-size:0.75rem;color:var(--text2)">天內自動提醒</span>
    <button class="btn btn-blue btn-sm" onclick="
      const v=parseInt(document.getElementById('warnDaysInput').value)||14;
      window._deadlineWarn=v;localStorage.setItem('_deadlineWarn',v);
      renderTab('orders');showToast('✅ 已儲存：提醒 '+v+' 天內的交期','ok')">💾 儲存</button>
  </div>`;

  if(!soonOrders.length) return tabs + settingBar +
    `<div class="panel"><div style="padding:32px;text-align:center;color:var(--text3)">
      ✅ 目前沒有 ${warnDays} 天內到期的訂單
    </div></div>`;

  const now = new Date(); now.setHours(0,0,0,0);
  const statusOpts=['可如期出貨','需延期','客戶確認中','已溝通完成'];
  const statusColor={'可如期出貨':'var(--green)','需延期':'var(--red)','客戶確認中':'var(--yellow)','已溝通完成':'var(--text3)'};

  const cards = soonOrders.map(o=>{
    const dl = new Date(o.deadline); dl.setHours(0,0,0,0);
    const diff = Math.round((dl-now)/86400000);
    const urgColor = diff<=3?'var(--red)':diff<=7?'var(--yellow)':'var(--amber,#f59e0b)';
    const curStat = window._deadlineStatus?.[o.id]||'';
    return `<div style="background:var(--bg2);border:1px solid ${diff<=3?'rgba(239,68,68,.3)':'var(--border)'};
      border-radius:12px;padding:16px 18px;margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:0.6875rem;font-weight:700;font-family:monospace;
              background:${urgColor};color:#000;padding:2px 8px;border-radius:20px">
              ${diff===0?'今天到期':diff+'天後到期'}</span>
            <span style="font-size:0.6875rem;color:var(--text3)">${o.no}</span>
          </div>
          <div style="font-weight:700;font-size:0.875rem;color:var(--text);margin-bottom:2px">${orderCustomerLabel(o)}</div>
          <div style="font-size:0.75rem;color:var(--text2)">${o.product||'—'} × ${o.qty}</div>
          <div style="font-size:0.6875rem;color:var(--text3);margin-top:4px">交期：<span style="font-family:monospace;font-weight:600;color:${urgColor}">${o.deadline}</span></div>
        </div>
        <div style="min-width:200px">
          <div style="font-size:0.625rem;color:var(--text3);margin-bottom:6px">業務狀態更新</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
            ${statusOpts.map(s=>{
              const a=curStat===s;
              return `<button onclick="if(!window._deadlineStatus)window._deadlineStatus={};window._deadlineStatus['${o.id}']='${s}';renderTab('orders')"
                style="padding:4px 10px;border-radius:20px;font-size:0.6875rem;cursor:pointer;font-weight:${a?700:400};
                border:1px solid ${a?'var(--blue)':'var(--border)'};
                background:${a?'rgba(77,142,245,.15)':'var(--bg3)'};
                color:${a?'var(--blue)':'var(--text2)'}">${s}</button>`;
            }).join('')}
          </div>
          ${curStat?`<div style="font-size:0.6875rem;padding:5px 10px;background:var(--bg3);border-radius:6px;color:${statusColor[curStat]||'var(--text2)'}">✓ ${curStat}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  return tabs + settingBar + `<div style="font-size:0.6875rem;color:var(--text3);margin-bottom:10px">共 ${soonOrders.length} 張訂單需注意</div>` + cards;
}

  const monthCtrl=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH--;if(window._ORD_CAL_MONTH<1){window._ORD_CAL_MONTH=12;window._ORD_CAL_YEAR--;}renderTab('orders')">← 上月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_YEAR=new Date().getFullYear();window._ORD_CAL_MONTH=new Date().getMonth()+1;renderTab('orders')">今月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH++;if(window._ORD_CAL_MONTH>12){window._ORD_CAL_MONTH=1;window._ORD_CAL_YEAR++;}renderTab('orders')">下月 →</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.6875rem;color:var(--text3)">顯示月數：</span>
      ${[1,2,3,6].map(n=>{const a=showMonths===n;return`<button onclick="window._ORD_CAL_MONTHS=${n};renderTab('orders')"
        style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;
        border:1px solid ${a?'var(--blue)':'var(--border)'};
        background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};
        color:${a?'var(--blue)':'var(--text2)'}">${n}個月</button>`;}).join('')}
    </div>
  </div>`;

  // 產生每個月的月曆
  let calHtml='';
  for(let mi=0;mi<showMonths;mi++){
    let yr=window._ORD_CAL_YEAR, mo=window._ORD_CAL_MONTH+mi;
    while(mo>12){mo-=12;yr++;}
    const monthStr=yr+'-'+String(mo).padStart(2,'0');
    const daysInMonth=new Date(yr,mo,0).getDate();
    const firstDay=new Date(yr,mo-1,1).getDay();
    const wds=['日','一','二','三','四','五','六'];
    let cells=''; let dc=1;
    const total=Math.ceil((firstDay+daysInMonth)/7)*7;
    for(let i=0;i<total;i++){
      if(i<firstDay||dc>daysInMonth){
        cells+=`<div style="min-height:60px;background:rgba(255,255,255,.01);border-radius:6px"></div>`;
      } else {
        const dk=monthStr+'-'+String(dc).padStart(2,'0');
        const dl=deadlineMap[dk]||[];
        const isT=dk===today.toISOString().slice(0,10);
        const isW=(i%7===0||i%7===6);
        cells+=`<div style="min-height:60px;padding:4px 5px;background:${isT?'rgba(77,142,245,.08)':'var(--bg2)'};
          border:1px solid ${isT?'rgba(77,142,245,.3)':dl.length?'rgba(239,68,68,.25)':'var(--border)'};border-radius:6px">
          <div style="font-size:0.6875rem;font-weight:${isT?700:400};color:${isT?'var(--blue)':isW?'rgba(239,68,68,.7)':'var(--text)'};margin-bottom:2px">${dc}</div>
          ${dl.map(o=>`<div style="padding:1px 4px;border-radius:3px;font-size:0.5625rem;font-weight:600;
            background:rgba(239,68,68,.12);color:#ef4444;margin-bottom:1px;
            overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer"
            title="${o.no} ${orderCustomerLabel(o)} × ${o.qty}">
            🔴 ${o.no.slice(-6)}</div>`).join('')}
        </div>`;
        dc++;
      }
    }
    // 計算本月有幾張交期訂單
    const monthDL = Object.entries(deadlineMap).filter(([k])=>k.startsWith(monthStr)).reduce((s,[,v])=>s+v.length,0);
    calHtml+=`<div style="margin-bottom:${mi<showMonths-1?'24px':'0'}">
      <div style="font-size:0.875rem;font-weight:700;color:var(--text);margin-bottom:8px">
        ${yr} 年 ${mo} 月
        ${monthDL?`<span style="font-size:0.6875rem;font-weight:400;color:var(--red);margin-left:8px">🔴 ${monthDL} 張交期</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">
        ${wds.map(w=>`<div style="text-align:center;font-size:0.625rem;font-weight:700;color:var(--text3);padding:3px">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
    </div>`;
  }

  // 近期交期清單
  const upcomingList = Object.entries(deadlineMap)
    .sort(([a],[b])=>a.localeCompare(b))
    .filter(([k])=>k>=today.toISOString().slice(0,10))
    .slice(0,10);

  const upcomingHtml = upcomingList.length ? `<div class="panel" style="margin-top:16px">
    <div class="panel-hdr"><span class="panel-title">📌 近期交期清單</span></div>
    <div class="table-wrap"><table>
      <tr><th>交期</th><th>訂單號</th><th>客戶</th><th>品項</th><th>數量</th><th>狀態</th><th>剩餘天數</th></tr>
      ${upcomingList.map(([dk,ords])=>ords.map(o=>{
        const dl=new Date(dk);dl.setHours(0,0,0,0);
        const diff=Math.round((dl-today)/86400000);
        const urgColor=diff<=3?'var(--red)':diff<=7?'var(--yellow)':'var(--text2)';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem;font-weight:600;color:${urgColor}">${dk}</td>
          <td style="font-family:monospace;font-size:0.6875rem">${o.no}</td>
          <td style="font-size:0.6875rem">${orderCustomerLabel(o)}</td>
          <td style="font-size:0.6875rem">${o.product||'—'}</td>
          <td style="font-family:monospace">${o.qty}</td>
          <td>${pill(o.status||'—')}</td>
          <td style="font-size:0.6875rem;font-weight:700;color:${urgColor}">${diff===0?'今天':diff+'天'}</td>
        </tr>`;
      }).join('')).join('')}
    </table></div>
  </div>` : '';

  return tabs + monthCtrl + calHtml + upcomingHtml;
}

function renderInventory(){

    q:'', type:'all', stockMin:'', stockMax:'', stockStatus:'all', page:1, pageSize:100
  };

  // ── 套用篩選
  let data = applySort('inventory', mats);
  if(INV.q){
    const q=INV.q.toLowerCase();
    data=data.filter(m=>m.name.toLowerCase().includes(q)||m.code.toLowerCase().includes(q));
  }
  if(INV.type!=='all') data=data.filter(m=>m.type===INV.type);

  if(INV.stockMax!=='') data=data.filter(m=>m.stock<=Number(INV.stockMax));
  if(INV.stockStatus==='ok')  data=data.filter(m=>m.stock>0&&(m.safe<=0||m.stock>m.safe));
  if(INV.stockStatus==='low') data=data.filter(m=>m.stock>0&&m.safe>0&&m.stock<=m.safe);
  if(INV.stockStatus==='out') data=data.filter(m=>m.stock<=0);

  const total=data.length;
  const ps=INV.pageSize;
  const maxPage=Math.max(1,Math.ceil(total/ps));
  if(INV.page>maxPage) INV.page=maxPage;
  const pageData=data.slice((INV.page-1)*ps, INV.page*ps);

  // ── 分頁按鈕
  function pageBtns(){
    if(maxPage<=1) return '';
    const btns=[];
    const p=INV.page;
    btns.push(`<button class="btn btn-ghost btn-xs" ${p<=1?'disabled':''} onclick="_invGo(${p-1})">‹</button>`);

    let start=Math.max(1,p-3), end=Math.min(maxPage,start+6);

      </div>
      <!-- 庫存下限 -->
      <div style="min-width:90px">

      <!-- 庫存上限 -->
      <div style="min-width:90px">
        <div style="font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">庫存 ≤</div>

          placeholder="最大" style="padding:7px 10px;font-size:0.8125rem"
          oninput="_invFilter('stockMax',this.value)">
      </div>
      <!-- 庫存狀態篩選 -->
      <div style="min-width:120px">
        <div style="font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">庫存狀態</div>
        <select class="inp" style="padding:7px 10px;font-size:0.8125rem" onchange="_invFilter('stockStatus',this.value)">
          ${[['all','全部狀態'],['ok','✅ 正常'],['low','⚠ 低庫存'],['out','❌ 缺料']].map(([v,l])=>`<option value="${v}" ${INV.stockStatus===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <!-- 清除篩選 -->
      <div style="display:flex;align-items:flex-end;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="_invReset()">✕ 清除</button>
        ${isAdminRole()?`<button class="btn btn-yellow btn-sm" onclick="openDeepInventoryAudit()">🧪 深度檢視</button>`:''}

        ${isAdminRole()?`<button class="btn btn-cyan btn-sm" onclick="importShopeeBomToNotion()">🛒 匯入蝦皮BOM</button>`:''}
        ${canEdit?`<button class="btn btn-blue btn-sm" onclick="openModal('newInbound')">＋ 入料</button>`:''}
      </div>
    </div>
    <!-- 結果摘要 + 每頁筆數 -->
    <div style="padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border)">
      <span style="font-size:0.75rem;color:var(--text3)">
        共 <b style="color:var(--text)">${total}</b> 筆 / 全部 ${mats.length} 筆
        ${INV.page>1||total<mats.length?`（第 ${INV.page} 頁，顯示 ${(INV.page-1)*ps+1}–${Math.min(INV.page*ps,total)}）`:''}
      </span>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:0.6875rem;color:var(--text3)">每頁</span>
        <select class="inp" style="width:70px;padding:4px 8px;font-size:0.75rem" onchange="_invFilter('pageSize',parseInt(this.value))">
          ${[50,100,200,500].map(n=>`<option value="${n}" ${INV.pageSize===n?'selected':''}>${n}</option>`).join('')}
        </select>
        <span style="font-size:0.6875rem;color:var(--text3)">筆</span>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="panel">
    <div class="panel-hdr">
      <span class="panel-title">料件主檔 <span class="badge">${total}</span></span>
      <div style="display:flex;gap:4px">${pageBtns()}</div>
    </div>
    <div class="table-wrap">
    <table>
      <tr>
        ${TH('inventory','name','料件名稱')}
        ${TH('inventory','code','料件編號','str','hide-m')}
        ${TH('inventory','type','類型','str','hide-m')}
        ${TH('inventory','stock','庫存','num')}
        ${TH('inventory','safe','安全庫存','num','hide-m')}
        <th class="hide-m">狀態</th>
        <th>操作</th>
      </tr>
      ${pageData.length?pageData.map(m=>{
        const pct=m.safe>0?Math.min(100,(m.stock/(m.safe*2))*100):(m.stock>0?80:0);
        const fill=m.stock<=0?'var(--red)':m.stock<=m.safe?'var(--yellow)':'var(--green)';
        const sc=m.stock<=0?'var(--red)':m.stock<=m.safe?'var(--yellow)':'var(--green)';

// 入料單：手動輸入料件名稱時，即時檢查是否已建檔
// ═══════════════════════════════════════════════
function checkDupMat(val){
  const warn = document.getElementById('dup_mat_warn');
  if(!warn) return;
  const q = val.trim().toLowerCase();
  if(!q){ warn.style.display='none'; return; }

  // 比對料件主檔（大小寫不敏感 + 去空白後比對）
  const qNorm = q.replace(/\s+/g,''); // 去除所有空白後比對
  const exact = mats.find(m=> {
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');
    const cNorm = (m.code||'').toLowerCase().replace(/\s+/g,'');
    return nNorm===qNorm || (cNorm && cNorm===qNorm);
  });
  const similar = mats.filter(m=>{
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');
    const cNorm = (m.code||'').toLowerCase().replace(/\s+/g,'');
    return !exact && (nNorm.includes(qNorm) || qNorm.includes(nNorm.slice(0,6)) ||
           (cNorm && (cNorm.includes(qNorm) || qNorm.includes(cNorm))));
  }).slice(0,3);

  if(exact){
    // 完全相同 → 強烈提示切換到選擇模式
    warn.style.display='';
    warn.innerHTML=`
      <div style="font-weight:700;margin-bottom:4px">⚠ 此料件已建檔</div>
      <div style="margin-bottom:6px">
        <span style="font-family:monospace;color:var(--text)">${exact.name}</span>
        ${exact.code?`<span style="color:var(--text3);margin-left:6px">(${exact.code})</span>`:''}
        <span class="pill" style="background:rgba(16,185,129,.12);color:var(--green2);margin-left:6px">${exact.type}</span>
        <span style="color:var(--text2);margin-left:6px">庫存：<b>${exact.stock}</b></span>
      </div>
      <div style="font-size:0.6875rem;color:var(--text3);margin-bottom:6px">請改用「從料件主檔選擇」避免重複建立，造成統計錯誤。</div>
      <button class="btn btn-amber btn-xs" onclick="ibSwitchToExistAndSelect('${exact.id}')"
        style="background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)">
        → 切換並選擇此料件
      </button>`;
    warn.style.borderColor='rgba(239,68,68,.4)';
    warn.style.background='rgba(239,68,68,.07)';
    warn.style.color='var(--red2)';
    warn.querySelector('div').style.color='var(--red2)';
  } else if(similar.length){
    // 相似 → 提示可能重複
    warn.style.display='';
    warn.style.borderColor='rgba(245,158,11,.3)';
    warn.style.background='rgba(245,158,11,.07)';
    warn.style.color='var(--amber)';
    warn.innerHTML=`
      <div style="font-weight:700;margin-bottom:5px">💡 找到相似料件，請確認是否已建檔</div>
      ${similar.map(m=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(245,158,11,.15)">
          <span>
            <span style="font-family:monospace;font-size:0.75rem;color:var(--text)">${m.name}</span>
            ${m.code?`<span style="color:var(--text3);font-size:0.625rem;margin-left:5px">${m.code}</span>`:''}
            <span style="font-size:0.625rem;color:var(--text3);margin-left:5px">庫存 ${m.stock}</span>
          </span>
          <button class="btn btn-ghost btn-xs" onclick="ibSwitchToExistAndSelect('${m.id}')" style="flex-shrink:0;margin-left:8px">使用此料件</button>
        </div>`).join('')}
      <div style="font-size:0.625rem;color:var(--text3);margin-top:5px">確認是全新料件才繼續手動輸入</div>`;
  } else {
    warn.style.display='none';
  }
}

// 切換到「從主檔選擇」模式並自動選中指定料件
function ibSwitchToExistAndSelect(matId){
  const mat=mats.find(m=>m.id===matId);
  if(!mat){showToast('找不到料件','err');return;}
  const q=document.getElementById(`ib_qty_${matId}`);
  if(q) q.value=q.value||'1';
  addInboundItem(mat.id,mat.code||mat.name||'',mat.name||mat.code||'');
  const search=document.getElementById('ib_search');
  if(search) search.value=mat.code||mat.name||'';
  filterInboundList(search?.value||'');
}

function addManualPickItem(matId){

async function completeManualPick(masterId){
  if(denyViewOnlyAction()) return;
  const pick=picks.find(p=>p.id===masterId);
  if(!pick){showToast('找不到領料單','err');return;}
  if(!confirm('確認此臨時補料單已領料？\n確認後會依明細扣除庫存。')) return;
  showToast('扣除臨時補料庫存中...','warn');
  try{
    const details=(await dbQueryAll(DB.pickDetail)).filter(p=>p.properties?.['領料主單']?.relation?.some(r=>r.id===masterId));
    if(!details.length) throw new Error('找不到領料明細');
    for(const d of details){
      const matId=d.properties?.['料件']?.relation?.[0]?.id||'';
      const qty=d.properties?.['需求數量']?.number||d.properties?.['實領數量']?.number||0;
      if(!matId||!qty) continue;
      const mat=mats.find(m=>m.id===matId);
      const latest=await notionAPI('GET','pages/'+matId);
      const cur=latest?.properties?.['目前庫存']?.number??mat?.stock??0;
      const next=Math.max(0,cur-qty);
      await updatePage(matId,{'目前庫存':{number:next}});
      await updatePage(d.id,{'實領數量':{number:qty},'狀態':{select:{name:cur>=qty?'足夠':'缺料'}}});
      await logStockChange(matId,mat?.name||getTitle(d.properties,'料件名稱'),mat?.code||'','臨時補料領料',-qty,cur,next,pick.no,ROLE);
      if(mat) mat.stock=next;
    }
    await updatePage(masterId,{'狀態':{select:{name:'已領料'}}});
    logUserAction('完成臨時補料領料',pick.no,pick.note||'',ROLE);
    await refreshAll(true); await loadPicks(); window._PICK_SUB='manual'; renderTab('picking');
    showToast('✅ 已領料並完成扣庫存','ok');
  }catch(e){showToast('❌ 扣庫存失敗：'+e.message,'err');}
}

async function submitResubmitInbound(id){
  const ib=inbounds.find(x=>x.id===id);
  const matId=document.getElementById('resub_mat')?.value||'';
  const qty=parseInt(document.getElementById('resub_qty')?.value)||0;
  const reason=(document.getElementById('resub_reason')?.value||'').trim();
  if(!ib){showToast('找不到入料單','err');return;}
  if(!matId){showToast('請選擇料號','warn');return;}
  if(qty<=0){showToast('請輸入正確數量','warn');return;}
  const mat=mats.find(m=>m.id===matId);
  const stamp=new Date().toLocaleString('zh-TW',{hour12:false});
  const oldNote=ib.note||'';
  const nextNote=[oldNote,`重新提交 ${stamp}${reason?'：'+reason:''}`].filter(Boolean).join('\n');
  closeModal(); showToast('重新提交入料單中...','warn');
  try{
    await updatePage(id,{
      '料件':{relation:[{id:matId}]},
      '入料數量':{number:qty},
      '品管狀態':{select:{name:'待品檢'}},
      '入庫狀態':{select:{name:'待入庫'}},
      '備註':{rich_text:[{text:{content:nextNote.slice(-1800)}}]},
    });
    logUserAction('重新提交入料單',ib.no||id,`${mat?.code||mat?.name||matId} x ${qty}${reason?' / '+reason:''}`,ROLE);
    await loadInbounds();
    renderTab('inbound');
    showToast('✅ 已重新提交，品管頁會回到入料待品檢','ok');
  }catch(e){showToast('❌ 重新提交失敗：'+e.message,'err');}
}

function fmtDateTime(v){
  if(!v) return '—';
  const d=new Date(v);
  if(isNaN(d.getTime())) return String(v).slice(0,16).replace('T',' ');
  return d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}

function normalizeLeaveStatus(status){
  if(status==='approved') return '審核通過';
  if(status==='rejected') return '不通過';
  return status||'待審核';
}

function leaveHoursFromDays(days){return Math.round((Number(days)||0)*8*100)/100;}
function leaveDaysFromHours(hours){return Math.round(((Number(hours)||0)/8)*1000)/1000;}
function leaveDurationLabel(l){
  const days=Number(l?.days)||0;
  const hours=Number(l?.hours??leaveHoursFromDays(days))||0;
  if(hours&&hours<8) return `${hours} 小時`;
  if(hours&&Math.abs(hours-leaveHoursFromDays(days))>.01) return `${days} 天 / ${hours} 小時`;
  return `${days} 天${hours?`（${hours} 小時）`:''}`;
}

function syncLeaveHoursFromDays(prefix='lv'){
  const d=parseFloat(document.getElementById(prefix+'_days')?.value)||0;
  const h=document.getElementById(prefix+'_hours');
  if(h) h.value=leaveHoursFromDays(d);
}

function syncLeaveDaysFromHours(prefix='lv'){
  const h=parseFloat(document.getElementById(prefix+'_hours')?.value)||0;
  const d=document.getElementById(prefix+'_days');
  if(d) d.value=leaveDaysFromHours(h);
}

function isShopeeMat(m){
  const t=m?.type||'';
  const code=m?.code||m?.name||'';
  return t==='蝦皮用'||t==='蝦皮用(S-)'||/^S-/i.test(code);
}
function normSku(v){return String(v||'').trim().replace(/\s+/g,'').toUpperCase();}
function looseSku(v){return normSku(v).replace(/[^A-Z0-9]/g,'');}
function findMatBySku(sku){
  const key=normSku(sku);
  if(!key) return null;
  const byId=mats.find(m=>m.id===sku);
  if(byId) return byId;
  return mats.find(m=>
    normSku(m.code)===key||
    normSku(m.name)===key
  )||null;
}

async function importShopeeBomToNotion(){
  if(!isAdminRole()){showToast('權限不足，無法匯入 BOM','warn');return;}
  const totalRows=SHOPEE_BOM_EXCEL.reduce((sum,row)=>sum+(row.children||[]).length,0);
  showToast('⏳ 重新同步 Notion 資料中...','warn',6000);
  await refreshAll(true);
  const cleanupCandidates=findShopeeCompoundMistakeMats();
  const cleanupPreview=cleanupCandidates.length
    ? `\n\n另外偵測到 ${cleanupCandidates.length} 個舊版/錯誤料號會封存清理，例如：\n${cleanupCandidates.slice(0,12).map(m=>'・'+(m.code||m.name)+'（'+shopeeCleanupReason(m)+'）').join('\n')}${cleanupCandidates.length>12?'\n・...':''}\n\n例：Y-SKC04-3+LE-18*2 會依 Excel 拆成 Y-SKC04-3 x1、LE-18 x2，不應作為單一庫存料號；只差 -、空白、符號的舊料號也會以 Excel 標準料號為準。`
    : '';
  if(!confirm(`準備依照最新蝦皮編號 Excel 更新 Notion。\n\n會處理：\n1. 缺少的 S-母件自動建成「蝦皮用」庫存，預設庫存20 / 安全10\n2. 缺少的子件自動建成「零件」，庫存0\n3. 缺少的 BOM 關係會新增\n4. 已有 BOM 但數量不同會修正\n5. 清理 Excel 複合表示式或格式差異造成的舊版錯誤料號${cleanupPreview}\n\n母件：${SHOPEE_BOM_EXCEL.length} 個\nBOM關係：${totalRows} 筆\n\n要開始嗎？`)) return;
  let created=0, updated=0, skipped=0, parentCreated=0, childCreated=0, failed=[];
  let cleanupResult={archivedMats:0,archivedBoms:0,failed:[]};
  const existing=new Map(boms.map(b=>[b.parentId+'|'+b.childId,b]));
  for(const row of SHOPEE_BOM_EXCEL){
    let parent=findMatBySku(row.parent);
    try{
      if(!parent){
        parent=await createMaterialFromSku(row.parent,'蝦皮用',20,10,shopeeBomNoteForSku(row.parent));
        parentCreated++;
      }else{
        const parentNote=shopeeBomNoteForSku(row.parent);
        const props={};
        if(parent.type!=='蝦皮用') props['類型']={select:{name:'蝦皮用'}};
        if(parentNote && (!parent.note||!parent.note.includes('Shopee'))) props['備註']={rich_text:[{text:{content:parentNote}}]};
        if(Object.keys(props).length){
          await updatePage(parent.id,props);
          parent.type='蝦皮用';
          if(parentNote) parent.note=parentNote;
        }
      }
    }catch(e){
      failed.push(`${row.parent} 母件處理失敗：${e.message}`);
      continue;
    }
    for(const ch of (row.children||[])){
      let child=findMatBySku(ch.code);
      try{
        if(!child){
          child=await createMaterialFromSku(ch.code,'零件',0,0,`Shopee BOM 子件，來源母件 ${row.parent}`);
          childCreated++;
        }
      }catch(e){
        failed.push(`${row.parent} → ${ch.code} 子件建檔失敗：${e.message}`);
        continue;
      }
      const key=parent.id+'|'+child.id;
      const current=existing.get(key);
      const nextQty=Number(ch.qty)||1;
      if(current){
        if(Number(current.qty)!==nextQty&&current.id){
          try{
            await updatePage(current.id,{'每台用量':{number:nextQty},'備註':{rich_text:[{text:{content:'Shopee Excel BOM qty sync'}}]}});
            current.qty=nextQty;
            updated++;
          }catch(e){
            failed.push(`${row.parent} → ${ch.code} 數量修正失敗：${e.message}`);
          }
        }else{
          skipped++;
        }
        continue;
      }
      const title=`${row.parent} → ${ch.code}`;
      try{
        const r=await createPage(DB.bom,{
          'BOM項目':{title:[{text:{content:title}}]},
          '母件':{relation:[{id:parent.id}]},
          '子件':{relation:[{id:child.id}]},
          '每台用量':{number:nextQty},
          '備註':{rich_text:[{text:{content:'Shopee Excel import'}}]},
        });
        if(r?.object==='error') throw new Error(r.message||'Notion 建立失敗');
        const bomRow={id:r.id,parentId:parent.id,childId:child.id,qty:nextQty};
        existing.set(key,bomRow);
        boms.push(bomRow);
        created++;
        if(created%20===0) showToast(`⏳ 蝦皮 BOM 匯入中：已新增 ${created} 筆`,'warn',5000);
      }catch(e){
        failed.push(title+': '+e.message);
      }
    }
  }
  if(cleanupCandidates.length){
    showToast(`⏳ 清理舊版/錯誤料號 ${cleanupCandidates.length} 個...`,'warn',6000);
    cleanupResult=await cleanupShopeeCompoundMistakeMats(cleanupCandidates);
    failed=failed.concat(cleanupResult.failed||[]);
  }
  await refreshAll(true);
  const msg=`✅ 蝦皮設定更新完成：新增BOM ${created} 筆，修正數量 ${updated} 筆，略過 ${skipped} 筆，新增母件 ${parentCreated} 個，新增子件 ${childCreated} 個`
    +`，清理錯誤料號 ${cleanupResult.archivedMats||0} 個 / 關聯BOM ${cleanupResult.archivedBoms||0} 筆`
    +(failed.length?`，失敗 ${failed.length} 筆`:'');
  showToast(msg,failed.length?'warn':'ok',12000);
  if(failed.length){
    alert(msg+'\n\n失敗：\n'+failed.slice(0,80).join('\n'));
  }
}
function shopeeBomRowsForSku(sku){
  const key=normSku(sku);
  return SHOPEE_BOM_MAP[key]||SHOPEE_BOM_FALLBACK[key]||[];
}
function shopeeBomNoteForSku(sku){
  const rows=shopeeBomRowsForSku(sku);
  if(!rows.length) return 'Shopee Excel import';
  const main=rows[0]?.code||'';
  const acc=rows.slice(1).map(x=>x.code+(Number(x.qty)>1?'x'+x.qty:'')).join(', ');
  return ['來源:Shopee Excel BOM',main?'主料:'+main:'',acc?'配件:'+acc:''].filter(Boolean).join(' | ');
}
function shopeeValidSkuSet(){
  const set=new Set();
  SHOPEE_BOM_EXCEL.forEach(row=>{
    if(row.parent) set.add(normSku(row.parent));
    (row.children||[]).forEach(ch=>{if(ch.code)set.add(normSku(ch.code));});
  });
  return set;
}
function shopeeCanonicalSkuMap(){
  const exact=new Set();
  SHOPEE_BOM_EXCEL.forEach(row=>{
    if(row.parent) exact.add(String(row.parent).trim());
    (row.children||[]).forEach(ch=>{if(ch.code)exact.add(String(ch.code).trim());});
  });
  const looseMap=new Map();
  const conflicts=new Set();
  exact.forEach(code=>{
    const key=looseSku(code);
    if(!key) return;
    if(looseMap.has(key)&&looseMap.get(key)!==code) conflicts.add(key);
    else looseMap.set(key,code);
  });
  conflicts.forEach(key=>looseMap.delete(key));
  return looseMap;
}
function shopeeCleanupReason(m){
  const code=(m.code||'').trim();
  const name=(m.name||'').trim();
  const raw=code||name;
  if(!raw) return '';
  const valid=shopeeValidSkuSet();
  const key=normSku(raw);
  if(/[+*]/.test(raw)&&!valid.has(key)){
    return '複合表示式誤建：應依 Excel 拆成個別子件與用量，不應作為單一庫存料號';
  }
  const canonical=shopeeCanonicalSkuMap().get(looseSku(raw));
  if(canonical&&normSku(canonical)!==key){
    return `舊版/格式差異料號：依 Excel 標準料號 ${canonical} 保留，封存此筆`;
  }
  return '';
}
function findShopeeCompoundMistakeMats(){
  return mats.filter(m=>{
    return !!shopeeCleanupReason(m);
  });
}
async function cleanupShopeeCompoundMistakeMats(candidates){
  const list=(candidates||[]).filter(Boolean);
  if(!list.length) return {archivedMats:0,archivedBoms:0,failed:[]};
  const ids=new Set(list.map(m=>m.id));
  const affectedBoms=boms.filter(b=>ids.has(b.parentId)||ids.has(b.childId));
  let archivedMats=0, archivedBoms=0, failed=[];
  for(const b of affectedBoms){
    try{
      await archivePage(b.id);
      archivedBoms++;
    }catch(e){
      failed.push(`BOM ${b.name||b.id} 封存失敗：${e.message}`);
    }
  }
  for(const m of list){
    try{
      await archivePage(m.id);
      archivedMats++;
      await _writeStockEditLog({
        matId:m.id,
        matName:m.name||'',
        matCode:m.code||'',
        changeType:'刪除料件',
        before:`${m.name||''} / ${m.code||''} / ${m.type||''} / 庫存 ${m.stock}`,
        after:'Shopee Excel 標準化清理，Notion 已封存',
        delta:0,
        reason:'依最新蝦皮編號 Excel 清理舊版/錯誤料號；'+shopeeCleanupReason(m),
        operator:ROLE,
      });
      logUserAction('清理蝦皮錯誤料號',m.code||m.name,'依最新蝦皮編號 Excel 封存舊版/錯誤料號；'+shopeeCleanupReason(m),ROLE);
    }catch(e){
      failed.push(`${m.code||m.name} 封存失敗：${e.message}`);
    }
  }
  mats=mats.filter(m=>!ids.has(m.id));
  boms=boms.filter(b=>!affectedBoms.some(x=>x.id===b.id));
  return {archivedMats,archivedBoms,failed};
}
async function createMaterialFromSku(sku,type='零件',stock=0,safe=0,note=''){
  const code=(sku||'').trim();
  if(!code) throw new Error('料號空白');
  const props={
    '料件名稱':{title:[{text:{content:code}}]},
    '料件編號':{rich_text:[{text:{content:code}}]},
    '類型':{select:{name:type}},
    '單位':{select:{name:'個'}},
    '目前庫存':{number:Number(stock)||0},
    '安全庫存':{number:Number(safe)||0},
    '備註':{rich_text:[{text:{content:note||''}}]},
  };
  const r=await createPage(DB.materials,props);
  if(r?.object==='error') throw new Error(r.message||'料件建檔失敗');
  const mat={id:r.id,name:code,code,type,unit:'個',qty:Number(stock)||0,stock:Number(stock)||0,safe:Number(safe)||0,note:note||''};
  mats.push(mat);
  return mat;
}
async function ensureShopeeParentMaterial(sku){
  const code=(sku||'').trim().toUpperCase();
  if(!code) throw new Error('請輸入 S-料號');
  if(!code.startsWith('S-')) throw new Error('蝦皮料號需 S- 開頭');
  let mat=findMatBySku(code);
  if(mat) return mat;
  showToast('⏳ 建立蝦皮料號 '+code+'...','warn',5000);
  mat=await createMaterialFromSku(code,'蝦皮用',20,10,shopeeBomNoteForSku(code));
  return mat;
}
async function ensureShopeeBomRows(parentMat){
  const sku=parentMat.code||parentMat.name;
  const rows=shopeeBomRowsForSku(sku);
  if(!rows.length) return {created:0,missing:0,total:0};
  const existing=new Set(boms.map(b=>b.parentId+'|'+b.childId));
  let created=0, childCreated=0;
  for(const row of rows){
    let child=findMatBySku(row.code);
    if(!child){
      child=await createMaterialFromSku(row.code,'零件',0,0,'Shopee Excel BOM 自動建檔');
      childCreated++;
    }
    const key=parentMat.id+'|'+child.id;
    if(existing.has(key)) continue;
    const title=`${sku} → ${row.code}`;
    const r=await createPage(DB.bom,{
      'BOM項目':{title:[{text:{content:title}}]},
      '母件':{relation:[{id:parentMat.id}]},
      '子件':{relation:[{id:child.id}]},
      '每台用量':{number:Number(row.qty)||1},
      '備註':{rich_text:[{text:{content:'Shopee Excel BOM 自動建立'}}]},
    });
    if(r?.object==='error') throw new Error(title+'：'+(r.message||'BOM 建立失敗'));
    boms.push({parentId:parentMat.id,childId:child.id,qty:Number(row.qty)||1});
    existing.add(key);
    created++;
  }
  return {created,childCreated,total:rows.length};
}
async function auditShopeeBomInventory(){
  await refreshAll(true);
  const matCodes=new Set();
  mats.forEach(m=>{
    if(m.code) matCodes.add(m.code.trim().toLowerCase());
    if(m.name) matCodes.add(m.name.trim().toLowerCase());
  });
  const missingParents=[], missingChildren=[];
  SHOPEE_BOM_EXCEL.forEach(row=>{
    if(!matCodes.has(row.parent.toLowerCase())) missingParents.push(row.parent);
    (row.children||[]).forEach(ch=>{
      if(!matCodes.has(ch.code.toLowerCase())) missingChildren.push(row.parent+' → '+ch.code);
    });
  });
  const compoundMistakes=findShopeeCompoundMistakeMats();
  document.getElementById('modalInner').innerHTML=`<h3>🔍 蝦皮 BOM 庫存建檔審查</h3>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">

function makeCorderNo(){

const CORDER_PREFIX='SHPTW';
const CORDER_START_NO=16279;
const CORDER_START_KEY='lematec_corder_shptw_start';
const CORDER_LAST_KEY='lematec_corder_shptw_last_used';
function corderSerial(no){
  const m=String(no||'').trim().match(/^SHPTW(\d+)$/i);
  return m?parseInt(m[1],10):0;
}
function formatCorderNo(n){
  return CORDER_PREFIX+String(Math.max(CORDER_START_NO,parseInt(n)||CORDER_START_NO));
}
function normalizeCorderSerialInput(v){
  return String(v||'')
    .trim()
    .replace(new RegExp('^'+CORDER_PREFIX,'i'),'')
    .replace(/\D/g,'')
    .slice(0,6);
}
function getCorderStartSerial(){
  const raw=normalizeCorderSerialInput(localStorage.getItem(CORDER_START_KEY)||localStorage.getItem(CORDER_LAST_KEY)||'');
  const n=parseInt(raw,10);
  return n?Math.max(CORDER_START_NO,n):CORDER_START_NO;
}
function saveCorderStartSerial(){
  const inp=document.getElementById('corderStartSerial');
  const raw=normalizeCorderSerialInput(inp?.value||'');
  if(inp) inp.value=raw;
  const n=parseInt(raw,10);
  if(!n){showToast('請輸入起始數字','warn');return;}
  localStorage.setItem(CORDER_START_KEY,String(n));
  localStorage.setItem(CORDER_LAST_KEY,String(n));
  showToast(`✅ C端起始單號已儲存：${formatCorderNo(n)}`,'ok');
  renderTab('corders');
}
function previewCorderStartSerial(v){
  const inp=document.getElementById('corderStartSerial');
  const out=document.getElementById('corderStartPreview');
  const raw=normalizeCorderSerialInput(v);
  if(inp&&inp.value!==raw) inp.value=raw;
  if(out) out.textContent=raw?formatCorderNo(raw):formatCorderNo(getCorderStartSerial());
}
function nextCorderInternalNo(usedNos=[]){
  const all=[...(usedNos||[])];
  const max=all.reduce((m,no)=>Math.max(m,corderSerial(no)),0);
  const seed=getCorderStartSerial();
  return formatCorderNo(Math.max(seed,max?max+1:seed));
}
function persistCorderNextNo(usedNos=[]){
  const max=(usedNos||[]).reduce((m,no)=>Math.max(m,corderSerial(no)),0);
  if(max){
    const next=max+1;
    localStorage.setItem(CORDER_START_KEY,String(next));
    localStorage.setItem(CORDER_LAST_KEY,String(next));
  }
}
function parseMoneyNumber(v){
  const s=String(v??'').replace(/[^\d.-]/g,'');
  const n=parseFloat(s);
  return Number.isFinite(n)?n:0;
}
function corderSameOrderKey(shopeeNo,buyer){
  const s=String(shopeeNo||'').trim();
  const b=String(buyer||'').trim();
  if(!s||!b) return '';
  return `${s}|||${b}`;
}
function corderExistingNoByShopeeAndBuyer(shopeeNo,buyer){
  const s=String(shopeeNo||'').trim();
  const b=String(buyer||'').trim();
  if(!s||!b) return '';
  const hit=(window.corders||[]).find(o=>
    String(o.shopeeNo||'').trim()===s &&
    String(o.buyer||'').trim()===b
  );
  return hit?.no||'';
}
function parseCorderStockRefs(raw, fallbackQty){
  const text=String(raw||'').trim();
  if(!text) return [];
  if(text.includes(':')){
    return text.split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>{
      const [id,qty]=x.split(':');
      return {id:id.trim(),qty:parseInt(qty)||fallbackQty||1};
    });
  }
  return text.split(',').map(x=>x.trim()).filter(Boolean).map(id=>({id,qty:fallbackQty||1}));
}
function corderStockRef(id, qty){return id?`${id}:${parseInt(qty)||1}`:'';}
function corderStockRefs(items){
  return (items||[]).map(x=>corderStockRef(x.id,x.qty??x.needed)).filter(Boolean).join(';');
}
function filterCorderMatOptions(q){
  const sel=document.getElementById('co_mat');
  if(!sel) return;
  const v=(q||'').toLowerCase();
  Array.from(sel.options).forEach(opt=>{
    if(!opt.value){opt.style.display='';return;}
    const text=(opt.textContent||'').toLowerCase();
    opt.style.display=(!v||text.includes(v))?'':'none';
  });
}
function previewCorderMatStock(){

  const stock=parseInt(opt.dataset.stock)||0;
  const qty=parseInt(document.getElementById('co_qty')?.value)||1;
  const after=stock-qty;
  hint.innerHTML=`庫存 ${stock}，本次扣 ${qty}，建立後剩 <b style="color:${after<0?'var(--red)':'var(--green)'}">${after}</b>`;
}
async function deductCorderStock(mat, qty, refNo, operator){
  const latest=await notionAPI('GET','pages/'+mat.id);
  const cur=latest?.properties?.['目前庫存']?.number??mat.stock??0;
  const next=cur-(parseInt(qty)||1);
  await updatePage(mat.id,{'目前庫存':{number:next}});
  await logStockChange(mat.id,mat.name||'',mat.code||'','C端出貨',-(parseInt(qty)||1),cur,next,refNo,operator||ROLE);
  mat.stock=next;
  return {before:cur,after:next};
}
async function deductCorderStockByBom(mat, qty, refNo, operator){
  const sku=normalizeSku(mat?.code||mat?.name||'');
  const isShopeeSku=sku.startsWith('S-')||String(mat?.type||'').includes('蝦皮');
  if(!isShopeeSku){
    await deductCorderStock(mat,qty,refNo,operator);
    return {mode:'direct',refs:[{id:mat.id,qty:parseInt(qty)||1}],items:[{...mat,needed:parseInt(qty)||1}]};
  }

  const items=getShopeeBomItems(mat,qty);
  if(!items.length) throw new Error(`此蝦皮料號 ${mat.code||mat.name} 尚未設定 BOM，為避免誤扣成品庫存，已停止建立`);
  const missing=items.filter(x=>x.missing||!x.id);
  if(missing.length) throw new Error('找不到 BOM 子料號：'+missing.map(x=>x.code||x.name).join('、'));

  await deductShopeeBom(mat,qty,refNo);
  return {
    mode:'bom',
    refs:items.map(x=>({id:x.id,qty:x.needed})),
    items
  };
}
async function returnCorderStock(refs, refNo){
  for(const r of refs){
    const mat=mats.find(m=>m.id===r.id);
    const latest=await notionAPI('GET','pages/'+r.id);
    const cur=latest?.properties?.['目前庫存']?.number??mat?.stock??0;
    const next=cur+(parseInt(r.qty)||1);
    await updatePage(r.id,{'目前庫存':{number:next}});
    await logStockChange(r.id,mat?.name||'',mat?.code||'','C端退料',parseInt(r.qty)||1,cur,next,refNo,ROLE);
    if(mat) mat.stock=next;
  }
}

      annualRemain:p.properties?.['特休剩餘天數']?.number??p.properties?.['年假剩餘']?.number??p.properties?.['特休餘額']?.number??0,
      annualTotal:p.properties?.['特休天數']?.number??p.properties?.['年假總額']?.number??p.properties?.['特休總天數']?.number??0,
      usedAnnual:p.properties?.['已請特休']?.number??p.properties?.['已休特休']?.number??p.properties?.['年假已用']?.number??0,
      usedPersonal:p.properties?.['已請事假']?.number??0,
      usedSick:p.properties?.['已請病假']?.number??0,
      usedOther:p.properties?.['其他假別天數']?.number??0,
      sick:p.properties?.['病假剩餘']?.number??0,

    })).filter(e=>e.name);
  }catch(e){ window._leaveStats=[]; leaveEmployees=[]; }
}

function isApprovedLeaveStatus(status){
  const s=normalizeLeaveStatus(status);
  return s==='審核通過'||s==='核准';
}

function leaveStatTypeField(type){
  if(type==='年假'||type==='特休') return '已請特休';
  if(type==='事假') return '已請事假';
  if(type==='病假') return '已請病假';
  return '其他假別天數';
}

function leaveStatDays(l){
  const days=Number(l?.days);
  if(days>0) return days;
  return leaveDaysFromHours(Number(l?.hours)||0);
}

async function updateLeaveStatsUsage(l, delta){
  if(!l||!l.name||!delta) return;
  try{
    await ensureLeaveEmployeeRecord(l.name,l.title||'',l.proxy||'');
    const year=String((l.dateFrom||'').slice(0,4)||new Date().getFullYear());
    let stats = (window._leaveStats||[]).find(s=>s.name===l.name&&String(s.year)===year)
      || (window._leaveStats||[]).find(s=>s.name===l.name);
    if(!stats) return;
    const days=leaveStatDays(l);
    const field=leaveStatTypeField(l.type);
    const props = {};
    const currentTypeValue = field==='已請特休' ? (stats.usedAnnual||0)
      : field==='已請事假' ? (stats.usedPersonal||0)
      : field==='已請病假' ? (stats.usedSick||0)
      : (stats.usedOther||0);
    props[field]={number:Math.max(0,Math.round((currentTypeValue + days*delta)*1000)/1000)};
    props['請假總天數']={number:Math.max(0,Math.round(((stats.totalDays||0)+days*delta)*1000)/1000)};
    props['請假總次數']={number:Math.max(0,(stats.totalTimes||0)+delta)};
    if(field==='已請特休'){
      props['特休剩餘天數']={number:Math.max(0,Math.round(((stats.annualRemain??stats.annual??0)-days*delta)*1000)/1000)};
    }
    if(l.title) props['職稱']={rich_text:[{text:{content:l.title||''}}]};
    if(l.proxy) props['代理人']={rich_text:[{text:{content:l.proxy||''}}]};
    await updatePage(stats.id, props);
    Object.assign(stats,{
      usedAnnual:field==='已請特休'?props[field].number:stats.usedAnnual,
      usedPersonal:field==='已請事假'?props[field].number:stats.usedPersonal,
      usedSick:field==='已請病假'?props[field].number:stats.usedSick,
      usedOther:field==='其他假別天數'?props[field].number:stats.usedOther,
      totalDays:props['請假總天數'].number,
      totalTimes:props['請假總次數'].number,
      annual:props['特休剩餘天數']?.number??stats.annual,
      annualRemain:props['特休剩餘天數']?.number??stats.annualRemain,
    });
  }catch(e){ console.warn('_updateLeaveStats 失敗:', e); }
}

async function syncLeaveStatsTransition(oldLeave, newLeave){
  const oldApproved=isApprovedLeaveStatus(oldLeave?.status);
  const newApproved=isApprovedLeaveStatus(newLeave?.status);
  if(oldApproved) await updateLeaveStatsUsage(oldLeave,-1);
  if(newApproved) await updateLeaveStatsUsage(newLeave,1);
}

function getLeaveEmployeeOptions(){

  }))).filter(e=>e.name);

function calcLeaveDays(from,to){
  if(!from) return 1;
  const a=new Date(from), b=new Date(to||from);
  if(isNaN(a.getTime())||isNaN(b.getTime())) return 1;
  const start=a<=b?a:b;
  const end=a<=b?b:a;
  start.setHours(0,0,0,0); end.setHours(0,0,0,0);
  return Math.max(0.5,Math.floor((end-start)/86400000)+1);
}

}

async function ensureLeaveEmployeeRecord(name,title='',proxy=''){
  const year=String(new Date().getFullYear());
  const exists=getLeaveEmployeeOptions().find(e=>String(e.name||'').trim()===name&&String(e.year||year)===year);
  if(exists) return exists;
  const fullProps={
    '員工姓名':{title:[{text:{content:name}}]},
    '職稱':{rich_text:[{text:{content:title||''}}]},
    '代理人':{rich_text:[{text:{content:proxy||''}}]},
    '年度':{select:{name:year}},
    '特休總天數':{number:0},
    '特休剩餘天數':{number:0},
    '已請特休':{number:0},
    '已請事假':{number:0},
    '已請病假':{number:0},
    '其他假別天數':{number:0},
    '請假總天數':{number:0},
    '請假總次數':{number:0},
  };
  const basicProps={
    '員工姓名':{title:[{text:{content:name}}]},
    '年度':{select:{name:year}},
    '特休總天數':{number:0},
    '特休剩餘天數':{number:0},
  };
  const minimalProps={'員工姓名':{title:[{text:{content:name}}]}};
  let created=null;
  for(const props of [fullProps,basicProps,minimalProps]){
    try{
      created=await notionAPI('POST','pages',{parent:{database_id:DB.leaveStats},properties:props});
      if(created?.object==='page') break;
    }catch(e){}
  }
  if(!created||created.object!=='page'){
    console.warn('員工資料自動建檔失敗:',created);
    return null;
  }
  const emp={id:created.id,name,title:title||'',proxy:proxy||'',year,annualTotal:0,annualBalance:0};
  leaveEmployees.push(emp);
  window._leaveStats=window._leaveStats||[];
  window._leaveStats.push({id:emp.id,name,title:title||'',proxy:proxy||'',year,annual:0,annualTotal:0,usedAnnual:0,sick:0,personal:0,used:0,totalTimes:0,totalDays:0});
  return emp;
}

function normalizeShippingText(text){
  return String(text||'')
    .replace(/\u3197/g,'中')
    .replace(/\r/g,'')
    .replace(/[：]/g,':')
    .replace(/[ \t]+/g,' ')
    .trim();
}

function normalizeShopeeOrderNo(v){
  return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
}

function cleanReceiverName(v){
  return String(v||'')
    .replace(/\s+/g,'')
    .replace(/請收款結帳|請核對證件|請收款|結帳/g,'')
    .replace(/^[南北中東西]$/,'')
    .trim();
}

function isLikelyReceiverName(v){
  const s=cleanReceiverName(v);
  if(!s) return false;
  if(/[A-Z0-9]{5,}|TW\d+|蝦皮|標準配送|門市交寄|寄件|編號|宅配|HCT|收貨|備註/.test(s)) return false;
  return /[\u4e00-\u9fff]/.test(s) && s.length>=2 && s.length<=24;
}

function isLikelyReceiverOrCompany(v){
  const s=cleanReceiverName(v);
  if(!s) return false;
  if(/[A-Z0-9]{5,}|TW\d+|蝦皮|標準配送|門市交寄|寄件|編號|宅配|HCT|收貨|備註|請收款|結帳/.test(s)) return false;
  if(/[縣市路街巷弄號樓]/.test(s)&&s.length>8) return false;
  return /[\u4e00-\u9fff]/.test(s) && s.length>=2 && s.length<=36;
}

function extractHctReceiverFromLines(lines){
  const stopWords=/備註|寄件人|蝦皮訂單|寄件編號|宅配|HCT/i;
  for(let i=0;i<lines.length;i++){
    if(!/收貨人|收件人/.test(lines[i])) continue;
    const same=lines[i].replace(/.*(?:收貨人|收件人)\s*/,'').trim();
    if(isLikelyReceiverOrCompany(same)) return cleanReceiverName(same);
    for(let j=i+1;j<Math.min(lines.length,i+6);j++){
      if(stopWords.test(lines[j])) break;
      const c=lines[j].replace(/\s*\d+件.*$/,'').trim();
      if(isLikelyReceiverOrCompany(c)) return cleanReceiverName(c);
    }
  }
  return '';
}

function extractShopeeReceiverFromLine(line){
  let s=String(line||'')
    .replace(/請收款結帳|請核對證件|請收款|結帳/g,'')
    .replace(/[→⇒]/g,' ')
    .replace(/中\/南|北|南|中/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  const m=s.match(/([\u4e00-\u9fff][\u4e00-\u9fff\s]{1,10}?)\s*(\d{3})(?:\D|$)/);
  if(!m) return '';
  let prefix=m[1]
    .replace(/^\d{3,4}.*?(?:智取店|門市|店)/,'')
    .replace(/.*(?:智取店|門市|店)\s*/,'')
    .replace(/\s+/g,'')
    .trim();
  const names=prefix.match(/[\u4e00-\u9fff]{2,4}/g)||[];
  for(let i=names.length-1;i>=0;i--){
    const n=cleanReceiverName(names[i]);
    if(isLikelyReceiverName(n)) return n;
  }
  return '';
}

function ocrLinesFromTesseract(data){
  return (data?.lines||[]).map(l=>({
    text:normalizeShippingText(l.text||''),
    x0:l.bbox?.x0??0,
    y0:l.bbox?.y0??0,
    x1:l.bbox?.x1??0,
    y1:l.bbox?.y1??0,
  })).filter(l=>l.text);
}

function parseShippingImageOcr(data,barcodeText,fileName=''){
  const lines=ocrLinesFromTesseract(data);
  const out=[];
  const barcodeRows=parseShippingLabelText(barcodeText||'',fileName);
  const byOrder=new Map();
  barcodeRows.forEach(r=>byOrder.set(r.shopeeNo,r));

  const orderLines=[];
  lines.forEach(l=>{
    const matches=[...l.text.matchAll(/\b(\d{6}[A-Z0-9]{6,})\b/gi)];
    matches.forEach(m=>orderLines.push({no:normalizeShopeeOrderNo(m[1]),line:l}));
  });

  for(const o of orderLines){
    const nextY=Math.min(...orderLines.filter(x=>x.line.y0>o.line.y0+20).map(x=>x.line.y0),o.line.y0+520);
    const region=lines.filter(l=>l.y0>o.line.y0+50&&l.y0<nextY);
    let customerName='';
    for(let i=region.length-1;i>=0;i--){
      customerName=extractShopeeReceiverFromLine(region[i].text);
      if(customerName) break;
    }
    if(customerName){
      const old=byOrder.get(o.no)||{};
      out.push({source:fileName,carrier:'蝦皮店到店',shopeeNo:o.no,trackingNo:old.trackingNo||'',customerName});
    }
  }

  const hctText=lines.map(l=>l.text).join('\n');
  const hctOrder=(hctText.match(/\b(\d{6}[A-Z0-9]{6,})\b/i)||[])[1];
  if(hctOrder&&/HCT|宅配|收貨人/.test(hctText)){
    const customerName=extractHctReceiverFromLines(lines.map(l=>l.text));
    const tracking=(hctText.match(/宅配\s*([0-9]{8,})/)||hctText.match(/\b(7\d{9})\b/)||[])[1]||'';
    if(customerName) out.push({source:fileName,carrier:'新竹物流',shopeeNo:normalizeShopeeOrderNo(hctOrder),trackingNo:tracking,customerName});
  }

  return dedupeShippingLabelRows(out);
}

async function ensureTesseract(){
  if(window.Tesseract) return window.Tesseract;
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=resolve;
    s.onerror=()=>reject(new Error('OCR 元件載入失敗'));
    document.head.appendChild(s);
  });
  return window.Tesseract;
}

async function parseShippingLabelFile(file){
  const name=file.name||'';
  const type=(file.type||'').toLowerCase();
  if(type.includes('pdf')||/\.pdf$/i.test(name)){
    const text=await extractPdfText(file);
    return {rows:parseShippingLabelText(text,name),warnings:[]};
  }
  if(type.startsWith('image/')||/\.(jpg|jpeg|png|webp)$/i.test(name)){
    const barcodeText=await extractImageBarcodes(file);
    let ocrText='',ocrWarn='';
    try{
      const Tesseract=await ensureTesseract();
      showToast('圖片 OCR 辨識中，請稍候...','warn');
      const result=await Tesseract.recognize(file,'chi_tra+eng');
      ocrText=result?.data?.text||'';
      const imageRows=parseShippingImageOcr(result?.data,barcodeText,name);
      if(imageRows.length) return {rows:imageRows,warnings:[]};
    }catch(e){
      console.warn('圖片 OCR 失敗:',e);
      ocrWarn=`${name}：圖片 OCR 失敗，請改用 PDF 或較清晰照片。`;
    }
    const text=[barcodeText,ocrText].filter(Boolean).join('\n');
    const rows=text?parseShippingLabelText(text,name):[];
    const warnings=ocrWarn?[ocrWarn]:[];
    if(!rows.length) warnings.push(`${name}：未解析到可比對的蝦皮訂單號與收件人，請確認照片清晰或改用 PDF。`);
    return {rows,warnings};
  }
  return {rows:[],warnings:[`${name}：不支援的檔案格式`]};
}

async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF 解析元件尚未載入，請重新整理後再試');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=(tc.items||[]).map(it=>({
      str:it.str||'',
      x:it.transform?.[4]||0,
      y:it.transform?.[5]||0,
    })).filter(it=>String(it.str).trim());
    items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
    const lines=[];
    for(const it of items){
      const last=lines[lines.length-1];
      if(last&&Math.abs(last.y-it.y)<=2) last.parts.push(it);
      else lines.push({y:it.y,parts:[it]});
    }
    pages.push(lines.map(l=>l.parts.sort((a,b)=>a.x-b.x).map(x=>x.str).join(' ')).join('\n'));
  }
  return pages.join('\n---PAGE---\n');
}

async function extractImageBarcodes(file){
  if(!('BarcodeDetector' in window)) return '';
  try{
    const detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','data_matrix']});
    const bitmap=await createImageBitmap(file);
    const codes=await detector.detect(bitmap);
    return (codes||[]).map(c=>c.rawValue||'').filter(Boolean).join('\n');
  }catch(e){
    console.warn('BarcodeDetector 解析失敗:',e);
    return '';
  }
}

function parseShippingLabelText(rawText,fileName=''){
  const text=normalizeShippingText(rawText);
  const rows=[
    ...parseShopeeStoreLabels(text,fileName),
    ...parseHctLabels(text,fileName),
  ];
  return rows.filter(r=>r.shopeeNo&&r.customerName);
}

function parseShopeeStoreLabels(text,fileName=''){
  const out=[];
  const pages=text.split('---PAGE---');
  for(const page of pages){
    const lines=page.split('\n').map(x=>x.trim()).filter(Boolean);
    for(let i=0;i<lines.length;i++){
      if(!/蝦皮訂單編號/.test(lines[i])) continue;
      const orders=[...lines[i].matchAll(/蝦皮訂單編號:\s*([A-Z0-9]+)/g)].map(m=>normalizeShopeeOrderNo(m[1]));
      if(!orders.length) continue;
      const trackingLine=lines[i+1]||'';
      const tracks=[...trackingLine.matchAll(/寄件編號:\s*(TW[A-Z0-9]+)/g)].map(m=>m[1].trim());
      let nameLine='';
      for(let j=i+2;j<Math.min(lines.length,i+7);j++){
        const line=lines[j];
        if(/-.*店/.test(line)) {nameLine=lines[j+1]||'';break;}
      }
      if(!nameLine) nameLine=lines[i+3]||'';
      let names=nameLine.split(/\s+/).map(cleanReceiverName).filter(isLikelyReceiverName);
      if(names.length<orders.length){
        const next=(lines[i+4]||'').split(/\s+/).map(cleanReceiverName).filter(isLikelyReceiverName);
        names=[...names,...next];
      }
      orders.forEach((orderNo,idx)=>{
        const customerName=names[idx]||'';
        if(customerName) out.push({source:fileName,carrier:'蝦皮店到店',shopeeNo:orderNo,trackingNo:tracks[idx]||'',customerName});
      });
    }
  }
  return out;
}

function parseHctLabels(text,fileName=''){
  const out=[];
  const pages=text.split('---PAGE---');
  for(const page of pages){
    const lines=page.split('\n').map(x=>x.trim()).filter(Boolean);
    const order=(page.match(/\b(\d{6}[A-Z0-9]{6,})\b/i)||[])[1];
    if(!order) continue;
    let customerName=extractHctReceiverFromLines(lines);
    for(let i=0;i<lines.length;i++){
      if(!customerName&&/^宅配\b/.test(lines[i])&&lines[i+1]){
        customerName=lines[i+1].replace(/\s*\d+件.*$/,'').trim();
        break;
      }
    }
    if(!customerName){
      const oi=lines.findIndex(l=>l.includes(order));
      for(let i=oi-1;i>=0&&i>oi-8;i--){
        const c=lines[i].replace(/\s*\d+件.*$/,'').trim();
        if(isLikelyReceiverName(c)){customerName=c;break;}
      }
    }
    const tracking=(page.match(/宅配\s+([0-9]{8,})/)||[])[1]||'';
    customerName=cleanReceiverName(customerName);
    if(customerName) out.push({source:fileName,carrier:'新竹物流',shopeeNo:normalizeShopeeOrderNo(order),trackingNo:tracking,customerName});
  }
  return out;
}

function dedupeShippingLabelRows(rows){
  const map=new Map();
  (rows||[]).forEach(r=>{
    const key=normalizeShopeeOrderNo(r.shopeeNo);
    if(!key) return;
    const old=map.get(key);
    if(!old||(!old.customerName&&r.customerName)||(!old.trackingNo&&r.trackingNo)){
      map.set(key,{...old,...r,shopeeNo:key});
    }
  });
  return [...map.values()];
}

async function getDatabaseSchema(dbId){
  if(_dbSchemaCache[dbId]) return _dbSchemaCache[dbId];
  const db=await notionAPI('GET',`databases/${dbId}`);
  if(db?.object==='error') throw new Error('讀取資料庫欄位失敗：'+db.message);
  _dbSchemaCache[dbId]=db.properties||{};
  return _dbSchemaCache[dbId];
}

function textPropForSchema(prop,value){
  const type=prop?.type;
  if(type==='title') return {title:[{text:{content:String(value||'')}}]};
  if(type==='rich_text') return {rich_text:[{text:{content:String(value||'')}}]};
  if(type==='select') return value?{select:{name:String(value)}}:{select:null};
  if(type==='multi_select') return value?{multi_select:[{name:String(value)}]}:{multi_select:[]};
  return null;
}

function addSchemaTextProp(props,schema,candidates,value){
  const name=candidates.find(k=>schema?.[k]);
  if(!name||value===undefined||value===null||String(value).trim()==='') return false;
  const prop=textPropForSchema(schema[name],String(value).trim());
  if(!prop) return false;
  props[name]=prop;
  return true;
}

async function buildShippingUpdateProps(dbId,row){
  const schema=await getDatabaseSchema(dbId);
  const props={};
  addSchemaTextProp(props,schema,['客戶名稱','客戶姓名','收件人'],row.customerName);
  addSchemaTextProp(props,schema,['寄件編號','包裹查詢號碼'],row.trackingNo);
  return props;
}

async function applyCorderShippingNames(){
  const rows=(window._shippingLabelMatches||[]).filter(r=>r.customerName&&(r.cMatches.length||r.sMatches.length));

  closeModal();
  showToast('寫入客戶名稱中...','warn');
  let cOk=0,sOk=0,fail=0;
  try{
    for(const row of rows){
      for(const o of row.cMatches){
        try{
          const props=await buildShippingUpdateProps(DB.corders,row);
          if(Object.keys(props).length){
            await updatePage(o.id,props);
            Object.assign(o,{customerName:row.customerName,trackingNo:row.trackingNo||o.trackingNo});
            cOk++;
          }
        }catch(e){fail++;console.warn('C端回填失敗:',row,o,e);}

      for(const s of row.sMatches){

          const props=await buildShippingUpdateProps(DB.shopee115,row);

            await updatePage(s.id,props);

            s.trackingNo=row.trackingNo||s.trackingNo;

          }

// ══ 品管檢驗單 ══
async function loadQCInspections(){
  try{
    const r = await dbQueryAll(DB.qcInspection);
    window._qcInspections = r.map(p=>({
      id:       p.id,
      no:       p.properties?.['檢驗單號']?.title?.[0]?.plain_text||'',
      orderRefRaw: p.properties?.['關聯訂單號']?.rich_text?.[0]?.plain_text||'',
      get orderRef(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[1]:r; },
      get orderId(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[0]:''; },
      matName:  p.properties?.['品項名稱']?.rich_text?.[0]?.plain_text||
                p.properties?.['料件名稱']?.rich_text?.[0]?.plain_text||'',
      matCode:  p.properties?.['料件編號']?.rich_text?.[0]?.plain_text||'',
      type:     p.properties?.['檢驗類型']?.select?.name||'',
      qtyReq:   p.properties?.['應檢數量']?.number??0,
      qtyAct:   p.properties?.['實檢數量']?.number??0,
      qtyBad:   p.properties?.['不良數量']?.number??0,
      result:   p.properties?.['檢驗結果']?.select?.name||'待檢驗',
      date:     p.properties?.['檢驗日期']?.date?.start||'',
      inspector:p.properties?.['檢驗人員']?.rich_text?.[0]?.plain_text||'',
      badReason:p.properties?.['不良原因']?.select?.name||'',
      handling: p.properties?.['處理方式']?.select?.name||'',
      toStock:  p.properties?.['料號入庫']?.checkbox||false,
      note:     p.properties?.['備註']?.rich_text?.[0]?.plain_text||'',
    })).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ console.warn('loadQCInspections error:',e); window._qcInspections=[]; }
}


// ── 檢驗結果：通過 / 不通過 ──
async function doInspResult(insId, orderRef, resultCode){
  // resultCode 可能是 'p'/'f'（來自 data-res）或已是中文
  const result = resultCode==='p' ? '通過' : resultCode==='f' ? '不通過' : resultCode;
  // orderRef 格式：「orderId|orderNo」或純訂單號
  // 解析
  let orderId = '', orderNo = '';
  if(orderRef && orderRef.includes('|')){
    [orderId, orderNo] = orderRef.split('|');
  } else {
    orderNo = orderRef||'';
    // 嘗試從本地 orders 找
    const found = orders.find(o=>o.no===(orderNo||'').trim());
    if(found) orderId = found.id;
  }

  // 確認不通過原因
  let badDesc = '';
  if(result === '不通過'){
    badDesc = prompt('請填入不通過原因（必填）：')||'';
    if(!badDesc){ showToast('請填入不通過原因','warn'); return; }
  }

  showToast('更新中...','warn');

  try{
    // 1. 更新檢驗單結果
    const props = { '檢驗結果':{select:{name:result}} };
    if(badDesc) props['不良描述']={rich_text:[{text:{content:badDesc}}]};
    await updatePage(insId, props);

    // 2. 若有關聯訂單 → 更新訂單狀態
    let targetOrder = null;
    if(orderId){
      targetOrder = orders.find(x=>x.id===orderId);
    } else if(orderNo){
      targetOrder = orders.find(x=>(x.no||'').trim()===(orderNo||'').trim());
    }

    if(targetOrder){
      const isSfgOrder = targetOrder.orderType==='半成品' || (targetOrder.no||'').startsWith('SFG-');
      if(result==='通過'){
        if(isSfgOrder){
          // 半成品通過 → 自動入庫 + 訂單改「已完成」
          const mat = mats.find(m=>m.id===targetOrder.productId);
          if(mat){
            const latest = await notionAPI('GET','pages/'+mat.id);
            const curStock = latest.properties?.['目前庫存']?.number??mat.stock??0;
            const inQty = targetOrder.qty||0;
            const newStock = curStock + inQty;
            await updatePage(mat.id, {'目前庫存':{number:newStock}});
            await logStockChange(mat.id, mat.name, mat.code||'', '半成品入庫', inQty, curStock, newStock, orderNo||orderId, ROLE);
          }
          await updatePage(targetOrder.id, {'狀態':{select:{name:'已完成'}}});
          targetOrder.status = '已完成';
        } else {
          // 一般訂單通過 → 待出貨（不動庫存）
          await updatePage(targetOrder.id, {'狀態':{select:{name:'待出貨'}}});
          targetOrder.status = '待出貨';
        }
      } else {
        // 不通過 → 維持待檢驗
        await updatePage(targetOrder.id, {'狀態':{select:{name:'待檢驗'}}});
        targetOrder.status = '待檢驗';
      }
    }

    // 3. 重新載入並刷新
    await loadQCInspections();
    await refreshAll();

    showToast(result==='通過'
      ? '✅ 檢驗通過'+(orderId||orderNo?' — 訂單已更新為「待出貨」':'')
      : '❌ 檢驗不通過，訂單維持待檢驗狀態'
    , result==='通過'?'ok':'warn');

  }catch(e){ showToast('❌ '+e.message,'err'); }
}

async function updateInspectionStatus(id, status){
  try{
    await updatePage(id,{'檢驗狀態':{select:{name:status}}});
    await loadQCInspections(); renderTab('qc');
    showToast('✅ 已更新為「'+status+'」','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

function renderQCReport(allInspections=[],pendingInbound=[],pendingOrders=[],doneInbound=[]){
  const month=new Date().toISOString().slice(0,7);
  const monthIns=allInspections.filter(x=>(x.date||'').startsWith(month));
  const pass=allInspections.filter(x=>x.result==='通過'||x.result==='條件通過').length;
  const fail=allInspections.filter(x=>x.result==='不通過').length;
  const badQty=allInspections.reduce((s,x)=>s+(Number(x.qtyBad)||0),0);
  const reasonMap={};
  allInspections.forEach(x=>{const k=x.badReason||x.handling||'';if(k)reasonMap[k]=(reasonMap[k]||0)+1;});
  const reasons=Object.entries(reasonMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const rate=allInspections.length?Math.round(pass/allInspections.length*100):100;
  return `<div class="dash-kpi-grid">
    <div class="kpi-card kpi-green"><div class="kpi-label">通過率</div><div class="kpi-num">${rate}<span style="font-size:1.2rem">%</span></div><div class="kpi-sub">${pass} 通過 / ${allInspections.length} 總檢驗</div></div>
    <div class="kpi-card ${fail?'kpi-red':'kpi-green'}"><div class="kpi-label">不通過</div><div class="kpi-num">${fail}</div><div class="kpi-sub">不良數量 ${badQty}</div></div>
    <div class="kpi-card ${pendingInbound.length+pendingOrders.length?'kpi-amber':'kpi-green'}"><div class="kpi-label">待檢項目</div><div class="kpi-num">${pendingInbound.length+pendingOrders.length}</div><div class="kpi-sub">入料 ${pendingInbound.length} / 訂單 ${pendingOrders.length}</div></div>
    <div class="kpi-card kpi-cyan"><div class="kpi-label">本月檢驗</div><div class="kpi-num">${monthIns.length}</div><div class="kpi-sub">${month}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
    <div class="panel"><div class="panel-hdr"><span class="panel-title">不良原因排行</span></div>
      <div style="padding:12px">${reasons.length?reasons.map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)"><b>${k}</b><span class="badge">${v}</span></div>`).join(''):'<div style="padding:22px;text-align:center;color:var(--green2)">目前沒有不良原因資料</div>'}</div>
    </div>
    <div class="panel"><div class="panel-hdr"><span class="panel-title">最近檢驗紀錄</span></div>
      <div style="padding:12px">${allInspections.slice(0,10).map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)"><div><b>${x.no||'—'}</b><div style="font-size:.76rem;color:var(--text3)">${x.matName||x.matCode||'—'} · ${x.date||'—'}</div></div>${pill(x.result)}</div>`).join('')||'<div style="padding:22px;text-align:center;color:var(--text3)">尚無檢驗單</div>'}</div>
    </div>
    <div class="panel"><div class="panel-hdr"><span class="panel-title">Notion 整理建議</span></div>
      <div style="padding:14px;line-height:1.8;color:var(--text2);font-size:.86rem">
        品管檢驗單是唯一主紀錄；入料通過會寫檢驗單、更新入料狀態並入庫。建議 Notion 保留「品管檢驗單」、「品管不合格記錄」、「入料單」三個資料源即可，舊版品管記錄頁可封存。
      </div>
    </div>
  </div>`;
}
