/* ══════════════════════════════════════════════
   LEMATEC ERP 主題系統 — 5 種精選配色
   即時切換、localStorage 保存、無需重整
   ══════════════════════════════════════════════ */

/* 共用字型變數 */
:root{
  --bg:#05080f;--bg2:#0a0f1e;--bg3:#0f1628;--bg4:#151d35;--bg5:#1c2640;
  --border:#1a2438;--border2:#243352;--border3:#2d4068;
  --brand:#9c1b2c;--brand2:#c5243e;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#06b6d4;--cyan2:#22d3ee;
  --green:#10b981;--green2:#34d399;--yellow:#f59e0b;--amber:#fbbf24;
  --red:#ef4444;--red2:#f87171;--purple:#8b5cf6;
  --text:#f0f4ff;--text2:#a0aec0;--text3:#55657a;
  --f-ui:'Outfit','Noto Sans TC',system-ui,sans-serif;
  --f-mono:'DM Mono',monospace;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius-card:14px;
}
/* ══════════════════════════════
   主題覆蓋（不影響 :root 預設值）
   選擇後即時覆蓋，不選則用科技風
   ══════════════════════════════ */

/* 🌿 自然風 */
html[data-theme="nature"]{
  --bg:#0f1a12;--bg2:#162118;--bg3:#1c2e20;--bg4:#243a28;--bg5:#2c4832;
  --border:#2a3d2e;--border2:#3a5540;--border3:#4a6e52;
  --brand:#2d6a4f;--brand2:#40916c;
  --blue:#52b788;--blue2:#74c69d;--cyan:#95d5b2;--cyan2:#b7e4c7;
  --green:#2d6a4f;--green2:#40916c;--yellow:#d4a017;--amber:#e9c46a;
  --red:#c44536;--red2:#e07a5f;--purple:#7b6d8d;
  --text:#d8f3dc;--text2:#95b8a0;--text3:#52796f;
  --shadow:0 4px 24px rgba(0,0,0,.4);--radius-card:16px;
}
/* ⬜ 極簡風（深灰）*/
html[data-theme="minimal"]{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;--bg4:#2a2a2a;--bg5:#333333;
  --border:#2c2c2c;--border2:#383838;--border3:#444444;
  --brand:#505050;--brand2:#707070;
  --blue:#6e9ef5;--blue2:#8fb3f8;--cyan:#5bc4d6;--cyan2:#7dd4e3;
  --green:#5fbd8a;--green2:#79cea0;--yellow:#d4a843;--amber:#e8c56e;
  --red:#d9534f;--red2:#e57573;--purple:#9b8ec4;
  --text:#ebebeb;--text2:#9a9a9a;--text3:#585858;
  --shadow:0 4px 20px rgba(0,0,0,.6);--radius-card:8px;
}


/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌌 科技深藍（預設）- 深邃宇宙藍，高對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root, html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌙 深紫夜色 - 優雅暗紫，眼睛最舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌿 森林綠意 - 沉穩深綠，自然舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🔥 琥珀暗金 - 溫暖金棕，高貴沉穩
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ⬛ 碳黑極簡 - 純粹黑灰，最大對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
html{font-size:1rem;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--cyan),var(--green2));border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
.view-only-role .notion-link,
.view-only-role .notion-bar a,
.view-only-role a[href*="notion.so"]{display:none!important;}
.view-only-role .notion-bar::after{content:'檢視模式';color:var(--text3);font-size:.8rem;font-weight:700;}

/* ── Input ── */
.inp{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-family:var(--f-ui);font-size:0.875rem;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18);}
.inp::placeholder{color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;}
select.inp{-webkit-appearance:none;appearance:none;cursor:pointer;height:auto;}
select.inp>option{background:var(--bg3);color:var(--text);}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;font-family:var(--f-ui);font-size:0.875rem;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;-webkit-user-select:none;user-select:none;white-space:nowrap;letter-spacing:.2px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 16px rgba(156,27,44,.35);}
.btn-primary:hover{box-shadow:0 6px 24px rgba(156,27,44,.5);}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3);}
.btn-blue:hover{background:#2563eb;box-shadow:0 6px 22px rgba(59,130,246,.45);}
.btn-blue:disabled{background:var(--text3);box-shadow:none;}
.btn-green{background:rgba(16,185,129,.15);color:var(--green2);border:1px solid rgba(16,185,129,.3);}
.btn-green:hover{background:rgba(16,185,129,.25);}
.btn-red{background:rgba(239,68,68,.12);color:var(--red2);border:1px solid rgba(239,68,68,.25);}
.btn-yellow{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25);}
.btn-ghost{background:var(--bg4);color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--bg5);color:var(--text);border-color:var(--border3);}
.btn-cyan{background:rgba(6,182,212,.12);color:var(--cyan2);border:1px solid rgba(6,182,212,.25);}
.btn-sm{padding:6px 14px;font-size:0.75rem;border-radius:7px;}
.btn-xs{padding:4px 10px;font-size:0.6875rem;border-radius:6px;}
.btn-full{width:100%;justify-content:center;}
/* ════════════════════════════════════════════
   設計配色系統 — 基於配色學原則
   原則：
   · 微帶色調的深色面（非純黑）減少視覺疲勞
   · WCAG AA 對比度：文字 ≥ 4.5:1
   · 高亮色飽和度略降，避免在暗底上震動
   · 表面明度隨層次遞增（elevation system）
   ════════════════════════════════════════════ */

/* 🌊 深海藍（冷靜專業，數據儀表板首選）*/
html[data-theme="ocean"]{
  --bg:#050e1a;--bg2:#091525;--bg3:#0e1f38;--bg4:#142a4d;--bg5:#1a3562;
  --border:#1a2e45;--border2:#254262;--border3:#305580;

  --red:#f44336;--red2:#ef9a9a;--purple:#7c4dff;

  --shadow:0 4px 28px rgba(0,0,0,.55);--radius-card:12px;
}

  --red:#ff5252;--red2:#ff8a80;--purple:#ea80fc;

  --shadow:0 4px 28px rgba(0,0,0,.6);--radius-card:14px;

html[data-theme="rose"]{
  --bg:#130b0e;--bg2:#1c1013;--bg3:#25161a;--bg4:#2e1c21;--bg5:#382228;
  --border:#3a1e24;--border2:#4e2830;--border3:#62333c;
  --brand:#880e4f;--brand2:#c2185b;

/* ══════════════════════════════════════
   LOGIN PAGE
══════════════════════════════════════ */
.login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;z-index:100;
  padding:16px;box-sizing:border-box;overflow-y:auto;
}
.login-screen>*{width:100%;max-width:400px;box-sizing:border-box;}
.login-screen img{
  width:64px!important;height:64px!important;max-width:64px!important;
  border-radius:50%;display:block;margin:0 auto;
}
.login-screen h1{font-size:1.5rem;text-align:center;}
.login-screen .brand{text-align:center;}
  width:72px;height:72px;object-fit:contain;border-radius:50%;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.brand{font-family:var(--f-mono);font-size:0.75rem;font-weight:400;letter-spacing:5px;color:var(--text3);}
.login-screen h1{font-family:var(--f-ui);font-size:1.625rem;font-weight:800;color:var(--text);letter-spacing:.3px;margin-top:-8px;text-align:center;}

/* Login card */
.card{
  background:var(--bg2);border:1px solid var(--border2);border-radius:16px;
  padding:24px;width:100%;max-width:400px;box-sizing:border-box;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.card .field{margin-bottom:14px;}
.card .field>label{display:block;font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600;}

/* Token input + 清除按鈕 */
.token-wrap{position:relative;width:100%;overflow:hidden;}
.token-wrap .inp{padding-right:54px;box-sizing:border-box;width:100%;}
.show-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:var(--bg4);border:1px solid var(--border2);border-radius:5px;
  color:var(--text3);cursor:pointer;font-size:0.625rem;padding:3px 8px;
  font-family:var(--f-ui);white-space:nowrap;
}
.show-btn:hover{color:var(--text);}

/* Hint text */
.hint{font-size:0.6875rem;color:var(--text3);margin-top:5px;line-height:1.5;}
.hint a{color:var(--blue);text-decoration:none;}

/* Login button */
.btn-login{
  width:100%;padding:13px;margin-top:4px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;border:none;border-radius:9px;
  font-size:0.9375rem;font-weight:700;cursor:pointer;
  font-family:var(--f-ui);letter-spacing:.5px;
  box-shadow:0 4px 20px rgba(156,27,44,.4);transition:all .2s;
}
.btn-login:hover{box-shadow:0 6px 28px rgba(156,27,44,.6);transform:translateY(-1px);}
.btn-login:disabled{background:var(--text3);cursor:not-allowed;box-shadow:none;transform:none;}

/* Alert */
.alert{padding:10px 14px;border-radius:8px;font-size:0.75rem;margin-top:10px;display:none;}
.alert.show{display:block;}
.alert-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red2);}

/* ══════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════ */
.app{display:none;flex-direction:column;height:100vh;overflow:hidden;}

/* Topbar */
.topbar{height:52px;flex-shrink:0;background:var(--bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50;}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--blue) 35%,var(--cyan) 65%,transparent 95%);opacity:.4;}
.topbar-logo{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topbar-logo img{width:22px;height:22px;object-fit:contain;}
.topbar-brand{font-family:var(--f-mono);font-size:0.75rem;font-weight:400;letter-spacing:4px;color:var(--text);}
.topbar-sep{color:var(--border3);font-size:0.75rem;margin:0 2px;}
.topbar-sub{font-size:0.6875rem;color:var(--text3);letter-spacing:1px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px;}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.6);flex-shrink:0;}
.role-badge{padding:2px 9px;border-radius:20px;font-size:0.6875rem;font-weight:600;}
#syncStatus{font-size:0.625rem;color:var(--text3);font-family:var(--f-mono);}
#liveClock{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(34,211,238,.18);background:rgba(34,211,238,.06);color:var(--cyan2);font-size:0.6875rem;font-family:var(--f-mono);font-weight:600;white-space:nowrap;}

/* Nav */
.role-nav{flex-shrink:0;background:rgba(5,8,15,.95);border-bottom:1px solid var(--border);display:flex;padding:0 8px 4px;overflow-x:scroll;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent;}
.role-nav::-webkit-scrollbar{height:8px;}
.role-nav::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--cyan),var(--green2));border-radius:999px;}
.tab-btn{flex-shrink:0;padding:11px 15px;font-size:0.8125rem;font-weight:600;color:var(--text3);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s;font-family:var(--f-ui);}
.tab-btn:hover{color:var(--text2);}
.tab-btn.active{color:var(--cyan2);border-bottom-color:var(--cyan2);}

/* Content */
.content{flex:1;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#mainContent{flex:1;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ══════════════════════════════════════
   PANELS & TABLES
══════════════════════════════════════ */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;position:relative;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.2),rgba(6,182,212,.15),transparent);}
.panel-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(10,15,30,.5);}
.panel-title{font-size:0.8125rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
.badge{background:rgba(59,130,246,.15);color:var(--blue2);border-radius:12px;padding:2px 8px;font-size:0.625rem;font-weight:700;border:1px solid rgba(59,130,246,.18);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--cyan) rgba(255,255,255,.05);padding-bottom:8px;}
.table-wrap::-webkit-scrollbar{height:10px;}
.table-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:999px;}
.table-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--cyan),var(--green2));border-radius:999px;border:2px solid rgba(5,8,15,.8);}
table{width:100%;border-collapse:collapse;min-width:480px;}
th{font-size:0.625rem;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);font-weight:700;padding:10px 14px;text-align:left;background:rgba(5,8,15,.7);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;transition:color .15s;}
th:hover{color:var(--text2);}
th.th-asc,th.th-desc{color:var(--cyan2);}
td{padding:11px 14px;font-size:0.8125rem;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;line-height:1.4;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(59,130,246,.04);}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:0.6875rem;font-weight:700;white-space:nowrap;letter-spacing:.3px;}

/* ══════════════════════════════════════
   DASHBOARD
══════════════════════════════════════ */
.dash-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;align-items:stretch;}
.dash-kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px;align-items:stretch;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;}
.kpi-card:hover{transform:translateY(-3px);}
.kpi-glow{position:absolute;width:130px;height:130px;border-radius:50%;top:-30px;right:-20px;opacity:.1;filter:blur(50px);pointer-events:none;}
.kpi-label{font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:12px;}
.kpi-num{font-family:var(--f-mono);font-size:2.5rem;font-weight:500;line-height:1;margin-bottom:4px;letter-spacing:-2px;}
.kpi-sub{font-size:0.6875rem;color:var(--text3);margin-top:2px;}
.kpi-bar{height:3px;border-radius:2px;background:var(--border);margin-top:12px;overflow:hidden;}
.kpi-bar-fill{height:100%;border-radius:2px;}
.kpi-blue{border-color:rgba(59,130,246,.2);}.kpi-blue:hover{border-color:rgba(59,130,246,.4);box-shadow:0 8px 32px rgba(59,130,246,.1);}.kpi-blue .kpi-glow{background:var(--blue);}.kpi-blue .kpi-num{color:var(--blue2);}.kpi-blue .kpi-bar-fill{background:linear-gradient(90deg,var(--blue),var(--cyan2));}
.kpi-green{border-color:rgba(16,185,129,.2);}.kpi-green:hover{border-color:rgba(16,185,129,.4);box-shadow:0 8px 32px rgba(16,185,129,.1);}.kpi-green .kpi-glow{background:var(--green);}.kpi-green .kpi-num{color:var(--green2);}.kpi-green .kpi-bar-fill{background:linear-gradient(90deg,var(--green),var(--cyan2));}
.kpi-amber{border-color:rgba(245,158,11,.2);}.kpi-amber:hover{border-color:rgba(245,158,11,.4);}.kpi-amber .kpi-glow{background:var(--yellow);}.kpi-amber .kpi-num{color:var(--amber);}.kpi-amber .kpi-bar-fill{background:linear-gradient(90deg,var(--yellow),var(--amber));}
.kpi-red{border-color:rgba(239,68,68,.2);}.kpi-red:hover{border-color:rgba(239,68,68,.4);box-shadow:0 8px 32px rgba(239,68,68,.08);}.kpi-red .kpi-glow{background:var(--red);}.kpi-red .kpi-num{color:var(--red2);}.kpi-red .kpi-bar-fill{background:linear-gradient(90deg,var(--red),#ff7171);}
.kpi-cyan{border-color:rgba(6,182,212,.2);}.kpi-cyan:hover{border-color:rgba(6,182,212,.4);box-shadow:0 8px 32px rgba(6,182,212,.08);}.kpi-cyan .kpi-glow{background:var(--cyan);}.kpi-cyan .kpi-num{color:var(--cyan2);}.kpi-cyan .kpi-bar-fill{background:linear-gradient(90deg,var(--cyan),var(--blue2));}

/* Stats (Dashboard fallback) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .15s,border-color .2s;}
.stat:hover{transform:translateY(-2px);}
.stat-n{font-family:var(--f-mono);font-size:1.875rem;font-weight:700;line-height:1;margin-bottom:3px;}
.stat-l{font-size:0.6875rem;color:var(--text3);}

/* ══════════════════════════════════════
   INFO BOXES
══════════════════════════════════════ */
.info-box{padding:10px 14px;border-radius:9px;font-size:0.8125rem;margin-bottom:12px;line-height:1.6;}
.info-ok{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);color:var(--green2);}
.info-warn{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);color:var(--amber);}
.info-tip{background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.2);color:var(--cyan2);font-size:0.75rem;}
.help-box{background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.18);border-radius:9px;padding:10px 14px;font-size:0.75rem;color:var(--cyan2);margin-bottom:12px;line-height:1.7;}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
.modal-bg.open{display:flex;}

/* ══════════════════════════════════════

══════════════════════════════════════ */
.ann-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:15px 16px 15px 20px;margin-bottom:9px;position:relative;overflow:hidden;transition:border-color .2s;}

.ann-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,var(--blue),var(--cyan));border-radius:4px 0 0 4px;}
.ann-pinned::before{background:linear-gradient(to bottom,var(--yellow),var(--amber));}

/* ══════════════════════════════════════
   ITEM ROWS (Order items)
══════════════════════════════════════ */
.item-row{background:var(--bg4);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:5px;display:flex;align-items:flex-start;gap:8px;}
.item-row:last-child{margin-bottom:0;}

.item-body{flex:1;min-width:0;}
.item-model-wrap{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.item-model{flex:1;background:var(--bg5)!important;border:1px solid var(--border2);border-radius:6px;padding:6px 9px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-size:0.8125rem;font-family:var(--f-mono);outline:none;min-width:0;}
.item-model:focus{border-color:var(--blue);}
.item-model::placeholder{color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;}
.item-qty{width:68px;flex-shrink:0;background:var(--bg5)!important;border:1px solid var(--border2);border-radius:6px;padding:6px 8px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-size:0.8125rem;font-family:var(--f-mono);text-align:center;outline:none;}
.item-qty:focus{border-color:var(--blue);}
.item-del{flex-shrink:0;width:28px;height:28px;border-radius:6px;cursor:pointer;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red2);display:flex;align-items:center;justify-content:center;font-size:0.875rem;font-weight:700;padding:0;}
.item-hint{font-size:0.625rem;color:var(--text3);min-height:14px;margin-top:2px;}

/* ══════════════════════════════════════
   PROGRESS / STOCK BAR / SN / etc.
══════════════════════════════════════ */
.prog-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:10px;}
.prog-text{font-size:0.75rem;color:var(--text2);margin-bottom:7px;}
.prog-track{background:var(--bg5);border-radius:4px;height:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:4px;transition:width .3s;}
.sbar{width:44px;height:4px;background:var(--bg5);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px;overflow:hidden;}
.sbar-fill{height:100%;border-radius:2px;}
.bar{width:44px;height:4px;background:var(--bg5);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;}
.sn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:0.5625rem;font-weight:700;flex-shrink:0;vertical-align:middle;margin-right:4px;}
.loading-row{display:flex;align-items:center;justify-content:center;padding:28px;color:var(--text3);gap:8px;font-size:0.8125rem;}
.pi-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:5px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s;}
.pi-item:hover,.pi-item.selected{border-color:var(--blue);}

/* ══════════════════════════════════════
   QC TABS
══════════════════════════════════════ */
.qc-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;}
.qc-tab{padding:9px 16px;font-size:0.8125rem;font-weight:600;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text3);transition:color .15s;flex-shrink:0;}
.qc-tab.active{color:var(--cyan2);border-bottom-color:var(--cyan2);}

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toastZone{position:fixed;top:62px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{min-width:230px;max-width:370px;padding:11px 15px;border-radius:10px;font-size:0.8125rem;font-weight:500;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transform:translateX(16px);transition:opacity .25s,transform .25s;pointer-events:none;}
.toast.in{opacity:1;transform:translateX(0);}
.sync-float{position:fixed;right:14px;bottom:14px;z-index:9998;display:none;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(5,8,15,.92);border:1px solid var(--border2);box-shadow:0 10px 30px rgba(0,0,0,.45);color:var(--text2);font-size:0.75rem;font-weight:700;backdrop-filter:blur(14px);cursor:pointer;}
.sync-float.show{display:flex;}
.sync-float::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(16,185,129,.7);flex-shrink:0;}
.sync-float.syncing::before{background:var(--cyan);animation:pulseDot 1s infinite;}
.sync-float.warn::before{background:var(--yellow);}
.sync-float.err::before{background:var(--red);}
.sync-float.update{background:rgba(6,182,212,.18);border-color:rgba(34,211,238,.45);color:var(--cyan2);}
@keyframes pulseDot{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

/* ══════════════════════════════════════
   ANIMATIONS & SPIN
══════════════════════════════════════ */
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.kpi-card{animation:fadeUp .3s ease both;}
.panel{animation:fadeUp .25s ease both;}

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media(max-width:600px){
  html{font-size:0.875rem;}
  .content,#mainContent{padding:9px;}
  .dash-kpi-grid{grid-template-columns:1fr 1fr!important;gap:9px!important;}
  .stats{grid-template-columns:1fr 1fr;}
  .kpi-num{font-size:2rem!important;}
  .stat-n{font-size:1.5rem;}
  td,th{padding:9px 10px!important;font-size:0.75rem!important;}
  .form-row{grid-template-columns:1fr!important;}
  .hide-m{display:none!important;}
  .modal-box,.modal{padding:18px;}
  .topbar{padding:0 10px;}
  .tab-btn{padding:10px 12px;font-size:0.75rem;}
  .kpi-card{padding:15px 16px;}
  .card{max-width:100%;}
  .sync-float{left:12px;right:12px;bottom:12px;justify-content:center;font-size:0.8125rem;padding:10px 12px;}
}
@media(max-width:380px){
  .kpi-num{font-size:1.75rem!important;}
}
.sel-row { background: rgba(77,142,245,.06) !important; }
.sel-row:hover { background: rgba(77,142,245,.10) !important; }

<script>
function openStatusModal(id, cur){
  if(denyViewOnlyAction()) return;
  const statuses=['待排程','生產中','待檢驗','待出貨','已完成','取消'];
  document.getElementById('modalInner').innerHTML=`<h3>📋 更新訂單狀態</h3>
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
    ${statuses.map(s=>`<button class="btn ${s===cur?'btn-blue':'btn-ghost'}"
      onclick="doUpdateStatus('${id}','${s}')"
      style="justify-content:flex-start;font-size:13px">${pill(s)}&nbsp;&nbsp;${s}</button>`).join('')}
  </div>
  <div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button></div>`;
  openModal();
}

async function doUpdateStatus(id, s){
  if(denyViewOnlyAction()) return;
  closeModal();
  const o = orders.find(x=>x.id===id);
  const oldStatus = o?.status||'';
  if(o){ o.status=s; renderTab(CURRENT_TAB); }
  showToast('更新狀態中...','warn');
  try{
    await updatePage(id,{'狀態':{select:{name:s}}});
    logUserAction('訂單狀態更新',o?.no||id,`${oldStatus||'—'} → ${s}`,ROLE);
    showToast('✅ 狀態→「'+s+'」','ok');
    setTimeout(()=>refreshAll().catch(()=>{}), 1000);
  }catch(e){ showToast('❌ '+e.message,'err'); }
}

function openShipOrderModal(id){
  if(denyViewOnlyAction()) return;
  const o=orders.find(x=>x.id===id);
  if(!o){showToast('找不到訂單','err');return;}
  const canShip=isAdminRole()||ROLE==='sales'||ROLE==='warehouse';
  if(!canShip){showToast('此角色無法填寫出貨日','warn');return;}
  document.getElementById('modalInner').innerHTML=`<h3>🚚 填寫實際出貨日</h3>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px">
      <div style="font-family:var(--f-mono);color:var(--cyan2);font-weight:700">${o.no||'—'}</div>
      <div style="font-weight:700;margin-top:5px">${orderProductName(o)} × ${o.qty||0}</div>
      <div style="font-size:.78rem;color:var(--text3);margin-top:4px">客戶：${orderCustomerLabel(o)} / 交期：${o.deadline||'—'}</div>
    </div>
    <div style="margin-bottom:10px">
      <label class="field-label">實際出貨日</label>
      <input class="inp" type="date" id="shipActualDate" value="${o.shipDate||todayStr()}">
    </div>
    <div style="margin-bottom:14px">
      <label class="field-label">備註（選填）</label>
      <input class="inp" id="shipNote" placeholder="例如：業務確認、船務已安排">
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-green" onclick="submitShipOrder('${id}')">✅ 出貨完成</button>
    </div>`;
  openModal();
}
async function submitShipOrder(id){
  if(denyViewOnlyAction()) return;
  const o=orders.find(x=>x.id===id);
  const d=document.getElementById('shipActualDate')?.value||todayStr();
  const note=(document.getElementById('shipNote')?.value||'').trim();
  if(!d){showToast('請選擇實際出貨日','warn');return;}
  closeModal();showToast('更新出貨資料中...','warn');
  try{
    const props={'實際出貨日':{date:{start:d}},'狀態':{select:{name:'已完成'}}};
    if(note||o?.note)props['業務備註']={rich_text:[{text:{content:[o?.note||'',note?('出貨備註：'+note):''].filter(Boolean).join(' / ')}}]};
    await updatePage(id,props);
    if(o){o.shipDate=d;o.status='已完成';if(note)o.note=[o.note,note].filter(Boolean).join(' / ');}
    logUserAction('訂單出貨完成',o?.no||id,'實際出貨日 '+d+(note?' / '+note:''),ROLE);
    renderTab(CURRENT_TAB);
    showToast('✅ 已完成出貨，日期：'+d,'ok');
    setTimeout(()=>refreshAll().catch(()=>{}),900);
  }catch(e){showToast('❌ '+e.message,'err');}
}


function openEditStock(id, name, cur){
  if(denyViewOnlyAction()) return;
  const matForEdit=mats.find(m=>m.id===id);
  name=name||matForEdit?.name||'料件';
  cur=(cur===undefined||cur===null)?(matForEdit?.stock||0):cur;
  document.getElementById('modalInner').innerHTML=`<h3>✏️ 修改庫存 — ${name}</h3>
  <div style="font-size:0.8125rem;color:var(--text2);margin-bottom:10px">目前：<b style="color:var(--text);font-size:1.25rem">${cur}</b> 個</div>
  <div style="margin-bottom:10px">
    <label style="font-size:0.625rem;color:var(--text2);display:block;margin-bottom:4px">修改後數量</label>
    <input class="inp" type="number" id="newStock" value="${cur}" min="0">
  </div>
  <div style="margin-bottom:12px">
    <label style="font-size:0.625rem;color:var(--red);display:block;margin-bottom:4px">✳ 修改原因（必填）</label>
    <input class="inp" id="editStockReason" placeholder="請填寫修改原因，不可空白或只有特殊符號" style="border-color:rgba(239,68,68,.3)">
    <div style="font-size:0.625rem;color:var(--text3);margin-top:4px">⚠ 修改後自動寫入庫存修改記錄</div>
  </div>
  <div class="form-actions">
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-blue" onclick="doEditStock('${id}','${name}',${cur})">💾 確認修改</button>
  </div>`;
  openModal();
}

async function doEditStock(id, name, oldStock){
  if(denyViewOnlyAction()) return;
  const newVal = parseInt(document.getElementById('newStock')?.value);
  const reason = (document.getElementById('editStockReason')?.value||'').trim();
  if(isNaN(newVal)||newVal<0){showToast('請輸入有效數字','warn');return;}
  if(!reason || !/[一-龥a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫修改原因（需包含中文或英數字）','warn');
    document.getElementById('editStockReason')?.focus();
    return;
  }
  closeModal(); showToast('更新庫存中...','warn');
  try{
    await updatePage(id,{'目前庫存':{number:newVal}});
    await _writeStockEditLog({
      matId:id, matName:name, matCode:'',
      changeType:'庫存數量修改',
      before:String(oldStock), after:String(newVal),
      delta:newVal-oldStock, reason, operator:ROLE,
    });
    const mat = mats.find(m=>m.id===id);
    if(mat){mat.qty=newVal; mat.stock=newVal;}
    await refreshAll();
    showToast(`✅ ${name} 庫存 ${oldStock} → ${newVal}（原因已記錄）`,'ok');
  }catch(e){showToast('❌ 失敗：'+e.message,'err');}
}


// ═══════════════════════════════════════════════
// DB IDs — 客戶資料架構說明
// ═══════════════════════════════════════════════
// 客戶資料唯一來源：DB.custMaster（國外業務客戶總檔）
//   - 欄位：Name(title), 客戶編號(text), 國家(select)
//   - 客戶編號格式：YY+出貨狀態(01未出貨/02已出貨)+國碼+流水號
//   - 每次登入必須重新讀取（因為出貨後編號會改變）
//
// DB.customers（ERP工廠客戶主檔）已不作為客戶清單主要來源
//   - 僅保留工廠手動建立的台灣廠商（D0108等）
//   - 已清除之前錯誤寫入的 2xxx 客戶

function isAdminRole(role=ROLE){return role==='vic'||role==='manager';}
function isViewOnly(role=ROLE){return role==='viewer';}
function denyViewOnlyAction(){
  if(!isViewOnly()) return false;
  showToast('檢視角色僅供查看，無操作權限','warn');
  return true;
}
function isMutatingNotionCall(method,endpoint){
  const m=String(method||'').toUpperCase();
  const ep=String(endpoint||'');
  return m==='PATCH'||m==='DELETE'||(m==='POST'&&(ep==='pages'||ep.startsWith('file_uploads')));
}
let _allowViewOnlyAuditWrite=false;
async function withSystemAuditWrite(fn){
  const prev=_allowViewOnlyAuditWrite;
  _allowViewOnlyAuditWrite=true;
  try{return await fn();}
  finally{_allowViewOnlyAuditWrite=prev;}
}

let _toastTimer=null;
function showToast(msg,type='ok',duration=3000){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:0.8125rem;font-weight:600;z-index:99999;max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)';document.body.appendChild(t);}
  t.textContent=msg;
  t.style.opacity='1';
  if(type==='ok')    {t.style.background='rgba(16,185,129,.9)';t.style.color='#fff';}
  else if(type==='warn'){t.style.background='rgba(245,158,11,.9)';t.style.color='#fff';}
  else if(type==='err') {t.style.background='rgba(239,68,68,.9)';t.style.color='#fff';}
  else               {t.style.background='rgba(59,130,246,.9)';t.style.color='#fff';}
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{t.style.opacity='0';},duration);
}

function closeModal(){
  document.getElementById('modalBg')?.classList.remove('open');
}

async function saveAnnounce(id){
  const title=(document.getElementById('ann_title')?.value||'').trim();
  const body=document.getElementById('ann_body')?.value||'';
  const date=document.getElementById('ann_date')?.value||'';
  const status=document.getElementById('ann_status')?.value||'草稿';
  const order=parseInt(document.getElementById('ann_order')?.value)||0;
  const pinned=!!document.getElementById('ann_pin')?.checked;
  if(!title){showToast('請填寫公告標題','warn');return;}
  closeModal(); showToast('公告儲存中...','warn');
  const props={
    '標題':{title:[{text:{content:title}}]},
    '內容':{rich_text:[{text:{content:body}}]},
    '狀態':{select:{name:status}},
    '顯示順序':{number:order},
    '置頂':{checkbox:pinned},
  };
  if(date) props['發佈日期']={date:{start:date}};
  try{
    if(id) await updatePage(id,props);
    else await createPage(DB.announce,props);
    await refreshAll();
    showToast('✅ 公告已儲存','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function deleteAnnounce(id){
  if(!confirm('確定刪除此公告？')) return;
  try{
    await archivePage(id);
    announces=announces.filter(a=>a.id!==id);
    renderTab('announce');
    showToast('✅ 公告已刪除','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function saveSchedule(id){
  const name=(document.getElementById('sc_name')?.value||'').trim();
  const start=document.getElementById('sc_start')?.value||'';
  const end=document.getElementById('sc_end')?.value||'';
  const note=(document.getElementById('sc_note')?.value||'').trim();
  if(!name){showToast('請填寫排程名稱','warn');return;}
  closeModal(); showToast('排程儲存中...','warn');
  const props={
    '排程名稱':{title:[{text:{content:name}}]},
    '備註':{rich_text:[{text:{content:note}}]},
    '狀態':{select:{name:'待開始'}},
  };
  if(start) props['開始日期']={date:{start}};
  if(end) props['結束日期']={date:{start:end}};
  try{
    if(id) await updatePage(id,props);
    else await createPage(DB.schedule,props);
    await loadSchedule(); renderTab('schedule');
    showToast('✅ 排程已儲存','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function notionAPI(method,endpoint,body=null){
  if(isViewOnly()&&!_allowViewOnlyAuditWrite&&isMutatingNotionCall(method,endpoint)){
    return {object:'error',status:403,code:'view_only',message:'檢視角色僅供查看，無操作權限'};
  }
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,method,endpoint,body})});
  const text=await res.text();
  try{return JSON.parse(text);}catch{throw new Error('解析失敗: '+text.slice(0,100));}
}
async function notionAPI2026(method,endpoint,body=null){
  if(isViewOnly()&&!_allowViewOnlyAuditWrite&&isMutatingNotionCall(method,endpoint)){
    return {object:'error',status:403,code:'view_only',message:'檢視角色僅供查看，無操作權限'};
  }
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,method,endpoint,body,notionVersion:'2026-03-11'})});
  const text=await res.text();
  try{return JSON.parse(text);}catch{throw new Error('解析失敗: '+text.slice(0,100));}
}
async function dbQueryAll(dbId){
  let all=[],c=null,tries=0;
  do{
    const b={page_size:100};if(c)b.start_cursor=c;
    const r=await notionAPI('POST',`databases/${dbId}/query`,b);
    if(r.object==='error'){
      if(r.status===429&&tries<2){await new Promise(res=>setTimeout(res,1200*(tries+1)));tries++;continue;}
      throw new Error('DB查詢失敗: '+r.message);
    }
    all=all.concat(r.results||[]);c=r.has_more?r.next_cursor:null;tries=0;
  }while(c);
  return all;
}
const createPage=(dbId,props)=>notionAPI('POST','pages',{parent:{database_id:dbId},properties:props});
function assertNotionPage(r, action='Notion 寫入'){
  if(!r||r.object==='error'){
    throw new Error(`${action}失敗：${r?.message||r?.code||'未知錯誤'}`);
  }
  if(r.object&&r.object!=='page'){
    throw new Error(`${action}回傳異常：${r.object}`);
  }
  return r;
}
async function updatePage(id,props){
  for(let i=0;i<3;i++){
    const r=await notionAPI('PATCH',`pages/${id}`,{properties:props});
    if(r.object!=='error') return r;
    if(r.status===429) await new Promise(res=>setTimeout(res,1000*(i+1)));
    else throw new Error(r.message||JSON.stringify(r));
  }
}
const archivePage=id=>notionAPI('PATCH',`pages/${id}`,{archived:true});
const getBlockChildren=id=>notionAPI('GET',`blocks/${id}/children?page_size=100`);
const getBlock=id=>notionAPI('GET',`blocks/${id}`);
const notionSearch=q=>notionAPI('POST','search',{query:q,filter:{property:'object',value:'page'},page_size:20});
async function downloadViaProxy(url){
  let directErr=null;
  if(/^https?:\/\//i.test(url||'')){
    try{
      const direct=await fetch(url);
      if(direct.ok) return await direct.arrayBuffer();
      directErr=new Error(`直接下載 HTTP ${direct.status}`);
    }catch(e){directErr=e;}
  }
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,downloadUrl:url})});
  if(!res.ok)throw new Error(`下載失敗 HTTP ${res.status}${directErr?' / '+directErr.message:''}`);
  return res.arrayBuffer();
}

function getTitle(props,...keys){for(const k of keys){const a=props?.[k]?.title;if(Array.isArray(a)&&a.length)return a[0]?.plain_text||a[0]?.text?.content||'';}return '';}
function getRichText(props,...keys){for(const k of keys){const p=props?.[k];if(!p)continue;const a=p.rich_text||p.text||[];if(Array.isArray(a)&&a.length)return(a[0]?.plain_text||a[0]?.text?.content||'').trim();}return '';}

// ═══════════════════════════════════════════════
const LOGIN_LOG_DB_KEY='lematec_login_log_db_id';
let _loginLogDbId='',_loginLogPageId='',_loginLogSession='',_loginStartedAt=0,_loginLastPatch=0,_loginLogLoading=false,_loginLogLoadedAt=0;
let loginLogs=[];
function safeRt(s,max=1900){return String(s??'').slice(0,max);}
function loginRoleLabel(role=ROLE){return ROLES[role]?.label||role||'未知';}
function notionPageUrl(id){
  const clean=String(id||'').replace(/-/g,'');
  return clean?`https://www.notion.so/${clean}`:'#';
}
function loginLogSessionId(){
  if(!_loginLogSession){
    _loginLogSession=`${getOnlineSessionId()}-${Date.now().toString(36)}`;
  }
  return _loginLogSession;
}
async function ensureLoginLogDB(){
  if(_loginLogDbId) return _loginLogDbId;
  const cached=localStorage.getItem(LOGIN_LOG_DB_KEY)||DB.loginLog||'';
  if(cached){
    const ok=await notionAPI('GET',`databases/${cached}`);
    if(ok?.id||ok?.object==='database'){
      _loginLogDbId=cached;
      return _loginLogDbId;
    }
  }
  if(DB.erpPage){
    const children=await getBlockChildren(DB.erpPage);
    const found=(children?.results||[]).find(b=>b.type==='child_database'&&b.child_database?.title==='ERP 登入紀錄');
    if(found?.id){
      _loginLogDbId=found.id;
      localStorage.setItem(LOGIN_LOG_DB_KEY,_loginLogDbId);
      return _loginLogDbId;
    }
  }
  const created=await notionAPI('POST','databases',{
    parent:{type:'page_id',page_id:DB.erpPage},
    title:[{type:'text',text:{content:'ERP 登入紀錄'}}],
    properties:{
      'Session':{title:{}},
      '角色':{select:{options:Object.entries(ROLES).map(([k,r])=>({name:r.label,color:k==='vic'?'red':k==='manager'?'blue':'gray'}))}},
      '角色代碼':{rich_text:{}},
      '登入時間':{date:{}},
      '最後在線':{date:{}},
      '在線秒數':{number:{format:'number'}},
      '在線分鐘':{number:{format:'number'}},
      '登入次數':{number:{format:'number'}},
      '狀態':{select:{options:[{name:'線上',color:'green'},{name:'離線',color:'gray'}]}},
      '裝置':{rich_text:{}},
      'UserAgent':{rich_text:{}},
    }
  });
  if(created?.object==='error') throw new Error(created.message||'建立登入紀錄資料庫失敗');
  _loginLogDbId=created.id;
  localStorage.setItem(LOGIN_LOG_DB_KEY,_loginLogDbId);
  return _loginLogDbId;
}
function loginDurationSeconds(){
  if(!_loginStartedAt) return 0;
  return Math.max(0,Math.round((Date.now()-_loginStartedAt)/1000));
}
function loginAuditProps(status='線上'){
  const sec=loginDurationSeconds();
  const nowIso=new Date().toISOString();
  return {
    '最後在線':{date:{start:nowIso}},
    '在線秒數':{number:sec},
    '在線分鐘':{number:Math.round(sec/60*10)/10},
    '狀態':{select:{name:status}},
  };
}
async function startLoginAudit(){
  if(!TOKEN||!ROLE) return;
  try{
    const dbId=await ensureLoginLogDB();
    _loginStartedAt=Date.now();
    _loginLastPatch=Date.now();
    const nowIso=new Date().toISOString();
    const roleLabel=loginRoleLabel();
    const props={
      'Session':{title:[{text:{content:loginLogSessionId()}}]},
      '角色':{select:{name:roleLabel}},
      '角色代碼':{rich_text:[{text:{content:ROLE}}]},
      '登入時間':{date:{start:nowIso}},
      '最後在線':{date:{start:nowIso}},
      '在線秒數':{number:0},
      '在線分鐘':{number:0},
      '登入次數':{number:1},
      '狀態':{select:{name:'線上'}},
      '裝置':{rich_text:[{text:{content:onlineDeviceLabel()}}]},
      'UserAgent':{rich_text:[{text:{content:safeRt(navigator.userAgent||'')}}]},
    };
    const page=await withSystemAuditWrite(()=>createPage(dbId,props));
    _loginLogPageId=page?.id||'';
    if(ROLE==='vic') setTimeout(loadLoginLogs,500);
  }catch(e){console.warn('login audit start failed:',e);}
}
async function updateLoginActivity(force=false){
  if(!_loginLogPageId||!TOKEN) return;
  if(!force&&Date.now()-_loginLastPatch<60000) return;
  _loginLastPatch=Date.now();
  try{await withSystemAuditWrite(()=>updatePage(_loginLogPageId,loginAuditProps('線上')));}
  catch(e){console.warn('login audit update failed:',e);}
}
async function finalizeLoginActivity(){
  if(!_loginLogPageId||!TOKEN) return;
  try{await withSystemAuditWrite(()=>updatePage(_loginLogPageId,loginAuditProps('離線')));}
  catch(e){console.warn('login audit finalize failed:',e);}
}
function mapLoginLogPage(p){
  const props=p.properties||{};
  return {
    id:p.id,
    session:getTitle(props,'Session'),
    role:props['角色']?.select?.name||getRichText(props,'角色代碼')||'—',
    roleCode:getRichText(props,'角色代碼'),
    loginAt:props['登入時間']?.date?.start||p.created_time||'',
    lastAt:props['最後在線']?.date?.start||'',
    seconds:props['在線秒數']?.number||0,
    minutes:props['在線分鐘']?.number||0,
    count:props['登入次數']?.number||1,
    status:props['狀態']?.select?.name||'—',
    device:getRichText(props,'裝置'),
  };
}
async function loadLoginLogs(force=false){
  if(ROLE!=='vic'||_loginLogLoading) return;
  if(!force&&Date.now()-_loginLogLoadedAt<60000) return;
  _loginLogLoading=true;
  try{
    const dbId=await ensureLoginLogDB();
    let all=[],cursor=null;
    do{
      const body={
        sorts:[{property:'登入時間',direction:'descending'}],
        page_size:100
      };
      if(cursor) body.start_cursor=cursor;
      const r=await notionAPI('POST',`databases/${dbId}/query`,body);
      if(r?.object==='error') throw new Error(r.message||'讀取登入紀錄失敗');
      all=all.concat(r.results||[]);
      cursor=r.has_more?r.next_cursor:null;
    }while(cursor&&all.length<1000);
    loginLogs=all.map(mapLoginLogPage);
    _loginLogLoadedAt=Date.now();
    if(CURRENT_TAB==='permissions') renderTab('permissions');
  }catch(e){console.warn('login logs load failed:',e);}
  finally{_loginLogLoading=false;}
}
function loginLogRangeStart(range){
  const d=new Date();
  d.setHours(0,0,0,0);
  if(range==='3d') d.setDate(d.getDate()-2);
  else if(range==='7d') d.setDate(d.getDate()-6);
  else if(range==='30d') d.setDate(d.getDate()-29);
  return d;
}
function filterLoginLogsByRange(logs,range){
  const start=loginLogRangeStart(range||'today');
  return logs.filter(l=>{
    const d=new Date(l.loginAt||l.lastAt||0);
    return !Number.isNaN(d.getTime())&&d>=start;
  });
}
function renderLoginAuditPanel(){
  const range=window._LOGIN_LOG_RANGE||'today';
  const rangeOpts=[['today','當日'],['3d','近 3 天'],['7d','近 7 天'],['30d','近 1 個月']];
  const scoped=filterLoginLogsByRange(loginLogs,range);
  const byRole={};
  for(const l of scoped){
    const key=l.role||'—';
    if(!byRole[key]) byRole[key]={role:key,count:0,seconds:0,last:''};
    byRole[key].count+=l.count||1;
    byRole[key].seconds+=l.seconds||0;
    if(!byRole[key].last||String(l.loginAt)>String(byRole[key].last)) byRole[key].last=l.loginAt;
  }
  const summary=Object.values(byRole).sort((a,b)=>b.count-a.count);
  return `<div class="panel" style="margin-top:14px">
    <div class="panel-hdr">
      <span class="panel-title">🧾 登入紀錄 <span class="badge">${scoped.length}/${loginLogs.length}</span></span>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${rangeOpts.map(([v,l])=>`<button class="btn btn-xs ${range===v?'btn-cyan':'btn-ghost'}" onclick="window._LOGIN_LOG_RANGE='${v}';renderTab('permissions')">${l}</button>`).join('')}
        <button class="btn btn-ghost btn-sm" onclick="loadLoginLogs(true)">重新整理</button>
      </div>
    </div>
    <div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
      ${summary.length?summary.map(s=>`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px">
        <div style="color:var(--text2);font-size:.8rem">${escapeHtml(s.role)}</div>
        <div style="font-family:var(--f-mono);font-size:1.7rem;font-weight:800;color:var(--cyan2)">${s.count}</div>
        <div style="color:var(--text3);font-size:.78rem">累積在線 ${Math.round(s.seconds/60*10)/10} 分鐘</div>
        <div style="color:var(--text3);font-size:.72rem">最近 ${fmtDateTime(s.last)}</div>
      </div>`).join(''):`<div class="loading-row">尚無登入紀錄，登入後會自動建立。</div>`}
    </div>
    <div class="table-wrap"><table>
      <tr><th>角色</th><th>登入時間</th><th>最後在線</th><th>在線</th><th>狀態</th><th class="hide-m">裝置</th></tr>
      ${scoped.slice(0,80).map(l=>`<tr>
        <td>${escapeHtml(l.role)}</td>
        <td style="font-family:var(--f-mono);font-size:.78rem">${fmtDateTime(l.loginAt)}</td>
        <td style="font-family:var(--f-mono);font-size:.78rem">${fmtDateTime(l.lastAt)}</td>
        <td>${Math.round((l.seconds||0)/60*10)/10} 分</td>
        <td>${pill(l.status)}</td>

}

const ADMIN_ROLE_PIN_KEY='lematec_admin_role_pin_hash';
const ADMIN_ROLE_PIN_REF_PREFIX='ADMIN_ROLE_PIN:';
const ADMIN_ROLE_PIN_CIPHER_KEY='lematec-erp-admin-pin-v1';
let _pendingAdminRolePinSync=null;
let _permissionPinSyncing=false;
const _adminPinVisible={};
function adminRolePinKey(role){return 'lematec_admin_role_pin_hash_'+role;}
function adminRolePinPlainKey(role){return 'lematec_admin_role_pin_plain_'+role;}
function needsAdminRolePin(role){return role==='vic'||role==='manager';}
async function hashAdminPin(pin){
  if(!window.crypto?.subtle){
    let h=0,s='lematec-admin-role:'+pin;
    for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0;
    return 'fallback:'+Math.abs(h).toString(36);
  }
  const enc=new TextEncoder().encode('lematec-admin-role:'+pin);
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function b64FromBytes(bytes){
  let s='';
  bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s);
}
function bytesFromB64(s){
  const bin=atob(s);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function encodeAdminPinForNotion(role,pin){
  const payload=JSON.stringify({role,pin,ts:Date.now()});
  const data=new TextEncoder().encode(payload);
  const key=new TextEncoder().encode(ADMIN_ROLE_PIN_CIPHER_KEY+':'+role);
  const out=new Uint8Array(data.length);
  for(let i=0;i<data.length;i++) out[i]=data[i]^key[i%key.length];
  return 'enc:v1:'+b64FromBytes(out);
}
function decodeAdminPinFromNotion(role,value){
  const v=String(value||'').trim();
  if(!v) return '';
  if(v.startsWith('enc:v1:')){
    try{
      const data=bytesFromB64(v.slice(7));
      const key=new TextEncoder().encode(ADMIN_ROLE_PIN_CIPHER_KEY+':'+role);
      const out=new Uint8Array(data.length);
      for(let i=0;i<data.length;i++) out[i]=data[i]^key[i%key.length];
      const parsed=JSON.parse(new TextDecoder().decode(out));
      return parsed?.pin||'';
    }catch(e){
      console.warn('管理角色密碼解碼失敗：',e);
      return '';
    }
  }
  if(v.startsWith('sha256:')) return '';
  return v;
}
async function storeAdminRolePinLocal(role,pin){
  localStorage.setItem(adminRolePinKey(role),await hashAdminPin(pin));
  localStorage.setItem(adminRolePinPlainKey(role),pin);
  localStorage.removeItem(ADMIN_ROLE_PIN_KEY);
}
async function saveAdminRolePinToNotion(role,pin,operator=''){
  if(!TOKEN||!DB.stockEditLog||!needsAdminRolePin(role)||!pin) return;
  try{
    const label=ROLES[role]?.label||role;
    const stamp=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14);
    const cipher=encodeAdminPinForNotion(role,pin);
    await notionAPI('POST','pages',{parent:{database_id:DB.stockEditLog},properties:{
      '記錄編號':{title:[{text:{content:`PERM-${role}-${stamp}`}}]},
      '料件名稱':{rich_text:[{text:{content:label}}]},
      '料件編號':{rich_text:[{text:{content:ADMIN_ROLE_PIN_REF_PREFIX+role}}]},
      '修改類型':{select:{name:'其他修改'}},
      '修改前數值':{rich_text:[{text:{content:'管理角色登入密碼'}}]},
      '修改後數值':{rich_text:[{text:{content:cipher}}]},
      '修改原因':{rich_text:[{text:{content:'管理角色密碼加密保存；Vic 權限頁可解密查看'}}]},
      '修改人員':{rich_text:[{text:{content:operator||ROLE||label}}]},
    }});
  }catch(e){
    console.warn('管理角色密碼同步失敗：',e);
  }
}
async function syncPendingAdminRolePin(){
  if(!_pendingAdminRolePinSync) return;
  const p=_pendingAdminRolePinSync;
  _pendingAdminRolePinSync=null;
  await saveAdminRolePinToNotion(p.role,p.pin,p.operator);
}
async function loadAdminRolePinFromNotion(role){
  if(!TOKEN||!DB.stockEditLog||!needsAdminRolePin(role)) return null;
  try{
    const r=await notionAPI('POST',`databases/${DB.stockEditLog}/query`,{
      filter:{property:'料件編號',rich_text:{equals:ADMIN_ROLE_PIN_REF_PREFIX+role}},
      page_size:50
    });
    if(r?.object==='error') throw new Error(r.message||'查詢失敗');
    const rows=(r.results||[]).sort((a,b)=>String(b.created_time||'').localeCompare(String(a.created_time||'')));
    const page=rows[0];
    if(!page) return null;
    const stored=getRichText(page.properties,'修改後數值');
    const pin=decodeAdminPinFromNotion(role,stored);
    if(pin) await storeAdminRolePinLocal(role,pin);
    const hash=stored.startsWith('sha256:')?stored.slice(7):'';
    if(hash) localStorage.setItem(adminRolePinKey(role),hash);
    return {pin,hash,updatedAt:page.created_time||'',operator:getRichText(page.properties,'修改人員')};
  }catch(e){
    console.warn('讀取管理角色密碼失敗：',e);
    return null;
  }
}
async function syncPermissionPinsFromNotion(roles=null,{render=true}={}){
  if(_permissionPinSyncing||!TOKEN) return;
  _permissionPinSyncing=true;
  try{
    let changed=false;
    const list=Array.isArray(roles)&&roles.length?roles:['vic','manager'];
    for(const role of list){
      const before=localStorage.getItem(adminRolePinPlainKey(role))||localStorage.getItem(adminRolePinKey(role))||'';
      const got=await loadAdminRolePinFromNotion(role);
      const after=got?.pin||got?.hash||'';
      if(after&&after!==before) changed=true;
    }
    if(render&&changed&&CURRENT_TAB==='permissions') renderTab('permissions');
  }finally{
    _permissionPinSyncing=false;
  }
}
function toggleAdminPinVisible(role){
  _adminPinVisible[role]=!_adminPinVisible[role];
  renderTab('permissions');
}
async function verifyAdminRolePin(role){
  if(!needsAdminRolePin(role)) return true;
  const roleLabel=ROLES[role]?.label||role;
  const roleKey=adminRolePinKey(role);
  const plain=localStorage.getItem(adminRolePinPlainKey(role))||'';
  let saved=localStorage.getItem(roleKey)||'';
  if(plain&&!saved){
    saved=await hashAdminPin(plain);
    localStorage.setItem(roleKey,saved);
  }
  if(!saved){
    const remote=await loadAdminRolePinFromNotion(role);
    if(remote?.hash){
      saved=remote.hash;
    }else if(remote?.pin){
      saved=await hashAdminPin(remote.pin);
    }
  }
  if(!saved){
    const p1=prompt(`請設定 ${roleLabel} 登入密碼`);
    if(p1===null) return false;
    const pin=(p1||'').trim();
    if(pin.length<4){showLoginErr(`${roleLabel} 登入密碼至少 4 碼`);return false;}
    const p2=prompt(`請再次輸入 ${roleLabel} 登入密碼`);
    if((p2||'').trim()!==pin){showLoginErr(`兩次 ${roleLabel} 登入密碼不一致`);return false;}
    await storeAdminRolePinLocal(role,pin);
    _pendingAdminRolePinSync={role,pin,operator:roleLabel};
    return true;
  }
  const p=prompt(`請輸入 ${roleLabel} 登入密碼`);
  if(p===null) return false;
  const entered=(p||'').trim();
  const ok=(await hashAdminPin(entered))===saved;
  if(!ok) showLoginErr(`${roleLabel} 登入密碼錯誤`);
  else if(entered){
    localStorage.setItem(adminRolePinPlainKey(role),entered);
    _pendingAdminRolePinSync={role,pin:entered,operator:roleLabel};
  }
  return ok;
}

async function setAdminRolePin(role){
  if(ROLE!=='vic'){showToast('此功能僅限 Vic 使用','warn');return;}
  if(!needsAdminRolePin(role)){showToast('此角色不需要登入密碼','warn');return;}
  if(role!=='vic'){showToast('廠長密碼需由廠長角色首次登入時自行設定','warn');return;}

  if(p1===null) return;
  const pin=(p1||'').trim();
  if(pin.length<4){showToast(`${roleLabel} 登入密碼至少 4 碼`,'warn');return;}
  const p2=prompt(`請再次輸入 ${roleLabel} 登入密碼`);
  if((p2||'').trim()!==pin){showToast(`兩次 ${roleLabel} 登入密碼不一致`,'err');return;}
  await storeAdminRolePinLocal(role,pin);
  await saveAdminRolePinToNotion(role,pin,ROLE);

  renderTab('permissions');
}

async function login(){
  const t=document.getElementById('tokenInput').value.trim().replace(/\s+/g,'');
  const r=document.getElementById('roleSelect').value;
  document.getElementById('loginAlert').classList.remove('show');
  if(!t){showLoginErr('請填入 Token');return;}
  if(!t.startsWith('ntn_')){showLoginErr('Token 需 <b>ntn_</b> 開頭');return;}
  TOKEN=t;
  if(needsAdminRolePin(r)) await syncPermissionPinsFromNotion([r],{render:false});
  if(!(await verifyAdminRolePin(r))){TOKEN='';return;}
  ROLE=r;
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='驗證中...';
  try{
    const data=await notionAPI('GET',`databases/${DB.materials}`);
    if(data.id||data.object==='database'){
      syncPendingAdminRolePin();
      localStorage.setItem('lt',t);localStorage.setItem('lr',r);startApp();
    }else if(data.status===401||data.code==='unauthorized'){showLoginErr('Token 無效 (401)');}
    else{showLoginErr(`連接失敗: ${data.message||data.code||'未知'}`);}
  }catch(e){showLoginErr(`網路錯誤: ${e.message}`);}
  btn.disabled=false;btn.textContent='⚡ 進入系統';
}

}

function setOnlineCount(n, active=true){

async function syncOnlineHeartbeat(){
  if(_onlineBusy||!TOKEN||!DB.online) return;
  _onlineBusy=true;
  try{
    const sid=getOnlineSessionId();
    const nowIso=new Date().toISOString();
    const props={
      'Session':{title:[{text:{content:sid}}]},
      '最後心跳':{date:{start:nowIso}},
      '角色':{select:{name:ROLE||'manager'}},
      '裝置':{rich_text:[{text:{content:onlineDeviceLabel()}}]},
    };
    if(!_onlinePageId){
      const q=await notionAPI('POST',`databases/${DB.online}/query`,{
        filter:{property:'Session',title:{equals:sid}},
        page_size:1
      });
      _onlinePageId=q?.results?.[0]?.id||'';
      if(!_onlinePageId){
        const created=await withSystemAuditWrite(()=>createPage(DB.online,props));
        _onlinePageId=created?.id||'';
      }
    }else{
      await withSystemAuditWrite(()=>updatePage(_onlinePageId,props));
    }
    const activeR=await notionAPI('POST',`databases/${DB.online}/query`,{
      filter:{property:'最後心跳',date:{on_or_after:new Date(Date.now()-ONLINE_TTL_MS).toISOString()}},
      page_size:100
    });
    const active=activeR?.results?.length||1;
    setOnlineCount(active,true);
    updateLoginActivity(false);
  }catch(e){
    console.warn('online heartbeat failed:',e);
    setOnlineCount(1,false);
  }finally{
    _onlineBusy=false;
  }
}

  if(_onlineTimer) clearInterval(_onlineTimer);
  setOnlineCount(1,true);

}

  document.getElementById('loginScreen').style.display='none';

let _refreshTimer=null,_refreshing=false;

const CACHE_KEY='lematec_erp_cache_v5';
function setSyncState(text,type='ok',persist=false){
  const syncEl=document.getElementById('syncStatus');

  if(!float) return;

function saveAppCache(){

    localStorage.setItem(CACHE_KEY,JSON.stringify({
      ts:Date.now(),mats,boms,orders,customers,announces,leaves
    }));
  }catch(e){console.warn('cache save skipped:',e);}

function hydrateAppCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const c=JSON.parse(raw);
    if(!c?.ts||Date.now()-c.ts>6*60*60*1000) return false;
    mats=Array.isArray(c.mats)?c.mats:[];
    boms=Array.isArray(c.boms)?c.boms:[];
    orders=Array.isArray(c.orders)?c.orders:[];
    customers=Array.isArray(c.customers)?c.customers:[];
    announces=Array.isArray(c.announces)?c.announces:[];
    leaves=Array.isArray(c.leaves)?c.leaves:[];

  }catch(e){console.warn('cache hydrate skipped:',e);return false;}

function explodeBOM(pid,qty){
  const res={};const q=[{pid,mult:qty}];const seen=new Set();
  while(q.length){const{pid:p,mult:m}=q.shift();boms.filter(b=>b.parentId===p).forEach(b=>{const mat=mats.find(x=>x.id===b.childId);if(!mat)return;const n=b.qty*m;if(!res[b.childId])res[b.childId]={...mat,needed:0};res[b.childId].needed+=n;if(mat.type==='半成品'&&!seen.has(b.childId)){seen.add(b.childId);q.push({pid:b.childId,mult:n});}});}
  const notionItems=Object.values(res);
  if(notionItems.length) return notionItems;
  const mat=mats.find(m=>m.id===pid);
  if(!mat) return [];
  const rows=getShopeeBomRows(mat);
  return rows.map(r=>{
    const child=findMatBySku(r.code);
    return child?{...child,needed:(parseInt(r.qty)||1)*qty}:{id:'',code:r.code,name:r.code,stock:0,needed:(parseInt(r.qty)||1)*qty,missing:true};
  });
}
function normalizeSku(v){
  return String(v||'')
    .toUpperCase()
    .replace(/[　\s]/g,'')
    .replace(/[＿_]/g,'-')
    .replace(/[－–—]/g,'-')
    .trim();
}
function materialKey(m){
  return normalizeSku(m?.code||m?.name||'');
}
function requiresBOMMaterial(m, orderType=''){
  const code=normalizeSku(m?.code||m?.name||'');
  const type=m?.type||'';
  const ot=String(orderType||'').toLowerCase();
  return type==='半成品'||type==='蝦皮用'||type==='蝦皮用(S-)'||code.startsWith('S-')||ot==='蝦皮'||ot==='shopee';
}
function analyzeInventoryDeep(){
  const refs={};
  mats.forEach(m=>{refs[m.id]={asParent:0,asChild:0,orders:0,total:0};});
  boms.forEach(b=>{
    if(refs[b.parentId]) refs[b.parentId].asParent++;
    if(refs[b.childId]) refs[b.childId].asChild++;
  });
  orders.forEach(o=>{if(refs[o.productId]) refs[o.productId].orders++;});
  Object.keys(refs).forEach(id=>refs[id].total=refs[id].asParent+refs[id].asChild+refs[id].orders);

  function keeperScore(m){
    const r=refs[m.id]||{total:0,asParent:0,asChild:0,orders:0};
    return r.total*10000 + (r.asParent>0?2500:0) + (r.asChild>0?1500:0) + (Number(m.stock)||0) + (m.code?25:0) + (m.created?1:0);
  }
  const groups={};
  mats.forEach(m=>{
    const k=materialKey(m);
    if(!k) return;
    (groups[k]||(groups[k]=[])).push(m);
  });
  const duplicateGroups=Object.entries(groups)
    .filter(([k,list])=>list.length>1)
    .map(([key,list])=>{
      const sorted=[...list].sort((a,b)=>keeperScore(b)-keeperScore(a));
      return {key, keep:sorted[0], remove:sorted.slice(1), list:sorted};
    });

  const bomParentSet=new Set(boms.map(b=>b.parentId).filter(Boolean));
  const orderItems=mats
    .filter(m=>['成品','半成品','蝦皮用','蝦皮用(S-)'].includes(m.type)||normalizeSku(m.code||m.name).startsWith('S-'))
    .map(m=>{
      const hasBom=bomParentSet.has(m.id)||getShopeeBomRows(m).length>0;
      return {mat:m, hasBom, required:requiresBOMMaterial(m), refs:refs[m.id]||{total:0,asParent:0,asChild:0,orders:0}};
    });
  const mustFix=orderItems.filter(x=>x.required&&!x.hasBom);
  const externalCandidates=orderItems.filter(x=>!x.required&&!x.hasBom);
  const okBom=orderItems.filter(x=>x.hasBom);

  const near=[];
  const arr=mats.filter(m=>materialKey(m));
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      const a=arr[i], b=arr[j], ak=materialKey(a), bk=materialKey(b);
      if(ak===bk) continue;
      const short=ak.length<bk.length?ak:bk, long=ak.length<bk.length?bk:ak;
      const sameCore=short.length>=5&&(long.includes(short)||levenshteinLite(short,long)<=2);
      if(sameCore) near.push({a,b,ak,bk,score:levenshteinLite(ak,bk)});
      if(near.length>120) break;
    }
    if(near.length>120) break;
  }
  return {refs, duplicateGroups, mustFix, externalCandidates, okBom, near:near.slice(0,80)};
}
function levenshteinLite(a,b){
  a=String(a||'');b=String(b||'');
  if(Math.abs(a.length-b.length)>3) return 9;
  const dp=Array(b.length+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=b.length;j++){
      const tmp=dp[j];
      dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return dp[b.length];
}

  const extHtml=a.externalCandidates.slice(0,80).map(x=>matLine(x.mat)).join('')||'<div class="info-ok">沒有外購候選項。</div>';
  const nearHtml=a.near.length?a.near.map(x=>`

function getShopeeBomRows(mat){
  const parsed=[];
  const note=mat.note||'';
  const main=note.match(/主料:([^\s|]+)/);
  const acc=note.match(/配件:([^|]+)/);
  if(main) parsed.push({code:main[1].trim(),qty:1});
  if(acc){
    acc[1].split(',').map(s=>s.trim()).filter(Boolean).forEach(raw=>{
      const m=raw.match(/^(.+?)(?:[xX×*](\d+))?$/);
      parsed.push({code:(m?.[1]||raw).trim(),qty:parseInt(m?.[2])||1});
    });
  }
  return parsed.length?parsed:shopeeBomRowsForSku(mat.code||mat.name);
}
function getShopeeBomItems(mat, qty){
  const orderQty=parseInt(qty)||1;
  const fromNotion=explodeBOM(mat.id,orderQty);
  if(fromNotion.length) return fromNotion.map(x=>({...x,source:x.missing?'missing':'bom'}));

  const parsed=[];
  const note=mat.note||'';
  const main=note.match(/主料:([^\s|]+)/);
  const acc=note.match(/配件:([^|]+)/);
  if(main) parsed.push({code:main[1].trim(),qty:1});
  if(acc){
    acc[1].split(',').map(s=>s.trim()).filter(Boolean).forEach(raw=>{
      const m=raw.match(/^(.+?)(?:[xX×*](\d+))?$/);
      parsed.push({code:(m?.[1]||raw).trim(),qty:parseInt(m?.[2])||1});
    });
  }
  const fallback=shopeeBomRowsForSku(mat.code||mat.name);
  const rows=parsed.length?parsed:fallback;
  return rows.map(r=>{
    const child=findMatBySku(r.code);
    return child?{...child,needed:(parseInt(r.qty)||1)*orderQty,source:parsed.length?'note':'fallback'}:{id:'',code:r.code,name:r.code,stock:0,needed:(parseInt(r.qty)||1)*orderQty,missing:true,source:parsed.length?'note':'fallback'};
  });
}
async function deductShopeeBom(mat, qty, orderNo){
  const items=getShopeeBomItems(mat,qty);
  const missing=items.filter(x=>x.missing||!x.id);
  if(missing.length) throw new Error('找不到 BOM 子料號：'+missing.map(x=>x.code||x.name).join('、'));
  for(const item of items){
    const latest=await notionAPI('GET','pages/'+item.id);
    const cur=latest?.properties?.['目前庫存']?.number??item.stock??0;
    const next=cur-item.needed;
    await updatePage(item.id,{'目前庫存':{number:next}});
    await logStockChange(item.id,item.name||'',item.code||'','蝦皮組裝扣料',-item.needed,cur,next,orderNo,ROLE);
    const local=mats.find(m=>m.id===item.id);
    if(local){local.stock=next;local.qty=next;}
  }
  return items;
}

function toggleSort(tid,col,type='str'){const s=SORT[tid]||{};SORT[tid]={col,dir:s.col===col&&s.dir==='asc'?'desc':'asc',type};renderTab(CURRENT_TAB);}
function applySort(tid,data){const s=SORT[tid];if(!s)return data;return[...data].sort((a,b)=>{let va=a[s.col],vb=b[s.col];if(s.type==='num'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}else{va=String(va||'').toLowerCase();vb=String(vb||'').toLowerCase();}if(va<vb)return s.dir==='asc'?-1:1;if(va>vb)return s.dir==='asc'?1:-1;return 0;});}
function TH(tid,col,label,type='str',cls=''){const s=SORT[tid]||{};const a=s.col===col;return`<th class="${a?'th-'+s.dir:''} ${cls}" onclick="toggleSort('${tid}','${col}','${type}')">${label}<span style="font-size:0.5rem;opacity:${a?1:.3};margin-left:2px">${a?(s.dir==='asc'?'↑':'↓'):'↕'}</span></th>`;}
function applyDateFilter(filterId,data,dateKey='created'){
  const sel=document.getElementById(filterId+'DateFilter');
  const val=sel?sel.value:'0';
  if(!val||val==='0') return data; // 全部，不篩選

  const today=new Date();
  let cutoff;

  if(val==='7d'){
    cutoff=new Date();
    cutoff.setDate(cutoff.getDate()-7);
  } else if(val==='month'){
    cutoff=new Date(today.getFullYear(),today.getMonth(),1);
  } else {
    cutoff=new Date();
    cutoff.setMonth(cutoff.getMonth()-parseInt(val));
  }

  const cs=cutoff.toISOString().slice(0,10);
  return data.filter(item=>{
    const d=item[dateKey]||'';
    if(!d) return false; // 沒有日期的不顯示（避免永遠出現）
    return d>=cs;
  });
}

function duplicateMaterialRepairPlan(dupCodes){
  return dupCodes.map(group=>{
    const rows=group.map(m=>({m,usage:materialUsageSummary(m.id)}));
    rows.sort((a,b)=>
      (b.usage.total-a.usage.total) ||
      ((b.m.stock||0)-(a.m.stock||0)) ||
      String(a.m.name||a.m.code||'').localeCompare(String(b.m.name||b.m.code||''))
    );
    const keep=rows[0];
    const deletable=rows.slice(1).filter(x=>x.usage.total===0);
    const blocked=rows.slice(1).filter(x=>x.usage.total>0);
    return {key:group[0]?.code||group[0]?.name||'',keep,deletable,blocked,rows};
  });
}

async function repairDuplicateMaterialsByIds(ids,label='建議項目'){
  if(!isAdminRole()){showToast('⚠ 權限不足，無法執行健康檢查修復','warn');return;}
  if(!ids.length){showToast('請先勾選要刪除的重複料號','warn');return;}
  const targets=ids.map(id=>mats.find(m=>m.id===id)).filter(Boolean);
  const unsafe=targets.filter(m=>materialUsageSummary(m.id).total>0);
  if(unsafe.length){showToast('⚠ 勾選中含有仍被關聯的料號，已取消修復','err');return;}
  if(!confirm(`將直接刪除「${label}」中的 ${targets.length} 筆無關聯重複料號，並寫入異動紀錄。確定執行？`))return;
  showToast('修復重複料號中...','warn');
  let ok=0,fail=0;
  for(const m of targets){
    try{
      const reason='健康檢查修復：刪除無關聯重複料號';
      await archivePage(m.id);
      await _writeStockEditLog({
        matId:m.id,matName:m.name||'',matCode:m.code||'',
        changeType:'健康檢查刪除重複料號',
        before:`${m.name||''} / ${m.code||''} / ${m.type||''} / 庫存 ${m.stock}`,
        after:'Notion 已封存',
        delta:0,reason,operator:ROLE,
      });
      logUserAction('健康檢查修復',m.code||m.name,reason,ROLE);
      ok++;
    }catch(e){
      console.warn('repair duplicate material failed',m,e);
      fail++;
    }
  }
  await refreshAll(true);
  if(CURRENT_TAB==='health')renderTab('health');
  showToast(`✅ 修復完成：刪除 ${ok} 筆${fail?`，失敗 ${fail} 筆`:''}`,'ok');
}

async function repairOrderMisusedQcStatus(){
  if(!isAdminRole()){showToast('⚠ 權限不足，無法執行流程狀態修復','warn');return;}
  const targets=orders.filter(o=>o.status==='待品檢');
  if(!targets.length){showToast('沒有誤用待品檢的訂單','ok');return;}
  if(!confirm(`將 ${targets.length} 張訂單從「待品檢」改為正確訂單狀態「待檢驗」。確定執行？`))return;
  showToast('修復訂單品管狀態中...','warn');
  let ok=0,fail=0;
  for(const o of targets){
    try{
      await updatePage(o.id,{'狀態':{select:{name:'待檢驗'}}});
      logUserAction('健康檢查修復',o.no||o.id,'訂單狀態：待品檢 → 待檢驗',ROLE);
      o.status='待檢驗';
      ok++;
    }catch(e){
      console.warn('repair order qc status failed',o,e);
      fail++;
    }
  }
  await refreshAll(true);
  if(CURRENT_TAB==='health')renderTab('health');
  showToast(`✅ 訂單狀態修復完成：${ok} 張${fail?`，失敗 ${fail} 張`:''}`,'ok');
}

async function runHealthCheck(manual=false){
  if(!TOKEN)return;
  if(_healthReport?.running)return;
  const required={
    materials:['料件名稱','料件編號','類型','目前庫存','安全庫存'],
    bom:['母件','子件','每台用量'],
    orders:['訂單號','客戶名稱','成品','訂購數量','交期','實際出貨日','狀態','訂單類型'],
    corders:['訂單號碼','蝦皮訂單號碼','客戶名稱','買家帳號','寄件編號','品名','數量','單價','總價','狀態','來源'],
    shopee115:['蝦皮訂單號碼','訂單號碼','客戶名稱','買家帳號','寄件編號','品名','數量','單價'],
    pickMaster:['領料主單號','狀態','領料日期','備註'],
    pickDetail:['料件名稱','領料主單','料件','需求數量','實領數量','狀態'],
    inbound:['入料單號','料件','入料數量','品管狀態','入庫狀態'],
    qcInspection:['檢驗單號','檢驗結果','檢驗日期'],
    stockLog:['異動項目','異動類型','異動數量','異動日期','操作人員']
  };
  const selectReq={
    orders:{'狀態':['待排程','生產中','待檢驗','待出貨','已完成','取消']},
    pickMaster:{'狀態':['待確認','已確認扣料','缺料待補','待領料','已領料']},
    inbound:{'品管狀態':['待品檢','品檢通過','品檢不合格'],'入庫狀態':['待入庫','已入庫','退回供應商','退回倉管']}
  };
  _healthReport={running:true,schemaRows:[]}; if(CURRENT_TAB==='health')renderTab('health');
  const rows=[];
  for(const key of Object.keys(required)){
    try{
      const r=await notionAPI('GET','databases/'+DB[key]);
      if(r.object==='error'){rows.push({db:key,level:'err',msg:'無法讀取：'+(r.message||r.code)});continue;}
      const props=r.properties||{};
      const miss=required[key].filter(p=>!props[p]);
      rows.push({db:key,level:miss.length?'err':'ok',msg:miss.length?'缺少欄位：'+miss.join('、'):'必要欄位存在'});
      const sels=selectReq[key]||{};
      Object.keys(sels).forEach(p=>{
        const opts=(props[p]?.select?.options||[]).map(o=>o.name);
        const missOpt=sels[p].filter(x=>!opts.includes(x));
        if(missOpt.length)rows.push({db:key,level:'warn',msg:`${p} 缺少選項：${missOpt.join('、')}`});
      });
    }catch(e){rows.push({db:key,level:'err',msg:e.message});}
  }
  _healthReport={running:false,schemaRows:rows};
  if(CURRENT_TAB==='health')renderTab('health');
  if(manual)showToast('✅ 健康檢查完成','ok');
}

  function renderCalendar(){
    const now=new Date();

    const firstDay=new Date(yr,mo,1).getDay();
    const daysInMonth=new Date(yr,mo+1,0).getDate();

    for(let i=0;i<firstDay;i++){cal+=`<div style="padding:8px;border:1px solid var(--border);min-height:64px;background:var(--bg3)"></div>`;cellIdx++;}
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday=dateStr===today;
      const daySchedules=data.filter(s=>s.startDate===dateStr||s.endDate===dateStr||(s.startDate<=dateStr&&s.endDate>=dateStr));
      cal+=`<div style="padding:5px;border:1px solid var(--border);min-height:64px;background:${isToday?'rgba(59,130,246,.08)':'var(--bg2)'}">
        <div style="font-size:0.6875rem;font-weight:${isToday?800:400};color:${isToday?'var(--blue)':'var(--text2)'};margin-bottom:3px">${d}</div>
        ${daySchedules.slice(0,2).map(s=>`<div style="font-size:0.5625rem;background:${typeColors[s.type]||'var(--bg4)'}22;color:${typeColors[s.type]||'var(--text2)'};border-radius:3px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>`).join('')}
        ${daySchedules.length>2?`<div style="font-size:0.5625rem;color:var(--text3)">+${daySchedules.length-2} 更多</div>`:''}
      </div>`;
      cellIdx++;
      if(cellIdx%7===0&&d<daysInMonth) cal+=``;
    }
    cal+=`</div></div>`;
    return cal;
  }

  return _notionBar + `
  <!-- 統計列 -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
    ${[

  </div>

  ${viewVal==='calendar'?renderCalendar():`
  <!-- 列表視圖 -->
  <div class="panel">
    <div class="panel-hdr"><span class="panel-title">生產排程 <span class="badge">${data.length}</span></span></div>

      ${data.map(s=>{
        const isOverdue=s.endDate&&s.endDate<today&&s.status!=='已完成';
        return`<tr style="${isOverdue?'background:rgba(245,101,101,.05)':''}">
          <td style="font-weight:600">${s.name}${s.orderRef?`<div style="font-size:0.625rem;color:var(--cyan2);font-family:monospace">${s.orderRef}</div>`:''}</td>

            <button class="btn btn-ghost btn-sm" onclick="openEditSchedule('${s.id}')">✏</button>
            <button class="btn btn-green btn-sm" onclick="doScheduleStatus('${s.id}','已完成')" title="標記完成">✓</button>
          </td>`:''}

      }).join('')}
    </table></div>`}
  </div>`}`;
}

async function submitSchedule(existId){
  const name=document.getElementById('sch_name').value.trim();
  const type=document.getElementById('sch_type').value;
  const pri=document.getElementById('sch_pri').value;
  const start=document.getElementById('sch_start').value;
  const end=document.getElementById('sch_end').value;
  const person=document.getElementById('sch_person').value.trim();
  const order=document.getElementById('sch_order').value.trim();
  const note=document.getElementById('sch_note').value.trim();
  const status=document.getElementById('sch_status')?.value||'待開始';
  if(!name){showToast('請填入排程名稱','warn');return;}
  closeModal();showToast('儲存中...','warn');
  try{
    const props={
      '排程名稱':{title:[{text:{content:name}}]},
      '類型':{select:{name:type}},
      '優先級':{select:{name:pri}},
      '負責人':{rich_text:[{text:{content:person}}]},
      '關聯訂單號':{rich_text:[{text:{content:order}}]},
      '備註':{rich_text:[{text:{content:note}}]},
      '狀態':{select:{name:status}},
    };
    if(start)props['開始日期']={date:{start}};
    if(end)props['結束日期']={date:{start:end}};
    if(existId){
      await notionAPI('PATCH','pages/'+existId,{properties:props});
      showToast('✅ 排程已更新','ok');
    }else{
      await notionAPI('POST','pages',{parent:{database_id:DB.schedule},properties:props});
      showToast('✅ 排程已建立','ok');
    }
    await loadSchedule();renderTab('schedule');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function doScheduleStatus(id, status){
  const s=schedules.find(x=>x.id===id);
  if(s){s.status=status;renderTab('schedule');}
  try{
    await updatePage(id,{'狀態':{select:{name:status}}});
    showToast('✅ 已更新排程狀態','ok');
    setTimeout(()=>loadSchedule().then(()=>renderTab('schedule')),1500);
  }catch(e){showToast('❌ '+e.message,'err');}
}

function openEditSchedule(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  openModal('editSchedule',s);
}

function inspectionMatLabel(m){
  return [m.code,m.name&&m.name!==m.code?m.name:''].filter(Boolean).join(' — ') || m.name || m.code || '';
}
function inspectionMatMatches(q){
  const needle=String(q||'').trim().toLowerCase();
  const list=needle
    ? mats.filter(m=>(m.code||'').toLowerCase().includes(needle)||(m.name||'').toLowerCase().includes(needle)||(m.type||'').toLowerCase().includes(needle))
    : mats.slice(0,8);
  return list.sort((a,b)=>inspectionMatLabel(a).localeCompare(inspectionMatLabel(b),'zh-Hant')).slice(0,12);
}
function renderInspectionMatResults(q=''){
  const box=document.getElementById('ins_mat_results');

  if(!list.length){
    box.innerHTML=`<div style="padding:10px 12px;color:var(--amber);font-size:.82rem">找不到既有料號。可直接在下方手寫品項，系統只會建立品檢紀錄，不會自動建立庫存料號。</div>`;

function selectInspectionMat(id){
  const m=mats.find(x=>x.id===id);
  if(!m) return;
  const hidden=document.getElementById('ins_mat_existing_id');

const QC_PHOTO_LIMIT = 6;

function renderQCPhotoGrid(){

async function addQCPhotos(input){
  const files=[...(input.files||[])].filter(f=>f.type&&f.type.startsWith('image/'));
  input.value='';
  if(!files.length) return;
  for(const file of files){
    if(_qcPhotoFiles.length>=QC_PHOTO_LIMIT){showToast(`照片最多 ${QC_PHOTO_LIMIT} 張`,'warn');break;}
    try{
      const out=await compressQCPhoto(file);
      _qcPhotoFiles.push(out);
    }catch(e){showToast('照片處理失敗：'+e.message,'err');}
  }
  renderQCPhotoGrid();
}
function removeQCPhoto(i){
  const p=_qcPhotoFiles[i];
  if(p){try{URL.revokeObjectURL(p.url);}catch(e){}}
  _qcPhotoFiles.splice(i,1);
  renderQCPhotoGrid();
}
function clearQCPhotos(){
  resetQCPhotos();
  renderQCPhotoGrid();
}
async function compressQCPhoto(file){
  const bitmap=await createImageBitmap(file);
  const maxSide=1600;
  const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
  const w=Math.max(1,Math.round(bitmap.width*scale));
  const h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(bitmap,0,0,w,h);
  if(bitmap.close) bitmap.close();
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('無法壓縮圖片')),'image/jpeg',0.82));
  const safeName=(file.name||'qc-photo.jpg').replace(/\.[^.]+$/,'');
  const name=`${safeName}-${Date.now()}.jpg`;
  return {file:new File([blob],name,{type:'image/jpeg'}),url:URL.createObjectURL(blob),name};
}
async function uploadNotionFileViaProxy(file){
  const fd=new FormData();
  fd.append('action','notionFileUpload');
  fd.append('token',TOKEN);
  fd.append('file',file,file.name);
  const res=await fetch(PROXY,{method:'POST',body:fd});
  const text=await res.text();
  let data;
  try{data=JSON.parse(text);}catch{throw new Error('Worker 回應不是 JSON：'+text.slice(0,80));}
  if(!res.ok||data.error) throw new Error(data.error||('HTTP '+res.status));
  const id=data.id||data.file_upload_id||data.file?.file_upload?.id;
  if(!id) throw new Error('Worker 尚未支援 Notion 圖片上傳，請先更新 green-wave-c22f');
  return {type:'file_upload',name:file.name,file_upload:{id}};
}
async function appendBlocksSafe(pageId,children){
  if(!pageId||!children?.length) return null;
  try{return await notionAPI2026('PATCH',`blocks/${pageId}/children`,{children});}
  catch(e){console.warn('appendBlocksSafe failed:',e);return null;}
}
async function uploadQCPhotosToNotion(ctx){
  const photos=ctx.photos||[];
  if(!photos.length||!ctx.inspectionPageId) return;
  showToast(`📷 上傳品檢照片 0/${photos.length}`,'warn',5000);
  const files=[];
  for(let i=0;i<photos.length;i++){
    files.push(await uploadNotionFileViaProxy(photos[i].file));
    showToast(`📷 上傳品檢照片 ${i+1}/${photos.length}`,'warn',5000);
  }
  try{await notionAPI2026('PATCH','pages/'+ctx.inspectionPageId,{properties:{'檢驗照片':{files}}});}
  catch(e){console.warn('檢驗照片欄位可能尚未建立:',e.message);}
  const title=(ctx.inspectionNo||'品檢照片')+(ctx.sourceTitle?' · '+ctx.sourceTitle:'');
  const imageBlocks=files.map(f=>({type:'image',image:{type:'file_upload',file_upload:{id:f.file_upload.id},caption:[{type:'text',text:{content:f.name||''}}]}}));
  await appendBlocksSafe(ctx.inspectionPageId,[
    {type:'heading_3',heading_3:{rich_text:[{type:'text',text:{content:'品檢照片'}}]}},
    ...imageBlocks
  ]);
  if(ctx.sourcePageId){
    const child=await appendBlocksSafe(ctx.sourcePageId,[{type:'child_page',child_page:{title:'品檢照片 - '+title}}]);
    const childId=child?.results?.[0]?.id;
    await appendBlocksSafe(childId||ctx.sourcePageId,[
      {type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:'由 ERP 品管檢驗單自動上傳：'+title}}]}},
      ...imageBlocks
    ]);
  }
  logUserAction('上傳品檢照片',ctx.inspectionNo||'',`${photos.length} 張`,ROLE);
  showToast(`✅ 品檢照片已上傳 ${photos.length} 張`,'ok');
}
