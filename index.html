    const ibIns  = inspections.filter(i=>insFilter(i) && (i.orderRef||'').startsWith('IB-') || (!i.orderRef && insFilter(i) && (i.insNo||'').startsWith('IB-')));
    const ordIns = inspections.filter(i=>insFilter(i) && ((i.orderRef||'').startsWith('ORD-') || (i.insNo||'').startsWith('ORD-')));
    const otherIns = inspections.filter(i=>insFilter(i) && !ibIns.includes(i) && !ordIns.includes(i));

    const statusColors={'待檢驗':'var(--text3)','通過':'var(--green)','不通過':'var(--red)','條件通過':'var(--yellow)'};
    function insRow(ins){ return `<tr>
      <td style="font-family:monospace;font-size:0.6875rem">${ins.insNo||'—'}</td>
      <td style="font-size:0.6875rem">${ins.orderRef||'—'}</td>
      <td style="font-size:0.6875rem">${ins.product||'—'}</td>
      <td style="font-family:monospace">${ins.actual||0}/${ins.total||0}</td>
      <td style="font-family:monospace;color:var(--red)">${ins.badQty||0}</td>
      <td><span style="font-size:0.6875rem;font-weight:600;color:${statusColors[ins.result]||'var(--text3)'}">${ins.result||'—'}</span></td>
      <td style="font-size:0.6875rem;color:var(--text3)">${ins.date||'—'}</td>
      <td style="font-size:0.6875rem">${ins.inspector||'—'}</td>
      <td><a href="https://www.notion.so/${(ins.id||'').replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-xs">🔗</a></td>
    </tr>`; }

    const thead = `<tr><th>檢驗單號</th><th>關聯單號</th><th>品項</th><th>實/應檢</th><th>不良</th><th>結果</th><th>日期</th><th>人員</th><th></th></tr>`;

    let content = '';
    if(ordIns.length){
      content += `<div class="panel" style="margin-bottom:12px">
        <div class="panel-hdr"><span class="panel-title">📋 訂單品管檢驗</span><span class="badge">${ordIns.length}</span></div>
        <div class="table-wrap"><table>${thead}${ordIns.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(ibIns.length || otherIns.length){
      const allIbOther = [...ibIns, ...otherIns];
      content += `<div class="panel">
        <div class="panel-hdr"><span class="panel-title">📥 入料品管檢驗</span><span class="badge">${allIbOther.length}</span></div>
        <div class="table-wrap"><table>${thead}${allIbOther.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(!content) content = `<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有符合條件的檢驗紀錄</div></div>`;

    return _notionBar+tabs+filterBar+content;
  }

  // ══════════════════════════════
  // tab 4：入料已檢測歷史
  // ══════════════════════════════
  const _qcDateOpts=[['0','全部'],['7','近7天'],['30','當月'],['90','近3個月']];
  const filterBar2=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:0.6875rem;color:var(--text2)">時間：</span>
    ${_qcDateOpts.map(([v,l])=>{const a=QC_DATE===v;return`<button onclick="QC_DATE='${v}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${l}</button>`;}).join('')}
  </div>`;
  const cutoff2 = QC_DATE==='0'?0:(Date.now()-parseInt(QC_DATE)*86400000);
  const filteredDone = doneInbound.filter(i=>{
    if(!cutoff2) return true;
    const t=new Date(i.date||'').getTime(); return t&&t>=cutoff2;
  });
  if(!filteredDone.length) return _notionBar+tabs+filterBar2+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有已檢測記錄</div></div>`;
  return _notionBar+tabs+filterBar2+`<div class="panel">
    <div class="panel-hdr"><span class="panel-title">✅ 入料已檢測</span><span class="badge">${filteredDone.length}</span></div>
    <div class="table-wrap"><table>
      <tr>${TH('qch','no','入料單號')}<th>料件</th>${TH('qch','qty','數量','num')}${TH('qch','date','日期','str','hide-m')}<th>狀態</th></tr>
      ${applySort('qch',filteredDone).map(i=>{
        const mat=mats.find(m=>m.id===i.matId);
        const isFail=i.qcStatus==='品檢不合格';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem">${i.no}</td>
          <td style="font-size:0.6875rem">${mat?.name||'—'}</td>
          <td style="font-family:monospace">${i.qty}</td>
          <td class="hide-m" style="font-size:0.6875rem">${i.date||'—'}</td>
          <td><span style="padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;background:${isFail?'rgba(239,68,68,.1)':'rgba(46,196,138,.1)'};color:${isFail?'var(--red)':'var(--green)'}">${i.qcStatus||'—'}</span></td>
        </tr>`;
      }).join('')}
    </table></div>
  </div>`;
}

// ── 刪除訂單（跳確認框，Notion archive 同步刪除）
async function deleteOrder(oid, no){
  if(!confirm('⚠️ 確認刪除訂單「'+no+'」？\n\n此操作將從 Notion 永久刪除，無法復原。')) return;
  showToast('刪除中...','warn');
  try{
    // ★ 先從本地移除（立即生效，不等 Notion）
    orders = orders.filter(o=>o.id!==oid);
    renderTab(CURRENT_TAB);

    // ★ 同步到 Notion：先 archive，確認後不再出現在 query 結果
    const r = await notionAPI('PATCH','pages/'+oid,{archived:true});
    if(r.object==='error') throw new Error(r.message);

    showToast('✅ 訂單「'+no+'」已刪除','ok');

    // ★ 延遲 2 秒再 refreshAll，讓 Notion 有時間處理
    // 且 refresh 時跳過已知刪除的 ID，避免 race condition
    setTimeout(async ()=>{
      try{
        const [mR,bR,oR,masterR,annR,leaveR]=await Promise.all([
          dbQueryAll(DB.materials), dbQueryAll(DB.bom),
          dbQueryAll(DB.orders), dbQueryAll(DB.custMaster),
          dbQueryAll(DB.announce), dbQueryAll(DB.leave),
        ]);
        // 解析訂單時排除剛刪除的 ID
        orders=oR.filter(p=>p.id!==oid).map(p=>({
          id:p.id, no:getTitle(p.properties,'訂單號'),
          customer:p.properties?.['客戶名稱']?.select?.name||'',
          productId:p.properties?.['成品']?.relation?.[0]?.id||'',
          qty:p.properties?.['訂購數量']?.number??0,
          deadline:p.properties?.['交期']?.date?.start||'',
          status:p.properties?.['狀態']?.select?.name||'',
          note:p.properties?.['業務備註']?.rich_text?.[0]?.plain_text||'',
          created:p.created_time?.slice(0,10)||'',
        }));
        renderTab(CURRENT_TAB);
      }catch(e){ console.warn('bg refresh after delete:',e); }
    }, 2000);

  }catch(e){ showToast('❌ 刪除失敗：'+e.message,'err'); }
}

// 庫存修改記錄：寫入 Notion 📝 庫存修改記錄 資料庫
// ══════════════════════════════════════════════
async function _writeStockEditLog({matId, matName, matCode, changeType, before, after, delta, reason, operator}){
  try{
    const today = new Date();
    const yr = today.getFullYear().toString().slice(2);
    const mo = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    const hh = String(today.getHours()).padStart(2,'0');
    const mm = String(today.getMinutes()).padStart(2,'0');
    const recNo = `LOG-${yr}${mo}${dd}-${hh}${mm}-${Math.floor(Math.random()*90+10)}`;

    const props = {
      '記錄編號':  {title:[{text:{content:recNo}}]},
      '料件名稱':  {rich_text:[{text:{content:matName||''}}]},
      '料件編號':  {rich_text:[{text:{content:matCode||''}}]},
      '修改類型':  {select:{name:changeType||'其他修改'}},
      '修改前數值':{rich_text:[{text:{content:String(before??'')}}]},
      '修改後數值':{rich_text:[{text:{content:String(after??'')}}]},
      '修改原因':  {rich_text:[{text:{content:reason||''}}]},
      '修改人員':  {rich_text:[{text:{content:operator||ROLE||''}}]},
    };
    if(typeof delta === 'number' && !isNaN(delta)) props['變化量']={number:delta};
    if(matId) props['料件連結']={url:`https://www.notion.so/${matId.replace(/-/g,'')}`};

    await notionAPI('POST','pages',{parent:{database_id:DB.stockEditLog},properties:props});
    console.log('[庫存記錄] 已寫入:', recNo, changeType, reason);
  }catch(e){
    console.warn('[庫存記錄] 寫入失敗（不影響主功能）:', e);
  }
}

async function doEditMat(mid){
  const name=document.getElementById('em_name').value.trim();
  const code=document.getElementById('em_code').value.trim();
  const type=document.getElementById('em_type').value;
  const safe=parseInt(document.getElementById('em_safe').value)||0;
  const reason=(document.getElementById('em_reason')?.value||'').trim();
  if(!name){showToast('請填入料件名稱','warn');return;}
  // 原因驗證
  if(!reason || !/[\u4e00-\u9fa5a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫修改原因（需包含中文或英數字）','warn');
    document.getElementById('em_reason')?.focus();
    return;
  }
  const oldMat = mats.find(x=>x.id===mid);
  const oldName = oldMat?.name||'';
  const oldSafe = oldMat?.safe||0;
  closeModal();showToast('更新中...','warn');
  try{
    const props={
      '料件名稱':{title:[{text:{content:name}}]},
      '類型':{select:{name:type}},
      '安全庫存':{number:safe},
    };
    if(code!==undefined)props['料件編號']={rich_text:[{text:{content:code}}]};
    await updatePage(mid,props);
    // 判斷修改類型
    const changeType = name!==oldName ? '料件名稱修改' : safe!==oldSafe ? '安全庫存修改' : '其他修改';
    const before = name!==oldName ? oldName : String(oldSafe);
    const after  = name!==oldName ? name : String(safe);
    await _writeStockEditLog({
      matId:mid, matName:name, matCode:code,
      changeType, before, after, delta:0, reason, operator:ROLE,
    });
    await refreshAll();
    showToast('✅ 料件「'+name+'」已更新（原因已記錄）','ok');
  }catch(e){showToast('❌ 更新失敗：'+e.message,'err');}
}

async function doPick(orderId){
  const o=orders.find(x=>x.id===orderId);
  const prod=mats.find(m=>m.id===o.productId);
  const items=explodeBOM(o.productId,o.qty);
  const hasBOM = items.length > 0;
  const ds=new Date().toISOString().slice(0,10);
  const no=`PK-${ds.slice(2).replace(/-/g,'')}-${Math.floor(Math.random()*900+100)}`;
  closeModal();
  showToast('建立領料單中...','warn');
  try{
    // 1. 建立領料主單
    const master=await createPage(DB.pickMaster,{
      '領料主單號':{title:[{text:{content:no}}]},
      '對應訂單':{relation:[{id:orderId}]},

      '領料日期':{date:{start:ds}}
    });
    if(master.object==='error') throw new Error('領料主單建立失敗：'+master.message);

    let stockErrors=[];

    if(hasBOM){
      // ══ 有 BOM：展開子件逐項扣庫存 ══
      for(const item of items){
        try{
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:item.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:item.id}]},
            '類型':{select:{name:item.type}},
            '需求數量':{number:item.needed},
            '實領數量':{number:item.type==='半成品'?item.needed:Math.min(item.needed,item.stock)},
            '狀態':{select:{name:item.type==='半成品'?'半成品':item.stock>=item.needed?'足夠':'缺料'}}
          });
          // 只有零件才扣，半成品不扣（半成品本身的零件已在 BOM 展開時計算）
          if(item.type!=='半成品'){
            const latestMat=await notionAPI('GET','pages/'+item.id);
            const latestStock=latestMat?.properties?.['目前庫存']?.number??item.stock;
            const newStock=Math.max(0,latestStock-item.needed);
            await updatePage(item.id,{'目前庫存':{number:newStock}});
            await logStockChange(item.id,item.name,item.code||'','領料',-item.needed,latestStock,newStock,no,ROLE);
          }
        }catch(itemErr){
          stockErrors.push(item.name+': '+itemErr.message);
          console.error('領料明細錯誤',item.name,itemErr);
        }
      }
    } else {
      // ══ 無 BOM：直接扣成品本身庫存 ══
      if(!prod){
        stockErrors.push('訂單未關聯成品料件，無法扣庫存');
      } else {
        try{
          // 建立一筆領料明細（成品本身）
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:prod.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:prod.id}]},
            '類型':{select:{name:prod.type||'成品'}},
            '需求數量':{number:o.qty},
            '實領數量':{number:o.qty},
            '狀態':{select:{name:'足夠'}}
          });
          // 從 Notion 讀最新庫存再扣
          const latestProd=await notionAPI('GET','pages/'+prod.id);
          const latestStock=latestProd?.properties?.['目前庫存']?.number??prod.stock;
          const newStock=Math.max(0,latestStock-o.qty);
          await updatePage(prod.id,{'目前庫存':{number:newStock}});
          await logStockChange(prod.id,prod.name,prod.code||'','領料',-o.qty,latestStock,newStock,no,ROLE);
        }catch(prodErr){
          stockErrors.push(prod.name+': '+prodErr.message);
          console.error('成品直接扣料錯誤',prodErr);
        }
      }
    }

    // 3. 更新訂單狀態為「生產中」
    await updatePage(orderId,{'狀態':{select:{name:'生產中'}}});

    // 4. 重新整理資料
    await refreshAll();
    await loadPicks();

    const modeNote = hasBOM ? `（BOM展開 ${items.length} 項子件）` : '（直接扣成品庫存）';
    if(stockErrors.length){
      showToast(`⚠ 領料單 ${no} 建立，部分失敗：${stockErrors.join('、')}`,'warn');
    }else{
      showToast(`✅ 領料單 ${no} 建立完成 ${modeNote}`,'ok');
    }
  }catch(e){
    showToast('❌ 領料失敗：'+e.message,'err');
    console.error('doPick error:',e);
  }
}

async function syncInboundStock(id, matId, qty){
  if(!matId){ showToast('此入料單未關聯料件，無法同步庫存','warn'); return; }
  // 先確認入料單目前狀態
  const inbound = inbounds.find(i=>i.id===id);
  if(!inbound){ showToast('找不到此入料單','warn'); return; }

  if(inbound.qcStatus!=='品檢通過'){
    showToast('⚠ 品管狀態尚未通過，無法同步庫存','warn'); return;
  }

  const mat = mats.find(m=>m.id===matId);
  if(!mat){ showToast('找不到對應料件','warn'); return; }

  const newStock = (mat.stock||0) + parseInt(qty);
  if(!confirm(`確認同步庫存？
料件：${mat.name}
目前庫存：${mat.stock}
入料數量：${qty}
同步後：${newStock}`)) return;

  showToast('同步中...','warn');
  try{
    await updatePage(matId, {'目前庫存':{number: newStock}});
    // 確保入庫狀態也是已入庫
    await updatePage(id, {'入庫狀態':{select:{name:'已入庫'}}});
    await refreshAll();
    showToast(`✅ ${mat.name} 庫存已同步：${mat.stock} → ${newStock}`,'ok');
  }catch(e){ showToast('❌ 同步失敗：'+e.message,'err'); }
}

// ══ 庫存異動記錄（每次入料/領料/手動調整都呼叫）══
async function logStockChange(matId, matName, matCode, changeType, qty, beforeStock, afterStock, refNo, operator){
  // ★ 非同步加入佇列，不阻塞主流程
  _logQueue.push({matId,matName,matCode,changeType,qty,beforeStock,afterStock,refNo,operator,
    operator2:operator||ROLE||''});
  if(!_logFlushing) _flushLogQueue();
}

// 佇列逐一寫入（避免同時大量 API 請求）
const _logQueue = [];
let _logFlushing = false;
async function _flushLogQueue(){
  if(_logFlushing||!_logQueue.length) return;
  _logFlushing=true;
  while(_logQueue.length){
    const item=_logQueue.shift();
    try{
      const today=new Date().toISOString().slice(0,10);
      await notionAPI('POST','pages',{parent:{database_id:DB.stockLog},properties:{
        '異動項目':{title:[{text:{content:today+' '+item.changeType+' '+item.matName}}]},
        '料件名稱':{rich_text:[{text:{content:item.matName||''}}]},
        '料件編號':{rich_text:[{text:{content:item.matCode||''}}]},
        '異動類型':{select:{name:item.changeType}},
        '異動數量':{number:Math.abs(item.qty)},
        '異動前庫存':{number:item.beforeStock},
        '異動後庫存':{number:item.afterStock},
        '異動日期':{date:{start:today}},
        '關聯單號':{rich_text:[{text:{content:item.refNo||''}}]},
        '操作人員':{rich_text:[{text:{content:item.operator2||''}}]},
      }});
    }catch(e){ console.warn('庫存異動記錄失敗：',e.message); }
  }
  _logFlushing=false;
}

      '實檢數量':   {number:parseInt(qty)||0},
      '不良數量':   {number:0},

    };

    await notionAPI('POST','pages',{parent:{database_id:DB.qcInspection}, properties:insProps});

    // 2. 更新入料單品管狀態
    await updatePage(id,{'品管狀態':{select:{name:'品檢通過'}},'入庫狀態':{select:{name:'已入庫'}}});
    // 3. 重新從 Notion 讀最新庫存
    const matData=await notionAPI('GET','pages/'+matId);
    const curStock=matData?.properties?.['目前庫存']?.number??0;
    const newStock=curStock+parseInt(qty);
    // 4. 更新庫存
    await updatePage(matId,{'目前庫存':{number:newStock}});
    // 5. 庫存異動記錄
    const mat2=mats.find(m=>m.id===matId);
    await logStockChange(matId,mat2?.name||matId,mat2?.code||'','入料',parseInt(qty),curStock,newStock,id,ROLE);

  }catch(e){

  }

let _mc=null;
function matchCustomer(v){
  if(!v)return null;const q=v.toLowerCase().trim();
  return customers.find(c=>c.code&&c.code.toLowerCase()===q)||
         customers.find(c=>c.code&&c.code.toLowerCase().startsWith(q))||
         (q.length>=4?customers.find(c=>c.code&&c.code.toLowerCase().includes(q)):null)||null;
}
function onCustCodeInput(v){

  }

  const q=v.toLowerCase();

  const matches=customers.filter(c=>
    (c.code&&c.code.toLowerCase().includes(q))||

  ).slice(0,8);

          <span style="margin-left:8px;color:var(--text)">${c.name}</span>
        </div>`).join('');
    }
    if(matchEl)matchEl.style.display='none';
    if(newRow)newRow.style.display='none';
    _mc=null;
  }else if(v.length>=2){

    if(suggest)suggest.style.display='none';
  }

async function fetchPIFromNotion(){
  if(!_mc)return;
  const btn=document.getElementById('fetchPIBtn');const list=document.getElementById('piNotionList');
  btn.textContent='搜尋中...';btn.disabled=true;list.style.display='';
  list.innerHTML=`<div style="padding:8px;font-size:0.6875rem;color:var(--text2)"><div class="spin" style="margin-right:6px"></div>搜尋 ${_mc.code}...</div>`;
  try{
    const r=await notionSearch(_mc.code);const pages=(r.results||[]).filter(p=>p.object==='page');
    const orderPages=pages.filter(p=>{
      const t=p.properties?.title?.title?.[0]?.plain_text||p.properties?.Name?.title?.[0]?.plain_text||'';
      return t&&t.toUpperCase().startsWith(_mc.code.toUpperCase())&&t.includes('-');
    }).sort((a,b)=>{const ta=a.properties?.title?.title?.[0]?.plain_text||'';const tb=b.properties?.title?.title?.[0]?.plain_text||'';return tb.localeCompare(ta);});
    if(!orderPages.length){
      list.innerHTML=`<div style="font-size:0.6875rem;color:var(--yellow);padding:8px">⚠ 找不到訂單頁面，請直接上傳 Excel。</div>`;
    }else{
      list.innerHTML=`<div style="font-size:0.6875rem;color:var(--text2);margin-bottom:6px">找到 ${orderPages.length} 筆訂單：</div>`+
      orderPages.map((p,i)=>{const t=p.properties?.title?.title?.[0]?.plain_text||p.properties?.Name?.title?.[0]?.plain_text||'';
        return`<div class="pi-item" id="pii_${i}" onclick="selectAndLoadPI('${p.id}','${t.replace(/'/g,"\\'")}',${i})">
          <span>📄</span><div style="flex:1"><div style="font-size:0.75rem;font-weight:700;color:var(--text)">${t}</div><div class="pi-status" style="font-size:0.625rem;color:var(--text3)">點擊 → 讀取品項與數量</div></div>
        </div>`;}).join('');
    }
  }catch(e){list.innerHTML=`<div style="font-size:0.6875rem;color:var(--red);padding:8px">❌ 失敗：${e.message}</div>`;}
  btn.textContent='📂 抓 Notion PI';btn.disabled=false;
}

async function selectAndLoadPI(pageId,title,idx){
  document.querySelectorAll('.pi-item').forEach(e=>e.classList.remove('selected'));
  const el=document.getElementById('pii_'+idx);if(el)el.classList.add('selected');
  const setStatus=msg=>{const d=el?.querySelector('.pi-status');if(d)d.textContent=msg;};
  setStatus('⏳ 讀取中...');
  try{
    const blocks=await getBlockChildren(pageId);const all=blocks.results||[];
    let fileUrl='',pdfUrl='';
    for(const b of all){
      if(b.type!=='file')continue;
      const fd=b.file||{};const name=(fd.name||'').toLowerCase();const url=fd.file?.url||fd.external?.url||'';if(!url)continue;
      if((name.endsWith('.xlsx')||name.endsWith('.xls'))&&!fileUrl)fileUrl=url;
      if(name.endsWith('.pdf')&&!pdfUrl)pdfUrl=url;
    }
    if(!fileUrl){
      for(const b of all){if(b.type!=='child_page')continue;const t=(b.child_page?.title||'').toLowerCase();if(t.endsWith('.xlsx')||t.endsWith('.xls')){try{const bd=await getBlock(b.id);const bfd=bd[bd.type]||{};const u=bfd.file?.url||bfd.external?.url||'';if(u){fileUrl=u;break;}}catch{}}}
    }
    if(!fileUrl&&pdfUrl){
      setStatus('📄 只有 PDF');const el2=document.getElementById('piInfo');
      if(el2)el2.innerHTML=`<span style="color:var(--yellow)">⚠ 只有 PDF 附件，無法自動解析。<a href="${pdfUrl}" target="_blank" style="color:var(--blue)">開啟 PDF</a>，請手動填入。</span>`;
      showToast('只有 PDF，請手動填入','warn');return;
    }
    if(!fileUrl){setStatus('❌ 找不到 Excel');showToast('找不到 Excel，請直接上傳','warn');return;}
    setStatus('⏳ 下載中...');
    const buf=await downloadViaProxy(fileUrl);
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    const orderNo=title.replace(/\s*\(.*?\)\s*/g,'').trim();
    const items=parsePIRows(rows,orderNo);
    setStatus(`✅ 讀取 ${items.length} 個品項`);
    showToast(`✅ PI「${title}」讀取成功`,'ok');
  }catch(e){setStatus(`❌ ${e.message.slice(0,40)}`);showToast('讀取失敗，請直接上傳','err');}
}

async function submitMultiOrders(){
  const cust=document.getElementById('m_cust')?.value;
  const date=document.getElementById('m_date')?.value;
  if(!cust){alert('請選擇客戶');return;}
  if(!date){alert('請填入交期');return;}

  // 從 data attribute 還原品項資料（避免 onclick 引號問題）
  const div=document.getElementById('piMultiList');
  if(!div||!div.dataset.items){alert('品項資料遺失，請重新讀取 PI');return;}
  let items;
  try{items=JSON.parse(decodeURIComponent(atob(div.dataset.items)));}
  catch(e){alert('品項資料解析失敗：'+e.message);return;}
  const piNo=div.dataset.pino||'';

  const selected=[];
  for(let i=0;i<items.length;i++){
    const chk=document.getElementById('chk_'+i);const qtyEl=document.getElementById('qty_'+i);
    if(chk?.checked&&qtyEl)selected.push({model:items[i].model,qty:parseInt(qtyEl.value)||items[i].qty});
  }
  if(!selected.length){alert('請至少勾選一個品項');return;}

  // 顯示進度（不 closeModal）
  const batchBtn=document.getElementById('batchBtn');
  if(batchBtn){batchBtn.disabled=true;batchBtn.textContent='建立中，請勿關閉...';}
  div.insertAdjacentHTML('afterend',`<div id="batchProgress" style="background:var(--bg3);border-radius:8px;padding:10px;margin-top:8px;font-size:0.75rem;color:var(--cyan)"><div class="spin" style="margin-right:6px"></div>正在建立 ${selected.length} 筆訂單...</div>`);

  const prefix=`ORD-${new Date().toISOString().slice(2,7).replace('-','')}`;
  let ok=0,fail=0,failList=[];

  for(let i=0;i<selected.length;i++){
    const item=selected[i];
    const prog=document.getElementById('batchProgress');
    if(prog)prog.innerHTML=`<div class="spin" style="margin-right:6px"></div>建立第 ${i+1}/${selected.length} 筆：${item.model}...`;
    try{
      let prodId='';
      const ex=mats.find(m=>m.name===item.model||m.code===item.model);
      if(ex){prodId=ex.id;}
      else{
        const nm=await createPage(DB.materials,{'料件名稱':{title:[{text:{content:item.model}}]},'類型':{select:{name:'成品'}},'目前庫存':{number:1000},'安全庫存':{number:0}});
        prodId=nm.id;
      }
      const no=`${prefix}-${String(i+1).padStart(3,'0')}`;
      await createPage(DB.orders,{
        '訂單號':{title:[{text:{content:no}}]},
        '客戶名稱':{select:{name:cust}},
        '成品':{relation:[{id:prodId}]},
        '訂購數量':{number:item.qty},
        '交期':{date:{start:date}},
        '狀態':{select:{name:'待排程'}},
        '訂單類型':{select:{name:orderType}},
        '業務備註':{rich_text:[{text:{content:note||(piNo?'PI: '+piNo:'')}}]},
        ...(piNo?{'PI單號':{rich_text:[{text:{content:piNo}}]}}:{}),
        ...(shipMethod?{'出貨方式':{select:{name:shipMethod}}}:{}),
        ...(packageType?{'包裝方式':{select:{name:packageType}}}:{}),
        ...(deliverAddr?{'送貨地':{rich_text:[{text:{content:deliverAddr}}]}}:{}),
      });
      ok++;
    }catch(e){fail++;failList.push(item.model);console.error(item.model,e);}
  }

  await refreshAll();

  const prog=document.getElementById('batchProgress');
  if(prog)prog.innerHTML=`<span style="color:${ok===selected.length?'var(--green)':'var(--yellow)'}">
    ✅ 成功 ${ok} 筆${fail?`，失敗 ${fail} 筆（${failList.join('、')}）`:''}
  </span>
  <br><button class="btn btn-ghost btn-sm" onclick="closeModal()" style="margin-top:8px">關閉</button>`;

  showToast(`${ok===selected.length?'✅':'⚠'} 建立 ${ok}/${selected.length} 筆訂單`,ok===selected.length?'ok':'warn');
}

function parsePIFile(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});parsePIRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null}),file.name.replace(/\.xlsx?$/i,''));}catch(err){const el=document.getElementById('piInfo');if(el)el.textContent='❌ 解析失敗：'+err.message;}};
  r.readAsArrayBuffer(file);
}

function openStatusModal(id, cur){
  const statuses=['待排程','生產中','待檢驗','待品檢','待出貨','已完成','取消','品檢異常'];
  document.getElementById('modalInner').innerHTML=`<h3>📋 更新訂單狀態</h3>

    ${statuses.map(s=>`<button class="btn ${s===cur?'btn-blue':'btn-ghost'}"
      onclick="doUpdateStatus('${id}','${s}')"
      style="justify-content:flex-start;font-size:0.8125rem">${pill(s)}&nbsp;&nbsp;${s}</button>`).join('')}
  </div>
  <div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button></div>`;
  openModal();
}
async function doUpdateStatus(id, s){
  closeModal();
  const o=orders.find(x=>x.id===id);
  if(o){o.status=s;renderTab(CURRENT_TAB);}
  showToast('更新狀態中...','warn');
  try{
    await updatePage(id,{'狀態':{select:{name:s}}});
    showToast('✅ 狀態→「'+s+'」','ok');
    setTimeout(()=>refreshAll().catch(()=>{}),1000);
  }catch(e){
    if(o) renderTab(CURRENT_TAB);
    showToast('❌ 更新失敗：'+e.message,'err');
  }
}

function openEditStock(id, name, cur){
  document.getElementById('modalInner').innerHTML=`<h3>✏️ 修改庫存 — ${name}</h3>
  <div style="font-size:0.8125rem;color:var(--text2);margin-bottom:10px">目前：<b style="color:var(--text);font-size:1.25rem">${cur}</b> 個</div>
  <div style="margin-bottom:10px">
    <label style="font-size:0.625rem;color:var(--text2);display:block;margin-bottom:4px">修改後數量</label>
    <input class="inp" type="number" id="newStock" value="${cur}" min="0">
  </div>
  <div style="margin-bottom:12px">
    <label style="font-size:0.625rem;color:var(--red);display:block;margin-bottom:4px">✳ 修改原因（必填）</label>
    <input class="inp" id="editStockReason" placeholder="請填寫修改原因，不可空白或只有特殊符號" style="border-color:rgba(239,68,68,.3)">
    <div style="font-size:0.625rem;color:var(--text3);margin-top:4px">⚠ 修改後自動寫入庫存修改記錄，留存備查</div>
  </div>
  <div class="form-actions">
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-blue" onclick="doEditStock('${id}','${name}',${cur})">💾 確認修改</button>
  </div>`;
  openModal();
}
async function doEditStock(id, name, oldStock){
  const newVal = parseInt(document.getElementById('newStock').value);
  const reason = (document.getElementById('editStockReason')?.value||'').trim();
  if(isNaN(newVal)||newVal<0){showToast('請輸入有效數字','warn');return;}
  // 原因驗證：不可空白、不可只有特殊符號
  if(!reason || !/[\u4e00-\u9fa5a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫修改原因（需包含中文或英數字）','warn');
    document.getElementById('editStockReason')?.focus();
    return;
  }
  closeModal();showToast('更新庫存中...','warn');
  try{
    await updatePage(id,{'目前庫存':{number:newVal}});
    await logStockChange(id,name,'','手動調整',newVal-oldStock,oldStock,newVal,'手動',ROLE);
    // 寫入庫存修改記錄
    await _writeStockEditLog({
      matId:id, matName:name, matCode:'',
      changeType:'庫存數量修改',
      before:String(oldStock), after:String(newVal),
      delta:newVal-oldStock, reason, operator:ROLE,
    });
    await refreshAll();
    showToast(`✅ ${name} 庫存 ${oldStock} → ${newVal}（原因已記錄）`,'ok');
  }catch(e){showToast('❌ 失敗：'+e.message,'err');}
}

      <div class="ann-accent ${a.pinned?'pinned':''}"></div>

            ${a.pinned?'<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:0.625rem;font-weight:700;background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)">📌 置頂</span>':''}

          <div class="ann-title" style="margin-bottom:0">${a.title}</div>
        </div>
        ${canEdit?`<div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-ghost btn-xs" onclick="openEditAnnounce('${a.id}')" title="編輯">✏️</button>
          <button class="btn btn-xs ${isDraft?'btn-green':'btn-yellow'}" onclick="toggleAnnStatus('${a.id}','${a.status}')">${isDraft?'發佈':'收回'}</button>

  const header=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <div style="font-size:1.125rem;font-weight:700;color:var(--text);margin-bottom:2px">📢 公告</div>
      <div style="font-size:0.75rem;color:var(--text3)">共 ${all.length} 則公告${pinned.length?`，${pinned.length} 則置頂`:''}</div>

  if(!all.length) return _notionBar+header+`<div class="panel"><div style="padding:40px;text-align:center;color:var(--text3)">目前沒有公告</div></div>`;

  let content='';

    content+=`<div style="margin-bottom:20px">

async function submitAnnounce(id){
  const title=document.getElementById('ann_title').value.trim();
  const body=document.getElementById('ann_body').value;
  const date=document.getElementById('ann_date').value;
  const status=document.getElementById('ann_status').value;

  const pinned=document.getElementById('ann_pin').checked;
  if(!title){showToast('請填入標題','warn');return;}
  closeModal();showToast('儲存中...','warn');
  const props={
    '標題':{title:[{text:{content:title}}]},
    '內容':{rich_text:[{text:{content:body}}]},
    '狀態':{select:{name:status}},
    '顯示順序':{number:order},
    '置頂':{checkbox:pinned},
  };
  if(date)props['發佈日期']={date:{start:date}};
  try{
    if(id){await updatePage(id,props);}
    else{await createPage('e2950944-dbe2-43f6-afd5-ca0ff2980f86',props);}
    await refreshAll();showToast('✅ 公告已儲存','ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}
async function toggleAnnStatus(id, cur){

    await updatePage(id,{'狀態':{select:{name:ns}}});
    showToast('✅ 已改為「'+ns+'」','ok');
    setTimeout(()=>refreshAll().catch(()=>{}),1000);
  }catch(e){if(a){a.status=cur;renderTab('announce');}showToast('❌ '+e.message,'err');}
}

function renderLeave(){

  const LSUB = window._LEAVE_SUB;
  const LDATE = window._LEAVE_DATE;

  const _notionBar=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:5px 10px;background:rgba(255,255,255,.03);border-radius:7px;border:1px solid var(--border)">

    <a href="https://www.notion.so/55e54d964c0848a5b3b77ede813abe15" target="_blank" style="padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">👤 員工統計</a>
  </div>`;

  const canApprove = ROLE==='manager';

  const now = Date.now();
  const dateOpts=[['0','全部'],['30','近30天'],['90','近3個月'],['365','今年']];
  function _leaveFilter(list){
    if(LDATE==='0') return list;
    const days = parseInt(LDATE);
    const cutoff = now - days*86400000;
    return list.filter(l=>{const t=new Date(l.dateFrom||'').getTime();return t&&t>=cutoff;});

async function doApproveLeave(id, action){
  const status=action==='approved'?'核准':'不通過';
  let reason='';
  if(action==='rejected'){
    reason=prompt('請填入不通過原因（必填）：')||'';
    if(!reason){showToast('請填入不通過原因','warn');return;}
  }
  showToast('處理中...','warn');
  const props={
    '審核狀態':{select:{name:status}},
    '審核人':{rich_text:[{text:{content:ROLE}}]},
  };
  if(reason)props['不通過原因']={rich_text:[{text:{content:reason}}]};
  try{
    await updatePage(id,props);

    // ── 核准時自動更新員工統計 ──
    if(action==='approved'){
      const lv = leaves.find(x=>x.id===id);
      if(lv){
        const year = new Date().getFullYear().toString();
        await _updateLeaveStats(lv.name, lv.type, lv.days, year);
      }
    }

    await refreshAll(); renderTab(CURRENT_TAB);
    showToast(`✅ 已${status}`,'ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

// ── 核准請假後更新員工統計資料庫 ──
async function _updateLeaveStats(empName, leaveType, days, year){
  try{
    // 查詢員工統計記錄
    const r = await notionAPI('POST','databases/'+DB.leaveStats+'/query',{
      filter:{and:[
        {property:'員工姓名',title:{equals:empName}},
        {property:'年度',select:{equals:year}},
      ]},page_size:1
    });

    const dayNum = parseFloat(days)||1;
    const isAnnual = leaveType==='特休';
    const isPersonal = leaveType==='事假';
    const isSick = leaveType==='病假';

    if(r?.results?.length){
      // 已有記錄 → 更新累計
      const pg = r.results[0];
      const cur = pg.properties;
      const curTotal = cur['請假總天數']?.number||0;
      const curTimes = cur['請假總次數']?.number||0;
      const curAnnual = cur['已請特休']?.number||0;
      const curPersonal = cur['已請事假']?.number||0;
      const curSick = cur['已請病假']?.number||0;
      const curRemain = cur['特休剩餘天數']?.number??14;

      const updateProps={
        '請假總天數':{number:curTotal+dayNum},
        '請假總次數':{number:curTimes+1},
      };
      if(isAnnual){
        updateProps['已請特休']={number:curAnnual+dayNum};
        updateProps['特休剩餘天數']={number:Math.max(0,curRemain-dayNum)};
      }
      if(isPersonal) updateProps['已請事假']={number:curPersonal+dayNum};
      if(isSick) updateProps['已請病假']={number:curSick+dayNum};
      await updatePage(pg.id, updateProps);
      console.log('[請假統計] 更新', empName, year);
    } else {
      // 首次 → 詢問特休天數並建立
      let annualDays = 14;
      if(isAnnual){
        const input = prompt(`首次建立 ${empName} 的請假統計。\n請輸入 ${empName} 的年度特休總天數：`);
        if(input) annualDays = parseInt(input)||14;
      }
      const remain = isAnnual ? Math.max(0, annualDays-dayNum) : annualDays;
      await notionAPI('POST','pages',{parent:{database_id:DB.leaveStats}, properties:{
        '員工姓名':{title:[{text:{content:empName}}]},
        '年度':{select:{name:year}},
        '特休總天數':{number:annualDays},
        '特休剩餘天數':{number:remain},
        '已請特休':{number:isAnnual?dayNum:0},
        '已請事假':{number:isPersonal?dayNum:0},
        '已請病假':{number:isSick?dayNum:0},
        '請假總次數':{number:1},
        '請假總天數':{number:dayNum},
      }});
      console.log('[請假統計] 首次建立', empName, year);
      showToast(`✅ 已為 ${empName} 建立 ${year} 年請假統計記錄`,'ok');
    }
    // 重新載入統計
    await loadLeaveStats();
  }catch(e){ console.warn('[請假統計] 更新失敗:', e); }
}

function parsePIRows(rows, piNo){
  const items=[];
  for(const row of rows){
    if(!row)continue;
    const cells=row.filter(c=>c!=null).map(c=>String(c).trim());
    const modelCell=cells.find(c=>/^[A-Z]{2,}[-_]/.test(c)||/^LE-|^Z-|^SKC|^DAR|^ZN/.test(c));
    if(!modelCell)continue;
    const qtyCell=cells.find(c=>/^\d+$/.test(c)&&parseInt(c)>0&&c!==modelCell);
    const qty=qtyCell?parseInt(qtyCell):1;
    const desc=cells.filter(c=>c!==modelCell&&c!==qtyCell).join(' ').substring(0,50);
    items.push({model:modelCell,qty,desc,piNo});
  }
  if(items.length){
    _items=[...items];
    renderItems();
    const piInfo=document.getElementById('piMsg');
    if(piInfo)piInfo.innerHTML=`<span style="color:var(--green)">✅ 讀取 ${items.length} 個品項</span>`;
    showMultiItems(items, piNo);
  }
  return items;
}

function initDomesticList(filter){
  const list = document.getElementById('domCustList');
  if(!list) return;
  const q = (filter||'').trim();
  const ql = q.toLowerCase();
  const dynNames = customers.filter(c=>c.type==='domestic'&&c.name).map(c=>c.name);
  const allNames = [...new Set([...DOMESTIC_NAMES, ...dynNames])].sort((a,b)=>a.localeCompare(b,'zh'));
  const filtered = ql ? allNames.filter(n=>n.toLowerCase().includes(ql)) : allNames;
  const exactMatch = allNames.some(n=>n.toLowerCase()===ql);

  const rows = filtered.slice(0,15).map(n=>{
    const div = document.createElement('div');
    div.className = '_domCustItem';
    div.dataset.name = n;
    div.textContent = n;
    div.style.cssText = 'padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.8125rem;color:var(--text)';
    div.onmouseenter = ()=>{ div.style.background='rgba(59,130,246,.1)'; };
    div.onmouseleave = ()=>{ div.style.background=''; };
    div.onclick = ()=>{ selectDomCust(n); };
    return div;
  });

  list.innerHTML = '';
  rows.forEach(r=>list.appendChild(r));

  if(q && !exactMatch){
    const addDiv = document.createElement('div');
    addDiv.textContent = '＋ 手動新增「'+q+'」';
    addDiv.style.cssText = 'padding:9px 14px;cursor:pointer;border-top:1px solid var(--border2);font-size:0.75rem;color:var(--amber,#f59e0b)';
    addDiv.onmouseenter = ()=>{ addDiv.style.background='rgba(245,158,11,.1)'; };
    addDiv.onmouseleave = ()=>{ addDiv.style.background=''; };
    addDiv.onclick = ()=>{ useDomNewCust(q); };
    list.appendChild(addDiv);
  }

  if(!filtered.length && !exactMatch){
    const empty = document.createElement('div');
    empty.textContent = ql ? '找不到符合的客戶' : '請輸入關鍵字搜尋';
    empty.style.cssText = 'padding:10px 14px;color:var(--text3);font-size:0.75rem';
    list.appendChild(empty);
  }
}

function showToast(msg, type='ok'){
  let el = document.getElementById('_toast');
  if(!el){
    el = document.createElement('div');
    el.id='_toast';
    el.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 16px;border-radius:10px;font-size:0.8125rem;font-weight:600;max-width:300px;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)';
    document.body.appendChild(el);
  }
  const colors = {
    ok:   {bg:'rgba(16,185,129,.15)',border:'rgba(16,185,129,.4)',text:'var(--green)'},
    warn: {bg:'rgba(245,158,11,.12)',border:'rgba(245,158,11,.35)',text:'var(--yellow)'},
    err:  {bg:'rgba(239,68,68,.12)', border:'rgba(239,68,68,.35)', text:'var(--red)'},
  };
  const c = colors[type]||colors.ok;

  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(el._t);

}

// ══ 線上人數（同一瀏覽器多分頁偵測）══
const ONLINE_KEY='lm_online';
const ONLINE_TTL=15000;
let _onlineChannel=null;
let _onlineTimer=null;
const _myTabId='tab_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);

function initOnlineTracking(){
  try{
    // BroadcastChannel 偵測同一瀏覽器的其他 tab
    _onlineChannel=new BroadcastChannel('lematec_online');
    _onlineChannel.onmessage=e=>{
      if(e.data?.type==='ping'||e.data?.type==='pong'){
        _updateOnlineUI();
      }
    };
    // 每12秒發心跳
    function heartbeat(){
      try{
        // 存入 localStorage
        const now=Date.now();
        const tabs=JSON.parse(localStorage.getItem(ONLINE_KEY)||'{}');
        tabs[_myTabId]=now;
        // 清除過期
        Object.keys(tabs).forEach(k=>{ if(now-tabs[k]>ONLINE_TTL) delete tabs[k]; });
        localStorage.setItem(ONLINE_KEY,JSON.stringify(tabs));
        _onlineChannel.postMessage({type:'ping',id:_myTabId});
        _updateOnlineUI();
      }catch(e){}
    }
    heartbeat();
    _onlineTimer=setInterval(heartbeat,12000);
    window.addEventListener('beforeunload',()=>{
      try{
        const tabs=JSON.parse(localStorage.getItem(ONLINE_KEY)||'{}');
        delete tabs[_myTabId];
        localStorage.setItem(ONLINE_KEY,JSON.stringify(tabs));
      }catch(e){}
    });
  }catch(e){
    console.log('Online tracking not supported');
  }
}

function _updateOnlineUI(){
  try{
    const now=Date.now();
    const tabs=JSON.parse(localStorage.getItem(ONLINE_KEY)||'{}');
    const count=Object.values(tabs).filter(t=>now-t<ONLINE_TTL).length;
    const el=document.getElementById('onlineCount');
    const numEl=document.getElementById('onlineNum');
    if(el){
      if(count>1){el.style.display='inline-flex';if(numEl)numEl.textContent=count;}
      else{el.style.display='none';}
    }
  }catch(e){}
}

// QR Code 掃描（jsQR 純 JS，支援所有手機瀏覽器）
// ═══════════════════════════════════════════════════════

let _qrStream = null;
let _qrAnimFrame = null;

async function openQRScanner(){
  const mi = document.getElementById('modalInner');
  mi.innerHTML = `
    <h3>📷 掃描料件 QR Code</h3>
    <p style="font-size:0.75rem;color:var(--text2);margin-bottom:10px">對準料件上的 QR Code，自動辨識後填入搜尋框</p>
    <div style="position:relative;width:100%;max-width:320px;margin:0 auto">
      <video id="qr_video" style="width:100%;border-radius:10px;background:#000" autoplay playsinline muted></video>
      <canvas id="qr_canvas" style="display:none"></canvas>
      <div id="qr_overlay" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border:2px solid rgba(77,142,245,.8);border-radius:12px;box-shadow:0 0 0 3000px rgba(0,0,0,.3);pointer-events:none"></div>
    </div>
    <div id="qr_status" style="text-align:center;margin-top:10px;font-size:0.75rem;color:var(--text2)">⏳ 啟動鏡頭中...</div>
    <div class="form-actions" style="margin-top:12px">
      <button class="btn btn-ghost" onclick="closeQRScanner()">取消</button>
    </div>`;
  document.getElementById('modalBg').classList.add('open');

  // 動態載入 jsQR（CDN）
  if(!window.jsQR){
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('jsQR 載入失敗'));
      document.head.appendChild(s);
    }).catch(e => {
      document.getElementById('qr_status').textContent = '❌ 無法載入掃描器：'+e.message;
      return;
    });
  }

  try{
    _qrStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
    const video = document.getElementById('qr_video');
    if(!video){ closeQRScanner(); return; }
    video.srcObject = _qrStream;
    await new Promise(r => video.onloadedmetadata = r);
    video.play();
    document.getElementById('qr_status').textContent = '🔍 對準 QR Code 框內掃描...';

    const canvas = document.getElementById('qr_canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});

    const scan = () => {
      if(!_qrStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts:'dontInvert'
        });
        if(code && code.data){
          const result = code.data.trim();
          if(result){
            // 先停止掃描，再重開入料 modal 並填入
            if(_qrAnimFrame){ cancelAnimationFrame(_qrAnimFrame); _qrAnimFrame=null; }
            if(_qrStream){ _qrStream.getTracks().forEach(t=>t.stop()); _qrStream=null; }
            // 重新開啟入料 modal（恢復原本的 modal 內容）
            closeModal();
            // 延遲一點再填入，確保 modal 已關閉並重新開啟
            setTimeout(()=>{
              openModal('newInbound', null);
              setTimeout(()=>{
                const searchEl = document.getElementById('eib_search');
                if(searchEl){
                  searchEl.value = result;
                  eibUpdateSelect();
                  searchEl.focus();
                }
                showToast('✅ 掃描成功：'+result,'ok');
              }, 200);
            }, 50);
            return;
          }
        }
      }
      _qrAnimFrame = requestAnimationFrame(scan);
    };
    _qrAnimFrame = requestAnimationFrame(scan);

  }catch(e){
    const statusEl = document.getElementById('qr_status');
    if(statusEl) statusEl.textContent = '❌ 無法啟動鏡頭：'+e.message;
    showToast('❌ 無法啟動鏡頭：'+e.message,'err');
  }
}

function closeQRScanner(){
  if(_qrAnimFrame){ cancelAnimationFrame(_qrAnimFrame); _qrAnimFrame=null; }
  if(_qrStream){ _qrStream.getTracks().forEach(t=>t.stop()); _qrStream=null; }
  closeModal();
}

  return _notionBar + `<div class="panel">

async function saveEditCorder(id){
  const buyer    = document.getElementById('ec_buyer')?.value||'';
  const matName  = (document.getElementById('ec_mat')?.value||'').trim();
  const qty      = parseInt(document.getElementById('ec_qty')?.value)||1;
  const status   = document.getElementById('ec_status')?.value||'出貨中';
  const shipMethod = document.getElementById('ec_ship')?.value||'';
  const shipDate = document.getElementById('ec_date')?.value||'';
  const note     = document.getElementById('ec_note')?.value||'';

  const o = corders.find(x=>x.id===id);
  const oldMatName = o?.matName||'';
  const oldMatId   = o?.matId||'';

  closeModal();

  // ── 若品名有修改，嘗試比對料件主檔並扣庫存 ──
  let newMatId = oldMatId;
  if(matName && matName !== oldMatName){
    // 在料件主檔尋找對應的料件
    const mat = mats.find(m=>
      m.name===matName || m.code===matName ||
      (m.name&&m.name.toLowerCase()===matName.toLowerCase())
    );

    if(mat){
      // 找到對應料件 → 扣庫存
      try{
        const matData = await notionAPI('GET','pages/'+mat.id);
        const curStock = matData?.properties?.['目前庫存']?.number??0;
        const newStock = curStock - qty;
        await updatePage(mat.id,{'目前庫存':{number:newStock}});
        await logStockChange(mat.id,mat.name,mat.code||'','C端出貨',-qty,curStock,newStock,id,ROLE);
        mat.stock = newStock;
        newMatId = mat.id;
        showToast('✅ 已找到料件「'+mat.name+'」並扣除 '+qty+' 個庫存','ok');

        // 若舊料件 ID 存在且不同，代表先前是自動建立的無效料件 → 標記刪除
        if(oldMatId && oldMatId !== mat.id){
          const oldMat = mats.find(m=>m.id===oldMatId);
          if(oldMat){
            try{
              await updatePage(oldMatId,{
                '料件名稱':{title:[{text:{content:'【已刪除-無效料件】'+oldMat.name}}]},
                '目前庫存':{number:0},
              });
              // 從本地快取移除
              const idx = mats.findIndex(m=>m.id===oldMatId);
              if(idx>=0) mats.splice(idx,1);
              showToast('🗑 舊料件「'+oldMat.name+'」已標記刪除','ok');
            }catch(e2){ console.warn('清除舊料件失敗:', e2); }
          }
        }
      }catch(e){ showToast('⚠ 找到料件但扣庫存失敗：'+e.message,'warn'); }
    } else {
      // 找不到對應料件，只更新品名文字
      showToast('⚠ 找不到料件「'+matName+'」，品名已更新但庫存未扣除','warn');
    }
  }

  try{
    const props = {
      '買家帳號': {rich_text:[{text:{content:buyer}}]},
      '品名':     {rich_text:[{text:{content:matName}}]},
      '數量':     {number:qty},
      '出貨方式': {rich_text:[{text:{content:shipMethod}}]},
      '狀態':     {select:{name:status}},
      '備註':     {rich_text:[{text:{content:note}}]},
      '料件ID':   {rich_text:[{text:{content:newMatId}}]},
    };
    if(shipDate) props['出日']={date:{start:shipDate}};
    await updatePage(id, props);
    // 更新本地快取
    if(o){ o.buyer=buyer; o.matName=matName; o.qty=qty; o.status=status;
           o.shipMethod=shipMethod; o.shipDate=shipDate; o.note=note; o.matId=newMatId; }
    renderTab(CURRENT_TAB);
    showToast('✅ 訂單已更新','ok');
  }catch(e){ showToast('❌ 更新失敗：'+e.message,'err'); }
}

// ── 刪除訂單（廠長限定）──
async function deleteCorder(id, matId, qty, status){
  if(!confirm('確定要刪除這筆訂單？\n此操作會同步刪除 Notion 資料（含 115蝦皮記錄），無法復原。')) return;

  // 若訂單狀態是「出貨中」，詢問是否回料
  let doReturn = false;
  if(status==='出貨中' && matId){
    doReturn = confirm('訂單狀態為「出貨中」，是否回料？\n確定 = 回料（庫存增加 '+qty+' 個）\n取消 = 直接刪除不回料');
  }

  const o = corders.find(x=>x.id===id);
  const orderNo = o?.no || '';

  try{
    // 1. 回料
    if(doReturn && matId){
      const matData = await notionAPI('GET','pages/'+matId);
      const curStock = matData?.properties?.['目前庫存']?.number??0;
      const newStock = curStock + parseInt(qty);
      await updatePage(matId,{'目前庫存':{number:newStock}});
      await logStockChange(matId,'','','C端退料（刪除）',parseInt(qty),curStock,newStock,id,ROLE);
    }

    // 2. 真正 Archive（刪除）ERP C端訂單頁面
    await notionAPI('PATCH','pages/'+id,{archived:true});

    // 3. 搜尋並刪除 115蝦皮 中相同訂單號碼的記錄
    if(orderNo){
      try{
        const r115 = await notionAPI('POST','databases/'+DB.shopee115+'/query',{
          filter:{property:'訂單號碼',title:{equals:orderNo}},
          page_size:10
        });
        if(r115?.results?.length){
          for(const pg of r115.results){
            await notionAPI('PATCH','pages/'+pg.id,{archived:true});
          }
          console.log('[115蝦皮] 刪除',r115.results.length,'筆記錄');
        }
      }catch(e2){ console.warn('115蝦皮刪除失敗:',e2); }
    }

    // 4. 從本地快取移除
    const cidx = corders.findIndex(x=>x.id===id);
    if(cidx>=0) corders.splice(cidx,1);
    renderTab(CURRENT_TAB);
    showToast(doReturn?'✅ 已刪除並回料，Notion 記錄同步移除':'✅ 訂單已刪除，Notion 記錄同步移除','ok');
  }catch(e){ showToast('❌ 刪除失敗：'+e.message,'err'); }
}

// ── 批量完成 ──
async function bulkCompleteCorders(){
  const ids = [..._sel];
  if(!ids.length) return;
  if(!confirm('確定將選取的 '+ids.length+' 筆訂單標記為「已完成」？')) return;
  showToast('⏳ 批量完成中...','ok');
  const today = new Date().toISOString().slice(0,10);
  let ok=0;
  for(const id of ids){
    try{
      await updatePage(id,{
        '狀態':{select:{name:'已完成'}},
        '出日':{date:{start:today}},
      });
      const o=corders.find(x=>x.id===id);
      if(o){ o.status='已完成'; o.shipDate=today; }
      ok++;
    }catch(e){ console.error('bulkComplete error:',id,e); }
  }
  _selClear(); renderTab(CURRENT_TAB);
  showToast(`✅ 已完成 ${ok}/${ids.length} 筆，出日設為 ${today}`,'ok');
}

// ── 批量刪除 ──
async function bulkDeleteCorders(){
  const ids = [..._sel];
  if(!ids.length) return;
  const doReturn = confirm('批量刪除 '+ids.length+' 筆訂單\n\n確定 = 出貨中訂單回料後刪除\n取消 = 全部直接刪除不回料\n\n（刪除後無法復原，Notion 記錄也會同步移除）');
  showToast('⏳ 批量刪除中...','ok');
  let ok=0;
  for(const id of ids){
    const o = corders.find(x=>x.id===id);
    if(!o) continue;
    try{
      if(doReturn && o.status==='出貨中' && o.matId){
        const matData = await notionAPI('GET','pages/'+o.matId);
        const curStock = matData?.properties?.['目前庫存']?.number??0;
        const newStock = curStock + parseInt(o.qty);
        await updatePage(o.matId,{'目前庫存':{number:newStock}});
        await logStockChange(o.matId,'','','C端退料（批量刪除）',parseInt(o.qty),curStock,newStock,id,ROLE);
      }
      await notionAPI('PATCH','pages/'+id,{archived:true});
      if(o.no){
        try{
          const r115 = await notionAPI('POST','databases/'+DB.shopee115+'/query',{
            filter:{property:'訂單號碼',title:{equals:o.no}},page_size:5
          });
          if(r115?.results?.length){
            for(const pg of r115.results) await notionAPI('PATCH','pages/'+pg.id,{archived:true});
          }
        }catch(e2){}
      }
      ok++;
    }catch(e){ console.error('bulkDelete error:',id,e); }
  }
  _selClear(); await loadCorders(); renderTab(CURRENT_TAB);
  showToast(`✅ 已刪除 ${ok}/${ids.length} 筆`,'ok');
}

// ── 品管：提交訂單檢驗結果 ──
async function submitOrderInspection(orderId, orderNo){
  const insType    = document.getElementById('ins_type')?.value||'全檢';
  const total      = parseInt(document.getElementById('ins_total')?.value)||0;
  const actual     = parseInt(document.getElementById('ins_actual')?.value)||0;
  const result     = document.getElementById('ins_result')?.value||'通過';
  const failReason = document.getElementById('ins_fail_reason')?.value||'';
  const badQty     = parseInt(document.getElementById('ins_bad_qty')?.value)||0;
  const handling   = document.getElementById('ins_handling')?.value||'';
  const failNote   = document.getElementById('ins_fail_note')?.value||'';
  const note       = document.getElementById('ins_note')?.value||'';
  const isPass     = result === '通過';

  closeModal();
  showToast('⏳ 提交檢驗單中...','ok');

  const today    = new Date().toISOString().slice(0,10);
  const monthKey = today.slice(0,7);
  const insNo    = 'ORD-'+today.replace(/-/g,'').slice(2)+'-'+Math.floor(Math.random()*900+100);
  const o        = orders.find(x=>x.id===orderId);

  try{
    // ── 1. 建立品管檢驗單（寫入 DB.qcInspection）──
    const insProps = {
      '檢驗單號':   {title:[{text:{content:insNo}}]},
      '關聯訂單號': {rich_text:[{text:{content:orderNo}}]},
      '檢驗類型':   {select:{name:insType}},
      '品項名稱':   {rich_text:[{text:{content:o?.product||o?.cust||''}}]},
      '應檢數量':   {number:total},
      '實檢數量':   {number:actual},
      '不良數量':   {number:isPass?0:badQty},
      '檢驗結果':   {select:{name:isPass?'通過':'不通過'}},
      '檢驗人員':   {rich_text:[{text:{content:ROLE}}]},
      '料號入庫':   {checkbox:isPass},
      '備註':       {rich_text:[{text:{content:[failNote,note].filter(Boolean).join(' / ')}}]},
    };
    if(!isPass && handling) insProps['處理方式']={select:{name:handling}};
    if(today) insProps['檢驗日期']={date:{start:today}};
    await notionAPI('POST','pages',{parent:{database_id:DB.qcInspection}, properties:insProps});

    // ── 2. 不通過：同步寫入品管不合格記錄（月份分組）──
    if(!isPass){
      try{

          '不合格描述': {rich_text:[{text:{content:failNote}}]},

          '責任歸屬':   {select:{name:'不明'}},

        };
        if(today) failProps['檢驗日期']={date:{start:today}};
        await notionAPI('POST','pages',{parent:{database_id:DB.qcFail}, properties:failProps});
        console.log('[品管不合格]', monthKey, '記錄已建立');
      }catch(e2){ console.warn('不合格記錄寫入失敗:', e2); }
    }

    // ── 3. 自動更新訂單狀態 ──
    const newStatus = isPass ? '待出貨' : '品檢異常';
    try{
      const updateResult = await updatePage(orderId,{'狀態':{select:{name:newStatus}}});
      console.log('[品管] 訂單狀態更新結果:', JSON.stringify(updateResult).slice(0,100));
      const ord = orders.find(x=>x.id===orderId);
      if(ord) ord.status = newStatus;
    }catch(eStatus){
      console.error('[品管] 訂單狀態更新失敗:', eStatus);
      showToast('⚠ 訂單狀態更新失敗（'+eStatus.message+'），請手動在 Notion 更新','warn');
    }

    await refreshAll();
    renderTab(CURRENT_TAB);

    if(isPass){
      showToast('✅ 品管通過！訂單已自動更新為「待出貨」','ok');
    } else {
      showToast('⚠ 品管不通過，訂單標記「品檢異常」，不合格記錄已建立（'+monthKey+'）','warn');
    }

  }catch(e){
    showToast('❌ 提交失敗：'+e.message,'err');
    console.error('submitOrderInspection error:', e);
  }
}

async function submitShopeeOrder(){
  const skuId  = document.getElementById('m_shopee_sku')?.value;
  const buyer  = document.getElementById('m_shopee_buyer')?.value?.trim()||'';
  const qty    = parseInt(document.getElementById('m_shopee_qty')?.value)||1;
  const note   = document.getElementById('m_shopee_note')?.value?.trim()||'';

  if(!skuId){ showToast('請選擇蝦皮商品','warn'); return; }
  const mat = mats.find(m=>m.id===skuId);
  if(!mat){ showToast('找不到料件資訊','err'); return; }

  const today = new Date().toISOString().slice(0,10);
  const yr = today.slice(2,4);
  const mo = today.slice(5,7);
  const orderNo = `ORD-${yr}${mo}-S${Math.floor(Math.random()*900+100)}`;

  showToast('⏳ 建立蝦皮訂單...','ok');
  closeModal();

  try{
    // ── 1. 建立客戶訂單 ──
    const orderProps = {
      '訂單號碼':   {title:[{text:{content:orderNo}}]},
      '料件編號':   {rich_text:[{text:{content:mat.code||''}}]},
      '客戶名稱':   {rich_text:[{text:{content:buyer||'蝦皮'}}]},
      '數量':       {number:qty},
      '狀態':       {select:{name:'生產中'}},
      '訂單類型':   {select:{name:'蝦皮'}},
      '備註':       {rich_text:[{text:{content:[`買家:${buyer}`,note].filter(Boolean).join(' | ')}}]},
    };
    if(today) orderProps['建立日期']={date:{start:today}};
    const ordResult = await notionAPI('POST','pages',{parent:{database_id:DB.orders},properties:orderProps});
    if(!ordResult||ordResult.object!=='page') throw new Error('訂單建立失敗');

    // ── 2. 解析 BOM 並建立領料單 ──
    const bomNote = mat.note||'';
    // 解析 備註欄位的 BOM：主料:XXX | 配件:A, B, C
    const mainMatMatch  = bomNote.match(/主料:([^\s|]+)/);
    const accMatch      = bomNote.match(/配件:([^|]+)/);
    const mainMatCode   = mainMatMatch?.[1]?.trim()||'';
    const accCodes      = accMatch?.[1]?.split(',').map(s=>s.trim()).filter(Boolean)||[];

    // 建立領料主單
    const pickNo = `PK-${yr}${mo}-S${Math.floor(Math.random()*900+100)}`;
    const pickMasterProps = {
      '領料單號':   {title:[{text:{content:pickNo}}]},
      '訂單號碼':   {rich_text:[{text:{content:orderNo}}]},
      '狀態':       {select:{name:'待領料'}},
    };
    await notionAPI('POST','pages',{parent:{database_id:DB.pickMaster},properties:pickMasterProps});

    // ── 3. 扣除庫存：主料 × qty ──
    if(mainMatCode){
      const mainMat = mats.find(m=>m.code===mainMatCode);
      if(mainMat){
        const newQty = Math.max(0,(mainMat.qty||0)-qty);
        await updatePage(mainMat.id,{'目前庫存':{number:newQty}});
        await logStockChange(mainMat.id, mainMatCode, -qty, `蝦皮訂單領料:${orderNo}`);
        mainMat.qty = newQty;
      }
    }

    // ── 4. 扣除配件庫存（解析數量，如 x2）──
    for(const accCode of accCodes){
      let code=accCode, deductQty=qty;
      const xMatch = accCode.match(/(.+)x(\d+)$/i);
      if(xMatch){ code=xMatch[1].trim(); deductQty=qty*parseInt(xMatch[2]); }
      const accMat = mats.find(m=>m.code===code);
      if(accMat){
        const newQty = Math.max(0,(accMat.qty||0)-deductQty);
        await updatePage(accMat.id,{'目前庫存':{number:newQty}});
        await logStockChange(accMat.id, code, -deductQty, `蝦皮訂單配件:${orderNo}`);
        accMat.qty = newQty;
      }
    }

    await refreshAll();
    showToast(`✅ 蝦皮訂單 ${orderNo} 建立完成（狀態：生產中）`,'ok');

  }catch(e){
    showToast('❌ 蝦皮訂單建立失敗：'+e.message,'err');
    console.error('submitShopeeOrder error:',e);
  }
}

async function completeShopeeOrder(orderId, orderNo, skuCode){
  // 蝦皮訂單完成時：增加 S- 料件庫存（因為是成品出貨統計）
  if(!confirm(`確認完成訂單 ${orderNo}？\n完成後將增加 ${skuCode} 的出貨統計。`)) return;
  try{
    await updatePage(orderId,{'狀態':{select:{name:'已完成'}}});
    const ord = orders.find(o=>o.id===orderId);
    if(ord) ord.status='已完成';
    // 扣除 S- 商品的庫存（出貨）
    const sku = mats.find(m=>m.code===skuCode);
    if(sku && sku.qty>0){
      const newQty = Math.max(0,(sku.qty||0)-1);
      await updatePage(sku.id,{'目前庫存':{number:newQty}});
      sku.qty=newQty;
    }
    await refreshAll(); renderTab(CURRENT_TAB);
    showToast(`✅ 訂單 ${orderNo} 已完成`,'ok');
  }catch(e){ showToast('❌ '+e.message,'err'); }
}

      const curStock = matData?.properties?.['目前庫存']?.number??0;
      const newStock = curStock + parseInt(qty);

async function importShopeeExcel(input){
  const file = input.files[0];
  if(!file) return;
  input.value='';
  showToast('⏳ 上傳解密中...','ok');

  try{
    // ── 把加密 xlsx 傳給 Worker 解密（最長等 60 秒）──
    const formData = new FormData();
    formData.append('file', file);
    formData.append('password', '576313');

    showToast('⏳ 上傳解密中，請稍候（約 5-15 秒）...','ok');

    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), 60000); // 60 秒 timeout

    let workerRes;
    try{
      workerRes = await fetch(PROXY, {
        method: 'POST',
        body: formData,
        signal: controller.signal,
      });
    }catch(fetchErr){
      clearTimeout(timeoutId);
      if(fetchErr.name === 'AbortError'){
        showToast('❌ 解密超時（60秒），請重試','err');
      } else {
        showToast('❌ 無法連線 Worker：'+fetchErr.message,'err');
      }
      input.value='';
      return;
    }
    clearTimeout(timeoutId);

    if(!workerRes.ok){
      let errMsg = 'HTTP '+workerRes.status;
      try{ const j = await workerRes.json(); errMsg = j.error||errMsg; }catch{}
      showToast('❌ Worker 錯誤：'+errMsg,'err');
      input.value='';
      return;
    }

    let base64, encrypted;
    try{
      const json = await workerRes.json();
      base64    = json.base64;
      encrypted = json.encrypted;
      if(json.error){ showToast('❌ 解密失敗：'+json.error,'err'); input.value=''; return; }
      if(!base64){ showToast('❌ Worker 未回傳資料','err'); input.value=''; return; }
    }catch(parseErr){
      showToast('❌ Worker 回應解析失敗：'+parseErr.message,'err');
      input.value='';
      return;
    }

    // ── 用 SheetJS 讀取解密後的 xlsx ──
    const binStr = atob(base64);
    const buf = new Uint8Array(binStr.length);
    for(let i=0;i<binStr.length;i++) buf[i]=binStr.charCodeAt(i);

    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if(!rows.length){ showToast('Excel 沒有資料','warn'); return; }

    showToast('⏳ 解析訂單中...','ok');

    // 出貨方式對應
    const SHIP_MAP = {
      '新竹物流':'新竹物流','蝦皮':'蝦皮','店到家宅配':'店到家','店到家':'店到家',
      '7-11':'7-11','全家':'全家','黑貓宅便':'黑貓宅便',
      'SF順豐':'SF順豐','大榮貨運':'大榮貨運','郵局包裹':'郵局包裹',
    };
    function mapShip(v){
      for(const k in SHIP_MAP){ if(v&&v.toString().includes(k)) return SHIP_MAP[k]; }
      return v||'';
    }

    // 合併同一訂單多品項
    const ordersMap = {};
    for(const row of rows){
      const no    = (row['訂單編號']||'').toString().trim();
      if(!no) continue;
      // ── SKU：只抓「商品選項貨號」欄位，空白就是空白 ──
      const sku     = (row['商品選項貨號']||'').toString().trim();
      const qty     = parseInt(row['數量'])||1;
const buyer = (row['買家帳號']||'').toString().trim();
      const rawShip = (row['寄送方式']||'').toString().trim();
      const shipDate= (row['實際出貨時間']||'').toString().slice(0,10).replace(/\//g,'-');
      const payDate = (row['買家付款時間']||'').toString().slice(0,10).replace(/\//g,'-');
      if(!ordersMap[no]) ordersMap[no]={no,buyer,shipMethod:mapShip(rawShip),shipDate,payDate,items:[]};
      ordersMap[no].items.push({sku, qty});
      
    }

    const orders = Object.values(ordersMap);
    if(!orders.length){ showToast('沒有有效訂單資料','warn'); return; }

    showToast('⏳ 匯入 '+orders.length+' 筆訂單...','ok');
    let ok=0, skip=0, noSkuOrders=[];

    for(const o of orders){
      // 每個品項獨立建一筆 C端訂單
      let orderOk=0;

      for(const item of o.items){
        // 重複判斷：同訂單號 + 同 SKU 才跳過
        const dupKey = o.no + '|' + (item.sku||item.prodName||'');
        if(corders.find(c=>c.no===o.no && c.matName===item.sku)){
          skip++; continue;
        }

        // ── SKU / 品名 處理 ──
        const displaySku = item.sku || '(無貨號)';
        const noSku = !item.sku;

        if(noSku){
          noSkuOrders.push({no:o.no, items:[item.prodName?.slice(0,20)||'(無品名)']});
        }

        let mat = null;
        let matId = '';
        if(item.sku){
          mat = mats.find(m=>
            m.name===item.sku || m.code===item.sku ||
            (m.name&&m.name.toLowerCase()===item.sku.toLowerCase()) ||
            (m.code&&m.code.toLowerCase()===item.sku.toLowerCase())
          );
          if(!mat){
            // 自動建立料件
            try{
              const created = await notionAPI('POST','pages',{
                parent:{database_id:DB.materials},
                properties:{
                  '料件名稱':{title:[{text:{content:item.sku}}]},
                  '類型':{select:{name:'成品'}},
                  '目前庫存':{number:20},
                  '安全庫存':{number:20},
                }
              });
              if(created&&created.object==='page'){
                mat={id:created.id,name:item.sku,code:item.sku,type:'成品',stock:20,safe:20};
                mats.push(mat);
                console.log('[自動建立料件]', item.sku);
              }
            }catch(e2){ console.error('自動建立料件失敗:', item.sku, e2); }
          }

          // 扣庫存
          if(mat){
            try{
              const matData = await notionAPI('GET','pages/'+mat.id);
              const curStock = matData?.properties?.['目前庫存']?.number??0;
              const newStock = curStock - item.qty;
              await updatePage(mat.id,{'目前庫存':{number:newStock}});
              await logStockChange(mat.id,mat.name,mat.code||'','C端出貨',-item.qty,curStock,newStock,o.no,ROLE);
              mat.stock=newStock;
              matId = mat.id;
            }catch(e3){ console.error('扣庫存失敗:', item.sku, e3); }
          }
        }

        // 寫入 ERP C端訂單（每品項一筆）
        const cProps={
          '訂單號碼':{title:[{text:{content:o.no}}]},
          '買家帳號':{rich_text:[{text:{content:o.buyer}}]},
          '品名':{rich_text:[{text:{content:displaySku}}]},
          '數量':{number:item.qty},
          '出貨方式':{rich_text:[{text:{content:o.shipMethod}}]},
          '狀態':{select:{name:'出貨中'}},
          '來源':{select:{name:'蝦皮'}},
          '料件ID':{rich_text:[{text:{content:matId}}]},
          '備註':{rich_text:[{text:{content:noSku?'⚠ 無料號，請手動補':'  '}}]},
        };
        if(o.shipDate&&o.shipDate.length===10) cProps['出日']={date:{start:o.shipDate}};
        if(o.payDate&&o.payDate.length===10) cProps['付款時間']={date:{start:o.payDate}};
        await notionAPI('POST','pages',{parent:{database_id:DB.corders},properties:cProps});
        orderOk++;
      }

      if(orderOk > 0){
        // 每張訂單只同步一次 115蝦皮（合併所有品項名稱）
        const allSkus = o.items.map(i=>(i.sku||i.chName||'無貨號')+(i.qty>1?'×'+i.qty:'')).join(' / ');
        const totalQty = o.items.reduce((s,i)=>s+i.qty,0);
        await syncToShopee115({no:o.no,buyer:o.buyer,matName:allSkus,qty:totalQty,
          shipMethod:o.shipMethod,shipDate:o.shipDate,payDate:o.payDate||'',note:''});
        ok++;
      }
    }

    await refreshAll(); await loadCorders(); renderTab(CURRENT_TAB);
    showToast('✅ 匯入完成：新增 '+ok+' 筆'+(skip?' / 跳過 '+skip+' 筆':''), 'ok');
    if(noSkuOrders.length){
      const detail = noSkuOrders.map(o=>'訂單 '+o.no+'：'+o.items.join('、')).join('\n');
      alert('⚠ 以下品項無料號（庫存未扣除，請手動處理）：\n\n'+detail);
    }

  }catch(e){
    showToast('❌ 匯入失敗：'+e.message,'err');
    console.error('importShopeeExcel error:',e);
  }
}

</script>
</body>
</html>
