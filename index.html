    <button class="qc-tab${QC_SUB==='history'?' active':''}" onclick="QC_SUB='history';renderTab('qc')">✅ 入料已檢測<span class="badge" style="background:rgba(46,196,138,.1);color:var(--green)">${doneInbound.length}</span></button>
  </div>`;

  // ══════════════════════════════
  // tab 1：入料待品檢（原有功能）
  // ══════════════════════════════
  if(QC_SUB==='pending'){
    if(!pendingInbound.length) return _notionBar+tabs+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">✅ 目前沒有入料待品檢項目</div></div>`;
    return _notionBar+tabs+`<div class="panel">
      <div class="panel-hdr"><span class="panel-title">📥 入料待品檢</span><span class="badge" style="background:rgba(245,185,66,.15);color:var(--yellow)">${pendingInbound.length}</span></div>
      <div class="table-wrap"><table>
        <tr>${TH('qcp','no','入料單號')}<th>料件</th>${TH('qcp','qty','數量','num')}${TH('qcp','date','日期','str','hide-m')}<th>操作</th></tr>
        ${applySort('qcp',pendingInbound).map(i=>{
          const mat=mats.find(m=>m.id===i.matId);
          return `<tr>
            <td style="font-family:monospace;font-size:0.6875rem">${i.no}</td>
            <td style="font-size:0.6875rem">${mat?.name||'—'}</td>
            <td style="font-family:monospace">${i.qty}</td>
            <td class="hide-m" style="font-size:0.6875rem">${i.date||'—'}</td>
            <td>${canQC?`<div style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn btn-green btn-sm" onclick="approveQC('${i.id}','${i.matId}',${i.qty})">✓ 通過</button>
              <button class="btn btn-red btn-sm" onclick="openInboundRejectModal('${i.id}')">✗ 退回</button>
              <button class="btn btn-cyan btn-sm" onclick="openInboundPhotoQC('${i.id}','${i.matId}',${i.qty})">📷 拍照品檢</button>
              <a href="https://www.notion.so/${i.id.replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-sm">🔗</a>
            </div>`:'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }

  if(QC_SUB==='report'){
    return _notionBar+tabs+renderQCReport(allInspections,pendingInbound,pendingOrders,doneInbound);
  }

  // ══════════════════════════════
  // tab 2：訂單待檢驗（只有訂單）
  // ══════════════════════════════
  if(QC_SUB==='order_qc'){
    if(!pendingOrders.length) return _notionBar+tabs+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">✅ 目前沒有訂單待檢驗</div></div>`;
    return _notionBar+tabs+`<div class="panel">
      <div class="panel-hdr"><span class="panel-title">📋 訂單待檢驗</span><span class="badge" style="background:rgba(168,85,247,.12);color:var(--purple,#a855f7)">${pendingOrders.length}</span></div>
      <div class="table-wrap"><table>
        <tr><th>訂單號</th><th>客戶</th><th>品項</th><th>數量</th><th>狀態</th><th>操作</th></tr>
        ${pendingOrders.map(o=>{
          const isFail = o.status==='品檢異常';
          return `<tr>
            <td style="font-family:monospace;font-size:0.6875rem">${o.no}</td>
            <td style="font-size:0.6875rem">${o.cust||'—'}</td>
            <td style="font-size:0.6875rem">${orderProductName(o)}</td>
            <td style="font-family:monospace">${o.qty||'—'}</td>
            <td><span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;background:${isFail?'rgba(239,68,68,.12)':'rgba(168,85,247,.12)'};color:${isFail?'#ef4444':'var(--purple,#a855f7)'}">${o.status}</span></td>
            <td>${canQC?`<div style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn btn-purple btn-sm" onclick="openInspectionModal('${o.id}','${o.no}')">📋 開立檢驗單</button>
              <a href="https://www.notion.so/${o.id.replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-sm">🔗</a>
            </div>`:'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }

  // ══════════════════════════════
  // tab 3：檢驗紀錄（入料 + 訂單分開）
  // ══════════════════════════════
  if(QC_SUB==='inspect'){
    const inspections = allInspections;
    const _qcDateOpts=[['0','全部'],['7','近7天'],['30','當月'],['90','近3個月']];
    const filterBar=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.6875rem;color:var(--text2)">結果：</span>
      ${['all','pass','fail'].map(f=>{const lb={all:'全部',pass:'✅通過',fail:'❌不合格'};const a=QC_FILTER===f;return`<button onclick="QC_FILTER='${f}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;font-weight:600;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${lb[f]}</button>`;}).join('')}
      <span style="font-size:0.6875rem;color:var(--text2);margin-left:8px">時間：</span>
      ${_qcDateOpts.map(([v,l])=>{const a=QC_DATE===v;return`<button onclick="QC_DATE='${v}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${l}</button>`;}).join('')}
    </div>`;

    const cutoff = QC_DATE==='0'?0:(Date.now()-parseInt(QC_DATE)*86400000);
    function insFilter(ins){
      if(QC_FILTER==='pass' && ins.result!=='通過' && ins.result!=='條件通過') return false;
      if(QC_FILTER==='fail' && ins.result!=='不通過') return false;
      if(cutoff){ const t=new Date(ins.created||ins.date||'').getTime(); if(!t||t<cutoff) return false; }
      return true;
    }

    // 分成入料、訂單與手動品檢。關聯單號來自舊資料時可能只有單號，避免吃到 undefined 欄位。
    const filteredInspections = inspections.filter(insFilter);
    const ibIns  = filteredInspections.filter(i=>(i.orderRef||i.no||'').startsWith('IB-'));
    const ordIns = filteredInspections.filter(i=>/^(ORD-|SO-|SFG-|26|25|24)/.test(i.orderRef||'') || (i.orderId&&orders.some(o=>o.id===i.orderId)));
    const otherIns = inspections.filter(i=>insFilter(i) && !ibIns.includes(i) && !ordIns.includes(i));

    const statusColors={'待檢驗':'var(--text3)','通過':'var(--green)','不通過':'var(--red)','條件通過':'var(--yellow)'};
    function insRow(ins){ return `<tr>
      <td style="font-family:monospace;font-size:0.6875rem">${escapeHtml(ins.no||'—')}</td>
      <td style="font-size:0.6875rem">${escapeHtml(ins.orderRef||'—')}</td>
      <td style="font-size:0.6875rem">${escapeHtml(ins.matName||ins.matCode||'—')}</td>
      <td style="font-family:monospace">${Number(ins.qtyAct)||0}/${Number(ins.qtyReq)||0}</td>
      <td style="font-family:monospace;color:var(--red)">${Number(ins.qtyBad)||0}</td>
      <td><span style="font-size:0.6875rem;font-weight:600;color:${statusColors[ins.result]||'var(--text3)'}">${ins.result||'—'}</span></td>
      <td style="font-size:0.6875rem;color:var(--text3)">${escapeHtml(ins.date||'—')}</td>
      <td style="font-size:0.6875rem">${escapeHtml(ins.inspector||'—')}</td>
      <td><a href="https://www.notion.so/${(ins.id||'').replace(/-/g,'')}" target="_blank" class="btn btn-ghost btn-xs">🔗</a></td>
    </tr>`; }

    const thead = `<tr><th>檢驗單號</th><th>關聯單號</th><th>品項</th><th>實/應檢</th><th>不良</th><th>結果</th><th>日期</th><th>人員</th><th></th></tr>`;

    let content = '';
    if(ordIns.length){
      content += `<div class="panel" style="margin-bottom:12px">
        <div class="panel-hdr"><span class="panel-title">📋 訂單品管檢驗</span><span class="badge">${ordIns.length}</span></div>
        <div class="table-wrap"><table>${thead}${ordIns.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(ibIns.length){
      const allIbOther = [...ibIns];
      content += `<div class="panel">
        <div class="panel-hdr"><span class="panel-title">📥 入料品管檢驗</span><span class="badge">${allIbOther.length}</span></div>
        <div class="table-wrap"><table>${thead}${allIbOther.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(otherIns.length){
      content += `<div class="panel">
        <div class="panel-hdr"><span class="panel-title">🔬 手動 / 開發 / 臨時品檢</span><span class="badge">${otherIns.length}</span></div>
        <div class="table-wrap"><table>${thead}${otherIns.map(insRow).join('')}</table></div>
      </div>`;
    }
    if(!content) content = `<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有符合條件的檢驗紀錄</div></div>`;

    return _notionBar+tabs+filterBar+content;
  }

  // ══════════════════════════════
  // tab 4：入料已檢測歷史
  // ══════════════════════════════
  const _qcDateOpts=[['0','全部'],['7','近7天'],['30','當月'],['90','近3個月']];
  const filterBar2=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:0.6875rem;color:var(--text2)">時間：</span>
    ${_qcDateOpts.map(([v,l])=>{const a=QC_DATE===v;return`<button onclick="QC_DATE='${v}';renderTab('qc')" style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;border:1px solid ${a?'var(--blue)':'var(--border)'};background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};color:${a?'var(--blue)':'var(--text2)'}">${l}</button>`;}).join('')}
  </div>`;
  const cutoff2 = QC_DATE==='0'?0:(Date.now()-parseInt(QC_DATE)*86400000);
  const filteredDone = doneInbound.filter(i=>{
    if(!cutoff2) return true;
    const t=new Date(i.date||'').getTime(); return t&&t>=cutoff2;
  });
  if(!filteredDone.length) return _notionBar+tabs+filterBar2+`<div class="panel"><div style="padding:28px;text-align:center;color:var(--text3)">目前沒有已檢測記錄</div></div>`;
  return _notionBar+tabs+filterBar2+`<div class="panel">
    <div class="panel-hdr"><span class="panel-title">✅ 入料已檢測</span><span class="badge">${filteredDone.length}</span></div>
    <div class="table-wrap"><table>
      <tr>${TH('qch','no','入料單號')}<th>料件</th>${TH('qch','qty','數量','num')}${TH('qch','date','日期','str','hide-m')}<th>狀態</th></tr>
      ${applySort('qch',filteredDone).map(i=>{
        const mat=mats.find(m=>m.id===i.matId);
        const isFail=i.qcStatus==='品檢不合格';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem">${i.no}</td>
          <td style="font-size:0.6875rem">${mat?.name||'—'}</td>
          <td style="font-family:monospace">${i.qty}</td>
          <td class="hide-m" style="font-size:0.6875rem">${i.date||'—'}</td>
          <td><span style="padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;background:${isFail?'rgba(239,68,68,.1)':'rgba(46,196,138,.1)'};color:${isFail?'var(--red)':'var(--green)'}">${i.qcStatus||'—'}</span></td>
        </tr>`;
      }).join('')}
    </table></div>
  </div>`;
}

// ── 刪除訂單（跳確認框，Notion archive 同步刪除）
async function deleteOrder(oid, no){
  if(!confirm('⚠️ 確認刪除訂單「'+no+'」？\n\n此操作將從 Notion 永久刪除，無法復原。')) return;
  showToast('刪除中...','warn');
  try{
    // ★ 先從本地移除（立即生效，不等 Notion）
    orders = orders.filter(o=>o.id!==oid);
    renderTab(CURRENT_TAB);

    // ★ 同步到 Notion：先 archive，確認後不再出現在 query 結果
    const r = await notionAPI('PATCH','pages/'+oid,{archived:true});
    if(r.object==='error') throw new Error(r.message);
    logUserAction('刪除訂單',no||oid,'訂單已刪除',ROLE);

    showToast('✅ 訂單「'+no+'」已刪除','ok');

    // ★ 延遲 2 秒再 refreshAll，讓 Notion 有時間處理
    // 且 refresh 時跳過已知刪除的 ID，避免 race condition
    setTimeout(async ()=>{
      try{
        const [mR,bR,oR,masterR,annR,leaveR]=await Promise.all([
          dbQueryAll(DB.materials), dbQueryAll(DB.bom),
          dbQueryAll(DB.orders), dbQueryAll(DB.custMaster),
          dbQueryAll(DB.announce), dbQueryAll(DB.leave),
        ]);
        // 解析訂單時排除剛刪除的 ID
        orders=oR.filter(p=>p.id!==oid).map(p=>({
          id:p.id, no:getTitle(p.properties,'訂單號'),
          customer:p.properties?.['客戶名稱']?.select?.name||'',
          productId:p.properties?.['成品']?.relation?.[0]?.id||'',
          qty:p.properties?.['訂購數量']?.number??0,
          deadline:p.properties?.['交期']?.date?.start||'',
          status:p.properties?.['狀態']?.select?.name||'',
          note:p.properties?.['業務備註']?.rich_text?.[0]?.plain_text||'',
          created:p.created_time?.slice(0,10)||'',
        }));
        renderTab(CURRENT_TAB);
      }catch(e){ console.warn('bg refresh after delete:',e); }
    }, 2000);

  }catch(e){ showToast('❌ 刪除失敗：'+e.message,'err'); }
}

// 庫存修改記錄：寫入 Notion 📝 庫存修改記錄 資料庫
// ══════════════════════════════════════════════
async function _writeStockEditLog({matId, matName, matCode, changeType, before, after, delta, reason, operator}){
  try{
    const today = new Date();
    const yr = today.getFullYear().toString().slice(2);
    const mo = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    const hh = String(today.getHours()).padStart(2,'0');
    const mm = String(today.getMinutes()).padStart(2,'0');
    const recNo = `LOG-${yr}${mo}${dd}-${hh}${mm}-${Math.floor(Math.random()*90+10)}`;

    const props = {
      '記錄編號':  {title:[{text:{content:recNo}}]},
      '料件名稱':  {rich_text:[{text:{content:matName||''}}]},
      '料件編號':  {rich_text:[{text:{content:matCode||''}}]},
      '修改類型':  {select:{name:changeType||'其他修改'}},
      '修改前數值':{rich_text:[{text:{content:String(before??'')}}]},
      '修改後數值':{rich_text:[{text:{content:String(after??'')}}]},
      '修改原因':  {rich_text:[{text:{content:reason||''}}]},
      '修改人員':  {rich_text:[{text:{content:operator||ROLE||''}}]},
    };
    if(typeof delta === 'number' && !isNaN(delta)) props['變化量']={number:delta};
    if(matId) props['料件連結']={url:`https://www.notion.so/${matId.replace(/-/g,'')}`};

    await notionAPI('POST','pages',{parent:{database_id:DB.stockEditLog},properties:props});
    console.log('[庫存記錄] 已寫入:', recNo, changeType, reason);
  }catch(e){
    console.warn('[庫存記錄] 寫入失敗（不影響主功能）:', e);
  }
}

async function doEditMat(mid){
  const name=document.getElementById('em_name').value.trim();
  const code=document.getElementById('em_code').value.trim();
  const type=document.getElementById('em_type').value;
  const safe=parseInt(document.getElementById('em_safe').value)||0;
  const reason=(document.getElementById('em_reason')?.value||'').trim();
  if(!name){showToast('請填入料件名稱','warn');return;}
  // 原因驗證
  if(!reason || !/[\u4e00-\u9fa5a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫修改原因（需包含中文或英數字）','warn');
    document.getElementById('em_reason')?.focus();
    return;
  }
  const oldMat = mats.find(x=>x.id===mid);
  const oldName = oldMat?.name||'';
  const oldSafe = oldMat?.safe||0;
  closeModal();showToast('更新中...','warn');
  try{
    const props={
      '料件名稱':{title:[{text:{content:name}}]},
      '類型':{select:{name:type}},
      '安全庫存':{number:safe},
    };
    if(code!==undefined)props['料件編號']={rich_text:[{text:{content:code}}]};
    await updatePage(mid,props);
    // 判斷修改類型
    const changeType = name!==oldName ? '料件名稱修改' : safe!==oldSafe ? '安全庫存修改' : '其他修改';
    const before = name!==oldName ? oldName : String(oldSafe);
    const after  = name!==oldName ? name : String(safe);
    await _writeStockEditLog({
      matId:mid, matName:name, matCode:code,
      changeType, before, after, delta:0, reason, operator:ROLE,
    });
    await refreshAll();
    showToast('✅ 料件「'+name+'」已更新（原因已記錄）','ok');
  }catch(e){showToast('❌ 更新失敗：'+e.message,'err');}
}

function materialUsageSummary(mid){
  const bomParent=boms.filter(b=>b.parentId===mid).length;
  const bomChild=boms.filter(b=>b.childId===mid).length;
  const orderCount=orders.filter(o=>o.productId===mid).length;
  const inboundCount=(inbounds||[]).filter(i=>i.matId===mid).length;
  const corderCount=(window.corders||[]).filter(o=>(o.matId||'').includes(mid)).length;
  const total=bomParent+bomChild+orderCount+inboundCount+corderCount;
  return {bomParent,bomChild,orderCount,inboundCount,corderCount,total};
}

function materialUsageLabel(u){
  const parts=[];
  if(u.bomParent) parts.push(`BOM母件 ${u.bomParent}`);
  if(u.bomChild) parts.push(`BOM子件 ${u.bomChild}`);
  if(u.orderCount) parts.push(`訂單 ${u.orderCount}`);
  if(u.inboundCount) parts.push(`入料 ${u.inboundCount}`);
  if(u.corderCount) parts.push(`C端 ${u.corderCount}`);
  return parts.length?parts.join('、'):'目前畫面資料未偵測到關聯';
}

async function doDeleteMat(mid){
  const m=mats.find(x=>x.id===mid);
  if(!m){showToast('找不到料件','err');return;}
  const reason=(document.getElementById('dm_reason')?.value||'').trim();
  const usage=materialUsageSummary(mid);
  if(!reason || !/[\u4e00-\u9fa5a-zA-Z0-9]/.test(reason)){
    showToast('⚠ 請填寫刪除原因（需包含中文或英數字）','warn');
    document.getElementById('dm_reason')?.focus();
    return;
  }
  if(usage.total>0 && !document.getElementById('dm_confirm_linked')?.checked){
    showToast('⚠ 此料號有關聯資料，請先勾選確認再刪除','warn');
    return;
  }
  closeModal();showToast('刪除料件中...','warn');
  try{
    await archivePage(mid);
    await _writeStockEditLog({
      matId:mid,
      matName:m.name||'',
      matCode:m.code||'',
      changeType:'刪除料件',
      before:`${m.name||''} / ${m.code||''} / ${m.type||''} / 庫存 ${m.stock}`,
      after:'Notion 已封存',
      delta:0,
      reason:`${reason}；關聯檢查：${materialUsageLabel(usage)}`,
      operator:ROLE,
    });
    logUserAction('刪除料件',m.code||m.name,`原因：${reason}；${materialUsageLabel(usage)}`,ROLE);
    mats=mats.filter(x=>x.id!==mid);
    renderTab(CURRENT_TAB);
    showToast('✅ 料件已刪除並完成紀錄','ok');
  }catch(e){showToast('❌ 刪除失敗：'+e.message,'err');}
}

async function doPick(orderId){
  const o=orders.find(x=>x.id===orderId);
  const prod=mats.find(m=>m.id===o.productId);
  const ds=new Date().toISOString().slice(0,10);
  const no=`PK-${ds.slice(2).replace(/-/g,'')}-${Math.floor(Math.random()*900+100)}`;
  closeModal();
  showToast('建立領料單中...','warn');

  try{
    // ── BOM 展開領料邏輯（蝦皮 S-、半成品、有 BOM 成品都走這裡）──
    const items=explodeBOM(o.productId,o.qty);
    const hasBOM = items.length > 0;
    if(!hasBOM&&requiresBOMMaterial(prod,o?.orderType)){
      throw new Error('此品項必須設定 BOM 才能領料，避免誤扣成品庫存。請先補 BOM 關係。');
    }
    // 1. 建立領料主單
    const master=await createPage(DB.pickMaster,{
      '領料主單號':{title:[{text:{content:no}}]},
      '對應訂單':{relation:[{id:orderId}]},
      '成品品號':{rich_text:[{text:{content:prod?.name||''}}]},
      '生產數量':{number:o.qty},
      '狀態':{select:{name:'已確認扣料'}},
      '領料日期':{date:{start:ds}}
    });
    if(master.object==='error') throw new Error('領料主單建立失敗：'+master.message);

    let stockErrors=[];

    if(hasBOM){
      // ══ 有 BOM：展開子件逐項扣庫存 ══
      for(const item of items){
        if(item.missing||!item.id){
          stockErrors.push((item.code||item.name)+': BOM 子料號尚未建檔');
          continue;
        }
        try{
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:item.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:item.id}]},
            '類型':{select:{name:item.type}},
            '需求數量':{number:item.needed},
            '實領數量':{number:item.type==='半成品'?item.needed:Math.min(item.needed,item.stock)},
            '狀態':{select:{name:item.type==='半成品'?'半成品':item.stock>=item.needed?'足夠':'缺料'}}
          });
          // 只有零件才扣，半成品不扣（半成品本身的零件已在 BOM 展開時計算）
          if(item.type!=='半成品'){
            const latestMat=await notionAPI('GET','pages/'+item.id);
            const latestStock=latestMat?.properties?.['目前庫存']?.number??item.stock;
            const newStock=Math.max(0,latestStock-item.needed);
            await updatePage(item.id,{'目前庫存':{number:newStock}});
            await logStockChange(item.id,item.name,item.code||'','領料',-item.needed,latestStock,newStock,no,ROLE);
          }
        }catch(itemErr){
          stockErrors.push(item.name+': '+itemErr.message);
          console.error('領料明細錯誤',item.name,itemErr);
        }
      }
    } else {
      // ══ 無 BOM：直接扣成品本身庫存 ══
      if(!prod){
        stockErrors.push('訂單未關聯成品料件，無法扣庫存');
      } else {
        try{
          // 建立一筆領料明細（成品本身）
          await createPage(DB.pickDetail,{
            '料件名稱':{title:[{text:{content:prod.name}}]},
            '領料主單':{relation:[{id:master.id}]},
            '料件':{relation:[{id:prod.id}]},
            '類型':{select:{name:prod.type||'成品'}},
            '需求數量':{number:o.qty},
            '實領數量':{number:o.qty},
            '狀態':{select:{name:'足夠'}}
          });
          // 從 Notion 讀最新庫存再扣
          const latestProd=await notionAPI('GET','pages/'+prod.id);
          const latestStock=latestProd?.properties?.['目前庫存']?.number??prod.stock;
          const newStock=Math.max(0,latestStock-o.qty);
          await updatePage(prod.id,{'目前庫存':{number:newStock}});
          await logStockChange(prod.id,prod.name,prod.code||'','領料',-o.qty,latestStock,newStock,no,ROLE);
        }catch(prodErr){
          stockErrors.push(prod.name+': '+prodErr.message);
          console.error('成品直接扣料錯誤',prodErr);
        }
      }
    }

    // 3. 更新訂單狀態為「生產中」
    await updatePage(orderId,{'狀態':{select:{name:'生產中'}}});
    logUserAction('確認領料',no,`${o?.no||orderId} ${hasBOM?'BOM展開':'直接扣料'}`,ROLE);

    // 4. 重新整理資料
    await refreshAll();
    await loadPicks();

    const modeNote = hasBOM ? `（BOM展開 ${items.length} 項子件）` : '（直接扣成品庫存）';
    if(stockErrors.length){
      showToast(`⚠ 領料單 ${no} 建立，部分失敗：${stockErrors.join('、')}`,'warn');
    }else{
      showToast(`✅ 領料單 ${no} 建立完成 ${modeNote}`,'ok');
    }
  }catch(e){
    showToast('❌ 領料失敗：'+e.message,'err');
    console.error('doPick error:',e);
  }
}

async function syncInboundStock(id, matId, qty){
  if(!matId){ showToast('此入料單未關聯料件，無法同步庫存','warn'); return; }
  // 先確認入料單目前狀態
  const inbound = inbounds.find(i=>i.id===id);
  if(!inbound){ showToast('找不到此入料單','warn'); return; }

  if(inbound.qcStatus!=='品檢通過'){
    showToast('⚠ 品管狀態尚未通過，無法同步庫存','warn'); return;
  }
  if(inbound.stStatus==='已入庫'){
    showToast('⚠ 此入料單已是「已入庫」，避免重複增加庫存','warn'); return;
  }

  const mat = mats.find(m=>m.id===matId);
  if(!mat){ showToast('找不到對應料件','warn'); return; }

  const newStock = (mat.stock||0) + parseInt(qty);
  if(!confirm(`確認同步庫存？
料件：${mat.name}
目前庫存：${mat.stock}
入料數量：${qty}
同步後：${newStock}`)) return;

  showToast('同步中...','warn');
  try{
    await updatePage(matId, {'目前庫存':{number: newStock}});
    // 確保入庫狀態也是已入庫
    await updatePage(id, {'入庫狀態':{select:{name:'已入庫'}}});
    await logStockChange(matId,mat.name,mat.code||'','手動同步入庫',parseInt(qty),mat.stock||0,newStock,id,ROLE);
    await refreshAll();
    showToast(`✅ ${mat.name} 庫存已同步：${mat.stock} → ${newStock}`,'ok');
  }catch(e){ showToast('❌ 同步失敗：'+e.message,'err'); }
}

}

  logStockChange('', detail||action, '', action, 0, 0, 0, refNo, operator||ROLE||'');
}

const STOCK_LOG_TYPES=new Set(['入料','領料','手動調整','品管退回','C端出貨','C端退料','C端退料（刪除）','建立入料單','品管通過','新增訂單','刪除訂單','取消訂單','狀態更新','出貨完成','補料']);
function normalizeStockLogType(type){
  const t=String(type||'手動調整');
  if(STOCK_LOG_TYPES.has(t)) return t;
  if(t.includes('建立入料')) return '建立入料單';
  if(t.includes('品管通過')) return '品管通過';
  if(t.includes('品管退')||t.includes('不合格')) return '品管退回';
  if(t.includes('新增訂單')||t.includes('建立訂單')) return '新增訂單';
  if(t.includes('刪除訂單')) return '刪除訂單';
  if(t.includes('取消')) return '取消訂單';
  if(t.includes('狀態')) return '狀態更新';
  if(t.includes('出貨')) return '出貨完成';
  if(t.includes('補料')) return '補料';
  if(t.includes('C端出貨')) return 'C端出貨';
  if(t.includes('C端退料')) return t.includes('刪除')?'C端退料（刪除）':'C端退料';
  if(t.includes('入庫')||t.includes('入料')||t.includes('完成')) return '入料';
  if(t.includes('領料')||t.includes('扣料')||t.includes('組裝')) return '領料';
  return '手動調整';
}

const _logQueue = [];
let _logFlushing = false;
async function _flushLogQueue(){
  if(_logFlushing||!_logQueue.length) return;
  _logFlushing=true;
  while(_logQueue.length){
    const item=_logQueue.shift();
    try{
      const today=new Date().toISOString().slice(0,10);
      const safeType=normalizeStockLogType(item.changeType);
      await notionAPI('POST','pages',{parent:{database_id:DB.stockLog},properties:{
        '異動項目':{title:[{text:{content:today+' '+item.changeType+' '+item.matName}}]},
        '料件名稱':{rich_text:[{text:{content:item.matName||''}}]},
        '料件編號':{rich_text:[{text:{content:item.matCode||''}}]},
        '異動類型':{select:{name:safeType}},
        '異動數量':{number:Math.abs(item.qty)},
        '異動前庫存':{number:item.beforeStock},
        '異動後庫存':{number:item.afterStock},
        '異動日期':{date:{start:today}},
        '關聯單號':{rich_text:[{text:{content:item.refNo||''}}]},
        '操作人員':{rich_text:[{text:{content:item.operator2||''}}]},
        '備註':{rich_text:[{text:{content:safeType===item.changeType?'':'原始動作：'+item.changeType}}]},

  }
  _logFlushing=false;
}

async function selectAndLoadPI(pageId,title,idx){
  document.querySelectorAll('.pi-item').forEach(e=>e.classList.remove('selected'));

  try{
    const blocks=await getBlockChildren(pageId);const all=blocks.results||[];
    let fileUrl='',pdfUrl='';
    for(const b of all){
      if(b.type!=='file')continue;
      const fd=b.file||{};const name=(fd.name||'').toLowerCase();const url=fd.file?.url||fd.external?.url||'';if(!url)continue;
      if((name.endsWith('.xlsx')||name.endsWith('.xls'))&&!fileUrl)fileUrl=url;
      if(name.endsWith('.pdf')&&!pdfUrl)pdfUrl=url;
    }
    if(!fileUrl){
      for(const b of all){if(b.type!=='child_page')continue;const t=(b.child_page?.title||'').toLowerCase();if(t.endsWith('.xlsx')||t.endsWith('.xls')){try{const bd=await getBlock(b.id);const bfd=bd[bd.type]||{};const u=bfd.file?.url||bfd.external?.url||'';if(u){fileUrl=u;break;}}catch{}}}
    }

    setStatus('⏳ 下載中...');
    const buf=await downloadViaProxy(fileUrl);
    const rows=await piRowsFromArrayBuffer(buf,title||'PI.xlsx');
    const orderNo=title.replace(/\s*\(.*?\)\s*/g,'').trim();

  }catch(e){setStatus(`❌ ${e.message.slice(0,40)}`);showToast('讀取失敗，請直接上傳','err');}
}

function normText(v){return String(v??'').replace(/\s+/g,' ').trim();}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function extractPICodeCandidates(text){
  const s=String(text||'').toUpperCase().replace(/\s+/g,'');
  const out=[];
  const push=v=>{v=String(v||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').replace(/-[A-Z0-9]+$/,'');if(v&&!out.includes(v))out.push(v);};
  const full=s.match(/\b(\d{2}0?[12][A-Z]{2}\d{3})(?:-[A-Z0-9]+)?\b/);
  if(full){
    push(full[1]);
    push(full[1].replace(/^(\d{2})0([12][A-Z]{2}\d{3})$/,(m,y,rest)=>y+rest));
  }
  const compact=s.match(/\b(\d{2}[12][A-Z]{2}\d{3})(?:-[A-Z0-9]+)?\b/);
  if(compact){
    push(compact[1]);
    push(compact[1].replace(/^(\d{2})([12])([A-Z]{2}\d{3})$/,(m,y,status,rest)=>y+'0'+status+rest));
  }
  const legacy=s.match(/\b([A-Z]{2}\d{5,6})(?:-[A-Z0-9]+)?\b/);
  if(legacy) push(legacy[1]);
  return out;
}
function countryFromPICode(code){
  const s=String(code||'').toUpperCase();
  const m=s.match(/\d{2}0?[12]?([A-Z]{2})\d{3}/)||s.match(/^([A-Z]{2})\d{5,6}$/);
  const map={US:'USA',AU:'Australia',CA:'Canada',JP:'Japan',KR:'Korea',SG:'Singapore',MY:'Malaysia',TH:'Thailand',VN:'Vietnam',PH:'Philippines',DE:'Germany',FR:'France',IT:'Italy',ES:'Spain',GB:'UK',UK:'UK'};
  return m?(map[m[1]]||m[1]):'';
}
function getPIValueNearLabel(rows,labelRegex){
  for(const rawRow of rows||[]){
    const row=Array.isArray(rawRow)?rawRow:[];
    for(let c=0;c<row.length;c++){
      const v=normText(row[c]);
      if(labelRegex.test(v)){
        for(let k=c+1;k<Math.min(row.length,c+5);k++){const n=normText(row[k]);if(n)return n;}
        const after=v.replace(labelRegex,'').replace(/^[:：\s]+/,'').trim();
        if(after)return after;
      }
    }
  }
  return '';
}
function extractPIResult(rows,piName){
  rows=(rows||[]).map(r=>Array.isArray(r)?r:[]);
  const allText=rows.flat().map(normText).filter(Boolean).join(' ');
  const piNo=getPIValueNearLabel(rows,/^(No\.?|PI\s*No\.?)[:：]?$/i) || extractPICodeCandidates(piName)[0] || '';
  const orderNo=extractPIOrderNo(piName,piNo);
  const codeCandidates=[...extractPICodeCandidates(piNo),...extractPICodeCandidates(piName),...extractPICodeCandidates(allText)];
  const dateRaw=getPIValueNearLabel(rows,/^Date[:：]?$/i);
  const piDate=dateRaw?dateRaw.replace(/Date[:：]?/i,'').trim().replace(/[./]/g,'-'):'';
  let company=getPIValueNearLabel(rows,/^Company Name[:：]?$/i);
  if(!company) company=getPIValueNearLabel(rows,/^Contact Name[:：]?$/i);
  let country='';
  const route=allText.match(/FROM\s+Taiwan\s+TO\s+([A-Za-z ]+)/i);
  if(route) country=route[1].replace(/\s+(SHIPMENT|PER|SHIPPING).*$/i,'').trim();
  if(!country&&codeCandidates.length) country=countryFromPICode(codeCandidates[0]);

  const items=[];
  const nonProductWords=new Set(['USD','TOTAL','SUBTOTAL','EMS','UPS','DHL','FEDEX','TNT','AIR','SEA','FROM','TO','DATE','NO','PI']);
  const isCustomerInfoRow=row=>row.some(v=>/company\s*name|contact\s*name|customer|address|from\s+taiwan|shipment|shipping|payment|beneficiary|bank|invoice/i.test(normText(v)));
  const isExplicitQtyCell=(v,next)=>{
    if(v===''||v==null) return false;
    const raw=normText(v).replace(/,/g,'');
    if(!/^\d+(\.\d+)?$/.test(raw)) return false;
    const n=Number(raw);
    if(!Number.isFinite(n)||n<=0||n>=100000) return false;
    const nNext=normText(next).toLowerCase();
    return nNext.includes('unit')||nNext.includes('pcs')||nNext.includes('pc')||nNext.includes('set')||nNext.includes('qty');
  };
  const rowQtyInfo=(row,itemCol)=>{
    for(let c=itemCol+1;c<row.length;c++){
      if(isExplicitQtyCell(row[c],row[c+1])) return {qty:Number(normText(row[c]).replace(/,/g,'')),col:c};
    }
    return null;
  };
  const isSku=v=>{
    const s=normText(v).toUpperCase().replace(/\s+/g,'');
    if(!/^[A-Z0-9][A-Z0-9-]{2,29}$/.test(s)||!/[A-Z]/.test(s)||!/\d/.test(s)) return false;
    if(nonProductWords.has(s)) return false;
    if(/^0?\d{1,2}MATE$/.test(s)) return false;
    if(codeCandidates.some(c=>s===String(c||'').toUpperCase())) return false;
    return true;
  };
  for(let r=0;r<rows.length;r++){
    const row=Array.isArray(rows[r])?rows[r]:[];
    const itemCol=row.findIndex(v=>/^\d+\.?$/.test(normText(v)));
    if(itemCol<0) continue;
    const qtyInfo=rowQtyInfo(row,itemCol);
    if(!qtyInfo) continue;
    const desc=normText(row.slice(itemCol+1).find(v=>normText(v)&&!isSku(v)&&!/^USD$/i.test(normText(v)))||'');
    let model='';
    for(let rr=r;rr<Math.min(rows.length,r+4)&&!model;rr++){
      if(isCustomerInfoRow(rows[rr]||[])) continue;
      for(const cell of rows[rr]||[]){
        const v=normText(cell).toUpperCase();
        if(isSku(v)){model=v;break;}
      }
    }
    if(model) items.push({model,qty:qtyInfo.qty,desc});
  }
  const dedup=[];
  const seen=new Set();
  for(const item of items){
    const k=item.model+'|'+item.qty;
    if(!seen.has(k)){seen.add(k);dedup.push(item);}
  }
  return {piNo:piNo||piName||'',orderNo,piDate,customerCodes:codeCandidates,customerCode:codeCandidates[0]||'',company,country,items:dedup};
}

function extractPIOrderNo(piName,piNo){
  const clean=v=>String(v||'').replace(/\.(xlsx|xls|pdf)$/i,'').replace(/^PI[-_\s]*/i,'').trim();
  const candidates=[clean(piName),clean(piNo)];
  for(const c of candidates){
    const m=c.toUpperCase().match(/\b(\d{2}0?[12][A-Z]{2}\d{3}(?:-[A-Z0-9]+)?)\b/);
    if(m) return m[1];
  }
  return clean(piNo||piName);
}

function findPICustomer(codes){
  const variants=(codes||[]).map(c=>String(c||'').toUpperCase()).filter(Boolean);
  return customers.find(c=>(c.type==='overseas'||!c.type)&&variants.includes(String(c.code||'').toUpperCase()))||
         customers.find(c=>(c.type==='overseas'||!c.type)&&variants.some(v=>String(c.code||'').toUpperCase().includes(v)||v.includes(String(c.code||'').toUpperCase())))||null;
}

async function submitMultiOrders(){
  const cust=document.getElementById('m_cust')?.value;
  const date=document.getElementById('m_date')?.value;
  if(!cust){alert('請選擇客戶');return;}
  if(!date){alert('請填入交期');return;}

  // 從 data attribute 還原品項資料（避免 onclick 引號問題）
  const div=document.getElementById('piMultiList');
  if(!div||!div.dataset.items){alert('品項資料遺失，請重新讀取 PI');return;}
  let items;
  try{items=JSON.parse(decodeURIComponent(atob(div.dataset.items)));}
  catch(e){alert('品項資料解析失敗：'+e.message);return;}
  const piNo=div.dataset.pino||'';

  const selected=[];
  for(let i=0;i<items.length;i++){
    const chk=document.getElementById('chk_'+i);const qtyEl=document.getElementById('qty_'+i);
    if(chk?.checked&&qtyEl)selected.push({model:items[i].model,qty:parseInt(qtyEl.value)||items[i].qty});
  }
  if(!selected.length){alert('請至少勾選一個品項');return;}

  // 顯示進度（不 closeModal）
  const batchBtn=document.getElementById('batchBtn');
  if(batchBtn){batchBtn.disabled=true;batchBtn.textContent='建立中，請勿關閉...';}
  div.insertAdjacentHTML('afterend',`<div id="batchProgress" style="background:var(--bg3);border-radius:8px;padding:10px;margin-top:8px;font-size:0.75rem;color:var(--cyan)"><div class="spin" style="margin-right:6px"></div>正在建立 ${selected.length} 筆訂單...</div>`);

  const prefix=`ORD-${new Date().toISOString().slice(2,7).replace('-','')}`;
  let ok=0,fail=0,failList=[];

  for(let i=0;i<selected.length;i++){
    const item=selected[i];
    const prog=document.getElementById('batchProgress');
    if(prog)prog.innerHTML=`<div class="spin" style="margin-right:6px"></div>建立第 ${i+1}/${selected.length} 筆：${item.model}...`;
    try{
      let prodId='';
      const ex=mats.find(m=>m.name===item.model||m.code===item.model);
      if(ex){prodId=ex.id;}
      else{
        const nm=await createPage(DB.materials,{
          '料件名稱':{title:[{text:{content:item.model}}]},
          '料件編號':{rich_text:[{text:{content:item.model}}]},
          '類型':{select:{name:'成品'}},
          '目前庫存':{number:100},
          '安全庫存':{number:0}
        });
        prodId=nm.id;
      }
      const no=`${prefix}-${String(i+1).padStart(3,'0')}`;
      await createPage(DB.orders,{
        '訂單號':{title:[{text:{content:no}}]},
        '客戶名稱':{select:{name:cust}},
        '成品':{relation:[{id:prodId}]},
        '訂購數量':{number:item.qty},
        '交期':{date:{start:date}},
        '狀態':{select:{name:'待排程'}},
        '訂單類型':{select:{name:orderType}},
        '業務備註':{rich_text:[{text:{content:note||(piNo?'PI: '+piNo:'')}}]},
        ...(piNo?{'PI單號':{rich_text:[{text:{content:piNo}}]}}:{}),
        ...(shipMethod?{'出貨方式':{select:{name:shipMethod}}}:{}),
        ...(packageType?{'包裝方式':{select:{name:packageType}}}:{}),
        ...(deliverAddr?{'送貨地':{rich_text:[{text:{content:deliverAddr}}]}}:{}),
      });
      ok++;
    }catch(e){fail++;failList.push(item.model);console.error(item.model,e);}
  }

  await refreshAll();

  const prog=document.getElementById('batchProgress');
  if(prog)prog.innerHTML=`<span style="color:${ok===selected.length?'var(--green)':'var(--yellow)'}">
    ✅ 成功 ${ok} 筆${fail?`，失敗 ${fail} 筆（${failList.join('、')}）`:''}
  </span>
  <br><button class="btn btn-ghost btn-sm" onclick="closeModal()" style="margin-top:8px">關閉</button>`;

  showToast(`${ok===selected.length?'✅':'⚠'} 建立 ${ok}/${selected.length} 筆訂單`,ok===selected.length?'ok':'warn');
}

function initShopeeOrderList(){
  window._shopeeOrderItems=[];

function filterShopeeList(q){
  _renderShopeeList((q||'').toLowerCase().trim());
}

function _renderShopeeList(q){
  const sel = document.getElementById('m_shopee_sku');
  if(!sel) return;
  const prev = sel.value;
  const rawQ=(q||'').trim();
  const qKey=rawQ.toLowerCase();
  const newCode=normSku(rawQ);
  sel.innerHTML = '<option value="">— 選擇蝦皮商品（S-開頭）—</option>';
  const items = mats
    .filter(m=>/^S-/i.test((m.code||m.name||'').trim()) || isShopeeMat(m))
    .filter(m=>!qKey || (m.code||'').toLowerCase().includes(qKey) || (m.name||'').toLowerCase().includes(qKey))
    .sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||''));
  items.forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m.id;
    opt.textContent=(m.code||m.name)+(m.name&&m.name!==m.code?' — '+m.name:'');
    if(m.id===prev) opt.selected=true;
    sel.appendChild(opt);
  });
  if(newCode.startsWith('S-')&&!findMatBySku(newCode)){
    const opt=document.createElement('option');
    opt.value='NEW::'+newCode;
    opt.textContent='＋ 建立新蝦皮料號：'+newCode;
    opt.selected=true;
    sel.appendChild(opt);
  }
  if(items.length===0){
    const opt=document.createElement('option');
    opt.disabled=true;
    opt.textContent=newCode.startsWith('S-')?'可選擇上方建立新料號':'（無符合結果，輸入 S-料號可建立）';
    sel.appendChild(opt);
  }
}

function onShopeeSkuChange(matId){
  const info = document.getElementById('shopeeSkuInfo');
  const bom  = document.getElementById('shopeeSkuBom');
  if(!info||!bom){return;}
  if(!matId){info.style.display='none';return;}
  if(matId.startsWith('NEW::')){
    const sku=matId.slice(5);
    const rows=shopeeBomRowsForSku(sku);
    bom.innerHTML=rows.length
      ? rows.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--border)"><span>${x.code}</span><b style="color:var(--amber)">扣 ${x.qty}</b></div>`).join('')+'<div style="font-size:0.625rem;color:var(--text3);margin-top:6px">來源：Excel BOM，建立時會自動補進 Notion</div>'
      : `<div style="color:var(--red)">Excel BOM 找不到 ${sku}，建立後需手動補 BOM。</div>`;
    info.style.display='';
    return;
  }
  const mat = mats.find(m=>m.id===matId);

        <span>${x.missing?'⚠ ':''}${x.code||x.name}</span>
        <b style="color:${x.missing?'var(--red)':'var(--amber)'}">扣 ${x.needed}</b>
      </div>`).join('')
    : `<div style="color:var(--red)">未找到 BOM。請在 Notion BOM 或程式對照表建立 ${mat.code||mat.name} 的扣料規則。</div>`;
  const source=items[0]?.source==='notion'?'Notion BOM':items[0]?.source==='note'?'料件備註':'程式暫存對照';
  html+=items.length?`<div style="font-size:0.625rem;color:var(--text3);margin-top:6px">來源：${source}</div>`:'';
  bom.innerHTML=html;
  info.style.display='';
}

async function addShopeeOrderItem(manual=false){
  let matId=document.getElementById('m_shopee_sku')?.value||'';
  const qty=parseInt(document.getElementById('m_shopee_qty')?.value)||1;
  let mat=null;
  const manualSku=(document.getElementById('m_shopee_manual')?.value||document.getElementById('shopee_search')?.value||'').trim();
  const newSkuFromSelect=(document.getElementById('m_shopee_sku')?.value||'').startsWith('NEW::')?(document.getElementById('m_shopee_sku')?.value||'').slice(5):'';
  if(newSkuFromSelect) matId='';
  if(manual||newSkuFromSelect||(!matId&&manualSku)){
    try{
      mat=await ensureShopeeParentMaterial(newSkuFromSelect||manualSku);
      const bomInfo=await ensureShopeeBomRows(mat);
      matId=mat.id;
      _renderShopeeList('');
      const sel=document.getElementById('m_shopee_sku');
      if(sel) sel.value=matId;
      const man=document.getElementById('m_shopee_manual');
      if(man) man.value='';
      if(bomInfo.total) showToast(`✅ ${mat.code||mat.name} 已建檔，BOM補 ${bomInfo.created} 筆`,'ok',6000);
    }catch(e){showToast('❌ '+e.message,'err');return;}
  }
  if(!matId){showToast('請先選擇或輸入 S-料號','warn');return;}
  mat=mat||mats.find(m=>m.id===matId)||findMatBySku(matId);
  if(!mat){showToast('找不到料件','err');return;}
  try{await ensureShopeeBomRows(mat);}catch(e){showToast('⚠ BOM補建失敗：'+e.message,'warn',7000);}
  window._shopeeOrderItems=window._shopeeOrderItems||[];
  const ex=window._shopeeOrderItems.find(x=>x.matId===matId);
  if(ex) ex.qty+=qty;
  else window._shopeeOrderItems.push({matId,qty,code:mat.code||mat.name,name:mat.name||mat.code});
  renderShopeeOrderItems();
  showToast('✅ 已加入 '+(mat.code||mat.name),'ok');
}

function addNewInboundItem(){
  const code=(document.getElementById('ib_new_code')?.value||'').trim();
  const type=document.getElementById('ib_new_type')?.value||'零件';
  const qty=parseInt(document.getElementById('ib_new_qty')?.value)||1;
  if(!code){showToast('請填入料號','warn');return;}
  if(!window._ibItems) window._ibItems=[];
  if(window._ibItems.find(x=>x.code===code)){showToast('已在清單中','warn');return;}
  window._ibItems.push({matId:null, code, name:'（新建）', qty, isNew:true, newType:type});
  renderIbItems();
  document.getElementById('ib_new_code').value='';
  document.getElementById('ib_new_qty').value='1';
}

function renderIbItems(){
  const container=document.getElementById('ib_items');
  if(!container) return;
  if(!window._ibItems||!window._ibItems.length){
    container.innerHTML='<div style="font-size:0.75rem;color:var(--text3)">尚未加入品項</div>';
    return;
  }
  container.innerHTML=window._ibItems.map((item,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid var(--border)">
      <div style="font-size:0.8125rem">
        <b>${item.code}</b>${item.isNew?` <span style="font-size:0.625rem;color:var(--amber)">[新建 ${item.newType}]</span>`:''}
        <span style="font-size:0.75rem;color:var(--text2);margin-left:6px">× ${item.qty}</span>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" onclick="removeIbItem(${i})">✕</button>
    </div>`).join('');
}

function removeIbItem(idx){
  if(!window._ibItems) return;
  window._ibItems.splice(idx,1);
  renderIbItems();
  filterInboundList(document.getElementById('ib_search')?.value||'');
}

async function submitBatchInbound(){
  if(!window._ibItems||!window._ibItems.length){showToast('請先加入入料品項','warn');return;}
  const note=(document.getElementById('ib_note')?.value||'').trim();
  const today=new Date().toISOString().slice(0,10);
  const yr=today.slice(2,4); const mo=today.slice(5,7);
  closeModal(); showToast(`⏳ 建立 ${window._ibItems.length} 筆入料中...`,'warn');
  let ok=0, fail=0, failMsgs=[];
  for(const item of window._ibItems){
    try{
      let matId = item.matId;
      const inboundType = ['零件','半成品','成品'].includes(item.newType) ? item.newType : '零件';
      // 若是新料號，先建立料件主檔
      if(item.isNew || !matId){
        const newMat = await notionAPI('POST','pages',{parent:{database_id:DB.materials},properties:{
          '料件名稱':{title:[{text:{content:item.code||''}}]},
          '料件編號':{rich_text:[{text:{content:item.code||''}}]},
          '類型':{select:{name:item.newType||'零件'}},
          '目前庫存':{number:0},
          '安全庫存':{number:0},
        }});
        matId = assertNotionPage(newMat,'建立料件').id;
      }
      // 建立入料單
      const inbNo=`IB-${yr}${mo}-${Math.floor(Math.random()*9000+1000)}`;
      const inboundProps={
        '入料單號':  {title:[{text:{content:inbNo}}]},
        '入料數量':  {number:item.qty},
        '品管狀態':  {select:{name:'待品檢'}},
        '入庫狀態':  {select:{name:'待入庫'}},
        '料件類型':  {select:{name:inboundType}},
        '備註':      {rich_text:[{text:{content:note||''}}]},
        '入料日期':  {date:{start:today}},
      };
      if(matId) inboundProps['料件']={relation:[{id:matId}]};
      const inbResult = await notionAPI('POST','pages',{parent:{database_id:DB.inbound},properties:inboundProps});
      assertNotionPage(inbResult,'建立入料單');
      logUserAction('建立入料單',inbNo,`${item.code||''} x ${item.qty}`);
      ok++;
    }catch(e){
      fail++;
      failMsgs.push(`${item.code||'未命名'}：${e.message}`);
      console.error('入料失敗:',item.code,e);
    }
  }
  await refreshAll(true);
  await loadInbounds();
  if(CURRENT_TAB==='inbound'||CURRENT_TAB==='qc') renderTab(CURRENT_TAB);
  showToast(`${fail?'⚠':'✅'} 入料完成：${ok} 筆成功${fail?`，${fail} 筆失敗`:''}（品管頁會讀取入料待品檢）`,fail?'warn':'ok');
  if(failMsgs.length) alert('以下入料建立失敗：\n\n'+failMsgs.join('\n'));
  window._ibItems=[];
}

async function submitLeave(){

  const title=(document.getElementById('lv_title')?.value||'').trim();
  const type=document.getElementById('lv_type')?.value||'年假';
  const days=parseFloat(document.getElementById('lv_days')?.value)||1;
  const hours=parseFloat(document.getElementById('lv_hours')?.value)||leaveHoursFromDays(days);
  const from=document.getElementById('lv_from')?.value||'';
  const to=document.getElementById('lv_to')?.value||'';
  const proxy=(document.getElementById('lv_proxy')?.value||'').trim();
  const reason=(document.getElementById('lv_reason')?.value||'').trim();
  if(!name){showToast('請填寫姓名','warn');return;}
  if(!from){showToast('請選擇開始日期','warn');return;}
  if(to&&new Date(to)<new Date(from)){showToast('結束日期不能早於開始日期','warn');return;}
  closeModal(); showToast('送出請假申請...','warn');
  const applyAt=new Date().toISOString();

    await notionAPI('POST','pages',{parent:{database_id:DB.leave},properties:{
      '申請人姓名':    {title:[{text:{content:name}}]},
      '職稱':          {rich_text:[{text:{content:title||''}}]},
      '假別':          {select:{name:type}},
      '請假天數':      {number:days},
      '請假時數':      {number:hours},

    }});
    const emp=await ensureLeaveEmployeeRecord(name,title,proxy);
    logUserAction('送出請假',name,`${type} ${leaveDurationLabel({days,hours})}`,ROLE);
    await refreshAll();
    showToast(emp?'✅ 請假申請已送出，員工資料已確認':'✅ 請假申請已送出','ok');

async function doApproveLeave(id, status){
  const normalized=normalizeLeaveStatus(status);
  const reviewAt=new Date().toISOString();
  const l=leaves.find(x=>x.id===id);
  const before=l?{...l}:null;
  try{
    await updatePage(id,{
      '審核狀態':{select:{name:normalized}},
      '審核日期':{date:{start:reviewAt}},
      '審核人':{rich_text:[{text:{content:ROLES[ROLE]?.label||ROLE||''}}]},
    });
    if(l) await syncLeaveStatsTransition(before,{...l,status:normalized,reviewDate:reviewAt,reviewer:ROLES[ROLE]?.label||ROLE||''});
    if(l){l.status=normalized;l.reviewDate=reviewAt;l.reviewer=ROLES[ROLE]?.label||ROLE||'';}
    logUserAction('請假審核',l?.name||id,normalized,ROLE);
    renderTab('leave');
    showToast(`✅ 已${normalized}，時間已記錄`,'ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function submitCorder(){
  const manualNo=(document.getElementById('co_no')?.value||'').trim();
  const shopeeNo=(document.getElementById('co_shopee_no')?.value||'').trim();
  const buyer=(document.getElementById('co_buyer')?.value||'').trim();
  const trackingNo=(document.getElementById('co_tracking')?.value||'').trim();
  const matId=(document.getElementById('co_mat')?.value||'').trim();
  const qty=parseInt(document.getElementById('co_qty')?.value)||1;
  const shipMethod=(document.getElementById('co_ship')?.value||'').trim();
  const shipDate=(document.getElementById('co_ship_date')?.value||'').trim();
  const payDate=(document.getElementById('co_pay_date')?.value||'').trim();
  const note=(document.getElementById('co_note')?.value||'').trim();
  if(!matId){showToast('請選擇蝦皮料號','warn');return;}
  const mat=mats.find(m=>m.id===matId);
  if(!mat){showToast('找不到料件','err');return;}
  const orderNo=manualNo||corderExistingNoByShopeeAndBuyer(shopeeNo,buyer)||makeCorderNo();
  closeModal(); showToast('建立 C端訂單中...','warn');
  try{
    const stockDeduct=await deductCorderStockByBom(mat,qty,orderNo,ROLE);
    const stockRef=corderStockRefs(stockDeduct.refs);
    const bomNote=stockDeduct.mode==='bom'
      ? 'BOM扣料：'+stockDeduct.items.map(x=>(x.code||x.name)+'×'+x.needed).join('、')
      : '';
    const props={
      '訂單號碼':   {title:[{text:{content:orderNo}}]},
      '蝦皮訂單號碼':{rich_text:[{text:{content:shopeeNo||''}}]},
      '買家帳號':   {rich_text:[{text:{content:buyer||''}}]},
      '寄件編號':   {rich_text:[{text:{content:trackingNo||''}}]},
      '品名':       {rich_text:[{text:{content:mat.code||mat.name||''}}]},
      '數量':       {number:qty},
      '出貨方式':   {rich_text:[{text:{content:shipMethod||''}}]},
      '狀態':       {select:{name:'出貨中'}},
      '來源':       {select:{name:'手動'}},
      '料件ID':     {rich_text:[{text:{content:stockRef}}]},
      '備註':       {rich_text:[{text:{content:[note,bomNote].filter(Boolean).join(' / ')}}]},
    };
    if(shipDate) props['出日']={date:{start:shipDate}};
    if(payDate)  props['付款時間']={date:{start:payDate}};
    await notionAPI('POST','pages',{parent:{database_id:DB.corders},properties:{
      ...props,
    }});
    await syncToShopee115({no:orderNo,shopeeNo,buyer,matName:mat.code||mat.name,qty,shipMethod,shipDate,payDate,note,trackingNo});
    persistCorderNextNo([orderNo]);
    await refreshAll(); await loadCorders(); renderTab('corders');
    showToast(`✅ C端訂單 ${orderNo} 已建立並扣庫存`,'ok');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function importShopeeExcel(input){
  const file = input.files[0];
  if(!file) return;
  input.value='';
  showToast('⏳ 上傳解析中...','ok');

  try{
    // 蝦皮匯出的 Excel 可能加密，先交給 Worker 處理；未加密檔也會回傳可讀資料。
    const formData = new FormData();
    formData.append('file', file);
    formData.append('password', '576313');

    const workerRes = await fetch(PROXY, {
      method: 'POST',
      body: formData,
    });

    if(!workerRes.ok){
      showToast('❌ Worker 回應異常: '+workerRes.status,'err');
      return;
    }

    const { base64, encrypted, error } = await workerRes.json();
    if(error){
      showToast('❌ 解密失敗: '+error,'err');
      return;
    }

    // \u2500\u2500 \u7528 SheetJS \u8b80\u53d6\u89e3\u5bc6\u5f8c\u7684 xlsx \u2500\u2500
    const binStr = atob(base64);
    const buf = new Uint8Array(binStr.length);
    for(let i=0;i<binStr.length;i++) buf[i]=binStr.charCodeAt(i);

    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if(!rows.length){ showToast('Excel 沒有資料','warn'); return; }

    showToast('⏳ 解析訂單中...','ok');

    const SHIP_MAP = {
      '新竹物流':'新竹物流','蝦皮':'蝦皮','店到家宅配':'店到家','店到家':'店到家',
      '7-11':'7-11','全家':'全家','黑貓宅便':'黑貓宅便',
      'SF順豐':'SF順豐','大榮貨運':'大榮貨運','郵局包裹':'郵局包裹',
    };
    function mapShip(v){
      for(const k in SHIP_MAP){ if(v&&v.toString().includes(k)) return SHIP_MAP[k]; }
      return v||'';
    }
    function rowVal(row, names){
      for(const n of names){
        if(row[n]!==undefined&&row[n]!==null&&String(row[n]).trim()!=='') return String(row[n]).trim();
      }
      return '';
    }
    function dateVal(v){
      const s=String(v||'').trim();
      if(!s) return '';
      return s.slice(0,10).replace(/\//g,'-');
    }

    const incoming=[];
    for(const row of rows){
      const shopeeNo=rowVal(row,['蝦皮訂單號碼','訂單編號','訂單號碼']);
      if(!shopeeNo) continue;
      const orderStatus=rowVal(row,['訂單狀態','狀態']);
      if(/不成立/.test(orderStatus)) continue;
      const sku=rowVal(row,['商品選項貨號']);
      const qty=parseInt(rowVal(row,['數量','商品數量']))||1;
      const buyer=rowVal(row,['買家帳號']);
      const shipMethod=mapShip(rowVal(row,['寄送方式','出貨方式']));
      const shipDate=dateVal(rowVal(row,['實際出貨時間','出日']));
      const payDate=dateVal(rowVal(row,['買家付款時間','付款時間','訂單成立時間']));
      const prodName=rowVal(row,['商品名稱','商品選項名稱']).slice(0,60);
      const trackingNo=rowVal(row,['包裹查詢號碼','寄件編號','物流單號']);
      const unitPrice=rowVal(row,['商品活動價格','買家總支付金額','商品總價','單價']);
      incoming.push({shopeeNo,sku,qty,buyer,shipMethod,shipDate,payDate,prodName,trackingNo,unitPrice,orderStatus});
    }
    if(!incoming.length){ showToast('沒有有效訂單資料','warn'); return; }
    incoming.sort((a,b)=>
      (a.shipMethod||'未設定物流').localeCompare(b.shipMethod||'未設定物流','zh-Hant') ||
      (a.shopeeNo||'').localeCompare(b.shopeeNo||'') ||
      (a.buyer||'').localeCompare(b.buyer||'') ||
      (a.sku||'').localeCompare(b.sku||'')
    );

    showToast('⏳ 匯入 '+incoming.length+' 筆品項...','ok');
    let ok=0, skip=0, warn=0, failed=0;
    const warnList=[];
    const assignedNos=new Map();
    const usedNos=[];
    function assignInternalNo(item){
      const key=corderSameOrderKey(item.shopeeNo,item.buyer);
      const existing=corderExistingNoByShopeeAndBuyer(item.shopeeNo,item.buyer);
      let no=existing||(key?assignedNos.get(key):'')||'';
      if(!no){
        no=nextCorderInternalNo(usedNos);
        usedNos.push(no);
      }
      if(key) assignedNos.set(key,no);
      return no;
    }

    for(const item of incoming){
      item.no=assignInternalNo(item);
      const dup=(window.corders||[]).find(c=>
        ((item.shopeeNo&&c.shopeeNo===item.shopeeNo)||c.no===item.no) &&
        (c.matCode===item.sku||c.matName===item.sku)
      );
      if(dup){skip++;continue;}

      let mat=null, stockRef='', note='';
      if(!item.sku){
        note='⚠ Excel 商品選項貨號空白，庫存未扣除';
        warnList.push((item.shopeeNo||item.no)+'：無料號');
        warn++;
      }else{
        mat=findMatBySku(item.sku);
        if(mat){
          try{
            const stockDeduct=await deductCorderStockByBom(mat,item.qty,item.no,ROLE);
            stockRef=corderStockRefs(stockDeduct.refs);
            if(stockDeduct.mode==='bom'){
              note='BOM扣料：'+stockDeduct.items.map(x=>(x.code||x.name)+'×'+x.needed).join('、');
            }
          }catch(eStock){
            note='⚠ 找到料件但扣庫存失敗：'+eStock.message;
            warnList.push((item.shopeeNo||item.no)+'：'+item.sku+' 扣庫存失敗');
            warn++;
          }
        }else{
          note='⚠ 找不到庫存料號，庫存未扣除：'+item.sku;
          warnList.push((item.shopeeNo||item.no)+'：找不到 '+item.sku);
          warn++;
        }
      }

      const displaySku=item.sku||item.prodName||'(無貨號)';
      const cProps={
        '訂單號碼':{title:[{text:{content:item.no}}]},
        '蝦皮訂單號碼':{rich_text:[{text:{content:item.shopeeNo||''}}]},
        '買家帳號':{rich_text:[{text:{content:item.buyer||''}}]},
        '寄件編號':{rich_text:[{text:{content:item.trackingNo||''}}]},
        '品名':{rich_text:[{text:{content:displaySku}}]},
        '數量':{number:item.qty},
        '單價':{number:parseMoneyNumber(item.unitPrice)},
        '總價':{number:(Number(item.qty)||0)*parseMoneyNumber(item.unitPrice)},
        '出貨方式':{rich_text:[{text:{content:item.shipMethod||''}}]},
        '狀態':{select:{name:'出貨中'}},
        '來源':{select:{name:'蝦皮'}},
        '料件ID':{rich_text:[{text:{content:stockRef}}]},
        '備註':{rich_text:[{text:{content:note}}]},
      };
      if(item.shipDate&&item.shipDate.length===10) cProps['出日']={date:{start:item.shipDate}};
      if(item.payDate&&item.payDate.length===10) cProps['付款時間']={date:{start:item.payDate}};
      try{
        await notionAPI('POST','pages',{parent:{database_id:DB.corders},properties:cProps});
        await syncToShopee115({no:item.no,shopeeNo:item.shopeeNo,buyer:item.buyer,matName:displaySku,qty:item.qty,
          shipMethod:item.shipMethod,shipDate:item.shipDate,payDate:item.payDate||'',note,trackingNo:item.trackingNo,unitPrice:item.unitPrice});
        ok++;
      }catch(eCreate){
        failed++;
        console.error('C端訂單建立失敗:',item,eCreate);
      }
    }

    persistCorderNextNo(usedNos);
    await refreshAll(); await loadCorders(); renderTab(CURRENT_TAB);
    showToast('✅ 匯入完成：新增 '+ok+' 筆'+(skip?' / 跳過 '+skip+' 筆':'')+(warn?' / '+warn+' 筆需確認':'')+(failed?' / 失敗 '+failed+' 筆':''), warn?'warn':'ok');
    if(warnList.length){
      alert('⚠ 以下品項庫存未完整扣除，請確認料件主檔：\n\n'+warnList.slice(0,30).join('\n')+(warnList.length>30?'\n...':''));
    }

  }catch(e){
    showToast('❌ 匯入失敗：'+e.message,'err');
    console.error('importShopeeExcel error:',e);
  }
}

function onCustCodeInput(v){
  const suggest=document.getElementById('custSuggest');
  const match=document.getElementById('custMatch');
  const hidden=document.getElementById('m_cust');
  const codeMsg=document.getElementById('codeMsg');
  if(suggest) suggest.style.display='none';
  if(!v){if(codeMsg)codeMsg.textContent='';return;}
  const results=customers.filter(c=>(c.type==='overseas'||!c.type)&&
    (c.code||'').toLowerCase().includes(v.toLowerCase())||
    ((c.type==='overseas'||!c.type)&&(c.name||'').toLowerCase().includes(v.toLowerCase()))
  ).slice(0,8);
  if(!results.length){if(codeMsg)codeMsg.innerHTML='<span style="color:var(--amber)">⚠ 無符合客戶，可直接用於本訂單，不會寫入客戶總檔</span>';return;}
  if(suggest){
    suggest.style.display='';
    suggest.innerHTML=results.map(c=>`<div onclick="selectCust('${c.id}','${(c.code||'').replace(/'/g,"\\'")}','${(c.name||'').replace(/'/g,"\\'")}','${c.type||'overseas'}')"
      style="padding:8px 12px;cursor:pointer;font-size:0.8125rem;border-bottom:1px solid var(--border)"
      onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background=''">
      <b>${c.code||''}</b> — ${c.name||''}
      <span style="font-size:0.625rem;color:var(--text3);margin-left:6px">${c.region||''}</span>
    </div>`).join('');
  }
}

function selectCust(id,code,name,type){
  document.getElementById('m_cust').value=id;
  document.getElementById('m_code').value=`${code} — ${name}`;
  const suggest=document.getElementById('custSuggest');
  if(suggest) suggest.style.display='none';
  const match=document.getElementById('custMatch');
  const matchText=document.getElementById('custMatchText');
  if(match&&matchText){
    match.style.display='flex';
    matchText.textContent=`✅ ${code} — ${name}`;
  }
  const codeMsg=document.getElementById('codeMsg');
  if(codeMsg) codeMsg.textContent='';
}

async function fetchPIFromNotion(){
  const btn=document.getElementById('fetchPIBtn');
  const list=document.getElementById('piNotionList');
  if(!btn||!list) return;
  const selectedId=document.getElementById('m_cust')?.value||'';
  const selected=customers.find(c=>c.id===selectedId);
  const rawInput=(document.getElementById('m_code')?.value||selected?.code||'').trim();
  const codeCandidates=[...(selected?.code?extractPICodeCandidates(selected.code):[]),...extractPICodeCandidates(rawInput)];
  const queryCode=codeCandidates[0]||rawInput.replace(/\s+—.*$/,'').trim();
  if(!queryCode){
    showToast('請先輸入或選擇客戶編號，再抓 Notion PI','warn');
    return;
  }
  btn.disabled=true; btn.textContent='⏳ 載入中...';
  list.style.display=''; list.innerHTML='<div style="padding:8px;font-size:0.75rem;color:var(--text3)">搜尋中...</div>';
  try{
    let customer=selected||findPICustomer(codeCandidates);
    if(!customer){
      customer=customers.find(c=>(c.type==='overseas'||!c.type)&&String(c.code||'').toUpperCase().includes(queryCode.toUpperCase()));
    }
    let files=[];
    if(customer?.id){
      files=await collectPIFilesFromPage(customer.id,0,customer.code||queryCode);
    }
    if(!files.length){
      const r=await notionSearch(queryCode);
      const pages=(r?.results||[]).filter(p=>p.object==='page');
      for(const p of pages.slice(0,8)){
        files=files.concat(await collectPIFilesFromPage(p.id,0,queryCode));
      }
    }
    files=dedupePIFiles(files);
    window._piCandidates=files;
    if(!files.length){list.innerHTML=`<div style="padding:8px;font-size:0.75rem;color:var(--text3)">找不到 ${escapeHtml(queryCode)} 的 PI Excel/PDF</div>`;return;}
    list.innerHTML=files.map((f,i)=>`<div class="pi-item" id="pii_${i}" onclick="loadPICandidate(${i})"
      style="padding:9px 12px;cursor:pointer;font-size:0.8125rem;border-bottom:1px solid var(--border)"
      onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background=''">
      <div style="display:flex;justify-content:space-between;gap:8px"><span>${f.kind==='excel'?'📊':'📄'} ${escapeHtml(f.title)}</span><span class="pi-status" style="color:var(--text3);font-size:0.6875rem">${f.kind==='excel'?'Excel':'PDF'}</span></div>
      <div style="font-size:0.6875rem;color:var(--text3);margin-top:2px">${escapeHtml(f.path||customer?.code||queryCode)}</div>
    </div>`).join('');
  }catch(e){
    list.innerHTML=`<div style="padding:8px;font-size:0.75rem;color:var(--red)">❌ ${e.message}</div>`;
  }finally{
    btn.textContent='📂 抓 Notion PI'; btn.disabled=false;
  }
}

async function collectPIFilesFromPage(pageId,depth=0,path=''){
  if(depth>3) return [];
  let blocks;
  try{blocks=await getBlockChildren(pageId);}catch{return [];}
  const out=[];
  for(const b of blocks.results||[]){
    if(b.type==='file'){
      const fd=b.file||{};
      const name=fd.name||'PI';
      const url=fd.file?.url||fd.external?.url||'';
      const lower=name.toLowerCase();
      if(url&&(lower.endsWith('.xlsx')||lower.endsWith('.xls')||lower.endsWith('.pdf'))){
        out.push({title:name,url,kind:lower.endsWith('.pdf')?'pdf':'excel',path});
      }
    }else if(b.type==='child_page'){
      const title=b.child_page?.title||'';
      const childPath=[path,title].filter(Boolean).join(' / ');
      out.push(...await collectPIFilesFromPage(b.id,depth+1,childPath));
    }
  }
  return out;
}

function dedupePIFiles(files){
  const map=new Map();
  for(const f of files){
    const base=String(f.title||'').replace(/\.(xlsx|xls|pdf)$/i,'').toUpperCase();
    const prev=map.get(base);
    if(!prev||(prev.kind==='pdf'&&f.kind==='excel')) map.set(base,f);
  }
  return [...map.values()].sort((a,b)=>a.title.localeCompare(b.title));
}

function rowsFromWorkbook(wb){
  const sheetName=wb?.SheetNames?.[0];
  if(!sheetName||!wb.Sheets?.[sheetName]) throw new Error('Excel 沒有可讀取的工作表');
  return XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null});
}

function isExcelLikeBuffer(buf){
  const u=new Uint8Array(buf||[]);
  if(u.length<4) return false;
  return (u[0]===0x50&&u[1]===0x4B) || (u[0]===0xD0&&u[1]===0xCF&&u[2]===0x11&&u[3]===0xE0);
}

async function piRowsFromArrayBuffer(buf,fileName='PI.xlsx'){
  if(!isExcelLikeBuffer(buf)){
    throw new Error('下載內容不是 Excel 檔，可能是 Notion 檔案連結過期或下載被轉成錯誤頁');
  }
  try{
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    return rowsFromWorkbook(wb);
  }catch(firstErr){
    const formData=new FormData();
    formData.append('file',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileName);
    formData.append('password','576313');
    const res=await fetch(PROXY,{method:'POST',body:formData});
    if(!res.ok) throw firstErr;
    const json=await res.json().catch(()=>null);
    if(!json?.base64) throw firstErr;
    const binStr=atob(json.base64);
    const bytes=new Uint8Array(binStr.length);
    for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);
    const wb2=XLSX.read(bytes,{type:'array'});
    return rowsFromWorkbook(wb2);
  }
}

async function loadPICandidate(idx){
  const f=window._piCandidates?.[idx];
  if(!f) return;
  document.querySelectorAll('.pi-item').forEach(e=>e.classList.remove('selected'));
  const el=document.getElementById('pii_'+idx);if(el)el.classList.add('selected');
  const status=el?.querySelector('.pi-status');
  if(f.kind==='pdf'){
    if(status)status.innerHTML=`<a href="${f.url}" target="_blank" style="color:var(--blue)">開啟 PDF</a>`;
    showToast('此 PI 只有 PDF，請手動輸入或改選 Excel','warn');
    return;
  }
  if(status)status.textContent='下載中...';
  try{
    const buf=await downloadViaProxy(f.url);
    const rows=await piRowsFromArrayBuffer(buf,f.title);
    const items=await parsePIRows(rows,f.title.replace(/\.xlsx?$/i,''));
    if(status)status.textContent=`已讀 ${items.length} 項`;
    showToast(`✅ PI「${f.title}」讀取成功`,'ok');
  }catch(e){
    if(status)status.textContent='讀取失敗';
    showToast('PI 讀取失敗：'+e.message,'err');
  }
}



function parsePIFile(input){
  const file=input.files?.[0]; if(!file) return;
  const info=document.getElementById('piInfo');
  if(info) info.textContent='⏳ 解析 PI Excel 中...';

  // 先嘗試直接讀取（未加密 Excel）
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      await parsePIRows(rowsFromWorkbook(wb), file.name.replace(/\.xlsx?$/i,''));
    }catch(err){
      // 可能是加密，嘗試送 Worker 解密
      if(info) info.textContent='⏳ 上傳解密中（約 5-15 秒）...';
      try{
        const formData=new FormData();
        formData.append('file', file);
        formData.append('password','576313');
        const controller=new AbortController();
        const tid=setTimeout(()=>controller.abort(), 60000);
        let res;
        try{
          res=await fetch(PROXY,{method:'POST',body:formData,signal:controller.signal});
        }catch(fe){
          clearTimeout(tid);
          if(info) info.textContent=fe.name==='AbortError'?'❌ 解密超時（60秒），請重試':'❌ 無法連線 Worker：'+fe.message;
          input.value=''; return;
        }
        clearTimeout(tid);
        if(!res.ok){if(info)info.textContent='❌ Worker 錯誤：HTTP '+res.status; input.value=''; return;}
        const json=await res.json();
        if(json.error){if(info)info.textContent='❌ 解密失敗：'+json.error; input.value=''; return;}
        if(!json.base64){if(info)info.textContent='❌ Worker 未回傳資料'; input.value=''; return;}
        // 解碼 base64
        const binary=atob(json.base64);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        const wb2=XLSX.read(bytes,{type:'array'});
        await parsePIRows(rowsFromWorkbook(wb2), file.name.replace(/\.xlsx?$/i,''));
      }catch(e2){
        if(info) info.textContent='❌ 解密失敗：'+e2.message;
        input.value='';
      }
    }
  };
  reader.readAsArrayBuffer(file);
  input.value='';
}

async function parsePIRows(rows, piName){
  const info=document.getElementById('piInfo');
  try{
    const result=extractPIResult(rows,piName);
    if(!result.items.length) throw new Error('找不到品項料號與數量');
    await ensurePICustomer(result);
    if(result.orderNo&&document.getElementById('m_order_no')) document.getElementById('m_order_no').value=result.orderNo;
    if(result.piNo&&document.getElementById('m_note')) document.getElementById('m_note').value='PI No: '+result.piNo;
    // PI 日期是開單日，不當成交期；交期保留給使用者確認填寫。
    showMultiItems(result.items,result.piNo||piName);
    const first=result.items[0];
    const prodSel=document.getElementById('m_product');
    if(prodSel&&first){
      const mat=mats.find(m=>(m.code||'').toUpperCase()===first.model.toUpperCase()||(m.name||'').toUpperCase()===first.model.toUpperCase());
      if(mat) prodSel.value=mat.id;
      if(document.getElementById('m_qty')) document.getElementById('m_qty').value=first.qty||1;
    }
    if(info) info.innerHTML=`✅ PI 解析完成：訂單 <b>${escapeHtml(result.orderNo||result.piNo||piName)}</b>，客戶 <b>${escapeHtml(result.customerCode||'已比對')}</b>，共 <b>${result.items.length}</b> 種品項。請確認交期後建立訂單。`;
    return result.items;
  }catch(e){
    if(info) info.textContent='❌ PI 解析失敗：'+e.message;
    throw e;
  }
}

  parsePIFile(input);
}

async function submitNormalOrder(isDomestic){

  const domManual=(document.getElementById('m_dom_manual')?.value||'').trim();
  const custId = isDomestic ? domSel?.value : document.getElementById('m_cust')?.value;

  const custName = isDomestic
    ? (domManual || selectedCust?.name || domSel?.options[domSel?.selectedIndex]?.dataset?.name || domSel?.options[domSel?.selectedIndex]?.text?.replace(/\s*\([^)]*\)\s*$/,'') || '')
    : (selectedCust?.name || (document.getElementById('m_newcust_name')?.value||'').trim() || '');
  const custCode = selectedCust?.code || '';
  const productId=document.getElementById('m_product')?.value;
  const productInput=(document.getElementById('m_product_search')?.value||'').trim();
  const qty=parseInt(document.getElementById('m_qty')?.value)||1;
  const deadline=document.getElementById('m_date')?.value||'';
  const note=document.getElementById('m_note')?.value?.trim()||'';
  const orderType=isDomestic?'國內':'國外';
  const manualOrderNo=(document.getElementById('m_order_no')?.value||'').trim();
  const piItems=!isDomestic?getSelectedPIItems():[];
  const piNo=document.getElementById('piMultiList')?.dataset?.pino||'';

  if(!custName){showToast(isDomestic?'請選擇或手動輸入國內客戶':'請選擇或輸入國外客戶','warn');return;}
  if(!deadline){showToast('請填入交期','warn');return;}
  if(!manualOrderNo){showToast('請輸入訂單號，或先讀取 PI 自動帶入','warn');return;}
  if(!piItems.length&&!productId&&!productInput){showToast('請選擇成品、輸入新料號，或先讀取 PI 品項','warn');return;}

  const product=mats.find(m=>m.id===productId);
  closeModal(); showToast('建立訂單中...','warn');
  try{
    const buildItems=piItems.length?piItems:[{model:product?.code||product?.name||productInput,qty,matId:productId}];
    let ok=0,fail=0,failList=[];
    for(let i=0;i<buildItems.length;i++){
        const item=buildItems[i];
      try{
        const mat=item.matId?mats.find(m=>m.id===item.matId):await ensureOrderProduct(item.model,100);
        if(!mat) throw new Error('找不到料號 '+(item.model||''));
        const orderNo=manualOrderNo;
        const props={
          '訂單號':    {title:[{text:{content:orderNo}}]},
          '客戶名稱':  {select:{name:(!isDomestic&&(custCode||selectedCust?.code))||custName||'未知'}},
          '訂購數量':  {number:Number(item.qty)||1},
          '狀態':      {select:{name:'待排程'}},
          '訂單類型':  {select:{name:orderType}},
          '業務備註':  {rich_text:[{text:{content:[note,piNo?`PI: ${piNo}`:''].filter(Boolean).join(' / ')}}]},
          '成品':      {relation:[{id:mat.id}]},
          '交期':      {date:{start:deadline}},
        };
        if(piNo) props['PI單號']={rich_text:[{text:{content:piNo}}]};
        await notionAPI('POST','pages',{parent:{database_id:DB.orders},properties:props});
        if(isDomestic){
          await syncToDomesticTrade115({
            orderNo,
            custName:custName||'未知',
            custCode,
            productName:mat?.code||mat?.name||'',
            qty:Number(item.qty)||1,
            deadline,
            note
          });
        }
        logUserAction('建立訂單',orderNo,`${custName||'未知'} ${mat?.code||mat?.name||''} x ${Number(item.qty)||1}`,ROLE);
        ok++;
      }catch(itemErr){
        fail++;
        failList.push(item.model||product?.code||'未知料號');
        console.error('建立訂單品項失敗:',item,itemErr);
      }
    }
    await refreshAll();
    showToast(`${fail?'⚠':'✅'} 建立 ${ok}/${buildItems.length} 筆訂單${isDomestic?'，已同步 115年貿易商':''}${fail?'，失敗：'+failList.join('、'):''}`,fail?'warn':'ok');
  }catch(e){showToast('❌ 建立失敗：'+e.message,'err'); if(btn){btn.disabled=false;btn.textContent='📋 建立訂單';}}
}

      buyer:getRichText(p.properties,'買家帳號')||getRichText(p.properties,'客戶'),
      customerName:getRichText(p.properties,'客戶名稱','客戶姓名','收件人')||p.properties?.['客戶名稱']?.select?.name||p.properties?.['客戶姓名']?.select?.name||p.properties?.['收件人']?.select?.name||'',
      matCode:getRichText(p.properties,'料件編號')||getRichText(p.properties,'商品')||getRichText(p.properties,'品名'),
      matName:getRichText(p.properties,'商品名稱')||getRichText(p.properties,'品名'),
      qty:p.properties?.['數量']?.number??0,
      status:p.properties?.['狀態']?.select?.name||'出貨中',
      shipMethod:getRichText(p.properties,'出貨方式'),
      trackingNo:getRichText(p.properties,'寄件編號')||getRichText(p.properties,'包裹查詢號碼'),
      shipDate:p.properties?.['出日']?.date?.start||p.properties?.['出貨日期']?.date?.start||'',
      payDate:p.properties?.['付款時間']?.date?.start||'',
      source:p.properties?.['來源']?.select?.name||p.properties?.['來源']?.multi_select?.map(x=>x.name).join('、')||'',
      matId:getRichText(p.properties,'料件ID'),
      note:getRichText(p.properties,'備註'),
      created:p.created_time?.slice(0,10)||'',
    }));
    window._cordersLoaded=true;
    window._cordersLoadedAt=Date.now();
    await autoCompleteCordersAfter7Days();
  }catch(e){window._cordersLoaded=false;window.corders=[];console.warn('loadCorders 失敗:',e);}
}

async function autoCompleteCordersAfter7Days(){
  if(window._autoCompletingCorders) return;
  const now=Date.now();
  if(window._lastCorderAutoCompleteAt && now-window._lastCorderAutoCompleteAt<120000) return;
  window._lastCorderAutoCompleteAt=now;
  const today=new Date();
  today.setHours(0,0,0,0);
  const targets=(window.corders||[]).filter(o=>{
    if(o.status!=='出貨中') return false;
    const base=o.shipDate||o.created||'';
    if(!base) return false;
    const d=new Date(base);
    if(isNaN(d.getTime())) return false;
    d.setHours(0,0,0,0);
    return Math.floor((today-d)/86400000)>=7;
  });
  if(!targets.length) return;
  window._autoCompletingCorders=true;
  let ok=0;
  try{
    for(const o of targets){
      try{
        await updatePage(o.id,{'狀態':{select:{name:'已完成'}}});
        o.status='已完成';
        ok++;
        logUserAction('C端訂單自動完成',o.no||o.id,'出貨中滿7天，自動改為已完成',ROLE);
      }catch(e){
        console.warn('[C端自動完成] 失敗:',o.no||o.id,e);
      }
    }
    if(ok) showToast(`✅ ${ok} 筆 C端訂單已滿 7 天，自動更新為已完成`,'ok');
  }finally{
    window._autoCompletingCorders=false;
  }
}

function switchOrderTab(type){
  const tabs = ['overseas','domestic','sfg','shopee'];
  tabs.forEach(t=>{
    const block = document.getElementById('block'+t.charAt(0).toUpperCase()+t.slice(1));
    const tab   = document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1));
    if(block) block.style.display = (t===type)?'':'none';
    if(tab){
      tab.className='btn '+(t===type?'btn-blue':'btn-ghost');
      tab.style.cssText='flex:1;justify-content:center;font-size:0.75rem';
    }
  });
  const itemAddRow = document.getElementById('itemAddRow');
  const dateRow    = document.getElementById('dateRow');
  const orderNoRow = document.getElementById('orderNoRow');
  if(itemAddRow) itemAddRow.style.display = (type==='sfg'||type==='shopee')?'none':'flex';
  if(dateRow)    dateRow.style.display    = (type==='sfg'||type==='shopee')?'none':'';
  if(orderNoRow) orderNoRow.style.display = (type==='sfg'||type==='shopee')?'none':'';
  if(type==='domestic'){
    initDomesticList();
  }
  if(type==='sfg'){
    const sel=document.getElementById('m_sfg_sel');
    if(sel) sel.style.display='block';
  }
  if(type==='shopee'){
    initShopeeOrderList();
  }
}

async function submitAllOrders(){
  const btn = document.getElementById('orderSubmitBtn');
  if(btn){ btn.disabled=true; btn.textContent='建立中...'; }
  const shopeeBlock = document.getElementById('blockShopee');
  const isShopee = shopeeBlock && shopeeBlock.style.display !== 'none';
  if(isShopee){ await submitShopeeOrdersV2(); if(btn){btn.disabled=false;btn.textContent='📋 建立訂單';} return; }
  const isSfg      = document.getElementById('blockSfg')?.style.display !== 'none';
  const isDomestic = !isSfg && document.getElementById('blockDomestic')?.style.display !== 'none';
  const orderTypeTab = isSfg?'sfg':isDomestic?'domestic':'overseas';
  try{
    if(isSfg){
      await submitSFGOrder();
    } else {
      await submitNormalOrder(isDomestic);
    }
  }catch(e){
    showToast('❌ 建立訂單失敗：'+e.message,'err');
    console.error('submitAllOrders error:',e);
  }
  if(btn){btn.disabled=false;btn.textContent='📋 建立訂單';}
}

async function submitShopeeOrdersV2(){
  const note=document.getElementById('m_shopee_note')?.value?.trim()||'';
  let items=window._shopeeOrderItems||[];
  const selected=document.getElementById('m_shopee_sku')?.value;
  if(!items.length&&selected){
    let mat=null;
    if(selected.startsWith('NEW::')){
      mat=await ensureShopeeParentMaterial(selected.slice(5));
      await ensureShopeeBomRows(mat);
    }else{
      mat=mats.find(m=>m.id===selected)||findMatBySku(selected);
    }
    if(mat) items=[{matId:mat.id,qty:parseInt(document.getElementById('m_shopee_qty')?.value)||1,code:mat.code||mat.name,name:mat.name||mat.code}];
  }
  if(!items.length){showToast('請至少加入一個 S-料號','warn');return;}
  const today=new Date().toISOString().slice(0,10);
  const yr=today.slice(2,4), mo=today.slice(5,7);
  closeModal(); showToast('⏳ 建立蝦皮待排程訂單...','ok');
  let ok=0, fail=0, messages=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    let mat=mats.find(m=>m.id===it.matId)||findMatBySku(it.code||it.name||it.matId);
    if(!mat){
      try{mat=await ensureShopeeParentMaterial(it.code||it.name||it.matId);}
      catch(e){fail++;messages.push((it.code||it.name||'')+'：'+e.message);continue;}
    }
    const orderNo=`ORD-${yr}${mo}-S${String(i+1).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;
    try{
      await ensureShopeeBomRows(mat);
      const bomItems=explodeBOM(mat.id,it.qty);
      if(!bomItems.length) throw new Error('此 S-料號尚未設定 BOM 或主料/配件備註，無法建立可領料訂單');
      const missing=bomItems.filter(x=>x.missing||!x.id);
      if(missing.length) throw new Error('BOM 子料號未建檔：'+missing.map(x=>x.code||x.name).join('、'));
      const props={
        '訂單號':{title:[{text:{content:orderNo}}]},
        '客戶名稱':{select:{name:'蝦皮'}},
        '成品':{relation:[{id:mat.id}]},
        '訂購數量':{number:it.qty},
        '狀態':{select:{name:'待排程'}},
        '訂單類型':{select:{name:'蝦皮'}},
        '業務備註':{rich_text:[{text:{content:[`S料號：${mat.code||mat.name}`,note,'預計扣料：'+bomItems.map(x=>(x.code||x.name)+'×'+x.needed).join('、')].filter(Boolean).join(' / ')}}]},
      };
      props['交期']={date:{start:today}};
      const r=await notionAPI('POST','pages',{parent:{database_id:DB.orders},properties:props});
      if(!r||r.object!=='page') throw new Error(r?.message||'訂單建立失敗');
      logUserAction('建立蝦皮訂單',orderNo,`${mat.code||mat.name} x ${it.qty}`,ROLE);
      ok++;
    }catch(e){
      fail++;
      messages.push((mat.code||mat.name)+'：'+e.message);
    }
  }
  window._shopeeOrderItems=[];
  await refreshAll();
  showToast(`✅ 蝦皮待排程訂單建立 ${ok} 筆${fail?'，失敗 '+fail+' 筆':''}`,fail?'warn':'ok');
  if(messages.length) alert('以下 S-料號未完成建立：\n\n'+messages.join('\n'));
}

async function submitShopeeOrder(){
  return submitShopeeOrdersV2();
}

async function completeShopeeOrder(orderId, orderNo, skuCode, qty){
  if(!confirm(`確認完成訂單 ${orderNo}？\n完成後將增加 ${skuCode} 庫存 ${qty||1} 個（成品入庫）。`)) return;
  try{
    await updatePage(orderId,{'狀態':{select:{name:'已完成'}}});
    const ord = orders.find(o=>o.id===orderId);
    if(ord) ord.status='已完成';
    const sku = mats.find(m=>m.code===skuCode);
    if(sku){
      const addQty = qty||1;
      const latest = await notionAPI('GET','pages/'+sku.id);
      const curQty = latest?.properties?.['目前庫存']?.number ?? sku.qty ?? sku.stock ?? 0;
      const newQty = curQty + addQty;
      await updatePage(sku.id,{'目前庫存':{number:newQty}});
      await logStockChange(sku.id, sku.name||skuCode, sku.code||skuCode, '蝦皮完成入庫', addQty, curQty, newQty, orderNo, ROLE);
      logUserAction('完成蝦皮訂單',orderNo,`${skuCode} x ${addQty}`,ROLE);
      sku.qty = newQty;
      sku.stock = newQty;
    }
    await refreshAll(); renderTab(CURRENT_TAB);
    showToast(`✅ 訂單 ${orderNo} 已完成，${skuCode} 庫存已更新`,'ok');
  }catch(e){ showToast('❌ '+e.message,'err'); }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      const promptReload=()=>{
        setSyncState('已有新版程式，點此更新','update',true);
        const btn=document.getElementById('syncFloat');
        if(btn) btn.onclick=()=>{
          if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
          else location.reload();
        };
      };
      if(reg.waiting) promptReload();
      reg.update().catch(()=>{});
      setInterval(()=>reg.update().catch(()=>{}), 10*60*1000);
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible') reg.update().catch(()=>{});
      });
      reg.addEventListener('updatefound', () => {
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            promptReload();
          }
        });
      });
    }).catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!window._swReloading){
      window._swReloading=true;
      location.reload();
    }
  });
}
