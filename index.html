/* ══════════════════════════════════════════════
   LEMATEC ERP 主題系統 — 5 種精選配色
   即時切換、localStorage 保存、無需重整
   ══════════════════════════════════════════════ */

/* 共用字型變數 */
:root{
  --bg:#05080f;--bg2:#0a0f1e;--bg3:#0f1628;--bg4:#151d35;--bg5:#1c2640;
  --border:#1a2438;--border2:#243352;--border3:#2d4068;
  --brand:#9c1b2c;--brand2:#c5243e;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#06b6d4;--cyan2:#22d3ee;
  --green:#10b981;--green2:#34d399;--yellow:#f59e0b;--amber:#fbbf24;
  --red:#ef4444;--red2:#f87171;--purple:#8b5cf6;
  --text:#f0f4ff;--text2:#a0aec0;--text3:#55657a;
  --f-ui:'Outfit','Noto Sans TC',system-ui,sans-serif;
  --f-mono:'DM Mono',monospace;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius-card:14px;
}
/* ══════════════════════════════
   主題覆蓋（不影響 :root 預設值）
   選擇後即時覆蓋，不選則用科技風
   ══════════════════════════════ */

/* 🌿 自然風 */
html[data-theme="nature"]{
  --bg:#0f1a12;--bg2:#162118;--bg3:#1c2e20;--bg4:#243a28;--bg5:#2c4832;
  --border:#2a3d2e;--border2:#3a5540;--border3:#4a6e52;
  --brand:#2d6a4f;--brand2:#40916c;
  --blue:#52b788;--blue2:#74c69d;--cyan:#95d5b2;--cyan2:#b7e4c7;
  --green:#2d6a4f;--green2:#40916c;--yellow:#d4a017;--amber:#e9c46a;
  --red:#c44536;--red2:#e07a5f;--purple:#7b6d8d;
  --text:#d8f3dc;--text2:#95b8a0;--text3:#52796f;
  --shadow:0 4px 24px rgba(0,0,0,.4);--radius-card:16px;
}
/* ⬜ 極簡風（深灰）*/
html[data-theme="minimal"]{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;--bg4:#2a2a2a;--bg5:#333333;
  --border:#2c2c2c;--border2:#383838;--border3:#444444;
  --brand:#505050;--brand2:#707070;
  --blue:#6e9ef5;--blue2:#8fb3f8;--cyan:#5bc4d6;--cyan2:#7dd4e3;
  --green:#5fbd8a;--green2:#79cea0;--yellow:#d4a843;--amber:#e8c56e;
  --red:#d9534f;--red2:#e57573;--purple:#9b8ec4;
  --text:#ebebeb;--text2:#9a9a9a;--text3:#585858;
  --shadow:0 4px 20px rgba(0,0,0,.6);--radius-card:8px;
}


/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌌 科技深藍（預設）- 深邃宇宙藍，高對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root, html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌙 深紫夜色 - 優雅暗紫，眼睛最舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌿 森林綠意 - 沉穩深綠，自然舒適
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🔥 琥珀暗金 - 溫暖金棕，高貴沉穩
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ⬛ 碳黑極簡 - 純粹黑灰，最大對比
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html
html{font-size:1rem;}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px;}

/* ── Input ── */
.inp{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-family:var(--f-ui);font-size:0.875rem;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18);}
.inp::placeholder{color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;}
select.inp>option{background:var(--bg3);color:var(--text);}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;font-family:var(--f-ui);font-size:0.875rem;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;-webkit-user-select:none;user-select:none;white-space:nowrap;letter-spacing:.2px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 16px rgba(156,27,44,.35);}
.btn-primary:hover{box-shadow:0 6px 24px rgba(156,27,44,.5);}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3);}
.btn-blue:hover{background:#2563eb;box-shadow:0 6px 22px rgba(59,130,246,.45);}
.btn-blue:disabled{background:var(--text3);box-shadow:none;}
.btn-green{background:rgba(16,185,129,.15);color:var(--green2);border:1px solid rgba(16,185,129,.3);}
.btn-green:hover{background:rgba(16,185,129,.25);}
.btn-red{background:rgba(239,68,68,.12);color:var(--red2);border:1px solid rgba(239,68,68,.25);}
.btn-yellow{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25);}
.btn-ghost{background:var(--bg4);color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--bg5);color:var(--text);border-color:var(--border3);}
.btn-cyan{background:rgba(6,182,212,.12);color:var(--cyan2);border:1px solid rgba(6,182,212,.25);}
.btn-sm{padding:6px 14px;font-size:0.75rem;border-radius:7px;}
.btn-xs{padding:4px 10px;font-size:0.6875rem;border-radius:6px;}
.btn-full{width:100%;justify-content:center;}
/* ════════════════════════════════════════════
   設計配色系統 — 基於配色學原則
   原則：
   · 微帶色調的深色面（非純黑）減少視覺疲勞
   · WCAG AA 對比度：文字 ≥ 4.5:1
   · 高亮色飽和度略降，避免在暗底上震動
   · 表面明度隨層次遞增（elevation system）
   ════════════════════════════════════════════ */

/* 🌊 深海藍（冷靜專業，數據儀表板首選）*/
html[data-theme="ocean"]{
  --bg:#050e1a;--bg2:#091525;--bg3:#0e1f38;--bg4:#142a4d;--bg5:#1a3562;
  --border:#1a2e45;--border2:#254262;--border3:#305580;
  --brand:#0e4d8a;--brand2:#1a6fc4;
  --blue:#2196f3;--blue2:#64b5f6;--cyan:#00bcd4;--cyan2:#4dd0e1;
  --green:#00c853;--green2:#69f0ae;--yellow:#ffca28;--amber:#ffd54f;
  --red:#f44336;--red2:#ef9a9a;--purple:#7c4dff;
  --text:#e3f2fd;--text2:#90b8d4;--text3:#4a6e8a;
  --shadow:0 4px 28px rgba(0,0,0,.55);--radius-card:12px;
}

/* 🔥 暗夜紫（深沉優雅，電商/創意工具）*/
html[data-theme="violet"]{
  --bg:#0d0815;--bg2:#130d1f;--bg3:#1a1229;--bg4:#221834;--bg5:#2b1f42;
  --border:#2d1f45;--border2:#3d2b5f;--border3:#4e3878;
  --brand:#6a1b9a;--brand2:#9c27b0;
  --blue:#7c83fd;--blue2:#a5aaf8;--cyan:#c77dff;--cyan2:#da9fff;
  --green:#69f0ae;--green2:#b9f6ca;--yellow:#ffd740;--amber:#ffec80;
  --red:#ff5252;--red2:#ff8a80;--purple:#ea80fc;
  --text:#ede7f6;--text2:#b39ddb;--text3:#6e5b8a;
  --shadow:0 4px 28px rgba(0,0,0,.6);--radius-card:14px;
}

/* 🌅 暖焦糖（溫暖工業感，製造業ERP最適）*/
html[data-theme="amber"]{
  --bg:#120c04;--bg2:#1c1208;--bg3:#26190d;--bg4:#322113;--bg5:#3d2a19;
  --border:#3a2410;--border2:#4e3218;--border3:#624021;
  --brand:#b35a00;--brand2:#e07800;
  --blue:#4fc3f7;--blue2:#81d4fa;--cyan:#f9a825;--cyan2:#ffd54f;
  --green:#66bb6a;--green2:#a5d6a7;--yellow:#ffb300;--amber:#ffd54f;
  --red:#ef5350;--red2:#ef9a9a;--purple:#ab47bc;
  --text:#fff8f0;--text2:#c8a882;--text3:#7a5c38;
  --shadow:0 4px 24px rgba(0,0,0,.5);--radius-card:10px;
}

/* 🩶 鈦金灰（高端工業，精密感）*/
html[data-theme="titanium"]{
  --bg:#0c0d0f;--bg2:#131518;--bg3:#1a1d22;--bg4:#22262d;--bg5:#2b3038;
  --border:#252930;--border2:#313740;--border3:#3e4550;
  --brand:#37474f;--brand2:#546e7a;
  --blue:#82b1ff;--blue2:#a4c8ff;--cyan:#64ffda;--cyan2:#9efff0;
  --green:#69f0ae;--green2:#b9f6ca;--yellow:#ffe57f;--amber:#ffd740;
  --red:#ff6e6e;--red2:#ffab91;--purple:#b388ff;
  --text:#eceff1;--text2:#90a4ae;--text3:#546e7a;
  --shadow:0 4px 20px rgba(0,0,0,.65);--radius-card:6px;
}

/* 🌸 玫瑰金（精緻商務，高端感）*/
html[data-theme="rose"]{
  --bg:#130b0e;--bg2:#1c1013;--bg3:#25161a;--bg4:#2e1c21;--bg5:#382228;
  --border:#3a1e24;--border2:#4e2830;--border3:#62333c;
  --brand:#880e4f;--brand2:#c2185b;
  --blue:#f48fb1;--blue2:#f8bbd9;--cyan:#f06292;--cyan2:#f8bbd9;
  --green:#a5d6a7;--green2:#c8e6c9;--yellow:#ffe082;--amber:#ffd54f;
  --red:#ff1744;--red2:#ff80ab;--purple:#ce93d8;
  --text:#fce4ec;--text2:#d4a0aa;--text3:#8a5562;
  --shadow:0 4px 24px rgba(0,0,0,.55);--radius-card:16px;
}


/* ══════════════════════════════════════
   LOGIN PAGE
══════════════════════════════════════ */
.login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;z-index:100;padding:16px;
}
.brand{font-family:var(--f-mono);font-size:0.75rem;font-weight:400;letter-spacing:5px;color:var(--text3);}
.login-screen h1{font-family:var(--f-ui);font-size:1.625rem;font-weight:800;color:var(--text);letter-spacing:.3px;margin-top:-8px;text-align:center;}

/* Login card */
.card{
  background:var(--bg2);border:1px solid var(--border2);border-radius:16px;
  padding:24px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.card .field{margin-bottom:14px;}
.card .field>label{display:block;font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600;}

/* Token input + 清除按鈕 */
.token-wrap{position:relative;}
.token-wrap .inp{padding-right:54px;}
.show-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:var(--bg4);border:1px solid var(--border2);border-radius:5px;
  color:var(--text3);cursor:pointer;font-size:0.625rem;padding:3px 8px;
  font-family:var(--f-ui);white-space:nowrap;
}
.show-btn:hover{color:var(--text);}

/* Hint text */
.hint{font-size:0.6875rem;color:var(--text3);margin-top:5px;line-height:1.5;}
.hint a{color:var(--blue);text-decoration:none;}

/* Login button */
.btn-login{
  width:100%;padding:13px;margin-top:4px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;border:none;border-radius:9px;
  font-size:0.9375rem;font-weight:700;cursor:pointer;
  font-family:var(--f-ui);letter-spacing:.5px;
  box-shadow:0 4px 20px rgba(156,27,44,.4);transition:all .2s;
}
.btn-login:hover{box-shadow:0 6px 28px rgba(156,27,44,.6);transform:translateY(-1px);}
.btn-login:disabled{background:var(--text3);cursor:not-allowed;box-shadow:none;transform:none;}

/* Alert */
.alert{padding:10px 14px;border-radius:8px;font-size:0.75rem;margin-top:10px;display:none;}
.alert.show{display:block;}
.alert-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red2);}

/* ══════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════ */
.app{display:none;flex-direction:column;height:100vh;overflow:hidden;}

/* Topbar */
.topbar{height:52px;flex-shrink:0;background:var(--bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50;}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--blue) 35%,var(--cyan) 65%,transparent 95%);opacity:.4;}
.topbar-logo{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topbar-logo img{width:22px;height:22px;object-fit:contain;}
.topbar-brand{font-family:var(--f-mono);font-size:0.75rem;font-weight:400;letter-spacing:4px;color:var(--text);}
.topbar-sep{color:var(--border3);font-size:0.75rem;margin:0 2px;}
.topbar-sub{font-size:0.6875rem;color:var(--text3);letter-spacing:1px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px;}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.6);flex-shrink:0;}
.role-badge{padding:2px 9px;border-radius:20px;font-size:0.6875rem;font-weight:600;}
#syncStatus{font-size:0.625rem;color:var(--text3);font-family:var(--f-mono);}

/* Nav */
.role-nav{flex-shrink:0;background:rgba(5,8,15,.95);border-bottom:1px solid var(--border);display:flex;padding:0 8px;overflow-x:scroll;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.role-nav::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:11px 15px;font-size:0.8125rem;font-weight:600;color:var(--text3);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s;font-family:var(--f-ui);}
.tab-btn:hover{color:var(--text2);}
.tab-btn.active{color:var(--cyan2);border-bottom-color:var(--cyan2);}

/* Content */
.content{flex:1;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#mainContent{flex:1;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ══════════════════════════════════════
   PANELS & TABLES
══════════════════════════════════════ */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;position:relative;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.2),rgba(6,182,212,.15),transparent);}
.panel-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(10,15,30,.5);}
.panel-title{font-size:0.8125rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
.badge{background:rgba(59,130,246,.15);color:var(--blue2);border-radius:12px;padding:2px 8px;font-size:0.625rem;font-weight:700;border:1px solid rgba(59,130,246,.18);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-wrap::-webkit-scrollbar{height:3px;}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border2);}
table{width:100%;border-collapse:collapse;min-width:480px;}
th{font-size:0.625rem;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);font-weight:700;padding:10px 14px;text-align:left;background:rgba(5,8,15,.7);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;transition:color .15s;}
th:hover{color:var(--text2);}
th.th-asc,th.th-desc{color:var(--cyan2);}
td{padding:11px 14px;font-size:0.8125rem;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;line-height:1.4;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(59,130,246,.04);}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:0.6875rem;font-weight:700;white-space:nowrap;letter-spacing:.3px;}

/* ══════════════════════════════════════
   DASHBOARD
══════════════════════════════════════ */
.dash-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;align-items:stretch;}
.dash-kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px;align-items:stretch;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;}
.kpi-card:hover{transform:translateY(-3px);}
.kpi-glow{position:absolute;width:130px;height:130px;border-radius:50%;top:-30px;right:-20px;opacity:.1;filter:blur(50px);pointer-events:none;}
.kpi-label{font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:12px;}
.kpi-num{font-family:var(--f-mono);font-size:2.5rem;font-weight:500;line-height:1;margin-bottom:4px;letter-spacing:-2px;}
.kpi-sub{font-size:0.6875rem;color:var(--text3);margin-top:2px;}
.kpi-bar{height:3px;border-radius:2px;background:var(--border);margin-top:12px;overflow:hidden;}
.kpi-bar-fill{height:100%;border-radius:2px;}
.kpi-blue{border-color:rgba(59,130,246,.2);}.kpi-blue:hover{border-color:rgba(59,130,246,.4);box-shadow:0 8px 32px rgba(59,130,246,.1);}.kpi-blue .kpi-glow{background:var(--blue);}.kpi-blue .kpi-num{color:var(--blue2);}.kpi-blue .kpi-bar-fill{background:linear-gradient(90deg,var(--blue),var(--cyan2));}
.kpi-green{border-color:rgba(16,185,129,.2);}.kpi-green:hover{border-color:rgba(16,185,129,.4);box-shadow:0 8px 32px rgba(16,185,129,.1);}.kpi-green .kpi-glow{background:var(--green);}.kpi-green .kpi-num{color:var(--green2);}.kpi-green .kpi-bar-fill{background:linear-gradient(90deg,var(--green),var(--cyan2));}
.kpi-amber{border-color:rgba(245,158,11,.2);}.kpi-amber:hover{border-color:rgba(245,158,11,.4);}.kpi-amber .kpi-glow{background:var(--yellow);}.kpi-amber .kpi-num{color:var(--amber);}.kpi-amber .kpi-bar-fill{background:linear-gradient(90deg,var(--yellow),var(--amber));}
.kpi-red{border-color:rgba(239,68,68,.2);}.kpi-red:hover{border-color:rgba(239,68,68,.4);box-shadow:0 8px 32px rgba(239,68,68,.08);}.kpi-red .kpi-glow{background:var(--red);}.kpi-red .kpi-num{color:var(--red2);}.kpi-red .kpi-bar-fill{background:linear-gradient(90deg,var(--red),#ff7171);}
.kpi-cyan{border-color:rgba(6,182,212,.2);}.kpi-cyan:hover{border-color:rgba(6,182,212,.4);box-shadow:0 8px 32px rgba(6,182,212,.08);}.kpi-cyan .kpi-glow{background:var(--cyan);}.kpi-cyan .kpi-num{color:var(--cyan2);}.kpi-cyan .kpi-bar-fill{background:linear-gradient(90deg,var(--cyan),var(--blue2));}

/* Stats (Dashboard fallback) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .15s,border-color .2s;}
.stat:hover{transform:translateY(-2px);}
.stat-n{font-family:var(--f-mono);font-size:1.875rem;font-weight:700;line-height:1;margin-bottom:3px;}
.stat-l{font-size:0.6875rem;color:var(--text3);}

/* ══════════════════════════════════════
   INFO BOXES
══════════════════════════════════════ */
.info-box{padding:10px 14px;border-radius:9px;font-size:0.8125rem;margin-bottom:12px;line-height:1.6;}
.info-ok{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);color:var(--green2);}
.info-warn{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);color:var(--amber);}
.info-tip{background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.2);color:var(--cyan2);font-size:0.75rem;}
.help-box{background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.18);border-radius:9px;padding:10px 14px;font-size:0.75rem;color:var(--cyan2);margin-bottom:12px;line-height:1.7;}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
.modal-bg.open{display:flex;}
@media(min-width:600px){.modal-bg{align-items:center;}.modal{border-radius:16px!important;width:560px!important;max-height:88vh!important;}}

/* ── 手機版優化 ── */
@media(max-width:599px){
  /* ── Nav tabs 水平滑動 ── */
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{white-space:nowrap;padding:10px 18px;font-size:0.9375rem;font-weight:500;flex-shrink:0;letter-spacing:.01em;}

  /* ── KPI 卡片 2欄 ── */
  .dash-kpi-grid{grid-template-columns:repeat(2,1fr)!important;gap:10px!important;}
  .dash-kpi-grid-5{grid-template-columns:repeat(2,1fr)!important;gap:10px!important;}
  .kpi-card{padding:14px 12px!important;border-radius:12px!important;}
  .kpi-num{font-size:1.875rem!important;}
  .kpi-label{font-size:0.6875rem!important;}
  .kpi-sub{font-size:0.6875rem!important;}

  /* ── 表格水平滑動 ── */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:500px;}
  .hide-m{display:none!important;}

  /* ── C端訂單表格 ── */
  .corder-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .corder-table{min-width:600px;}

  /* ── 按鈕手機版加大，方便點擊 ── */
  .btn{min-height:40px;padding:8px 16px!important;font-size:0.8125rem!important;border-radius:10px!important;}
  .btn-sm{min-height:36px!important;padding:8px 14px!important;font-size:0.8125rem!important;border-radius:8px!important;}
  .btn-xs{min-height:32px!important;padding:6px 10px!important;font-size:0.6875rem!important;}

  /* ── 狀態篩選按鈕 ── */
  button[onclick*="_corsState"]{min-height:36px!important;padding:6px 12px!important;font-size:0.75rem!important;}

  /* ── Panel 標題與按鈕 ── */
  .panel-hdr{flex-wrap:wrap;gap:8px;padding:10px 12px!important;}
  .panel-hdr .btn-sm{flex:1;min-width:80px;text-align:center;justify-content:center;}

  /* ── 頂部 nav bar ── */
  .top-bar{padding:6px 10px!important;}
  .top-bar .brand{font-size:0.8125rem!important;}

  /* ── Modal 手機版底部滑出 ── */
  .modal{width:100%!important;max-height:92vh!important;border-radius:16px 16px 0 0!important;position:fixed!important;bottom:0!important;top:auto!important;overflow-y:auto;}
  .modal-bg{align-items:flex-end!important;}
  .modal h3{font-size:1rem!important;}

  /* ── 操作按鈕欄位（縱向排列）── */
  .act-col{display:flex;flex-direction:column;gap:4px;}
  .act-col .btn-sm{padding:6px 10px!important;font-size:0.6875rem!important;}

  /* ── 表格 td 行高 ── */
  td{padding:10px 8px!important;font-size:0.75rem!important;line-height:1.5;}
  th{padding:10px 8px!important;font-size:0.6875rem!important;}

  /* ── 搜尋框 ── */
  .inp{font-size:1rem!important;padding:10px 12px!important;} /* iOS 不縮放 */
  input[type="number"]{font-size:1rem!important;}

  /* ── 表單 row 改直排 ── */
  .form-row{flex-direction:column!important;gap:10px!important;}
  .form-actions{gap:8px!important;}
  .form-actions .btn{flex:1;}

  /* ── 批量操作 bar ── */
  div[style*="批量"]{flex-wrap:wrap!important;gap:8px!important;}

  /* ── Checkbox 加大 ── */
  input[type="checkbox"]{width:20px!important;height:20px!important;}

  /* ── 操作按鈕組（完成/取消/編輯/刪除）── */
  td:last-child{min-width:80px;}
  td:last-child .btn-sm{padding:6px 8px!important;font-size:0.6875rem!important;}
}

/* C端訂單 手機卡片模式 */
@media(max-width:599px){
  .corder-row-mobile{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;}
  .corder-row-mobile .corder-no{font-family:monospace;font-size:0.6875rem;color:var(--text3);}
  .corder-row-mobile .corder-sku{font-size:0.875rem;font-weight:600;color:var(--text);margin:4px 0;}
  .corder-row-mobile .corder-meta{font-size:0.6875rem;color:var(--text2);}
  .corder-row-mobile .corder-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .corder-row-mobile .corder-cb{position:absolute;top:12px;right:12px;}
  .corder-row-mobile .corder-status{display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.6875rem;font-weight:600;}
}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:22px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 -20px 60px rgba(0,0,0,.6);}
.modal h3{font-size:0.9375rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text);}

/* Modal overlay (new) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
.modal-overlay.open{display:flex;}
@media(min-width:600px){.modal-overlay{align-items:center;}.modal-box{border-radius:16px!important;width:580px!important;max-height:88vh!important;}}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:22px;width:100%;max-height:93vh;overflow-y:auto;box-shadow:0 -20px 60px rgba(0,0,0,.7);}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap;}
.field-label{font-size:0.625rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px;font-weight:600;}

/* ══════════════════════════════════════
   ANNOUNCEMENT
══════════════════════════════════════ */
.ann-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:15px 16px 15px 20px;margin-bottom:9px;position:relative;overflow:hidden;transition:border-color .2s;}
.ann-item:hover{border-color:var(--border2);}
.ann-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,var(--blue),var(--cyan));border-radius:4px 0 0 4px;}
.ann-pinned::before{background:linear-gradient(to bottom,var(--yellow),var(--amber));}

/* ══════════════════════════════════════
   ITEM ROWS (Order items)
══════════════════════════════════════ */
.item-row{background:var(--bg4);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:5px;display:flex;align-items:flex-start;gap:8px;}
.item-row:last-child{margin-bottom:0;}
.item-check{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0;margin-top:4px;cursor:pointer;}
.item-body{flex:1;min-width:0;}
.item-model-wrap{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.item-model{flex:1;background:var(--bg5)!important;border:1px solid var(--border2);border-radius:6px;padding:6px 9px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-size:0.8125rem;font-family:var(--f-mono);outline:none;min-width:0;}
.item-model:focus{border-color:var(--blue);}
.item-model::placeholder{color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;}
.item-qty{width:68px;flex-shrink:0;background:var(--bg5)!important;border:1px solid var(--border2);border-radius:6px;padding:6px 8px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;font-size:0.8125rem;font-family:var(--f-mono);text-align:center;outline:none;}
.item-qty:focus{border-color:var(--blue);}
.item-del{flex-shrink:0;width:28px;height:28px;border-radius:6px;cursor:pointer;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red2);display:flex;align-items:center;justify-content:center;font-size:0.875rem;font-weight:700;padding:0;}
.item-hint{font-size:0.625rem;color:var(--text3);min-height:14px;margin-top:2px;}

/* ══════════════════════════════════════
   PROGRESS / STOCK BAR / SN / etc.
══════════════════════════════════════ */
.prog-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:10px;}
.prog-text{font-size:0.75rem;color:var(--text2);margin-bottom:7px;}
.prog-track{background:var(--bg5);border-radius:4px;height:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:4px;transition:width .3s;}
.sbar{width:44px;height:4px;background:var(--bg5);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px;overflow:hidden;}
.sbar-fill{height:100%;border-radius:2px;}
.bar{width:44px;height:4px;background:var(--bg5);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;}
.sn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:0.5625rem;font-weight:700;flex-shrink:0;vertical-align:middle;margin-right:4px;}
.loading-row{display:flex;align-items:center;justify-content:center;padding:28px;color:var(--text3);gap:8px;font-size:0.8125rem;}
.pi-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:5px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s;}
.pi-item:hover,.pi-item.selected{border-color:var(--blue);}

/* ══════════════════════════════════════
   QC TABS
══════════════════════════════════════ */
.qc-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;}
.qc-tab{padding:9px 16px;font-size:0.8125rem;font-weight:600;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text3);transition:color .15s;flex-shrink:0;}
.qc-tab.active{color:var(--cyan2);border-bottom-color:var(--cyan2);}

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toastZone{position:fixed;top:62px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{min-width:230px;max-width:370px;padding:11px 15px;border-radius:10px;font-size:0.8125rem;font-weight:500;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transform:translateX(16px);transition:opacity .25s,transform .25s;pointer-events:none;}
.toast.in{opacity:1;transform:translateX(0);}

/* ══════════════════════════════════════
   ANIMATIONS & SPIN
══════════════════════════════════════ */
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.kpi-card{animation:fadeUp .3s ease both;}
.panel{animation:fadeUp .25s ease both;}

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media(max-width:600px){
  html{font-size:0.875rem;}
  .content,#mainContent{padding:9px;}
  .dash-kpi-grid{grid-template-columns:1fr 1fr!important;gap:9px!important;}
  .stats{grid-template-columns:1fr 1fr;}
  .kpi-num{font-size:2rem!important;}
  .stat-n{font-size:1.5rem;}
  td,th{padding:9px 10px!important;font-size:0.75rem!important;}
  .form-row{grid-template-columns:1fr!important;}
  .hide-m{display:none!important;}
  .modal-box,.modal{padding:18px;}
  .topbar{padding:0 10px;}

async function notionAPI(method,endpoint,body=null){
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,method,endpoint,body})});
  const text=await res.text();
  try{return JSON.parse(text);}catch{throw new Error('解析失敗: '+text.slice(0,100));}
}
async function dbQueryAll(dbId){
  let all=[],c=null,tries=0;
  do{
    const b={page_size:100};if(c)b.start_cursor=c;
    const r=await notionAPI('POST',`databases/${dbId}/query`,b);
    if(r.object==='error'){
      if(r.status===429&&tries<2){await new Promise(res=>setTimeout(res,1200*(tries+1)));tries++;continue;}
      throw new Error('DB查詢失敗: '+r.message);
    }
    all=all.concat(r.results||[]);c=r.has_more?r.next_cursor:null;tries=0;
  }while(c);
  return all;
}
const createPage=(dbId,props)=>notionAPI('POST','pages',{parent:{database_id:dbId},properties:props});
async function updatePage(id,props){
  for(let i=0;i<3;i++){
    const r=await notionAPI('PATCH',`pages/${id}`,{properties:props});
    if(r.object!=='error') return r;
    if(r.status===429) await new Promise(res=>setTimeout(res,1000*(i+1)));
    else throw new Error(r.message||JSON.stringify(r));
  }
}
const archivePage=id=>notionAPI('PATCH',`pages/${id}`,{archived:true});

async function downloadViaProxy(url){
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,downloadUrl:url})});
  if(!res.ok)throw new Error(`下載失敗 HTTP ${res.status}`);
  return res.arrayBuffer();
}

async function login(){
  const t=document.getElementById('tokenInput').value.trim().replace(/\s+/g,'');
  const r=document.getElementById('roleSelect').value;
  document.getElementById('loginAlert').classList.remove('show');
  if(!t){showLoginErr('請填入 Token');return;}
  if(!t.startsWith('ntn_')){showLoginErr('Token 需 <b>ntn_</b> 開頭');return;}
  TOKEN=t;ROLE=r;
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='驗證中...';
  try{
    const data=await notionAPI('GET',`databases/${DB.materials}`);
    if(data.id||data.object==='database'){
      localStorage.setItem('lt',t);localStorage.setItem('lr',r);startApp();
    }else if(data.status===401||data.code==='unauthorized'){showLoginErr('Token 無效 (401)');}
    else{showLoginErr(`連接失敗: ${data.message||data.code||'未知'}`);}
  }catch(e){showLoginErr(`網路錯誤: ${e.message}`);}
  btn.disabled=false;btn.textContent='⚡ 進入系統';
}
function showLoginErr(msg){const el=document.getElementById('loginAlert');el.innerHTML=msg;el.className='alert alert-err show';}
function logout(){localStorage.removeItem('lu');localStorage.removeItem('lr');localStorage.removeItem('ldn');TOKEN='';ROLE='';document.getElementById('loginScreen').style.display='flex';document.getElementById('app').style.display='none';}

let _refreshTimer=null,_refreshing=false;
function scheduleRefresh(ms=800){clearTimeout(_refreshTimer);_refreshTimer=setTimeout(()=>refreshAll(),ms);}

async function refreshAll(manual=false){
  if(_refreshing&&!manual){scheduleRefresh(1500);return;}
  _refreshing=true;
  // 防連續重複觸發：3秒內自動觸發跳過
  const now=Date.now();
  if(!manual&&window._lastRefresh&&(now-window._lastRefresh)<3000){
    _refreshing=false;return;
  }
  window._lastRefresh=now;
  const syncEl=document.getElementById('syncStatus');
  if(syncEl)syncEl.textContent='⟳ 同步中...';
  try{
    const [mR,bR,oR,masterR,annR,leaveR]=await Promise.all([
      dbQueryAll(DB.materials),
      dbQueryAll(DB.bom),
      dbQueryAll(DB.orders),
      dbQueryAll(DB.custMaster), // 唯一客戶來源，每次重新讀取
      dbQueryAll(DB.announce),
      dbQueryAll(DB.leave),
    ]);

    mats=mR.map(p=>({
      id:p.id,
      name:getTitle(p.properties,'料件名稱'),

      safe:p.properties?.['安全庫存']?.number??0,
    }));

    boms=bR.map(p=>({
      parentId:p.properties?.['母件']?.relation?.[0]?.id||'',
      childId:p.properties?.['子件']?.relation?.[0]?.id||'',
      qty:p.properties?.['每台用量']?.number??1,
    }));

    orders=oR.map(p=>({
      id:p.id,
      no:getTitle(p.properties,'訂單號'),
      customer:p.properties?.['客戶名稱']?.select?.name||'',
      productId:p.properties?.['成品']?.relation?.[0]?.id||'',
      qty:p.properties?.['訂購數量']?.number??0,
      deadline:p.properties?.['交期']?.date?.start||'',

      orderType:p.properties?.['訂單類型']?.select?.name||'',
      created:p.created_time?.slice(0,10)||'',
    }));

    // 國外客戶
    const overseasCustomers = masterR.map(p=>({
      id:p.id,
      name:getTitle(p.properties,'Name'),
      code:getRichText(p.properties,'客戶編號'),
      region:p.properties?.['國家']?.select?.name||'',
      shipped:p.properties?.['出貨']?.select?.name||'',
      type:'overseas',
    })).filter(c=>c.name);

    // 同步載入國內客戶
    let domesticCustomers=[];
    try{
      const domR=await dbQueryAll(DB.custDomestic);
      domesticCustomers=domR.map(p=>({
        id:p.id,
        name:getTitle(p.properties,'客戶名稱'),
        code:getRichText(p.properties,'客戶編號'),
        region:p.properties?.['地區']?.select?.name||'',
        shipped:p.properties?.['出貨記錄']?.select?.name||'',
        grade:p.properties?.['客戶等級']?.select?.name||'',
        area:p.properties?.['地區']?.select?.name||'',
        type:'domestic',
      })).filter(c=>c.name);
    }catch(e){console.warn('國內客戶載入失敗:',e);}

    customers=[...overseasCustomers,...domesticCustomers];

    // ★ 請假解析
    leaves=(leaveR||[]).map(p=>({
      id:p.id,
      name:getTitle(p.properties,'申請人姓名'),
      title:getRichText(p.properties,'職稱'),
      dateFrom:p.properties?.['請假日期起']?.date?.start||'',
      dateTo:p.properties?.['請假日期迄']?.date?.start||'',
      days:p.properties?.['請假天數']?.number||0,
      type:p.properties?.['假別']?.select?.name||'',
      reason:getRichText(p.properties,'請假原因'),
      proxy:getRichText(p.properties,'職務代理人'),
      status:p.properties?.['審核狀態']?.select?.name||'待審核',
      rejectReason:getRichText(p.properties,'不通過原因'),
      reviewer:getRichText(p.properties,'審核人'),
      applyDate:p.properties?.['申請日期']?.date?.start||p.created_time?.slice(0,10)||'',
    }));
    // ★ 公告解析：'內容' 是 text 型欄位，Notion API 回傳為 rich_text 陣列
    announces=(annR||[]).map(p=>({
      id:p.id,
      title:getTitle(p.properties,'標題'),
      content:(p.properties?.['內容']?.rich_text||p.properties?.['內容']?.text||[]).map(r=>r.plain_text||r.text?.content||'').join(''),
      date:p.properties?.['發佈日期']?.date?.start||'',

      order:p.properties?.['顯示順序']?.number||99,

    const low=mats.filter(m=>m.stock<=m.safe);

    const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    if(syncEl)syncEl.textContent=`✓ ${now}`;

    renderTab(CURRENT_TAB);
    if(manual)showToast('✅ 資料已同步最新','ok');
  }catch(e){
    if(syncEl)syncEl.textContent='❌ 失敗';

      `<div class="info-box" style="background:rgba(245,101,101,.08);border:1px solid rgba(245,101,101,.2);color:var(--red);margin:8px">

        <br><button class="btn btn-ghost btn-sm" onclick="refreshAll()" style="margin-top:8px">重試</button>
      </div>`;
  } finally {
    _refreshing=false;
  }
}

function explodeBOM(pid,qty){
  const res={};const q=[{pid,mult:qty}];const seen=new Set();
  while(q.length){const{pid:p,mult:m}=q.shift();boms.filter(b=>b.parentId===p).forEach(b=>{const mat=mats.find(x=>x.id===b.childId);if(!mat)return;const n=b.qty*m;if(!res[b.childId])res[b.childId]={...mat,needed:0};res[b.childId].needed+=n;if(mat.type==='半成品'&&!seen.has(b.childId)){seen.add(b.childId);q.push({pid:b.childId,mult:n});}});}
  return Object.values(res);
}

function toggleSort(tid,col,type='str'){const s=SORT[tid]||{};SORT[tid]={col,dir:s.col===col&&s.dir==='asc'?'desc':'asc',type};renderTab(CURRENT_TAB);}
function applySort(tid,data){const s=SORT[tid];if(!s)return data;return[...data].sort((a,b)=>{let va=a[s.col],vb=b[s.col];if(s.type==='num'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}else{va=String(va||'').toLowerCase();vb=String(vb||'').toLowerCase();}if(va<vb)return s.dir==='asc'?-1:1;if(va>vb)return s.dir==='asc'?1:-1;return 0;});}
function TH(tid,col,label,type='str',cls=''){const s=SORT[tid]||{};const a=s.col===col;return`<th class="${a?'th-'+s.dir:''} ${cls}" onclick="toggleSort('${tid}','${col}','${type}')">${label}<span style="font-size:0.5rem;opacity:${a?1:.3};margin-left:2px">${a?(s.dir==='asc'?'↑':'↓'):'↕'}</span></th>`;}
function applyDateFilter(filterId,data,dateKey='created'){
  const sel=document.getElementById(filterId+'DateFilter');
  const val=sel?sel.value:'0';
  if(!val||val==='0') return data; // 全部，不篩選

  const today=new Date();
  let cutoff;

  if(val==='7d'){
    cutoff=new Date();
    cutoff.setDate(cutoff.getDate()-7);
  } else if(val==='month'){
    cutoff=new Date(today.getFullYear(),today.getMonth(),1);
  } else {
    cutoff=new Date();
    cutoff.setMonth(cutoff.getMonth()-parseInt(val));
  }

  const cs=cutoff.toISOString().slice(0,10);
  return data.filter(item=>{
    const d=item[dateKey]||'';
    if(!d) return false; // 沒有日期的不顯示（避免永遠出現）
    return d>=cs;
  });
}

let schedules = [];

async function loadSchedule(){
  try{
    const r = await dbQueryAll(DB.schedule);
    schedules = r.map(p=>({
      id: p.id,
      name: getTitle(p.properties,'排程名稱'),
      type: p.properties?.['類型']?.select?.name||'',
      person: getRichText(p.properties,'負責人'),
      startDate: p.properties?.['開始日期']?.date?.start||'',
      endDate: p.properties?.['結束日期']?.date?.start||'',
      orderRef: getRichText(p.properties,'關聯訂單號'),
      priority: p.properties?.['優先級']?.select?.name||'',
      status: p.properties?.['狀態']?.select?.name||'待開始',
      note: getRichText(p.properties,'備註'),
    })).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  }catch(e){ console.warn('loadSchedule:',e); schedules=[]; }
}

function renderSchedule(){
  const _notionBar='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:5px 10px;background:rgba(255,255,255,.03);border-radius:7px;border:1px solid var(--border)"><span style="font-size:0.625rem;color:var(--text3)">📌 Notion：</span><a href="https://www.notion.so/c66f324d59c64276bdc5b0ec915c9c20" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">📅 生產排程</a><a href="https://www.notion.so/50b7ce68437e431f9a4fa0d0d65a7b25" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">📋 ERP 客戶訂單</a></div>';;
  const canEdit = ROLE==='manager'||ROLE==='warehouse';
  const today = new Date().toISOString().slice(0,10);
  const viewVal = document.getElementById('schView')?.value||'list';
  const typeVal = document.getElementById('schType')?.value||'all';
  const statusVal = document.getElementById('schStatus')?.value||'all';

  let data = [...schedules];
  if(typeVal!=='all') data=data.filter(s=>s.type===typeVal);
  if(statusVal!=='all') data=data.filter(s=>s.status===statusVal);

  // 統計
  const urgent = schedules.filter(s=>s.priority==='🔴 緊急'&&s.status!=='已完成').length;
  const overdue = schedules.filter(s=>s.endDate&&s.endDate<today&&s.status!=='已完成').length;
  const inProgress = schedules.filter(s=>s.status==='進行中').length;
  const thisWeek = schedules.filter(s=>{
    const d=new Date(); d.setDate(d.getDate()+7);
    return s.startDate<=d.toISOString().slice(0,10)&&s.startDate>=today&&s.status!=='已完成';
  }).length;

  const typeColors={'生產':'var(--blue)','交貨':'var(--green)','採購入料':'var(--amber)','品管':'var(--yellow)','維護':'var(--text3)','其他':'var(--purple)'};
  const statusColors={'待開始':'var(--text3)','進行中':'var(--blue)','已完成':'var(--green)','延期':'var(--red)'};
  const priorityIcon={'🔴 緊急':'🔴','🟡 一般':'🟡','🟢 低優先':'🟢'};

  // 月曆生成
  function renderCalendar(){
    const now=new Date();
    const yr=now.getFullYear(), mo=now.getMonth();
    const firstDay=new Date(yr,mo,1).getDay();
    const daysInMonth=new Date(yr,mo+1,0).getDate();
    const monthStr=`${yr}-${String(mo+1).padStart(2,'0')}`;
    const days=['日','一','二','三','四','五','六'];
    let cal=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <div style="padding:14px 16px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font-weight:700;font-size:0.9375rem">${yr}年${mo+1}月</span>
        <span style="font-size:0.6875rem;color:var(--text3)">${data.filter(s=>s.startDate.startsWith(monthStr)).length} 項排程</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)">
        ${days.map(d=>`<div style="text-align:center;padding:8px;font-size:0.6875rem;font-weight:700;color:var(--text3);border-bottom:1px solid var(--border)">${d}</div>`).join('')}`;
    let cellIdx=0;
    for(let i=0;i<firstDay;i++){cal+=`<div style="padding:8px;border:1px solid var(--border);min-height:64px;background:var(--bg3)"></div>`;cellIdx++;}
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday=dateStr===today;
      const daySchedules=data.filter(s=>s.startDate===dateStr||s.endDate===dateStr||(s.startDate<=dateStr&&s.endDate>=dateStr));
      cal+=`<div style="padding:5px;border:1px solid var(--border);min-height:64px;background:${isToday?'rgba(59,130,246,.08)':'var(--bg2)'}">
        <div style="font-size:0.6875rem;font-weight:${isToday?800:400};color:${isToday?'var(--blue)':'var(--text2)'};margin-bottom:3px">${d}</div>
        ${daySchedules.slice(0,2).map(s=>`<div style="font-size:0.5625rem;background:${typeColors[s.type]||'var(--bg4)'}22;color:${typeColors[s.type]||'var(--text2)'};border-radius:3px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>`).join('')}
        ${daySchedules.length>2?`<div style="font-size:0.5625rem;color:var(--text3)">+${daySchedules.length-2} 更多</div>`:''}
      </div>`;
      cellIdx++;
      if(cellIdx%7===0&&d<daysInMonth) cal+=``;
    }
    cal+=`</div></div>`;
    return cal;
  }

  return _notionBar + `
  <!-- 統計列 -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
    ${[
      {label:'進行中',val:inProgress,color:'var(--blue)',icon:'▶'},
      {label:'本週開始',val:thisWeek,color:'var(--cyan2)',icon:'📅'},
      {label:'🔴 緊急',val:urgent,color:'var(--red)',icon:'🚨'},
      {label:'逾期未完',val:overdue,color:'var(--amber)',icon:'⚠'},
    ].map(c=>`<div style="background:var(--bg2);border:1px solid ${overdue>0&&c.label==='逾期未完'?'rgba(245,158,11,.3)':'var(--border)'};border-radius:10px;padding:12px;text-align:center;cursor:pointer" onclick="document.getElementById('schStatus').value='進行中';renderTab('schedule')">
      <div style="font-size:1.25rem;margin-bottom:2px">${c.icon}</div>
      <div style="font-size:1.5rem;font-weight:800;color:${c.color};font-family:monospace">${c.val}</div>
      <div style="font-size:0.625rem;color:var(--text3)">${c.label}</div>
    </div>`).join('')}
  </div>

  <!-- 篩選列 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <select class="inp" id="schView" style="width:100px;padding:5px 8px;font-size:0.75rem" onchange="renderTab('schedule')">
      <option value="list" ${viewVal==='list'?'selected':''}>📋 列表</option>
      <option value="calendar" ${viewVal==='calendar'?'selected':''}>📅 月曆</option>
    </select>
    <select class="inp" id="schType" style="width:100px;padding:5px 8px;font-size:0.75rem" onchange="renderTab('schedule')">
      <option value="all">全部類型</option>
      ${['生產','交貨','採購入料','品管','維護','其他'].map(t=>`<option value="${t}" ${typeVal===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <select class="inp" id="schStatus" style="width:100px;padding:5px 8px;font-size:0.75rem" onchange="renderTab('schedule')">
      <option value="all">全部狀態</option>
      ${['待開始','進行中','已完成','延期'].map(s=>`<option value="${s}" ${statusVal===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <span style="font-size:0.6875rem;color:var(--text3);margin-left:auto">共 <b style="color:var(--text)">${data.length}</b> 筆</span>
    ${canEdit?`<button class="btn btn-blue btn-sm" onclick="openModal('newSchedule')">＋ 新增排程</button>`:''}
  </div>

  ${viewVal==='calendar'?renderCalendar():`
  <!-- 列表視圖 -->
  <div class="panel">
    <div class="panel-hdr"><span class="panel-title">生產排程 <span class="badge">${data.length}</span></span></div>
    ${!data.length?'<div style="padding:28px;text-align:center;color:var(--text3)">尚無排程資料</div>':
    `<div class="table-wrap"><table>
      <tr><th>排程名稱</th><th>類型</th><th>開始</th><th>結束</th><th class="hide-m">負責人</th><th>狀態</th><th class="hide-m">優先</th>${canEdit?'<th>操作</th>':''}</tr>
      ${data.map(s=>{
        const isOverdue=s.endDate&&s.endDate<today&&s.status!=='已完成';
        return`<tr style="${isOverdue?'background:rgba(245,101,101,.05)':''}">
          <td style="font-weight:600">${s.name}${s.orderRef?`<div style="font-size:0.625rem;color:var(--cyan2);font-family:monospace">${s.orderRef}</div>`:''}</td>
          <td><span class="pill" style="background:${typeColors[s.type]||'var(--bg4)'}22;color:${typeColors[s.type]||'var(--text2)'}">${s.type||'—'}</span></td>
          <td style="font-family:monospace;font-size:0.6875rem">${s.startDate||'—'}</td>
          <td style="font-family:monospace;font-size:0.6875rem;color:${isOverdue?'var(--red)':'var(--text2)'}">${s.endDate||'—'}${isOverdue?' ⚠':''}</td>
          <td class="hide-m" style="font-size:0.75rem">${s.person||'—'}</td>
          <td><span class="pill" style="background:${statusColors[s.status]||'var(--bg4)'}22;color:${statusColors[s.status]||'var(--text2)'}">${s.status||'—'}</span></td>
          <td class="hide-m" style="font-size:0.75rem">${priorityIcon[s.priority]||'—'}</td>
          ${canEdit?`<td style="white-space:nowrap">
            <button class="btn btn-ghost btn-sm" onclick="openEditSchedule('${s.id}')">✏</button>
            <button class="btn btn-green btn-sm" onclick="doScheduleStatus('${s.id}','已完成')" title="標記完成">✓</button>
          </td>`:''}
        </tr>`;
      }).join('')}
    </table></div>`}
  </div>`}`;
}

async function submitSchedule(existId){
  const name=document.getElementById('sch_name').value.trim();
  const type=document.getElementById('sch_type').value;
  const pri=document.getElementById('sch_pri').value;
  const start=document.getElementById('sch_start').value;
  const end=document.getElementById('sch_end').value;
  const person=document.getElementById('sch_person').value.trim();
  const order=document.getElementById('sch_order').value.trim();
  const note=document.getElementById('sch_note').value.trim();
  const status=document.getElementById('sch_status')?.value||'待開始';
  if(!name){showToast('請填入排程名稱','warn');return;}
  closeModal();showToast('儲存中...','warn');
  try{
    const props={
      '排程名稱':{title:[{text:{content:name}}]},
      '類型':{select:{name:type}},
      '優先級':{select:{name:pri}},
      '負責人':{rich_text:[{text:{content:person}}]},
      '關聯訂單號':{rich_text:[{text:{content:order}}]},
      '備註':{rich_text:[{text:{content:note}}]},
      '狀態':{select:{name:status}},
    };
    if(start)props['開始日期']={date:{start}};
    if(end)props['結束日期']={date:{start:end}};
    if(existId){
      await notionAPI('PATCH','pages/'+existId,{properties:props});
      showToast('✅ 排程已更新','ok');
    }else{
      await notionAPI('POST','pages',{parent:{database_id:DB.schedule},properties:props});
      showToast('✅ 排程已建立','ok');
    }
    await loadSchedule();renderTab('schedule');
  }catch(e){showToast('❌ '+e.message,'err');}
}

async function doScheduleStatus(id, status){
  const s=schedules.find(x=>x.id===id);
  if(s){s.status=status;renderTab('schedule');}
  try{
    await updatePage(id,{'狀態':{select:{name:status}}});
    showToast('✅ 已更新排程狀態','ok');
    setTimeout(()=>loadSchedule().then(()=>renderTab('schedule')),1500);
  }catch(e){showToast('❌ '+e.message,'err');}
}

function openEditSchedule(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  openModal('editSchedule',s);
}

async function submitInspection(){
  // 讀取 orderId（從訂單觸發時有值，手動新增時為空）
  const orderId = document.getElementById('ins_order_id')?.value||'';
  const orderNo = document.getElementById('ins_order')?.value.trim()||'';
  const matName = document.getElementById('ins_mat').value.trim();
  const matCode = document.getElementById('ins_code').value.trim();
  const qtyReq  = parseInt(document.getElementById('ins_qtyreq').value)||0;
  const qtyAct  = parseInt(document.getElementById('ins_qtyact').value)||0;
  const qtyBad  = parseInt(document.getElementById('ins_qtybad').value)||0;
  const type     = document.getElementById('ins_type').value;
  const date     = document.getElementById('ins_date').value;
  const result   = document.getElementById('ins_result').value;
  const inspector= document.getElementById('ins_inspector').value.trim();
  const badReason= document.getElementById('ins_bad_reason')?.value||'';
  const handling = document.getElementById('ins_handling')?.value||'';
  const badDesc  = document.getElementById('ins_bad_desc')?.value.trim()||'';
  const toStock  = document.getElementById('ins_to_stock')?.checked||false;
  const matSel   = document.getElementById('ins_mat_sel')?.value||''; // 選擇的料件 ID（入庫用）
  const note     = document.getElementById('ins_note').value.trim();

  if(!matName){ showToast('請填入品項名稱','warn'); return; }
  if(!date){ showToast('請填入檢驗日期','warn'); return; }

  // 手動新增且勾選料號入庫：需選料件
  const isManual = !orderId;
  if(isManual && toStock && !matSel){
    showToast('勾選料號入庫時，請從料件主檔選擇對應料件','warn'); return;
  }

  const no = document.getElementById('ins_no').value;
  closeModal(); showToast('建立檢驗單中...','warn');

  try{
    const props = {
      '檢驗單號':   {title:[{text:{content:no}}]},
      '關聯訂單號': {rich_text:[{text:{content: orderId ? orderId+'|'+(orderNo||orderId) : (orderNo||'')}}]},
      '檢驗類型':   {select:{name:type}},
      '品項名稱':   {rich_text:[{text:{content:matName}}]},
      '料件編號':   {rich_text:[{text:{content:matCode}}]},
      '應檢數量':   {number:qtyReq},
      '實檢數量':   {number:qtyAct},
      '不良數量':   {number:qtyBad},
      '檢驗結果':   {select:{name:result}},
      '檢驗人員':   {rich_text:[{text:{content:inspector||ROLE}}]},
      '料號入庫':   {checkbox:toStock},
      '備註':       {rich_text:[{text:{content:note}}]},
    };
    if(date) props['檢驗日期']={date:{start:date}};
    if(badReason) props['不良原因']={select:{name:badReason}};
    if(handling)  props['處理方式']={select:{name:handling}};
    if(badDesc)   props['不良描述']={rich_text:[{text:{content:badDesc}}]};

    await notionAPI('POST','pages',{parent:{database_id:DB.qcInspection}, properties:props});

    // ── 情況 A：訂單品管（有 orderId）──
    if(orderId){
      if(result==='通過'){
        // 訂單推進到待出貨，不動庫存
        await updatePage(orderId, {'狀態':{select:{name:'待出貨'}}});
        const o = orders.find(x=>x.id===orderId);
        if(o){ o.status='待出貨'; renderTab(CURRENT_TAB); }
        showToast('✅ 檢驗通過，訂單已更新為「待出貨」','ok');
      } else if(result==='不通過'){
        showToast('❌ 檢驗不通過，請處理不良品','err');
      } else {
        showToast('✅ 檢驗單 '+no+' 已建立','ok');
      }

    // ── 情況 B：手動新增（無 orderId）──
    } else {
      // 若勾選「料號入庫」且結果通過 → 更新庫存
      if(toStock && matSel && (result==='通過'||result==='條件通過')){
        const mat = mats.find(m=>m.id===matSel);
        if(mat){
          const inQty = qtyAct - qtyBad; // 實檢數量 - 不良數量 = 入庫數量
          const latest = await notionAPI('GET','pages/'+matSel);
          const curStock = latest.properties?.['目前庫存']?.number??mat.stock;
          const newStock = curStock + inQty;
          await updatePage(matSel, {'目前庫存':{number:newStock}});
          await logStockChange(matSel, mat.name, mat.code, '品管入庫', inQty, curStock, newStock, no, inspector||ROLE);
          showToast('✅ 檢驗單 '+no+' 已建立，庫存 +'+inQty,'ok');
        }
      } else {
        showToast('✅ 檢驗單 '+no+' 已建立','ok');
      }
    }

    await refreshAll();
  }catch(e){ showToast('❌ '+e.message,'err'); }
}

  const warnDays = window._deadlineWarn!==undefined ? window._deadlineWarn : parseInt(localStorage.getItem('_deadlineWarn')||'14');

function renderOrders(){
  if(!window._ORD_SUB) window._ORD_SUB='list';
  const OSUB = window._ORD_SUB;

  // ── 交期提醒天數設定（可儲存）──
  if(window._deadlineWarn===undefined) window._deadlineWarn=parseInt(localStorage.getItem('_deadlineWarn')||'14');
  const warnDays = window._deadlineWarn;

  // ── Tab 切換 ──
  const now = new Date(); now.setHours(0,0,0,0);
  const soonOrders = orders.filter(o=>{
    if(!o.deadline) return false;
    const dl = new Date(o.deadline); dl.setHours(0,0,0,0);
    const diff = Math.round((dl-now)/86400000);
    return diff>=0 && diff<=warnDays && o.status!=='已完成' && o.status!=='取消';
  }).sort((a,b)=>a.deadline.localeCompare(b.deadline));

  const tabs=`<div style="display:flex;gap:2px;padding:4px;background:var(--bg3);border-radius:12px;margin-bottom:14px">
    ${[['list','📋 訂單列表'],['deadline','⏰ 交期提醒'+(soonOrders.length?` (${soonOrders.length})`:'')],['calendar','📅 月曆']].map(([k,l])=>`
    <button onclick="window._ORD_SUB='${k}';renderTab('orders')"
      style="flex:1;padding:8px 4px;border-radius:8px;font-size:0.75rem;font-weight:${OSUB===k?700:400};
      background:${OSUB===k?'var(--bg)':'transparent'};
      color:${OSUB===k?(k==='deadline'&&soonOrders.length?'var(--red)':'var(--text)'):'var(--text3)'};
      border:${OSUB===k?'1px solid var(--border)':'1px solid transparent'};cursor:pointer;transition:all .15s;
      box-shadow:${OSUB===k?'0 1px 4px rgba(0,0,0,.3)':'none'}">${l}</button>`).join('')}
  </div>`;

  if(OSUB==='list') return _renderOrdersList(tabs);
  if(OSUB==='deadline') return _renderDeadlineTab(tabs, soonOrders, warnDays);
  return _renderOrderCalendar(tabs);
}

function _renderOrdersList(tabs){
  const _notionBar='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:5px 10px;background:rgba(255,255,255,.03);border-radius:7px;border:1px solid var(--border)"><span style="font-size:0.625rem;color:var(--text3)">📌 Notion：</span><a href="https://www.notion.so/50b7ce68437e431f9a4fa0d0d65a7b25" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">📋 ERP 客戶訂單</a><a href="https://www.notion.so/276ff6f424bb807cbac2e8c68c788a7e" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">🗺️ 115年貿易商</a><a href="https://www.notion.so/19fff6f424bb80feb265c62fa39c814c" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:0.6875rem;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text2);text-decoration:none">🌍 國外客戶總檔</a></div>';;
  const canAdd=ROLE==='sales'||ROLE==='manager';
  
  const dateVal=document.getElementById('orderDateFilter')?.value||'0';
  const hideComp=document.getElementById('hideCompleted')?.checked||false;
  // 預設依建立日期降冪排序
  const sorted=SORT['orders']?applySort('orders',[...orders]):[...orders].sort((a,b)=>(b.created||'').localeCompare(a.created||''));
  let data=applyDateFilter('order',sorted,'created');
  if(hideComp)data=data.filter(o=>o.status!=='已完成'&&o.status!=='取消');

  // ── 搜尋過濾 ──
  const _ordQ = (document.getElementById('ordSearchQ')?.value||'').toLowerCase().trim();
  const _ordType = document.getElementById('ordTypeFilter')?.value||'all';
  if(_ordQ) data=data.filter(o=>(o.no||'').toLowerCase().includes(_ordQ)||(o.cust||'').toLowerCase().includes(_ordQ)||(o.product||'').toLowerCase().includes(_ordQ));
  if(_ordType!=='all') data=data.filter(o=>{
    if(_ordType==='shopee') return (o.orderType==='shopee'||(o.product||'').startsWith('S-')||(o.matCode||'').startsWith('S-'));
    if(_ordType==='overseas') return (!o.orderType||o.orderType==='overseas');
    if(_ordType==='domestic') return o.orderType==='domestic';
    if(_ordType==='sfg') return o.orderType==='sfg';
    return true;
  });

  return _notionBar + tabs + `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="inp" id="ordSearchQ" placeholder="🔍 搜尋訂單號、客戶、品項..." value="${_ordQ}"
        oninput="renderTab('orders')"
        style="min-width:180px;padding:5px 10px;font-size:0.6875rem">
      <select class="inp" id="ordTypeFilter" style="width:110px;padding:5px 8px;font-size:0.6875rem" onchange="renderTab('orders')">
        <option value="all" ${_ordType==='all'?'selected':''}>全部類型</option>
        <option value="overseas" ${_ordType==='overseas'?'selected':''}>🌍 國外</option>
        <option value="domestic" ${_ordType==='domestic'?'selected':''}>🏠 國內</option>
        <option value="sfg" ${_ordType==='sfg'?'selected':''}>📦 SFG</option>
        <option value="shopee" ${_ordType==='shopee'?'selected':''}>🛒 蝦皮</option>
      </select>
      <select class="inp" id="orderDateFilter" style="width:110px;padding:5px 8px;font-size:0.6875rem" onchange="renderTab('orders')">
        <option value="7d" ${dateVal==='7d'?'selected':''}>近7天</option><option value="month" ${dateVal==='month'?'selected':''}>當月</option><option value="1" ${dateVal==='1'?'selected':''}>近1個月</option><option value="3">近3個月</option><option value="6" ${dateVal==='6'?'selected':''}>近半年</option><option value="0">全部</option>
      </select>
      <label style="font-size:0.6875rem;color:var(--text2);display:flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" id="hideCompleted" ${hideComp?'checked':''} onchange="renderTab('orders')" style="accent-color:var(--blue)">隱藏完成/取消
      </label>
    </div>
    ${canAdd?`<button class="btn btn-blue btn-sm" onclick="openModal('newOrder')">＋ 新增訂單</button>`:''}
  </div>
  <div class="panel"><div class="panel-hdr"><span class="panel-title">客戶訂單 <span class="badge">${data.length}/${orders.length}</span></span></div><div class="table-wrap">
  <table><tr>${TH('orders','created','建立日','str')}${TH('orders','no','訂單號')}${TH('orders','customer','客戶','str','hide-m')}${TH('orders','product','品項')}<th class="hide-m">數量</th>${TH('orders','deadline','交期','str','hide-m')}${TH('orders','status','狀態')}<th>操作</th></tr>
  ${data.map(o=>{const isAct=o.status==='待排程'||o.status==='生產中';return`<tr>
    <td style="font-family:monospace;font-size:0.625rem;color:var(--text3)">${o.created||'—'}</td>
    <td style="font-family:monospace;color:var(--text);font-size:0.6875rem;font-weight:600">${o.no||'—'}</td>
    <td class="hide-m" style="font-size:0.6875rem">${o.customer}</td>
    <td style="font-size:0.75rem;font-weight:600">${(()=>{const p=mats.find(m=>m.id===o.productId);return p?p.name+(p.code?'<div style="font-size:0.625rem;color:var(--text3);font-family:monospace">'+p.code+'</div>':''):'—';})()}</td>
    <td style="font-family:monospace">${o.qty}</td>
    <td class="hide-m" style="font-family:monospace;font-size:0.625rem;color:var(--text3)">${o.created||'—'}</td>
    <td class="hide-m" style="font-family:monospace;font-size:0.6875rem">${o.deadline||'—'}</td>
    <td>${pill(o.status)}</td>
    <td style="display:flex;gap:4px;flex-wrap:wrap">
      ${o.status==='待排程'&&(ROLE==='warehouse'||ROLE==='manager')?`<button class="btn btn-green btn-sm" onclick="openPickPreview('${o.id}')">🗂 領料</button>`:''}<button class="btn btn-ghost btn-sm" onclick="openStatusModal('${o.id}','${o.status}')">狀態</button><button class="btn btn-yellow btn-sm" onclick="openEditOrder('${o.id}')" title="編輯">✏</button><button class="btn btn-red btn-sm" onclick="deleteOrder('${o.id}','${o.no}')" title="刪除">🗑</button>
    </td>
  </tr>`;}).join('')}
  </table></div></div>`;
}

// 交期提醒 Tab
// ══════════════════════════════════════
function _renderDeadlineTab(tabs, soonOrders, warnDays){
  const _notionBar='';

  // 設定欄：可調整提醒天數
  const settingBar=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.15);
    border-radius:10px;margin-bottom:14px">
    <span style="font-size:0.75rem;color:var(--text2)">⏰ 提醒設定：距交期</span>
    <input type="number" id="warnDaysInput" value="${warnDays}" min="1" max="90"
      style="width:60px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);
      background:var(--bg3);color:var(--text);font-size:0.75rem;text-align:center">
    <span style="font-size:0.75rem;color:var(--text2)">天內自動提醒</span>
    <button class="btn btn-blue btn-sm" onclick="
      const v=parseInt(document.getElementById('warnDaysInput').value)||14;
      window._deadlineWarn=v;localStorage.setItem('_deadlineWarn',v);
      renderTab('orders');showToast('✅ 已儲存：提醒 '+v+' 天內的交期','ok')">💾 儲存</button>
  </div>`;

  if(!soonOrders.length) return tabs + settingBar +
    `<div class="panel"><div style="padding:32px;text-align:center;color:var(--text3)">
      ✅ 目前沒有 ${warnDays} 天內到期的訂單
    </div></div>`;

  const now = new Date(); now.setHours(0,0,0,0);
  const statusOpts=['可如期出貨','需延期','客戶確認中','已溝通完成'];
  const statusColor={'可如期出貨':'var(--green)','需延期':'var(--red)','客戶確認中':'var(--yellow)','已溝通完成':'var(--text3)'};

  const cards = soonOrders.map(o=>{
    const dl = new Date(o.deadline); dl.setHours(0,0,0,0);
    const diff = Math.round((dl-now)/86400000);
    const urgColor = diff<=3?'var(--red)':diff<=7?'var(--yellow)':'var(--amber,#f59e0b)';
    const curStat = window._deadlineStatus?.[o.id]||'';
    return `<div style="background:var(--bg2);border:1px solid ${diff<=3?'rgba(239,68,68,.3)':'var(--border)'};
      border-radius:12px;padding:16px 18px;margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:0.6875rem;font-weight:700;font-family:monospace;
              background:${urgColor};color:#000;padding:2px 8px;border-radius:20px">
              ${diff===0?'今天到期':diff+'天後到期'}</span>
            <span style="font-size:0.6875rem;color:var(--text3)">${o.no}</span>
          </div>
          <div style="font-weight:700;font-size:0.875rem;color:var(--text);margin-bottom:2px">${o.cust||o.customer||'—'}</div>
          <div style="font-size:0.75rem;color:var(--text2)">${o.product||'—'} × ${o.qty}</div>
          <div style="font-size:0.6875rem;color:var(--text3);margin-top:4px">交期：<span style="font-family:monospace;font-weight:600;color:${urgColor}">${o.deadline}</span></div>
        </div>
        <div style="min-width:200px">
          <div style="font-size:0.625rem;color:var(--text3);margin-bottom:6px">業務狀態更新</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
            ${statusOpts.map(s=>{
              const a=curStat===s;
              return `<button onclick="if(!window._deadlineStatus)window._deadlineStatus={};window._deadlineStatus['${o.id}']='${s}';renderTab('orders')"
                style="padding:4px 10px;border-radius:20px;font-size:0.6875rem;cursor:pointer;font-weight:${a?700:400};
                border:1px solid ${a?'var(--blue)':'var(--border)'};
                background:${a?'rgba(77,142,245,.15)':'var(--bg3)'};
                color:${a?'var(--blue)':'var(--text2)'}">${s}</button>`;
            }).join('')}
          </div>
          ${curStat?`<div style="font-size:0.6875rem;padding:5px 10px;background:var(--bg3);border-radius:6px;color:${statusColor[curStat]||'var(--text2)'}">✓ ${curStat}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  return tabs + settingBar + `<div style="font-size:0.6875rem;color:var(--text3);margin-bottom:10px">共 ${soonOrders.length} 張訂單需注意</div>` + cards;
}

// 訂單月曆 Tab（多月份）
// ══════════════════════════════════════
function _renderOrderCalendar(tabs){
  if(!window._ORD_CAL_YEAR){
    const t=new Date();
    window._ORD_CAL_YEAR=t.getFullYear();
    window._ORD_CAL_MONTH=t.getMonth()+1;
  }
  // 顯示 3 個月（當月 + 前後）
  if(window._ORD_CAL_MONTHS===undefined) window._ORD_CAL_MONTHS=3;
  const showMonths = window._ORD_CAL_MONTHS;

  const today = new Date(); today.setHours(0,0,0,0);

  // 建立交期 dayMap
  const deadlineMap={};
  orders.filter(o=>o.deadline&&o.status!=='已完成'&&o.status!=='取消').forEach(o=>{
    const key=o.deadline.slice(0,10);
    if(!deadlineMap[key]) deadlineMap[key]=[];
    deadlineMap[key].push(o);
  });

  // 月份數量選擇
  const monthCtrl=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH--;if(window._ORD_CAL_MONTH<1){window._ORD_CAL_MONTH=12;window._ORD_CAL_YEAR--;}renderTab('orders')">← 上月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_YEAR=new Date().getFullYear();window._ORD_CAL_MONTH=new Date().getMonth()+1;renderTab('orders')">今月</button>
      <button class="btn btn-ghost btn-sm" onclick="window._ORD_CAL_MONTH++;if(window._ORD_CAL_MONTH>12){window._ORD_CAL_MONTH=1;window._ORD_CAL_YEAR++;}renderTab('orders')">下月 →</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.6875rem;color:var(--text3)">顯示月數：</span>
      ${[1,2,3,6].map(n=>{const a=showMonths===n;return`<button onclick="window._ORD_CAL_MONTHS=${n};renderTab('orders')"
        style="padding:3px 10px;border-radius:6px;font-size:0.6875rem;cursor:pointer;
        border:1px solid ${a?'var(--blue)':'var(--border)'};
        background:${a?'rgba(77,142,245,.12)':'var(--bg3)'};
        color:${a?'var(--blue)':'var(--text2)'}">${n}個月</button>`;}).join('')}
    </div>
  </div>`;

  // 產生每個月的月曆
  let calHtml='';
  for(let mi=0;mi<showMonths;mi++){
    let yr=window._ORD_CAL_YEAR, mo=window._ORD_CAL_MONTH+mi;
    while(mo>12){mo-=12;yr++;}
    const monthStr=yr+'-'+String(mo).padStart(2,'0');
    const daysInMonth=new Date(yr,mo,0).getDate();
    const firstDay=new Date(yr,mo-1,1).getDay();
    const wds=['日','一','二','三','四','五','六'];
    let cells=''; let dc=1;
    const total=Math.ceil((firstDay+daysInMonth)/7)*7;
    for(let i=0;i<total;i++){
      if(i<firstDay||dc>daysInMonth){
        cells+=`<div style="min-height:60px;background:rgba(255,255,255,.01);border-radius:6px"></div>`;
      } else {
        const dk=monthStr+'-'+String(dc).padStart(2,'0');
        const dl=deadlineMap[dk]||[];
        const isT=dk===today.toISOString().slice(0,10);
        const isW=(i%7===0||i%7===6);
        cells+=`<div style="min-height:60px;padding:4px 5px;background:${isT?'rgba(77,142,245,.08)':'var(--bg2)'};
          border:1px solid ${isT?'rgba(77,142,245,.3)':dl.length?'rgba(239,68,68,.25)':'var(--border)'};border-radius:6px">
          <div style="font-size:0.6875rem;font-weight:${isT?700:400};color:${isT?'var(--blue)':isW?'rgba(239,68,68,.7)':'var(--text)'};margin-bottom:2px">${dc}</div>
          ${dl.map(o=>`<div style="padding:1px 4px;border-radius:3px;font-size:0.5625rem;font-weight:600;
            background:rgba(239,68,68,.12);color:#ef4444;margin-bottom:1px;
            overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer"
            title="${o.no} ${o.cust||o.customer||''} × ${o.qty}">
            🔴 ${o.no.slice(-6)}</div>`).join('')}
        </div>`;
        dc++;
      }
    }
    // 計算本月有幾張交期訂單
    const monthDL = Object.entries(deadlineMap).filter(([k])=>k.startsWith(monthStr)).reduce((s,[,v])=>s+v.length,0);
    calHtml+=`<div style="margin-bottom:${mi<showMonths-1?'24px':'0'}">
      <div style="font-size:0.875rem;font-weight:700;color:var(--text);margin-bottom:8px">
        ${yr} 年 ${mo} 月
        ${monthDL?`<span style="font-size:0.6875rem;font-weight:400;color:var(--red);margin-left:8px">🔴 ${monthDL} 張交期</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">
        ${wds.map(w=>`<div style="text-align:center;font-size:0.625rem;font-weight:700;color:var(--text3);padding:3px">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
    </div>`;
  }

  // 近期交期清單
  const upcomingList = Object.entries(deadlineMap)
    .sort(([a],[b])=>a.localeCompare(b))
    .filter(([k])=>k>=today.toISOString().slice(0,10))
    .slice(0,10);

  const upcomingHtml = upcomingList.length ? `<div class="panel" style="margin-top:16px">
    <div class="panel-hdr"><span class="panel-title">📌 近期交期清單</span></div>
    <div class="table-wrap"><table>
      <tr><th>交期</th><th>訂單號</th><th>客戶</th><th>品項</th><th>數量</th><th>狀態</th><th>剩餘天數</th></tr>
      ${upcomingList.map(([dk,ords])=>ords.map(o=>{
        const dl=new Date(dk);dl.setHours(0,0,0,0);
        const diff=Math.round((dl-today)/86400000);
        const urgColor=diff<=3?'var(--red)':diff<=7?'var(--yellow)':'var(--text2)';
        return `<tr>
          <td style="font-family:monospace;font-size:0.6875rem;font-weight:600;color:${urgColor}">${dk}</td>
          <td style="font-family:monospace;font-size:0.6875rem">${o.no}</td>
          <td style="font-size:0.6875rem">${o.cust||o.customer||'—'}</td>
          <td style="font-size:0.6875rem">${o.product||'—'}</td>
          <td style="font-family:monospace">${o.qty}</td>
          <td>${pill(o.status||'—')}</td>
          <td style="font-size:0.6875rem;font-weight:700;color:${urgColor}">${diff===0?'今天':diff+'天'}</td>
        </tr>`;
      }).join('')).join('')}
    </table></div>
  </div>` : '';

  return tabs + monthCtrl + calHtml + upcomingHtml;
}

// 入料單：手動輸入料件名稱時，即時檢查是否已建檔
// ═══════════════════════════════════════════════
function checkDupMat(val){
  const warn = document.getElementById('dup_mat_warn');
  if(!warn) return;
  const q = val.trim().toLowerCase();
  if(!q){ warn.style.display='none'; return; }

  // 比對料件主檔（大小寫不敏感 + 去空白後比對）
  const qNorm = q.replace(/\s+/g,''); // 去除所有空白後比對
  const exact = mats.find(m=> {
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');
    const cNorm = (m.code||'').toLowerCase().replace(/\s+/g,'');
    return nNorm===qNorm || (cNorm && cNorm===qNorm);
  });
  const similar = mats.filter(m=>{
    const nNorm = m.name.toLowerCase().replace(/\s+/g,'');
    const cNorm = (m.code||'').toLowerCase().replace(/\s+/g,'');
    return !exact && (nNorm.includes(qNorm) || qNorm.includes(nNorm.slice(0,6)) ||
           (cNorm && (cNorm.includes(qNorm) || qNorm.includes(cNorm))));
  }).slice(0,3);

  if(exact){
    // 完全相同 → 強烈提示切換到選擇模式
    warn.style.display='';
    warn.innerHTML=`
      <div style="font-weight:700;margin-bottom:4px">⚠ 此料件已建檔</div>
      <div style="margin-bottom:6px">
        <span style="font-family:monospace;color:var(--text)">${exact.name}</span>
        ${exact.code?`<span style="color:var(--text3);margin-left:6px">(${exact.code})</span>`:''}
        <span class="pill" style="background:rgba(16,185,129,.12);color:var(--green2);margin-left:6px">${exact.type}</span>
        <span style="color:var(--text2);margin-left:6px">庫存：<b>${exact.stock}</b></span>
      </div>
      <div style="font-size:0.6875rem;color:var(--text3);margin-bottom:6px">請改用「從料件主檔選擇」避免重複建立，造成統計錯誤。</div>
      <button class="btn btn-amber btn-xs" onclick="ibSwitchToExistAndSelect('${exact.id}')"
        style="background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)">
        → 切換並選擇此料件
      </button>`;
    warn.style.borderColor='rgba(239,68,68,.4)';
    warn.style.background='rgba(239,68,68,.07)';
    warn.style.color='var(--red2)';
    warn.querySelector('div').style.color='var(--red2)';
  } else if(similar.length){
    // 相似 → 提示可能重複
    warn.style.display='';
    warn.style.borderColor='rgba(245,158,11,.3)';
    warn.style.background='rgba(245,158,11,.07)';
    warn.style.color='var(--amber)';
    warn.innerHTML=`
      <div style="font-weight:700;margin-bottom:5px">💡 找到相似料件，請確認是否已建檔</div>
      ${similar.map(m=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(245,158,11,.15)">
          <span>
            <span style="font-family:monospace;font-size:0.75rem;color:var(--text)">${m.name}</span>
            ${m.code?`<span style="color:var(--text3);font-size:0.625rem;margin-left:5px">${m.code}</span>`:''}
            <span style="font-size:0.625rem;color:var(--text3);margin-left:5px">庫存 ${m.stock}</span>
          </span>
          <button class="btn btn-ghost btn-xs" onclick="ibSwitchToExistAndSelect('${m.id}')" style="flex-shrink:0;margin-left:8px">使用此料件</button>
        </div>`).join('')}
      <div style="font-size:0.625rem;color:var(--text3);margin-top:5px">確認是全新料件才繼續手動輸入</div>`;
  } else {
    warn.style.display='none';
  }
}

// ── 庫存篩選輔助函數（不重渲染整個 tab）
function _invFilter(key, val){
  if(!window._invState) return;
  window._invState[key] = val;
  if(key!=='page') window._invState.page = 1; // 篩選改變時回第一頁
  // 更新表格內容而不重建整個頁面（保持搜尋框焦點）
  _invRender();
}
function _invGo(page){
  if(!window._invState) return;
  window._invState.page = page;
  _invRender();
  document.getElementById('mainContent')?.scrollTo?.(0,0);
}
function _invReset(){
  window._invState = {q:'',type:'all',stockMin:'',stockMax:'',stockStatus:'all',page:1,pageSize:window._invState?.pageSize||100};
  _invRender();
}
function _invRender(){
  // 保存搜尋框焦點和游標位置
  const qEl=document.getElementById('inv_q');
  const qFocus=document.activeElement===qEl;
  const qCursor=qEl?qEl.selectionStart:-1;

  const c=document.getElementById('mainContent');
  if(c) c.innerHTML=renderInventory();

  // 恢復焦點
  if(qFocus){
    const newQ=document.getElementById('inv_q');
    if(newQ){newQ.focus();try{newQ.setSelectionRange(qCursor,qCursor);}catch(e){}}
  }

async function loadQCInspections(){
  try{
    const r = await dbQueryAll(DB.qcInspection);
    window._qcInspections = r.map(p=>({
      id:       p.id,
      no:       p.properties?.['檢驗單號']?.title?.[0]?.plain_text||'',
      orderRefRaw: p.properties?.['關聯訂單號']?.rich_text?.[0]?.plain_text||'',
      get orderRef(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[1]:r; },
      get orderId(){ const r=this.orderRefRaw; return r.includes('|')?r.split('|')[0]:''; },
      matName:  p.properties?.['品項名稱']?.rich_text?.[0]?.plain_text||
                p.properties?.['料件名稱']?.rich_text?.[0]?.plain_text||'',
      matCode:  p.properties?.['料件編號']?.rich_text?.[0]?.plain_text||'',
      type:     p.properties?.['檢驗類型']?.select?.name||'',
      qtyReq:   p.properties?.['應檢數量']?.number??0,
      qtyAct:   p.properties?.['實檢數量']?.number??0,
      qtyBad:   p.properties?.['不良數量']?.number??0,
      result:   p.properties?.['檢驗結果']?.select?.name||'待檢驗',
      date:     p.properties?.['檢驗日期']?.date?.start||'',
      inspector:p.properties?.['檢驗人員']?.rich_text?.[0]?.plain_text||'',
      badReason:p.properties?.['不良原因']?.select?.name||'',
      handling: p.properties?.['處理方式']?.select?.name||'',
      toStock:  p.properties?.['料號入庫']?.checkbox||false,
      note:     p.properties?.['備註']?.rich_text?.[0]?.plain_text||'',
    })).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ console.warn('loadQCInspections error:',e); window._qcInspections=[]; }
}


// ── 檢驗結果：通過 / 不通過 ──
async function doInspResult(insId, orderRef, resultCode){
  // resultCode 可能是 'p'/'f'（來自 data-res）或已是中文
  const result = resultCode==='p' ? '通過' : resultCode==='f' ? '不通過' : resultCode;
  // orderRef 格式：「orderId|orderNo」或純訂單號
  // 解析
  let orderId = '', orderNo = '';
  if(orderRef && orderRef.includes('|')){
    [orderId, orderNo] = orderRef.split('|');
  } else {
    orderNo = orderRef||'';
    // 嘗試從本地 orders 找
    const found = orders.find(o=>o.no===(orderNo||'').trim());
    if(found) orderId = found.id;
  }

  // 確認不通過原因
  let badDesc = '';
  if(result === '不通過'){
    badDesc = prompt('請填入不通過原因（必填）：')||'';
    if(!badDesc){ showToast('請填入不通過原因','warn'); return; }
  }

  showToast('更新中...','warn');

  try{
    // 1. 更新檢驗單結果
    const props = { '檢驗結果':{select:{name:result}} };
    if(badDesc) props['不良描述']={rich_text:[{text:{content:badDesc}}]};
    await updatePage(insId, props);

    // 2. 若有關聯訂單 → 更新訂單狀態
    let targetOrder = null;
    if(orderId){
      targetOrder = orders.find(x=>x.id===orderId);
    } else if(orderNo){
      targetOrder = orders.find(x=>(x.no||'').trim()===(orderNo||'').trim());
    }

    if(targetOrder){
      const isSfgOrder = targetOrder.orderType==='半成品' || (targetOrder.no||'').startsWith('SFG-');
      if(result==='通過'){
        if(isSfgOrder){
          // 半成品通過 → 自動入庫 + 訂單改「已完成」
          const mat = mats.find(m=>m.id===targetOrder.productId);
          if(mat){
            const latest = await notionAPI('GET','pages/'+mat.id);
            const curStock = latest.properties?.['目前庫存']?.number??mat.stock??0;
            const inQty = targetOrder.qty||0;
            const newStock = curStock + inQty;
            await updatePage(mat.id, {'目前庫存':{number:newStock}});
            await logStockChange(mat.id, mat.name, mat.code||'', '半成品入庫', inQty, curStock, newStock, orderNo||orderId, inspector||ROLE);
          }
          await updatePage(targetOrder.id, {'狀態':{select:{name:'已完成'}}});
          targetOrder.status = '已完成';
        } else {
          // 一般訂單通過 → 待出貨（不動庫存）
          await updatePage(targetOrder.id, {'狀態':{select:{name:'待出貨'}}});
          targetOrder.status = '待出貨';
        }
      } else {
        // 不通過 → 維持待檢驗
        await updatePage(targetOrder.id, {'狀態':{select:{name:'待檢驗'}}});
        targetOrder.status = '待檢驗';
      }
    }

    // 3. 重新載入並刷新
    await loadQCInspections();
    await refreshAll();

    showToast(result==='通過'
      ? '✅ 檢驗通過'+(orderId||orderNo?' — 訂單已更新為「待出貨」':'')
      : '❌ 檢驗不通過，訂單維持待檢驗狀態'
    , result==='通過'?'ok':'warn');

  }catch(e){ showToast('❌ '+e.message,'err'); }
}
