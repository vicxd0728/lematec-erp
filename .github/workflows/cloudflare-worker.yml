name: Deploy ERP Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy green-wave-c22f Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e933d3daf916cba77469f0b8a4202a8a
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if ! grep -q '"SUPABASE_URL"' wrangler.green-wave.jsonc; then
            echo "::error::wrangler.green-wave.jsonc must bind SUPABASE_URL before deploy"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("wrangler.green-wave.jsonc")
          config = json.loads(path.read_text(encoding="utf-8"))
          vars_block = config.setdefault("vars", {})
          vars_block["ERP_DEPLOY_SHA"] = os.environ.get("GITHUB_SHA", "")
          vars_block["ERP_DEPLOY_REF"] = os.environ.get("GITHUB_REF_NAME", "")
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            printf "%s" "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler@latest secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.green-wave.jsonc
          elif npx wrangler@latest secret list --config wrangler.green-wave.jsonc | grep -q '"name": "SUPABASE_SERVICE_ROLE_KEY"'; then
            echo "Cloudflare Worker already has SUPABASE_SERVICE_ROLE_KEY."
          else
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing from both GitHub and the Cloudflare Worker."
            exit 1
          fi
          npx wrangler@latest deploy --config wrangler.green-wave.jsonc

      - name: Verify production Worker Supabase health
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from urllib.request import Request
          from urllib.request import urlopen

          base = "https://green-wave-c22f.vic-e93.workers.dev"
          version_url = f"{base}/api/version?deploy_check={int(time.time())}"
          health_url = f"{base}/api/health/public?deploy_check=worker-env"
          last = ""
          for attempt in range(1, 11):
              try:
                  req = Request(version_url, headers={"User-Agent": "lematec-erp-worker-deploy-health/1.0"})
                  with urlopen(req, timeout=30) as res:
                      body = res.read().decode("utf-8", "replace")
                  data = json.loads(body)
                  if data.get("deploy_sha") != "${{ github.sha }}":
                      last = body
                      raise RuntimeError("Worker deploy SHA does not match this GitHub run")
                  req = Request(health_url, headers={"User-Agent": "lematec-erp-worker-deploy-health/1.0"})
                  with urlopen(req, timeout=30) as res:
                      body = res.read().decode("utf-8", "replace")
                  data = json.loads(body)
                  checks = {item.get("name"): item for item in data.get("public_checks", [])}
                  inventory_ok = checks.get("inventory_versions", {}).get("status") == "ok"
                  corder_ok = checks.get("corder_sequence", {}).get("status") == "ok"
                  if data.get("ok") and inventory_ok and corder_ok:
                      print("Production Worker Supabase health verified.")
                      sys.exit(0)
                  last = body
              except Exception as exc:
                  last = repr(exc)
              print(f"Health check attempt {attempt} failed; retrying...")
              time.sleep(3)
          print("::error::Production Worker Supabase health failed after deploy")
          print(last)
          sys.exit(1)
          PY
