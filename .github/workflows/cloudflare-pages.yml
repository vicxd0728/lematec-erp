name: Deploy ERP to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy assets
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -rf _publish
          mkdir -p _publish
          cp index.html _publish/index.html
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            python -c "import os,pathlib; p=pathlib.Path('_publish/index.html'); t=p.read_text(encoding='utf-8'); p.write_text(t.replace('__SUPABASE_ANON_KEY__', os.environ['SUPABASE_ANON_KEY']), encoding='utf-8', newline='\n')"
          else
            echo "::warning::Missing GitHub secret SUPABASE_ANON_KEY; deployed ERP will require device-local Supabase key for direct REST fallback."
          fi
          cp manifest.webmanifest _publish/manifest.webmanifest
          cp sw.js _publish/sw.js
          cp _headers _publish/_headers
          cp _redirects _publish/_redirects
          cp -R icons _publish/icons
          if [ -d supabase/video_library ]; then
            mkdir -p _publish/supabase/video_library
            cp supabase/video_library/video_library_seed.json _publish/supabase/video_library/video_library_seed.json
          fi
          if [ -d lematec-erp ]; then
            mkdir -p _publish/lematec-erp
            cp lematec-erp/index.html _publish/lematec-erp/index.html
          fi

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e933d3daf916cba77469f0b8a4202a8a
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx wrangler@latest pages deploy _publish --project-name=lematec-erp --branch=main

      - name: Verify Worker dependency matches this commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from urllib.request import Request, urlopen

          base = "https://green-wave-c22f.vic-e93.workers.dev"
          expected_sha = "${{ github.sha }}"
          last = ""
          for attempt in range(1, 61):
              try:
                  req = Request(f"{base}/api/version?pages_check={attempt}-{int(time.time())}", headers={"User-Agent": "lematec-erp-pages-worker-gate/1.0"})
                  with urlopen(req, timeout=30) as res:
                      version_body = res.read().decode("utf-8", "replace")
                  version = json.loads(version_body)
                  if version.get("deploy_sha") != expected_sha:
                      last = version_body
                      raise RuntimeError("Worker deploy SHA is not yet aligned with this Pages commit")

                  for path in ("/api/health/public", "/api/inventory/versions", "/api/corder/number-state", "/api/video-library/list?limit=1"):
                      req = Request(f"{base}{path}", headers={"User-Agent": "lematec-erp-pages-worker-gate/1.0"})
                      with urlopen(req, timeout=30) as res:
                          body = res.read().decode("utf-8", "replace")
                      data = json.loads(body)
                      if data.get("error") or data.get("ok") is False:
                          last = body
                          raise RuntimeError(f"Worker dependency failed: {path}")

                  print("Worker dependency verified for this Pages commit.")
                  sys.exit(0)
              except Exception as exc:
                  print(f"Worker dependency attempt {attempt} failed: {exc}")
                  time.sleep(5)

          print("::error::Worker dependency did not match this Pages commit")
          print(last)
          sys.exit(1)
          PY
