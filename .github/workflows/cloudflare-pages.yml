name: Deploy ERP to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy assets
        shell: bash
        run: |
          rm -rf _publish
          mkdir -p _publish
          cp index.html _publish/index.html
          cp manifest.webmanifest _publish/manifest.webmanifest
          cp sw.js _publish/sw.js
          cp _headers _publish/_headers
          cp _redirects _publish/_redirects
          cp -R icons _publish/icons
          if [ -d supabase/video_library ]; then
            mkdir -p _publish/supabase/video_library
            cp supabase/video_library/video_library_seed.json _publish/supabase/video_library/video_library_seed.json
          fi
          if [ -d lematec-erp ]; then
            mkdir -p _publish/lematec-erp
            cp lematec-erp/index.html _publish/lematec-erp/index.html
          fi

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e933d3daf916cba77469f0b8a4202a8a
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx wrangler@latest pages deploy _publish --project-name=lematec-erp --branch=main
