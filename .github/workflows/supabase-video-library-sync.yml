name: Supabase Video Library Sync

on:
  schedule:
    # Refresh YouTube video metadata every 6 hours.
    - cron: "12 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp "psycopg[binary]"

      - name: Refresh YouTube library into Supabase
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing GitHub secret SUPABASE_DB_URL"
            exit 1
          fi
          python scripts/supabase_video_library_sync.py --refresh --apply

      - name: Verify production Worker video library read
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from urllib.request import Request, urlopen

          url = "https://green-wave-c22f.vic-e93.workers.dev/api/video-library/list?limit=1&sync_check=1"
          req = Request(url, headers={"User-Agent": "lematec-video-library-sync/1.0"})
          with urlopen(req, timeout=30) as res:
              body = res.read().decode("utf-8", "replace")
          data = json.loads(body)
          if not data.get("ok") or data.get("source") != "supabase_worker":
              print(body)
              sys.exit("Production Worker video library read failed")
          print(f"Production Worker video library OK. Rows returned: {data.get('count')}")
          PY
