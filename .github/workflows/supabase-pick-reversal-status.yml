name: Supabase Pick Reversal Status Migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to apply. Any other value runs inside rollback."
        required: true
        default: "false"

jobs:
  migrate:
    name: Pick return request status migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing GitHub secret SUPABASE_DB_URL"
            exit 1
          fi

      - name: Run migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sql_path="supabase/migrations/20260827_002_pick_return_request_status.sql"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$sql_path"
          else
            {
              echo "begin;"
              cat "$sql_path"
              echo "select conname || ':' || pg_get_constraintdef(oid) from pg_constraint where conrelid = 'public.pick_lists'::regclass and conname = 'pick_lists_status_check';"
              echo "rollback;"
            } | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          fi

      - name: Verify constraint accepts return request status
        if: ${{ github.event.inputs.apply == 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select conname || ':' || pg_get_constraintdef(oid)
            from pg_constraint
            where conrelid = 'public.pick_lists'::regclass
              and conname = 'pick_lists_status_check';
          "
