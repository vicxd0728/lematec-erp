name: Handoff C-end 16702 to 16706

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the guarded identity handoff after archiving 16702
        required: true
        default: false
        type: boolean

jobs:
  handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Guarded identity handoff
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
            python scripts/handoff_corder_16702_16706.py --apply
          else
            python scripts/handoff_corder_16702_16706.py
          fi
