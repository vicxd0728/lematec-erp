name: Repair Y-GAH material mirrors

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Repair and verify 2026-09-29 material mirrors
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/repair_y_gah_material_mirrors.py
